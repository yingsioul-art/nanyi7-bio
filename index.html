大腦", "小腦", "腦幹", "脊髓"], "ans": 3, "ex": "手腳碰到燙或尖的東西立刻縮回，由脊髓控制。", "fig": "", "ch": "4"}, {"id": "p_41_09", "src": "practice", "sec": "4-1", "concept": "神經傳導途徑", "q": "接尺實驗的神經傳導途徑何者正確？", "opts": ["受器→運動神經元→大腦→感覺神經元→肌肉", "受器→感覺神經元→大腦→脊髓→運動神經元→肌肉", "受器→感覺神經元→脊髓→運動神經元→肌肉", "大腦→受器→感覺神經元→肌肉"], "ans": 1, "ex": "接尺是意識反應：眼內受器→感覺神經元→大腦→脊髓→運動神經元→手的肌肉。C 是反射的路徑。", "fig": "", "ch": "4"}, {"id": "p_41_10", "src": "practice", "sec": "4-1", "concept": "感覺疲勞", "q": "右手泡冰水、左手泡熱水 15 秒後同時放入室溫水，結果？", "opts": ["兩手都覺得冷", "右手覺得溫暖、左手覺得冷", "右手覺得冷、左手覺得溫暖", "兩手感覺一樣"], "ans": 1, "ex": "右手習慣了冰水，碰到室溫水覺得暖；左手習慣熱水，覺得冷。說明感覺會因感覺疲勞而不準。", "fig": "", "ch": "4"}, {"id": "p_41_11", "src": "practice", "sec": "4-1", "concept": "負片後像", "q": "盯著白色燈具一陣子再移開視線，看到燈具形狀的黑影，這是？", "opts": ["正片後像", "負片後像", "反射", "感覺神經受損"], "ans": 1, "ex": "顏色和原物不同（白變黑）是負片後像，由視覺暫留加上視覺疲勞造成。", "fig": "", "ch": "4"}, {"id": "p_41_12", "src": "practice", "sec": "4-1", "concept": "反應時間", "q": "接尺練習多次後，反應時間可能縮短，原因是？", "opts": ["接尺是反射", "接尺是意識反應，練習能縮短", "尺變輕了", "眼睛受器變多"], "ans": 1, "ex": "接尺要經過大腦，是意識反應，經練習可以縮短反應時間。（p.178）", "fig": "", "ch": "4"}, {"id": "p_42_01", "src": "practice", "sec": "4-2", "concept": "激素運送", "q": "激素由內分泌腺分泌後，靠什麼運送到目標細胞？", "opts": ["神經元", "血液", "特定管道", "淋巴"], "ans": 1, "ex": "激素經血液運送；外分泌腺才需要特定管道。", "fig": "", "ch": "4"}, {"id": "p_42_02", "src": "practice", "sec": "4-2", "concept": "神經與內分泌比較", "q": "和神經系統相比，內分泌系統的作用通常？", "opts": ["較快、局部、短暫", "較慢、廣泛、持久", "較快、廣泛、持久", "較慢、局部、短暫"], "ans": 1, "ex": "內分泌系統較緩慢、廣泛且持久；神經系統較快速、局部且短暫。", "fig": "", "ch": "4"}, {"id": "p_42_03", "src": "practice", "sec": "4-2", "concept": "生長激素", "q": "成長期生長激素分泌過多可能造成？", "opts": ["侏儒症", "巨人症", "糖尿病", "骨質疏鬆"], "ans": 1, "ex": "腦垂腺分泌的生長激素太多→巨人症，太少→侏儒症。", "fig": "", "ch": "4"}, {"id": "p_42_04", "src": "practice", "sec": "4-2", "concept": "甲狀腺素", "q": "成人甲狀腺素分泌過多，最可能出現？", "opts": ["代謝變慢、體重增加", "代謝變快、體重減輕", "血鈣下降", "血糖下降"], "ans": 1, "ex": "甲狀腺素促進細胞代謝，太多會使養分消耗多、體重減輕。", "fig": "", "ch": "4"}, {"id": "p_42_05", "src": "practice", "sec": "4-2", "concept": "副甲狀腺", "q": "調節血液中鈣濃度的是哪一個腺體？", "opts": ["甲狀腺", "副甲狀腺", "腎上腺", "腦垂腺"], "ans": 1, "ex": "副甲狀腺分泌副甲狀腺素調節鈣濃度，異常可能抽筋或骨質疏鬆。", "fig": "", "ch": "4"}, {"id": "p_42_06", "src": "practice", "sec": "4-2", "concept": "腎上腺素", "q": "被狗追時腎上腺素分泌增加，下列哪一項不是它的作用？", "opts": ["心跳加快", "血壓上升", "血糖下降", "肌肉血液量增加"], "ans": 2, "ex": "腎上腺素會使血糖上升，不是下降。", "fig": "", "ch": "4"}, {"id": "p_42_07", "src": "practice", "sec": "4-2", "concept": "胰島素", "q": "進食後血糖升高，哪一種激素分泌增加使血糖降低？", "opts": ["升糖素", "胰島素", "腎上腺素", "甲狀腺素"], "ans": 1, "ex": "胰島分泌胰島素降低血糖；升糖素則提高血糖。", "fig": "", "ch": "4"}, {"id": "p_42_08", "src": "practice", "sec": "4-2", "concept": "糖尿病", "q": "糖尿病主要和哪一種激素分泌不足有關？", "opts": ["胰島素", "生長激素", "雌性激素", "副甲狀腺素"], "ans": 0, "ex": "胰島素分泌不足，血糖無法降下來，過多的血糖隨尿液排出。", "fig": "", "ch": "4"}, {"id": "p_42_09", "src": "practice", "sec": "4-2", "concept": "外分泌腺", "q": "下列何者屬於外分泌腺？", "opts": ["甲狀腺", "汗腺", "腎上腺", "腦垂腺"], "ans": 1, "ex": "汗腺、淚腺、消化腺的分泌物經管道送出，是外分泌腺。", "fig": "", "ch": "4"}, {"id": "p_42_10", "src": "practice", "sec": "4-2", "concept": "結紮", "q": "男性結紮後仍會長鬍鬚，原因是？", "opts": ["睪丸被切除", "雄性激素經血液運送，不受輸精管截斷影響", "鬍鬚由甲狀腺控制", "結紮會增加激素"], "ans": 1, "ex": "結紮只截斷輸精管，睪丸仍正常分泌雄性激素，激素靠血液運送。", "fig": "", "ch": "4"}, {"id": "p_43_01", "src": "practice", "sec": "4-3", "concept": "膨壓", "q": "氣孔打開時，保衛細胞發生什麼變化？", "opts": ["失水、膨壓變小", "吸水、膨壓變大", "細胞壁消失", "葉綠體增加"], "ans": 1, "ex": "水分進入保衛細胞，膨壓變大，氣孔打開；失水則關閉。", "fig": "", "ch": "4"}, {"id": "p_43_02", "src": "practice", "sec": "4-3", "concept": "觸發運動", "q": "含羞草被碰觸後小葉閉合，屬於？", "opts": ["向光性", "向地性", "觸發運動", "睡眠運動"], "ans": 2, "ex": "被碰觸後迅速閉合是觸發運動，和膨壓變化有關。", "fig": "", "ch": "4"}, {"id": "p_43_03", "src": "practice", "sec": "4-3", "concept": "睡眠運動", "q": "酢漿草葉片白天展開、夜晚閉合，屬於？", "opts": ["捕蟲運動", "睡眠運動", "向觸性", "向地性"], "ans": 1, "ex": "白天展開、夜晚閉合是睡眠運動。", "fig": "", "ch": "4"}, {"id": "p_43_04", "src": "practice", "sec": "4-3", "concept": "向光性", "q": "窗邊盆栽的莖彎向窗外生長，這是？", "opts": ["向光性", "負向光性", "向地性", "觸發運動"], "ans": 0, "ex": "莖朝光源生長是向光性。", "fig": "", "ch": "4"}, {"id": "p_43_05", "src": "practice", "sec": "4-3", "concept": "向地性", "q": "把幼苗橫放一段時間後，根會？", "opts": ["向上彎", "向下朝地心彎", "不改變方向", "朝光源彎"], "ans": 1, "ex": "根有向地性，朝地心生長；莖則有負向地性，向上彎。", "fig": "", "ch": "4"}, {"id": "p_43_06", "src": "practice", "sec": "4-3", "concept": "向觸性", "q": "牽牛花的莖纏繞支架生長，這是？", "opts": ["向觸性", "向光性", "睡眠運動", "膨壓運動"], "ans": 0, "ex": "莖碰到物體後朝接觸物捲曲生長，是向觸性。", "fig": "", "ch": "4"}, {"id": "p_43_07", "src": "practice", "sec": "4-3", "concept": "快慢比較", "q": "下列哪一種植物感應最需要「一段時間」才看得出來？", "opts": ["含羞草小葉閉合", "捕蠅草葉閉合", "莖彎向光源", "氣孔關閉"], "ans": 2, "ex": "向性是生長方向改變，要較長時間；其他是膨壓變化造成的快速感應。", "fig": "", "ch": "4"}, {"id": "p_43_08", "src": "practice", "sec": "4-3", "concept": "實驗變因", "q": "綠豆紙盒實驗（開口朝側面 vs 朝上）的操作變因是？", "opts": ["綠豆數目", "澆水量", "光源方向", "棉花量"], "ans": 2, "ex": "兩組只差在紙盒開口方向，也就是光源方向。", "fig": "", "ch": "4"}, {"id": "p_43_09", "src": "practice", "sec": "4-3", "concept": "光照與開花", "q": "花農在秋冬晚上點燈照菊花，目的是？", "opts": ["讓菊花快點開花", "延長光照、阻止菊花開花", "幫菊花保暖", "殺死害蟲"], "ans": 1, "ex": "延長光照能阻止菊花開花，等到春夏再遮光促使開花。", "fig": "", "ch": "4"}, {"id": "p_51_01", "src": "practice", "sec": "5-1", "concept": "呼吸作用場所", "q": "細胞的呼吸作用主要在哪裡進行？", "opts": ["葉綠體", "粒線體", "細胞核", "細胞膜"], "ans": 1, "ex": "呼吸作用主要在粒線體進行；葉綠體是光合作用的場所。", "fig": "", "ch": "5"}, {"id": "p_51_02", "src": "practice", "sec": "5-1", "concept": "呼吸作用產物", "q": "呼吸作用會產生什麼？", "opts": ["氧氣和葡萄糖", "二氧化碳、水和能量", "澱粉和氧氣", "胺基酸"], "ans": 1, "ex": "呼吸作用消耗氧氣，把養分的能量釋放出來，產生二氧化碳和水。", "fig": "", "ch": "5"}, {"id": "p_51_03", "src": "practice", "sec": "5-1", "concept": "植物的呼吸", "q": "關於植物，下列何者正確？", "opts": ["只在晚上行呼吸作用", "白天只行光合作用", "白天行光合作用也行呼吸作用", "植物不會產生二氧化碳"], "ans": 2, "ex": "植物細胞隨時都行呼吸作用；白天另外加上光合作用。", "fig": "", "ch": "5"}, {"id": "p_51_04", "src": "practice", "sec": "5-1", "concept": "氣體交換構造", "q": "魚用什麼呼吸器官交換氣體？", "opts": ["肺", "鰓", "氣管", "皮膚"], "ans": 1, "ex": "魚用鰓；昆蟲用氣管；青蛙用肺和皮膚。", "fig": "", "ch": "5"}, {"id": "p_51_05", "src": "practice", "sec": "5-1", "concept": "呼吸器官特徵", "q": "下列何者不是呼吸器官的共同特徵？", "opts": ["表面溼潤", "表面積廣大", "有充分血液流經", "表面有厚厚的角質"], "ans": 3, "ex": "呼吸器官要溼潤、面積大、血液多才利於擴散；厚角質會妨礙氣體交換。", "fig": "", "ch": "5"}, {"id": "p_51_06", "src": "practice", "sec": "5-1", "concept": "吸氣", "q": "吸氣時橫膈和胸腔的變化是？", "opts": ["橫膈上升、胸腔變小", "橫膈下降、胸腔變大", "橫膈上升、胸腔變大", "橫膈下降、胸腔變小"], "ans": 1, "ex": "吸氣：肋骨上舉、橫膈收縮下降，胸腔變大，空氣進入肺。", "fig": "", "ch": "5"}, {"id": "p_51_07", "src": "practice", "sec": "5-1", "concept": "呼吸模型", "q": "呼吸模型中，底部的氣球模擬人體的什麼構造？", "opts": ["肺", "胸腔", "橫膈", "氣管"], "ans": 2, "ex": "寶特瓶＝胸腔、瓶內氣球＝肺、底部氣球＝橫膈。", "fig": "", "ch": "5"}, {"id": "p_51_08", "src": "practice", "sec": "5-1", "concept": "呼吸中樞", "q": "劇烈運動時呼吸變快，是哪裡的呼吸中樞發出訊息？", "opts": ["大腦", "小腦", "腦幹", "脊髓"], "ans": 2, "ex": "血液中二氧化碳增加會刺激腦幹的呼吸中樞，使呼吸加快。", "fig": "", "ch": "5"}, {"id": "p_51_09", "src": "practice", "sec": "5-1", "concept": "石灰水", "q": "對澄清石灰水吹氣後石灰水變混濁，說明呼出的氣體含有？", "opts": ["氧氣", "氮氣", "二氧化碳", "水氣"], "ans": 2, "ex": "澄清石灰水遇二氧化碳變混濁；水氣要用氯化亞鈷試紙檢測。", "fig": "", "ch": "5"}, {"id": "p_51_10", "src": "practice", "sec": "5-1", "concept": "對照組", "q": "綠豆實驗中，放乾燥綠豆的乙瓶有什麼作用？", "opts": ["讓綠豆發芽", "當作對照組", "增加二氧化碳", "吸收水分"], "ans": 1, "ex": "乾燥（休眠）綠豆是對照組，和萌芽綠豆比較才能確認二氧化碳來自萌芽綠豆的呼吸作用。", "fig": "", "ch": "5"}, {"id": "p_51_11", "src": "practice", "sec": "5-1", "concept": "肺泡", "q": "肺泡適合氣體交換的原因不包括？", "opts": ["只有一層細胞", "表面布滿微血管", "數量很多、表面積大", "肺泡內有很多肌肉"], "ans": 3, "ex": "肺臟沒有肌肉；肺泡薄、微血管多、數量多才利於氣體交換。", "fig": "", "ch": "5"}, {"id": "p_52_01", "src": "practice", "sec": "5-2", "concept": "血糖來源", "q": "血糖的來源包括？", "opts": ["醣類食物消化吸收、肝糖分解", "只有喝果汁", "脂肪在胃中分解", "肺吸入的氧氣"], "ans": 0, "ex": "血糖主要來自醣類食物的消化吸收，以及肝臟中肝糖的分解。", "fig": "", "ch": "5"}, {"id": "p_52_02", "src": "practice", "sec": "5-2", "concept": "胰島素", "q": "飯後血糖升高時，胰臟分泌哪種激素讓血糖下降？", "opts": ["升糖素", "胰島素", "腎上腺素", "生長激素"], "ans": 1, "ex": "胰島素讓細胞多利用葡萄糖、肝糖生成增加，血糖下降。", "fig": "", "ch": "5"}, {"id": "p_52_03", "src": "practice", "sec": "5-2", "concept": "升糖素", "q": "升糖素讓血糖上升的方式是？", "opts": ["促使肝糖分解成葡萄糖", "促使葡萄糖變成肝糖", "增加尿液", "促進消化"], "ans": 0, "ex": "升糖素促使肝細胞把肝糖分解成葡萄糖釋放到血液。", "fig": "", "ch": "5"}, {"id": "p_52_04", "src": "practice", "sec": "5-2", "concept": "腎上腺素與血糖", "q": "考試前很緊張，血糖可能會？", "opts": ["下降", "上升", "完全不變", "變成零"], "ans": 1, "ex": "緊張時腎上腺素分泌增加，促使肝糖分解，血糖上升。", "fig": "", "ch": "5"}, {"id": "p_52_05", "src": "practice", "sec": "5-2", "concept": "飢餓感", "q": "血糖降低時，人體會出現什麼反應？", "opts": ["感到飢餓、升糖素增加", "感到飽足、胰島素增加", "體溫上升", "尿量增加"], "ans": 0, "ex": "低血糖使腦感到飢餓，同時升糖素分泌增加。", "fig": "", "ch": "5"}, {"id": "p_52_06", "src": "practice", "sec": "5-2", "concept": "胰臟兩種功能", "q": "關於胰臟，下列何者正確？", "opts": ["只會分泌胰液", "胰島素經特定管道送到小腸", "胰島分泌的激素經血液運送", "胰液可調節血糖"], "ans": 2, "ex": "胰島的激素（胰島素、升糖素）經血液運送調節血糖；胰液經管道送到小腸幫助消化。", "fig": "", "ch": "5"}, {"id": "p_53_01", "src": "practice", "sec": "5-3", "concept": "含氮廢物毒性", "q": "下列含氮廢物毒性由高到低排列何者正確？", "opts": ["尿酸＞尿素＞氨", "氨＞尿素＞尿酸", "尿素＞氨＞尿酸", "氨＞尿酸＞尿素"], "ans": 1, "ex": "氨毒性最高、尿素較弱、尿酸最弱。", "fig": "", "ch": "5"}, {"id": "p_53_02", "src": "practice", "sec": "5-3", "concept": "尿酸", "q": "鳥類主要以哪種形式排出含氮廢物？", "opts": ["氨", "尿素", "尿酸", "二氧化碳"], "ans": 2, "ex": "鳥類和昆蟲把氨轉換成毒性最小的尿酸，混在糞便中排出。", "fig": "", "ch": "5"}, {"id": "p_53_03", "src": "practice", "sec": "5-3", "concept": "尿素形成", "q": "人體中把氨轉換成尿素的器官是？", "opts": ["腎臟", "肝臟", "膀胱", "肺臟"], "ans": 1, "ex": "肝臟把氨轉換成尿素；腎臟負責過濾形成尿液。", "fig": "", "ch": "5"}, {"id": "p_53_04", "src": "practice", "sec": "5-3", "concept": "泌尿系統順序", "q": "尿液排出的路徑何者正確？", "opts": ["腎臟→膀胱→輸尿管→尿道", "腎臟→輸尿管→膀胱→尿道", "膀胱→腎臟→輸尿管→尿道", "肝臟→腎臟→尿道→膀胱"], "ans": 1, "ex": "腎臟形成尿液→輸尿管→膀胱暫存→尿道排出。", "fig": "", "ch": "5"}, {"id": "p_53_05", "src": "practice", "sec": "5-3", "concept": "排泄器官", "q": "下列何者不是人體的排泄器官？", "opts": ["肺臟", "腎臟", "皮膚", "胃"], "ans": 3, "ex": "人體排泄器官是腎臟、肺臟、皮膚。胃是消化器官。", "fig": "", "ch": "5"}, {"id": "p_53_06", "src": "practice", "sec": "5-3", "concept": "水分恆定", "q": "大量流汗後血液濃度變高，身體會？", "opts": ["排尿增加、不想喝水", "排尿減少、感到口渴", "排尿增加、感到口渴", "沒有任何反應"], "ans": 1, "ex": "血液中水分太少時，腦發出訊息使排尿減少，並感到口渴而喝水。", "fig": "", "ch": "5"}, {"id": "p_53_07", "src": "practice", "sec": "5-3", "concept": "水分恆定", "q": "一次喝了很多水，接下來身體最可能？", "opts": ["尿量增加", "尿量減少", "停止排汗", "血糖上升"], "ans": 0, "ex": "血液水分太多（濃度低）時，腎臟製造較多尿液排出多餘水分。", "fig": "", "ch": "5"}, {"id": "p_53_08", "src": "practice", "sec": "5-3", "concept": "防止水分散失", "q": "下列哪一個構造可以幫陸生動物減少水分散失？", "opts": ["魚鰓", "昆蟲的外骨骼", "肺泡", "根毛"], "ans": 1, "ex": "人的角質層、蜥蜴鱗片、昆蟲外骨骼都能防止水分散失。", "fig": "", "ch": "5"}, {"id": "p_53_09", "src": "practice", "sec": "5-3", "concept": "植物水分", "q": "清晨看到葉緣有一排水珠，原因是？", "opts": ["下雨", "體內水分過多、蒸散太慢，水從葉緣排出", "葉子生病", "根吸收太少水"], "ans": 1, "ex": "土壤和空氣都很潮溼時，蒸散太慢，多餘的水從葉緣或葉尖排出。", "fig": "", "ch": "5"}, {"id": "p_54_01", "src": "practice", "sec": "5-4", "concept": "外溫動物", "q": "下列何者是外溫動物？", "opts": ["狗", "企鵝", "蜥蜴", "人"], "ans": 2, "ex": "蜥蜴主要靠曬太陽、躲陰影調節體溫，是外溫動物；狗、企鵝、人是內溫動物。", "fig": "", "ch": "5"}, {"id": "p_54_02", "src": "practice", "sec": "5-4", "concept": "保溫構造", "q": "企鵝能在寒冷地區維持體溫，靠的是？", "opts": ["長耳朵散熱", "羽毛和皮下脂肪", "伸舌頭", "曬太陽"], "ans": 1, "ex": "企鵝的羽毛及皮下脂肪可以保溫。", "fig": "", "ch": "5"}, {"id": "p_54_03", "src": "practice", "sec": "5-4", "concept": "散熱構造", "q": "狗在熱天伸出舌頭，目的是？", "opts": ["保溫", "散熱", "吸收水分", "呼吸作用"], "ans": 1, "ex": "狗的舌頭可以協助散熱。", "fig": "", "ch": "5"}, {"id": "p_54_04", "src": "practice", "sec": "5-4", "concept": "寒冷時調節", "q": "天氣很冷時，人體皮膚血管會？", "opts": ["舒張，增加散熱", "收縮，減少散熱", "舒張，減少散熱", "收縮，增加散熱"], "ans": 1, "ex": "冷時皮膚血管收縮，流經體表的血量減少，減少散熱。", "fig": "", "ch": "5"}, {"id": "p_54_05", "src": "practice", "sec": "5-4", "concept": "發抖", "q": "冷到發抖，對身體的作用是？", "opts": ["增加散熱", "增加產熱", "減少產熱", "排出水分"], "ans": 1, "ex": "肌肉不自主收縮（顫抖）可以增加產熱。", "fig": "", "ch": "5"}, {"id": "p_54_06", "src": "practice", "sec": "5-4", "concept": "炎熱時調節", "q": "天氣炎熱時，下列何者不是人體的反應？", "opts": ["汗腺排汗增加", "皮膚血管舒張", "食慾增加", "活動減少"], "ans": 2, "ex": "熱時食慾減退以減少產熱；冷時食慾才會增加。", "fig": "", "ch": "5"}, {"id": "s112_1_q1", "src": "school", "sec": "1-1", "concept": "科學方法步驟", "q": "科學探究的歷程包括：(甲)提出假說；(乙)觀察；(丙)參考文獻資料；(丁)設計實驗步驟；(戊)整理分析數據、解釋數據；(己)提出問題。請排出正確的順序為何？", "ex": "科學探究通常從「觀察」開始，發現現象後「提出問題」，再「參考文獻資料」了解前人研究，接著「提出假說」、「設計實驗」，最後「整理分析數據並解釋」。所以順序是乙→己→丙→甲→丁→戊。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["乙→己→丙→甲→丁→戊", "乙→甲→己→丁→戊→丙", "乙→丙→己→甲→丁→戊", "乙→己→丁→甲→戊→丙"], "ans": 0, "ch": "1"}, {"id": "s112_1_q2", "src": "school", "sec": "1-1", "concept": "操作變因只能一個", "q": "設計實驗時，必須注意的事項，下列何者錯誤？", "ex": "設計實驗時一次只能改變一個操作變因，其他條件都要相同，這樣結果不同時才知道是哪個因素造成的。所以「能有多個操作變因」是錯的；多做幾次實驗、分成實驗組和對照組都是正確做法。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["最好能進行多次實驗", "實驗操作可分實驗組和對照組", "實驗能有多個操作變因", "對照組只有一個變因和實驗組不同"], "ans": 2, "ch": "1"}, {"id": "s112_1_q3", "src": "school", "sec": "1-1", "concept": "設計對照實驗", "q": "小書針對「孑孓為什麼要浮到水面處」這個問題，提出「孑孓需要光線」的假說。為求證此假說而設計的實驗裝置，附表所列何者正確？", "ex": "假說是「孑孓需要光線」，所以甲、乙兩杯只能有「光線」不同，其他如水量、孑孓數量和大小、溫度都要一樣。只有(C)兩杯的水量、孑孓、溫度都相同，只差光照和黑暗。", "fig": "fig/s112_1_q3.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 2, "ch": "1"}, {"id": "s112_1_q4", "src": "school", "sec": "1-1", "concept": "提出假說", "q": "近年來全球各地氣候異常豪雨成災，這種現象「可能和溫室效應有關。」，「」內是科學探究歷程中的哪一步驟？", "ex": "「可能和溫室效應有關」是對現象原因的猜測，還沒有被實驗證實，這就是「提出假說」。觀察是看到現象，解釋數據是實驗做完後的步驟。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["觀察", "參考文獻資料", "提出假說", "解釋數據。"], "ans": 2, "ch": "1"}, {"id": "s112_1_q5", "src": "school", "sec": "1-2", "concept": "生命現象類型", "q": "海綿寶寶和朋友們各舉了一個有關生命現象的例子。海綿寶寶：「海綿攝食得到的養分可在體內分解產生能量」－代謝派大星：「海星可以斷裂產生新個體。」－感應章魚哥：「小章魚遇到危險會噴出墨汁」－生長蟹老闆：「螃蟹斷掉的蟹螯再生回來。」－生殖上述每人舉例的生命現象，何者正確？", "ex": "養分分解產生能量屬於「代謝」，所以海綿寶寶說對了。海星斷裂產生新個體是「生殖」、章魚噴墨汁是「感應與運動」、蟹螯再生是「生長」，其他三人都配錯了。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["海綿寶寶", "派大星", "章魚哥", "蟹老闆。"], "ans": 0, "ch": "1"}, {"id": "s112_1_q6", "src": "school", "sec": "1-2", "concept": "感應與運動", "q": "含羞草葉片在被觸碰後，會閉合且下垂，是屬於生命現象中的何者？", "ex": "含羞草被碰觸後葉片閉合下垂，是生物接受刺激後產生反應，屬於「感應與運動」。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["感應", "生殖", "生長", "代謝。"], "ans": 0, "ch": "1"}, {"id": "s112_1_q7", "src": "school", "sec": "1-2", "concept": "判斷生命現象", "q": "下列何者屬於生命現象？", "ex": "珊瑚是生物，珊瑚礁逐年增大是珊瑚生長、繁殖的結果，屬於生命現象。草被風吹動、菜葉脫水、岩石崩解，都是外力或物理變化造成的，不是生物主動表現的生命現象。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小草因風吹而搖擺", "海洋中的珊瑚礁逐年增大", "醃漬泡菜時，高麗菜葉細胞脫水", "岩石因長時間風吹雨淋而崩解"], "ans": 1, "ch": "1"}, {"id": "s112_1_q8", "src": "school", "sec": "1-2", "concept": "判斷生物", "q": "(甲)燈籠魚；(乙)石頭；(丙)細菌；(丁)鬼針草；(戊)落葉。以上有生命現象的有幾項？", "ex": "燈籠魚、細菌、鬼針草都是生物，具有生命現象，共 3 項。石頭不是生物；落葉已經離開植物體死亡，不再表現生命現象。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["2 項", "3 項", "4 項", "5 項。"], "ans": 1, "ch": "1"}, {"id": "s112_1_q9", "src": "school", "sec": "1-2", "concept": "生物生存要素", "q": "(甲) 600 公尺深的海洋中沒有綠色生物； (乙)海拔 3000 公尺的山上生物比平地少 (丙) 北極熊具有厚毛。導致以上三個敘述結果的主要原因按 「 (甲)→(乙)→(丙) 」順序排列分別為", "ex": "600 公尺深的海洋照不到陽光，綠色植物無法行光合作用；高山空氣稀薄，生物比平地少；北極很冷，北極熊用厚毛保暖。所以依序是陽光→空氣→溫度。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["溫度→陽光→空氣", "水分→空氣→陽光", "空氣→陽光→水分", "陽光→空氣→溫度"], "ans": 3, "ch": "1"}, {"id": "s112_1_q10", "src": "school", "sec": "1-2", "concept": "生物適應環境", "q": "下列生物適應環境的相關敘述，何者錯誤？", "ex": "燈籠魚（鮟鱇魚）會發光，是生活在漆黑的「深海」，不是陽光充足的珊瑚礁海域，所以(D)錯。仙人掌針狀葉、水筆仔胎生苗、蝙蝠回聲定位都是適應環境的例子。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["仙人掌具有針狀葉，可在沙漠中生存", "水筆仔具有筆狀胎生苗，適合生活在河口濕地", "蝙蝠能利用回聲定位，幫助其在夜間活動", "燈籠魚能發光，適合生存在珊瑚礁海域"], "ans": 3, "ch": "1"}, {"id": "s112_1_q11", "src": "school", "sec": "1-2", "concept": "生物圈範圍", "q": "花媽和家人一起討論生物圈的相關知識，有關他們的討論內容，下列何者正確？", "ex": "生物圈大約是海平面上下各 10 公里的範圍，相對地球非常薄，就像蘋果的果皮一樣。海拔 5 公里還在範圍內；生物在生物圈內也不是均勻分布的。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["花媽：生物圈的範圍是海平面上下各20 公里", "花爸：海拔5 公里高的大氣不在生物圈的範圍內", "橘子：生物圈內的生物是均勻分布的", "柚子：若地球是一顆蘋果，生物圈的範圍就像果皮一樣薄"], "ans": 3, "ch": "1"}, {"id": "s112_1_q12", "src": "school", "sec": "1-2", "concept": "生物圈分布", "q": "附圖為地球的高山與海洋示意圖，有關甲、乙、丙、丁區域的敘述，何者錯誤？", "ex": "丁處是 10000 公尺的深海，完全照不到陽光，不可能有需要照光行光合作用的生物，所以(D)錯。甲處高空仍可能有細菌；乙、丙處在海平面附近，生物種類和數量最多。", "fig": "fig/s112_1_q12.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲處可發現細菌等生物", "乙處的生物種類、數量較多", "丙處可發現珊瑚、小丑魚等生物", "丁處可發現須照光進行光合作用的生物"], "ans": 3, "ch": "1"}, {"id": "s112_1_q13", "src": "school", "sec": "1-2", "concept": "生物圈概念", "q": "下列對於生物圈之敘述，何者錯誤？", "ex": "深海雖然照不到陽光，但仍有魚類、細菌等生物生存，並沒有「絕跡」，所以(B)錯。有生物生存的地方都算生物圈，範圍也會因新發現而改變。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["地球上凡是有生物生存之處即稱為生物圈", "日光不易穿透深層海洋，使得生物在海洋深處絕跡", "日光、空氣、水、養分為生物生存的要素", "生物圈範圍會因新發現或生物滅絕而變動"], "ans": 1, "ch": "1"}, {"id": "s112_1_q14", "src": "school", "sec": "1-3", "concept": "製作玻片標本", "q": "(甲)以濾紙吸去多餘的水；(乙)將水蘊草葉片放入玻片上的液體中；(丙)以45 度角蓋上載玻片；(丁)以45 度角蓋上蓋玻片；(戊)滴一滴水在載玻片上；(己)滴一滴水在蓋玻片上；下列何者為製作玻片標本的正確步驟？", "ex": "製作玻片標本的步驟：先在「載玻片」上滴一滴水（戊）→放入葉片（乙）→以 45 度角蓋上「蓋玻片」避免產生氣泡（丁）→用濾紙吸去多餘的水（甲）。所以是戊乙丁甲。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["戊乙丁甲", "己甲乙丙", "己乙丙甲", "戊甲乙丁"], "ans": 0, "ch": "1"}, {"id": "s112_1_q15", "src": "school", "sec": "1-2", "concept": "解剖顯微鏡成像", "q": "琪琪利用解剖顯微鏡觀察如附圖所示的「86」載玻片，若她在視野中只看到8，則應將玻片往哪個方向移動才能看到所有的數字？", "ex": "解剖顯微鏡看到的影像是正立的，不會上下左右顛倒。只看到左邊的 8，表示要看右邊的 6，必須讓玻片往左移，這樣就能看到完整的「86」。", "fig": "fig/s112_1_q15.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["向右移動，可看到98", "向右移動，可看到89", "向左移動，可看到98", "向左移動，可看到86"], "ans": 3, "ch": "1"}, {"id": "s112_1_q16", "src": "school", "sec": "1-2", "concept": "顯微鏡倍率", "q": "顯微鏡的目鏡及物鏡長短與倍率有關，當目鏡愈長時，倍率愈低；物鏡愈長時，倍率愈高。附圖中甲、乙、丙為目鏡，P、Q、R 為物鏡。晶晶利用這臺顯微鏡觀察植物的表皮，請問：如果想要在視野中看見最大的細胞，應採用何種組合？", "ex": "想看到「最大」的細胞要用最高倍率。題目說目鏡越短倍率越高、物鏡越長倍率越高，所以選最短的目鏡丙和最長的物鏡 R。", "fig": "fig/s112_1_q16.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、P", "乙、Q", "丙、R", "甲、R"], "ans": 2, "ch": "1"}, {"id": "s112_1_q17", "src": "school", "sec": "1-2", "concept": "高倍鏡操作", "q": "真真使用顯微鏡觀察口腔皮膜細胞，她用兩種不同倍率的物鏡來觀察，觀察到的影像分別為附圖中的X 視野和Y 視野。下列敘述何者正確？", "ex": "X 視野到 Y 視野細胞變大，表示換成高倍物鏡，換高倍後只能用細調節輪微調焦距。換高倍後視野會變暗；口腔皮膜細胞要染色才看得清楚細胞核（ㄅ）。", "fig": "fig/s112_1_q17.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["從X 視野到Y 視野，需先將玻片往右上移", "從X 視野到Y 視野，需利用細調節輪調焦距", "假設不去調整亮度，從X 視野到Y 視野畫面會變亮", "觀察此細胞不需要經過染色，即可清楚觀察到圖中的ㄅ部位"], "ans": 1, "ch": "1"}, {"id": "s112_1_q18", "src": "school", "sec": "1-2", "concept": "調節亮度的構造", "q": "妙妙利用複式顯微鏡觀察口腔皮膜細胞時，發現顯微鏡中視野過暗，可調節附圖哪一個構造以獲得適當的光線？", "ex": "視野太暗要調整光圈或反光鏡。圖中丙指的是載物臺下方的光圈，可以調節進入的光量。甲是目鏡、乙是旋轉盤、丁是調節輪。", "fig": "fig/s112_1_q18.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ch": "1"}, {"id": "s112_1_q19", "src": "school", "sec": "1-2", "concept": "目鏡放大功能", "q": "承上題，顯微鏡各部位構造中，哪個具有放大的功能？", "ex": "甲是目鏡，可以放大影像。乙是旋轉盤，用來轉換物鏡；丙是光圈、丁是調節輪，都沒有放大的功能。", "fig": "fig/s112_1_q18.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ch": "1"}, {"id": "s112_1_q20", "src": "school", "sec": "1-2", "concept": "解剖顯微鏡眼距", "q": "魯夫使用右圖顯微鏡觀察生物構造，換到娜美看時，發現兩眼視野無法重合，則娜美應該調整何種構造以解決此問題？", "ex": "兩眼視野無法重合，是因為每個人兩眼之間的距離不同，要調整眼距調整器（乙），把兩個目鏡筒調到符合自己的眼距。", "fig": "fig/s112_1_q20.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1, "ch": "1"}, {"id": "s112_1_q23", "src": "school", "sec": "1-3", "concept": "細胞形態與功能", "q": "丁丁觀察不同細胞的形態，「能進行訊息的接收或傳送」、「能收縮舒張產生運動」分別是下列何種細胞？", "ex": "神經細胞（甲）有許多突起，能接收和傳送訊息；肌肉細胞（乙）呈長條狀，能收縮舒張產生運動。丙是植物細胞、丁是紅血球。", "fig": "fig/s112_1_q23.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、乙", "丁、丙", "乙、甲", "丁、乙"], "ans": 0, "ch": "1"}, {"id": "s112_1_q24", "src": "school", "sec": "1-3", "concept": "細胞構造功能", "q": "附圖是動物細胞和植物細胞的示意圖，關於此圖中細胞內各構造的功能，下列何者正確？", "ex": "乙是細胞質，是細胞進行代謝作用的主要場所。甲是細胞核（生命中樞，但控制物質進出的是細胞膜）；丙是粒線體，負責產生能量；丁是葉綠體，負責製造養分，所以(C)(D)功能剛好說反了。", "fig": "fig/s112_1_q24.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲能控制物質進出，是細胞的生命中樞", "乙是細胞進行代謝作用的主要場所", "丙能產生養分", "丁能產生能量"], "ans": 1, "ch": "1"}, {"id": "s112_1_q25", "src": "school", "sec": "1-3", "concept": "保衛細胞", "q": "附圖是植物葉的表皮構造，下列敘述何者錯誤？", "ex": "乙是保衛細胞，主要功能是控制氣孔開閉，具保護作用的是表皮細胞（甲），所以(B)錯。甲、乙都是植物細胞，有細胞核和細胞壁；保衛細胞含葉綠體。", "fig": "fig/s112_1_q25.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、乙細胞均含有細胞核及細胞壁", "乙稱為保衛細胞，具保護作用", "丙多分布於葉的下表皮，可控制水分散失", "乙細胞含葉綠體，可行光合作用"], "ans": 1, "ch": "1"}, {"id": "s112_1_q26", "src": "school", "sec": "1-4", "concept": "滲透作用", "q": "大雄將植物細胞放入某種液體後，細胞呈現如附圖所示的變化。有關此結果的相關敘述，何者錯誤？", "ex": "細胞放進濃糖水或海水中，細胞內的水會滲透到外面，細胞膜和細胞質縮小而與細胞壁分開。細胞壁並沒有被破壞，所以(C)錯。", "fig": "fig/s112_1_q26.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["細胞內的水分可直接通過細胞膜，滲透到細胞外", "此液體可能為濃糖水或海水", "右邊細胞的細胞壁被破壞，導致與細胞膜分開", "此現象發生的原因，和葉綠體無關"], "ans": 2, "ch": "1"}, {"id": "s112_1_q27", "src": "school", "sec": "1-4", "concept": "物質通過細胞膜", "q": "附圖為物質通過細胞膜情形的示意圖。圖中的甲最可能為下列哪一種物質？", "ex": "甲直接穿過細胞膜的雙層磷脂質，表示它是很小的分子，例如二氧化碳。葡萄糖需要經過蛋白質通道；蛋白質太大，無法通過細胞膜。", "fig": "fig/s112_1_q27.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["葡萄糖", "二氧化碳", "蛋白質", "礦物質"], "ans": 1, "ch": "1"}, {"id": "s112_1_q28", "src": "school", "sec": "1-4", "concept": "物質通過細胞膜", "q": "承上題，圖中的乙最可能為下列哪一種物質？", "ex": "乙由兩個小粒子組成，可以經由膜上的蛋白質通道進出，最可能是水分子。水既可以直接穿過細胞膜，也可以經由蛋白質通道進出。", "fig": "fig/s112_1_q27.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水", "葡萄糖", "二氧化碳", "澱粉"], "ans": 0, "ch": "1"}, {"id": "s112_1_q29", "src": "school", "sec": "1-4", "concept": "膜蛋白通道", "q": "承上題，關於物質丙所經過的通道，下列敘述何者正確？", "ex": "葡萄糖、胺基酸對細胞膜而言屬於較小的分子，可以經由蛋白質通道進出細胞。澱粉、蛋白質是大分子，不能通過；滲透作用專指水分子的移動。", "fig": "fig/s112_1_q27.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["澱粉可經由此通道進出細胞", "利用滲透作用運輸物質進出細胞", "對細胞膜而言，葡萄糖與胺基酸屬於較小的物質，才能通過這類通道", "物質丙可能為蛋白質"], "ans": 2, "ch": "1"}, {"id": "s112_1_q30", "src": "school", "sec": "1-3", "concept": "細胞構造比較", "q": "下列有關細胞的描述何者錯誤？", "ex": "水蘊草細胞有葉綠體，也有粒線體，因為所有細胞都需要能量，所以(C)錯。紅血球沒有細胞核、呈雙凹圓盤狀；神經細胞是動物細胞，沒有細胞壁。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["細胞是由分子構成，分子是由原子構成", "人類的成熟紅血球是雙凹圓盤狀，有利於運送氧氣，沒有細胞核", "水蘊草細胞是綠色有葉綠體，但無粒線體", "人類的神經細胞有許多突起，沒有細胞壁"], "ans": 2, "ch": "1"}, {"id": "s112_1_q31", "src": "school", "sec": "1-3", "concept": "保衛細胞與表皮細胞", "q": "利用顯微鏡觀察咸豐草的葉下表皮，若想要區別表皮細胞與保衛細胞，請問可以利用何種構造來辨別呢？", "ex": "葉表皮細胞沒有葉綠體，保衛細胞有葉綠體，所以可以用葉綠體來區分。兩者都有粒線體、液胞和細胞壁，無法用來區分。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["葉綠體", "粒線體", "液胞", "細胞壁"], "ans": 0, "ch": "1"}, {"id": "s112_1_q32", "src": "school", "sec": "1-3", "concept": "動物細胞構造", "q": "附圖為某細胞的示意圖，有關此細胞的敘述，下列何者正確？", "ex": "這個細胞沒有細胞壁和葉綠體，是動物細胞。乙是液胞，可以暫存水分、養分和廢物。甲是細胞膜，不是由纖維素構成；丙是粒線體，不能行光合作用。", "fig": "fig/s112_1_q32.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲由纖維素構成，可維持細胞的形狀", "此細胞為植物表皮細胞", "丙是光合作用進行的場所", "乙可暫存細胞中多餘的水分、養分和廢物"], "ans": 3, "ch": "1"}, {"id": "s112_1_q33", "src": "school", "sec": "1-4", "concept": "擴散作用", "q": "關於擴散作用，下列敘述何者有誤？", "ex": "擴散作用是物質由濃度高往濃度低移動，不只發生在水和氣體，液體中的糖、墨水等也會擴散，所以(B)錯。擴散可以自然發生，最後會讓物質均勻分布。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["可以自然發生，無須外力協助，但如果有外力協助，則可能加速擴散", "只有水和氣體會發生擴散作用", "擴散作用最後會導致該物質均勻分布在整個空間", "有些物質擴散進出細胞要經過蛋白質協助"], "ans": 1, "ch": "1"}, {"id": "s112_1_q34", "src": "school", "sec": "1-3", "concept": "實驗 1-2 細胞的觀察", "q": "柯南以牙籤刮取口腔皮膜，並用亞甲藍液染色製作成玻片標本A。小蘭也拿洋蔥鱗葉的表皮製作成標本B。他們利用顯微鏡觀察，並比較AB 兩種標本所觀察到的構造。下列敘述何者正確？", "ex": "觀察口腔皮膜細胞和洋蔥表皮細胞都要用複式顯微鏡。兩者都需要染色才能清楚看到細胞核；洋蔥鱗葉表皮沒有葉綠體；口腔皮膜細胞形狀不規則。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["A 要染色才看的到細胞核，B 不必染色就看的到細胞核", "A 的細胞無葉綠體，B 的細胞有葉綠體", "AB 皆可看到形狀規則、排列緊密的細胞", "AB 皆使用複式顯微鏡進行觀察"], "ans": 3, "ch": "1"}, {"id": "s112_1_q35", "src": "school", "sec": "1-4", "concept": "葡萄糖分子", "q": "葡萄糖可用C₆H₁₂O₆ 表示，則下列有關葡萄糖分子特性的敘述，下列何者有誤？", "ex": "葡萄糖由碳、氫、氧原子組成，對細胞膜來說是小分子，可以直接經由通道進入細胞，不必再分解，所以(A)錯。很多葡萄糖可以連接成澱粉。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["必須分解成更小的分子才能通過細胞膜", "對細胞膜而言是一種小分子", "很多個葡萄糖分子可以組成澱粉分子", "由碳原子、氫原子及氧原子組成"], "ans": 0, "ch": "1"}, {"id": "s112_1_q36", "src": "school", "sec": "1-5", "concept": "單細胞與多細胞生物", "q": "下列哪種生物，單一個細胞無法執行維持生命的所有活動？", "ex": "跳蚤是多細胞生物，單一個細胞無法完成所有生命活動，要靠不同細胞分工合作。新月藻、草履蟲、眼蟲都是單細胞生物，一個細胞就能完成所有生命活動。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["新月藻", "草履蟲", "跳蚤", "眼蟲"], "ans": 2, "ch": "1"}, {"id": "s112_1_q37", "src": "school", "sec": "1-5", "concept": "植物組成層次", "q": "校園中有一棵結了好多果實的辣木，請問下列關於辣木敘述何者正確？", "ex": "植物沒有器官系統，組成層次是細胞→組織→器官→個體。花謝了、有果實，植物有根、莖、葉、果實、種子等器官，不是只有 4 種；植物也沒有「生殖系統」。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["因為辣木是多細胞生物，所以組成層次為：細胞、組織、器官、器官系統、個體", "因為辣木是多細胞植物，所以組成層次為：細胞、組織、器官、個體", "因為辣木具有生殖系統，所以可以開花結果", "如果這棵有許多成熟果實的辣木，樹上的花都謝了，此時它具有4 種器官"], "ans": 1, "ch": "1"}, {"id": "s112_1_q38", "src": "school", "sec": "1-5", "concept": "組成層次判斷", "q": "多細胞生物，有所謂的「組成層次」。下列關於各層次的敘述，何者錯誤？", "ex": "水筆仔的筆狀胎生苗其實是已經發芽的幼苗，屬於個體層次，不是器官，所以(C)錯。玫瑰花是器官；蛋黃、紅血球是細胞；血液、洋蔥表皮是組織。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["一個駝鳥蛋的蛋黃、人類的一個紅血球，都屬於細胞層次", "人的一滴血液、洋蔥的一層表皮，都屬於組織層次", "一朵玫瑰花、一支水筆仔的綠色筆狀胎生苗，都屬於器官層次", "一隻跳蚤、一隻螞蟻，都屬於個體層次"], "ans": 2, "ch": "1"}, {"id": "s112_1_q39", "src": "school", "sec": "1-5", "concept": "單細胞生物層次", "q": "附圖的生物為草履蟲，其組成層次的相關敘述，何者正確？", "ex": "草履蟲是單細胞生物，一個細胞就是一個個體，所以有細胞層次，但沒有組織、器官和器官系統。", "fig": "fig/s112_1_q39.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["有細胞、但沒有組織", "有組織、但沒有器官", "有器官、但沒有器官系統", "有細胞、但不算是個體"], "ans": 0, "ch": "1"}, {"id": "s112_1_q40", "src": "school", "sec": "1-5", "concept": "器官層次", "q": "珊迪到餐廳吃飯時，點了下列四道料理，請問何者的食材皆為生物體的器官層次？", "ex": "綠豆、花生都是種子，屬於植物的器官。牛肉是肌肉組織、雞蛋是一個細胞、蛤蜊是個體，番茄是果實（器官），但其他選項都混了不同層次。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蔥爆牛肉", "綠豆花生湯", "番茄炒蛋", "蛤蜊絲瓜"], "ans": 1, "ch": "1"}, {"id": "s112_1_q41", "src": "school", "sec": "1-5", "concept": "組成層次排序", "q": "珍珍觀察了鳳仙花的植株，並列出幾個構造如下：(甲)葉上表皮；(乙)花；(丙)葉肉細胞；(丁)葉綠體，這些構造由繁至簡依序排列為何？", "ex": "由繁到簡：花是器官（乙）→葉上表皮是組織（甲）→葉肉細胞是細胞（丙）→葉綠體是細胞內的構造（丁），所以是乙甲丙丁。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙丙丁", "丁丙甲乙", "丙丁乙甲", "乙甲丙丁"], "ans": 3, "ch": "1"}, {"id": "s112_1_q42", "src": "school", "sec": "1-5", "concept": "植物生殖器官", "q": "上生物課時，老師請同學舉例說明植物的生殖器官，請問誰說的不正確?", "ex": "花、果實、種子是植物的生殖器官。紅蘿蔔是根，屬於營養器官，所以大雄說錯了。花生是種子、番茄是果實、百合花是花。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["胖虎：一粒花生", "小夫：一個番茄", "靜香：一朵百合花", "大雄：一根紅蘿蔔"], "ans": 3, "ch": "1"}, {"id": "s112_1_q48", "src": "school", "sec": "1-2", "concept": "細胞發現史", "q": "下列關於細胞發現的歷史，何項敘述錯誤？", "ex": "細胞學說的雛型是由許旺和許來登提出的，菲可則是補充「細胞來自已存在的細胞」，所以(A)錯。虎克最早發現細胞，雷文霍克用顯微鏡發現細菌。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["細胞學說的雛型是在菲可奠定的", "雷文霍克利用顯微鏡發現了細菌", "由虎克首先發現到細胞的存在", "菲可認為所有的細胞均來自已存在的細胞。"], "ans": 0, "ch": "1"}, {"id": "s112_1_q49", "src": "school", "sec": "1-2", "concept": "細胞學說", "q": "下列哪一項敘述符合「細胞學說」？", "ex": "細胞學說的重點：生物都由細胞構成、細胞是生物構造和功能的基本單位、細胞來自已存在的細胞。(A)錯在單細胞生物只有一個細胞；(C)是事實但不是細胞學說內容。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["每個生物個體，都是由許多細胞聚集形成的", "細胞裡有遺傳物質，所以具有生命現象", "細胞的形狀隨功能不同而有不同", "細胞是生物體構造和機能的最基本單位"], "ans": 3, "ch": "1"}, {"id": "s112_1_q50", "src": "school", "sec": "1-2", "concept": "細胞發現史", "q": "科學家布朗在生物學上發現了什麼重要的事實？", "ex": "布朗發現細胞內有一個球狀的構造，也就是細胞核。生物由細胞構成是細胞學說的內容；發現細菌的是雷文霍克。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["植物細胞具有細胞壁", "細胞內有一球狀的核", "生物體皆是由細胞所構成", "發現到細菌有不同的形態"], "ans": 1, "ch": "1"}, {"id": "s113_1_q1", "src": "school", "sec": "1-1", "concept": "科學方法步驟", "q": "探究科學必須使用科學方法，而相關的步驟包括：(甲)提出問題； (乙)提出假說； (丙)參考文獻資料；(丁)設計實驗； (戊)討論並提出結論； (己)觀察； (庚)分析實驗數據。請按照順序選出正確答案", "ex": "科學方法的順序：觀察（己）→提出問題（甲）→參考文獻資料（丙）→提出假說（乙）→設計實驗（丁）→分析實驗數據（庚）→討論並提出結論（戊）。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己甲丙乙丁庚戊", "己甲乙丙丁庚戊", "己乙甲丙丁庚戊", "甲己乙丙丁庚戊。"], "ans": 0, "ch": "1"}, {"id": "s113_1_q2", "src": "school", "sec": "1-1", "concept": "科學方法步驟", "q": "請問小明觀察麵包發霉的情況，並記錄下來，是屬於科學方法的哪一項？", "ex": "小明把麵包發霉的情況記錄下來，在選項中最接近「整理並分析數據」。", "fig": "fig/s113_1_q2.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "依科學方法，觀察並記錄現象通常屬於「觀察」步驟，但選項裡沒有「觀察」；官方答案選(D)，可以理解為把觀察到的情形記錄成資料。", "pas": "小明買了一塊麵包後，放在客廳桌上數天，結果發現兩天後麵包發霉，上網收集資料後發現，黴菌喜歡生活在溫暖潮濕的地方，梁兄猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!為了釐清麵包上黴菌生長與水分的關係，依照科學方法進行相關實驗，試回答下列問題：", "opts": ["討論並提出結論", "參考文獻資料", "設計實驗", "整理並分析數據。"], "ans": 3, "ch": "1"}, {"id": "s113_1_q3", "src": "school", "sec": "1-1", "concept": "參考文獻資料", "q": "請問小明上網收集資料這個動作是屬於科學方法的哪一項？", "ex": "上網收集資料、查書本、問專家，都是在了解別人已經知道的知識，屬於「參考文獻資料」。", "fig": "fig/s113_1_q2.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "小明買了一塊麵包後，放在客廳桌上數天，結果發現兩天後麵包發霉，上網收集資料後發現，黴菌喜歡生活在溫暖潮濕的地方，梁兄猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!為了釐清麵包上黴菌生長與水分的關係，依照科學方法進行相關實驗，試回答下列問題：", "opts": ["參考文獻資料", "提出假說", "設計實驗", "整理並分析數據。"], "ans": 0, "ch": "1"}, {"id": "s113_1_q4", "src": "school", "sec": "1-1", "concept": "提出假說", "q": "請問小明猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!這個想法是屬於科學方法的哪一項？", "ex": "「發霉是因為空氣濕度較高」是對原因的猜測，還沒經過實驗證實，屬於「提出假說」。", "fig": "fig/s113_1_q2.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "小明買了一塊麵包後，放在客廳桌上數天，結果發現兩天後麵包發霉，上網收集資料後發現，黴菌喜歡生活在溫暖潮濕的地方，梁兄猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!為了釐清麵包上黴菌生長與水分的關係，依照科學方法進行相關實驗，試回答下列問題：", "opts": ["提出問題", "提出假說", "設計實驗", "觀察。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q5", "src": "school", "sec": "1-1", "concept": "選擇對照組", "q": "小明應選擇下列哪兩組進行實驗，並做觀察比較？", "ex": "要研究水分和黴菌的關係，兩組只能「給不給水」不同，光線和溫度要相同。丙（黑暗、不給水、30℃）和庚（黑暗、給適量水、30℃）正好只差水分。", "fig": "fig/s113_1_q2.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "小明買了一塊麵包後，放在客廳桌上數天，結果發現兩天後麵包發霉，上網收集資料後發現，黴菌喜歡生活在溫暖潮濕的地方，梁兄猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!為了釐清麵包上黴菌生長與水分的關係，依照科學方法進行相關實驗，試回答下列問題：", "opts": ["甲乙", "丙庚", "乙丙", "戊庚。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q6", "src": "school", "sec": "1-1", "concept": "三種變因", "q": "比較上述兩組實驗，請問操作變因、控制變因、應變變因依序為何？", "ex": "丙和庚只差給不給水，所以操作變因是濕度；兩組都保持一樣的條件（照光、溫度）是控制變因；最後觀察的黴菌生長情形是應變變因。", "fig": "fig/s113_1_q2.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "小明買了一塊麵包後，放在客廳桌上數天，結果發現兩天後麵包發霉，上網收集資料後發現，黴菌喜歡生活在溫暖潮濕的地方，梁兄猜測發霉的原因是因為梅姬颱風剛過，最近下雨頻繁，空氣濕度較高，導致麵包容易發霉吧!為了釐清麵包上黴菌生長與水分的關係，依照科學方法進行相關實驗，試回答下列問題：", "opts": ["溫度、濕度、黴菌生長情形", "黴菌生長情形、濕度、照光", "濕度、照光、黴菌生長情形", "濕度、溫度、照光。"], "ans": 2, "ch": "1"}, {"id": "s113_1_q7", "src": "school", "sec": "1-2", "concept": "生命現象舉例", "q": "下列有關生命現象與其舉例的配對，何者錯誤？", "ex": "鐘乳石洞的石筍是水中礦物質沉積而成，不是生物，不算生命現象的生長，所以(A)錯。熊貓生寶寶是繁殖、含羞草閉合是感應、光合作用是代謝。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["生長與發育：鐘乳石洞中不斷長出新石筍", "繁殖：熊貓生下熊貓寶寶", "感應與運動：含羞草被碰觸而閉合", "代謝：植物行光合作用產生養分"], "ans": 0, "ch": "1"}, {"id": "s113_1_q8", "src": "school", "sec": "1-2", "concept": "生物共同特徵", "q": "下列何項是一般生物皆共同具有的特徵？", "ex": "所有生物都能繁殖延續種族。植物不能主動移動、植物沒有肌肉，也不需要攝食（自己製造養分），所以其他選項不是所有生物共有的特徵。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["有延續種族之生存能力", "有主動運動與遷移的能力", "都能感應環境的刺激後而收縮肌肉產生運動", "需要攝食以補充養分"], "ans": 0, "ch": "1"}, {"id": "s113_1_q9", "src": "school", "sec": "1-2", "concept": "生物適應環境", "q": "下列生物與其相關敘述，何者錯誤？", "ex": "鮟鱇魚（燈籠魚）會發光，生活在漆黑的深海，不是陽光充足的珊瑚礁海域，所以(C)錯。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水筆仔具有筆狀胎生苗，適合生活在河口環境", "仙人掌肥厚的莖能儲存水分，以利沙漠中生存", "鮟鱇魚(燈籠魚)可發光，適合生存在珊瑚礁海域", "蝙蝠能利用回聲定位，幫助其適應黑暗洞穴"], "ans": 2, "ch": "1"}, {"id": "s113_1_q10", "src": "school", "sec": "1-2", "concept": "生物圈範圍", "q": "關於生物圈敘述，下列何者錯誤？", "ex": "生物圈的範圍會因為發現新的生物分布或生物滅絕而改變，不是固定不變的，所以(A)錯。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["生物圈的範圍是固定不變的", "沙漠地區非常乾燥，仙人掌的針狀葉可減少水分散失", "深海因沒有陽光，所以沒有綠色植物存在", "水筆仔具有胎生苗，能適應潮汐變化的河口"], "ans": 0, "ch": "1"}, {"id": "s113_1_q11", "src": "school", "sec": "1-2", "concept": "生物圈分布", "q": "下圖為地球的高山與海洋示意圖，有關甲、乙、丙、丁區域的敘述，何者正確？", "ex": "甲處是 8000 公尺的高空，仍可能發現細菌，所以(A)正確。乙處在海平面附近，生物種類和數量最多；丙處是淺海，鮟鱇魚生活在深海；丁處是 10000 公尺深海，沒有陽光，不會有珊瑚礁。", "fig": "fig/s113_1_q11.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲處可發現細菌的存在", "乙處的生物種類、數量較少", "丙處可能找到鮟鱇魚(燈籠魚)的存在", "丁處可可發現珊瑚礁、小丑魚等生物"], "ans": 0, "ch": "1"}, {"id": "s113_1_q12", "src": "school", "sec": "1-2", "concept": "生物圈範圍", "q": "目前生物圈領域，若以海洋表面為基準，上下各約多少公尺？", "ex": "生物圈大約是以海平面為基準，上下各約 10000 公尺（10 公里）的範圍。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["10", "100", "1000", "10000。"], "ans": 3, "ch": "1"}, {"id": "s113_1_q13", "src": "school", "sec": "1-2", "concept": "虎克發現細胞", "q": "利用自製顯微鏡觀察軟木栓薄片，將看到的蜂窩狀中空小格子，稱之為細胞的科學家是何人？", "ex": "虎克用自製顯微鏡觀察軟木栓薄片，看到許多中空的小格子，把它命名為「細胞」。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["布朗", "許旺和許來登", "雷文霍克", "虎克。"], "ans": 3, "ch": "1"}, {"id": "s113_1_q14", "src": "school", "sec": "1-2", "concept": "細胞學說", "q": "下列哪項敘述符合「細胞學說」？", "ex": "細胞學說認為細胞是生物體構造和功能的基本單位。(A)是細胞構造的描述、(C)是細胞形態的事實，都不是細胞學說；生物也不一定只有一個細胞。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["大多細胞都具有細胞膜、細胞質和細胞核", "細胞是生物體構造和功能的基本單位", "細胞的形狀隨功能不同而有不同", "生物體皆由一個細胞構成。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q15", "src": "school", "sec": "1-2", "concept": "複式顯微鏡操作", "q": "關於複式顯微鏡的使用，下列操作動作中何者正確？", "ex": "使用高倍物鏡時，物鏡離玻片很近，只能轉動細調節輪，避免壓破玻片。拿顯微鏡要一手握鏡臂、一手托鏡座；鏡頭髒了要用拭鏡紙；不能用鉛筆壓載玻片。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["取用顯微鏡時只要單手抓緊鏡臂即可", "若發現鏡頭髒污，可使用乾淨的衛生紙擦拭", "若發現視野下有氣泡，可用鉛筆尖輕壓載玻片，將氣泡擠出", "使用高倍物鏡時，只能轉動細調節輪。"], "ans": 3, "ch": "1"}, {"id": "s113_1_q16", "src": "school", "sec": "1-2", "concept": "顯微鏡倍率計算", "q": "小明最近購買一臺複式顯微鏡，其目鏡有10倍、20 倍二種，而物鏡則有4 倍、10 倍、20 倍及40 倍四種選擇，此顯微鏡共有幾種放大倍數？", "ex": "放大倍率＝目鏡倍率×物鏡倍率。10×4、10×10、10×20、10×40 得到 40、100、200、400；20×4、20×10、20×20、20×40 得到 80、200、400、800。去掉重複的 200、400，共 6 種。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["5", "6", "7", "8。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q17", "src": "school", "sec": "1-2", "concept": "複式顯微鏡成像", "q": "使用複式顯微鏡作觀察右圖英文單字，請問視野下最可能看到下列那一個影像？", "ex": "複式顯微鏡的影像是上下左右都顛倒（等於轉 180 度），而且會放大。所以「F」在視野中會變成倒轉的 F，而且看起來比較大，選(C)。", "fig": "fig/s113_1_q17.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 2, "ch": "1"}, {"id": "s113_1_q18", "src": "school", "sec": "1-3", "concept": "保衛細胞", "q": "嘉欣使用複式顯微鏡觀察植物的葉下表皮，右圖為視野中所見的細胞，請問箭頭所指具有顏色的細胞為何種細胞？有無葉綠體？", "ex": "葉下表皮中，成對、半月形、有顏色的是保衛細胞，它含有葉綠體，所以看起來有顏色。一般表皮細胞沒有葉綠體，是無色透明的。", "fig": "fig/s113_1_q18.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["保衛細胞；無葉綠體", "保衛細胞；有葉綠體", "表皮細胞；無葉綠體", "表皮細胞；有葉綠體。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q19", "src": "school", "sec": "1-2", "concept": "移動玻片", "q": "若想將箭頭所指細胞，移至視野中央，應將玻片往那一個方向移動？", "ex": "複式顯微鏡的影像上下左右顛倒，物體在視野的哪個方向，玻片就往同一個方向移。箭頭所指的細胞在視野右上方，所以玻片往右上方移。", "fig": "fig/s113_1_q18.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["右上", "右下", "左上", "左下。"], "ans": 0, "ch": "1"}, {"id": "s113_1_q20", "src": "school", "sec": "1-2", "concept": "解剖顯微鏡構造", "q": "解剖顯微鏡可利用何種構造，調整兩眼瞳孔距離？", "ex": "解剖顯微鏡用「眼距調整器」來調整兩個目鏡之間的距離，配合每個人的瞳孔距離。眼焦調整器是用來調整兩眼焦距不同的問題。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["眼焦調整器", "眼距調整器", "調節輪", "目鏡。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q21", "src": "school", "sec": "1-2", "concept": "換高倍物鏡步驟", "q": "小安用10 ×物鏡，如附圖(一)，觀察水中的小生物時，在視野內看到一個單細胞的矽藻，如附圖(二)，如果他要換較高倍的物鏡繼續觀察此矽藻，下列有六個操作步驟：(1)將載玻片向右上方移；(2)將載玻片向左下方移；(3)稍稍轉動細調節輪；(4)稍稍轉動粗調節輪；(5)轉動旋轉盤換物鏡甲；(6)轉動旋轉盤換物鏡乙。請問下列哪一項操作順序是正確的？", "ex": "矽藻在視野的左下方，複式顯微鏡要往同方向移，所以玻片先往左下方移（2）；再換較長、倍率較高的物鏡甲（5）；最後只能稍稍轉動細調節輪（3）。", "fig": "fig/s113_1_q21.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["4 → 5 → 2 → 3", "1 → 6 → 3", "2 → 5 → 3", "2 → 6 → 4 → 3。"], "ans": 2, "ch": "1"}, {"id": "s113_1_q22", "src": "school", "sec": "1-2", "concept": "旋轉盤", "q": "下列何者能夠轉換物鏡的倍率？", "ex": "乙是旋轉盤，轉動它可以更換不同倍率的物鏡。甲是目鏡、丙是光圈、丁是調節輪。", "fig": "fig/s113_1_q22.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "右圖為一臺複式顯微鏡，請根據代號回答下列問題：", "opts": ["甲", "乙", "丙", "丁。"], "ans": 1, "ch": "1"}, {"id": "s113_1_q23", "src": "school", "sec": "1-2", "concept": "光圈", "q": "下列何者能夠調節亮度？", "ex": "丙是載物臺下方的光圈，可以調節進入的光線量，改變視野亮度。", "fig": "fig/s113_1_q22.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "右圖為一臺複式顯微鏡，請根據代號回答下列問題：", "opts": ["甲", "乙", "丙", "丁。"], "ans": 2, "ch": "1"}, {"id": "s113_1_q24", "src": "school", "sec": "1-2", "concept": "調節輪", "q": "下列何者能調節清晰度？", "ex": "丁是調節輪，轉動它可以讓鏡筒或載物臺上下移動，調整焦距，使影像清晰。", "fig": "fig/s113_1_q22.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "右圖為一臺複式顯微鏡，請根據代號回答下列問題：", "opts": ["甲", "乙", "丙", "丁。"], "ans": 3, "ch": "1"}, {"id": "s113_1_q25", "src": "school", "sec": "1-2", "concept": "顯微鏡倍率", "q": "下圖為顯微鏡的三個目鏡(甲、乙、丙)與( P、Q、R )物鏡，你認為那個組合的放大倍率最大？", "ex": "目鏡越短倍率越高，物鏡越長倍率越高。最短的目鏡是丙、最長的物鏡是 R，所以丙×R 的放大倍率最大。", "fig": "fig/s113_1_q25.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲X P", "乙 X Q", "丙 X R", "丙 X P。"], "ans": 2, "ch": "1"}, {"id": "s113_1_q26", "src": "school", "sec": "1-3", "concept": "紅血球形態", "q": "小伶觀察不同細胞的形態，下列何種細胞能協助人體運送氧氣？", "ex": "紅血球呈雙凹圓盤狀，含有血紅素，能協助人體運送氧氣，就是(C)。(A)是肌肉細胞、(B)是神經細胞、(D)是植物細胞。", "fig": "fig/s113_1_q26.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 2, "ch": "1"}, {"id": "s113_1_q27", "src": "school", "sec": "1-3", "concept": "細胞相關知識", "q": "小丸子和同學們一起討論細胞的相關知識，有關他們的討論內容，下列何者正確？", "ex": "雞蛋的蛋黃是一個巨大的卵細胞。動物細胞沒有葉綠體也沒有細胞壁；大象比人大是因為細胞數量比較多，不是細胞比較大。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["美環：雞蛋蛋黃是一個巨大的細胞", "小玉：多數動物具有葉綠體，可行光合作用", "小丸子：部分的動物細胞具有細胞壁", "永澤：大象的體積比人大，是因為大象身上的細胞都比人體細胞大"], "ans": 0, "ch": "1"}, {"id": "s113_1_q28", "src": "school", "sec": "1-3", "concept": "動植物細胞差異", "q": "老師在複式顯微鏡下放了一片未標記的表皮細胞玻片標本，要求小新判斷其屬於植物細胞或動物細胞。請問：小新可以根據何種構造的有無進行判斷？", "ex": "植物細胞有細胞壁，動物細胞沒有，所以可以用細胞壁判斷。粒線體、細胞核兩者都有；動物細胞也可能有小液泡，用液泡判斷不夠準確。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["粒線體", "液泡", "細胞壁", "細胞核"], "ans": 2, "ch": "1"}, {"id": "s113_1_q29", "src": "school", "sec": "1-3", "concept": "動植物細胞比較", "q": "有關動物細胞和植物細胞的比較，下列敘述何者正確？", "ex": "動植物細胞的細胞質中都有粒線體等多種小構造。植物細胞的液泡通常比較大；動物細胞沒有細胞壁；植物的根細胞也沒有葉綠體，所以不能只用葉綠體判斷。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["動物細胞的液泡通常比植物細胞的大", "動物細胞和植物細胞的細胞質內皆有多種小構造", "只有少數動物細胞具有細胞壁，植物細胞則皆具有細胞壁", "沒有葉綠體的細胞為動物細胞，具有葉綠體的細胞為植物細胞"], "ans": 1, "ch": "1"}, {"id": "s113_1_q30", "src": "school", "sec": "1-3", "concept": "保衛細胞", "q": "附圖是植物葉的表皮構造，下列敘述何者正確？", "ex": "乙是保衛細胞，呈半月形、兩兩成對，中間圍成氣孔。甲是表皮細胞，沒有葉綠體、不能行光合作用；丙是氣孔，負責氣體進出和水分散失，不是吸收水分。", "fig": "fig/s113_1_q30.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、乙細胞均含有葉綠體及細胞壁", "甲細胞為不規則形，能行光合作用", "乙細胞為半月形，皆兩兩成對", "丙多分布於葉的下表皮，能協助吸收水分"], "ans": 2, "ch": "1"}, {"id": "s113_1_q31", "src": "school", "sec": "1-3", "concept": "細胞壁成分", "q": "醫生常告訴我們要多吃蔬菜，以補充足夠的纖維素幫助排便，其實是希望我們多吃植物細胞的哪一構造？", "ex": "植物細胞壁的主要成分是纖維素，所以多吃蔬菜補充纖維素，就是在吃細胞壁。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["細胞質", "細胞壁", "細胞核", "葉綠體"], "ans": 1, "ch": "1"}, {"id": "s113_1_q32", "src": "school", "sec": "1-3", "concept": "葉綠體", "q": "光彥使用顯微鏡觀察水蘊草細胞如附圖，發現細胞質中有許多綠色的小顆粒(乙構造)。請問關於乙構造的敘述，下列何者有誤？", "ex": "乙是葉綠體，含綠色的葉綠素，可以進行光合作用製造養分。但不是所有植物細胞都有葉綠體，例如根細胞、洋蔥鱗葉表皮細胞就沒有，所以(C)錯。", "fig": "fig/s113_1_q32.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["此構造位於細胞質中", "此構造內具有綠色色素", "所有植物細胞皆有此構造", "此構造可以合成養分"], "ans": 2, "ch": "1"}, {"id": "s113_1_q33", "src": "school", "sec": "1-3", "concept": "粒線體", "q": "下圖為細胞構造圖，已知某細胞需較多的能量才能維持其功能，可知該細胞內何種構造可能較多？", "ex": "細胞需要較多能量時，負責產生能量的粒線體會比較多。圖中丙是粒線體；甲是細胞核、乙是液胞、丁是葉綠體。", "fig": "fig/s113_1_q33.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ch": "1"}, {"id": "s113_1_q34", "src": "school", "sec": "1-4", "concept": "粒子表示法", "q": "下列物質粒子的表示方式，何者正確？", "ex": "二氧化碳分子由 1 個碳原子和 2 個氧原子組成，寫成 CO₂。氫原子是 H、水分子是 H₂O、氧分子是 O₂。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["氫原子—C", "二氧化碳分子—CO₂", "水分子—HO₂", "氧分子—O"], "ans": 1, "ch": "1"}, {"id": "s113_1_q35", "src": "school", "sec": "1-4", "concept": "葡萄糖分子", "q": "葡萄糖可用C₆H₁₂O₆表示，則下列有關葡萄糖分子特性的敘述，下列何者錯誤？", "ex": "葡萄糖對細胞膜而言是小分子，可以經由通道直接進入細胞，不需要再分解，所以(D)錯。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["由碳原子、氫原子及氧原子組成", "對細胞膜而言是一種小分子", "很多個葡萄糖分子可以組成澱粉分子", "必須分解成更小的分子才能通過細胞膜"], "ans": 3, "ch": "1"}, {"id": "s113_1_q36", "src": "school", "sec": "1-5", "concept": "尺度的認識", "q": "(甲)胺基酸；(乙)蛋白質；(丙)細胞；(丁)氫原子。若將上述四者由大到小排列，下列何者正確？", "ex": "由大到小：細胞（丙）＞蛋白質（乙）＞胺基酸（甲，是組成蛋白質的小分子）＞氫原子（丁）。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丁甲乙丙", "丙乙甲丁", "丙甲丁乙", "丁甲丙乙"], "ans": 1, "ch": "1"}, {"id": "s113_1_q37", "src": "school", "sec": "1-4", "concept": "物質進出細胞", "q": "附圖為物質進出細胞的示意圖，下列相關敘述何者錯誤？", "ex": "澱粉是大分子，不能通過細胞膜，無論甲（蛋白質通道）或乙（直接穿過）都不行，所以(D)錯。葡萄糖經由通道、氧氣直接穿過，水兩種方式都可以。", "fig": "fig/s113_1_q37.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["葡萄糖利用甲方式進出細胞", "氧氣利用乙方式進出細胞", "水可用甲或乙方式進出細胞", "澱粉可用甲或乙方式進入細胞"], "ans": 3, "ch": "1"}, {"id": "s113_1_q38", "src": "school", "sec": "1-4", "concept": "滲透作用", "q": "宣宣將大肚魚放入海水魚缸中飼養，但是大肚魚卻因此死亡，請問大肚魚死亡的原因為何？", "ex": "大肚魚是淡水魚，放進海水中，海水的鹽分濃度比體液高，細胞內的水會滲透到外面，細胞脫水而死亡。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["細胞脫水而死亡", "細胞內的鹽分通過細胞膜擴散到外界而死亡", "細胞脹破而死亡", "大肚魚只能生活在野外，無法利用魚缸飼養"], "ans": 0, "ch": "1"}, {"id": "s113_1_q39", "src": "school", "sec": "1-4", "concept": "滲透作用", "q": "小美製作泡菜時，先將泡菜並撒上大量的鹽，靜待一段時間後，高麗菜逐漸萎縮，外側的水分則漸漸增加，造成此現象的原因為何？", "ex": "撒鹽後高麗菜外面的鹽濃度變高、水的濃度變低，細胞內水的濃度比外面高，水就從細胞內滲透出來，高麗菜因而萎縮。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["高麗菜吸收了空氣中的水氣，使水分增加", "鹽擴散進入了高麗菜的細胞中，將水分擠出細胞", "鹽破壞了高麗菜的結構，高麗菜細胞破裂而滲出水分", "高麗菜細胞內的水分濃度比細胞外高，所以水分從細胞內滲出"], "ans": 3, "ch": "1"}, {"id": "s113_1_q40", "src": "school", "sec": "1-5", "concept": "單細胞生物", "q": "(甲)榕樹；(乙)細菌；(丙)跳蚤；(丁)眼蟲；(戊)青蛙；(己)新月藻。以上哪些生物細胞沒有分工合作的現象？", "ex": "細菌、眼蟲、新月藻都是單細胞生物，一個細胞就完成所有生命活動，沒有細胞分工合作。榕樹、跳蚤、青蛙都是多細胞生物。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙丙", "甲丙戊", "丙丁己", "乙丁己"], "ans": 3, "ch": "1"}, {"id": "s113_1_q41", "src": "school", "sec": "1-5", "concept": "單細胞與多細胞比較", "q": "比較一下單細胞生物和多細胞生物，下列敘述何者正確？", "ex": "單細胞生物只有 1 個細胞，多細胞生物有許多細胞。單細胞生物的細胞要獨立完成所有工作，所以獨立性較高、單一細胞功能較多；兩者都具有全部的生命現象。", "fig": "fig/s113_1_q41.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["個體細胞數：單細胞生物 1 個／多細胞生物 多個", "細胞獨立性：單細胞生物 較低／多細胞生物 較高", "單一細胞所具功能：單細胞生物 較少／多細胞生物 較多", "個體具有的生命現象：單細胞生物 較多／多細胞生物 較少"], "ans": 0, "ch": "1"}, {"id": "s113_1_q42", "src": "school", "sec": "1-5", "concept": "單細胞生物層次", "q": "附圖的生物為草履蟲，其生物體組成層次由低至高依序為何？", "ex": "草履蟲是單細胞生物，一個細胞就是一個個體，沒有組織、器官等層次。", "fig": "fig/s113_1_q42.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["細胞即個體", "細胞→組織→器官→個體", "細胞→器官→組織→個體", "細胞→組織→器官→器官系統→個體"], "ans": 0, "ch": "1"}, {"id": "s113_1_q43", "src": "school", "sec": "1-5", "concept": "組成層次排序", "q": "生物的組成層次包含細胞、組織、器官、器官系統與個體。丁丁去市場買了一條魚、一盒雞蛋、一袋地瓜和一塊雞胸肉。已知一般市售雞蛋未經過受精，若依生物的組成層次，將此四者由簡單至複雜依序排列，應為下列何者？", "ex": "未受精的雞蛋是一個細胞→雞胸肉主要是肌肉組織→地瓜是植物的根（器官）→一條魚是個體。所以由簡單到複雜是雞蛋→雞胸肉→地瓜→魚。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["地瓜→雞蛋→魚→雞胸肉", "雞蛋→地瓜→雞胸肉→魚", "雞蛋→雞胸肉→地瓜→魚", "魚→地瓜→雞胸肉→雞蛋"], "ans": 2, "ch": "1"}, {"id": "s113_1_q44", "src": "school", "sec": "1-5", "concept": "組成層次排序", "q": "人體仰賴消化系統完成養分的分解與吸收，下列幾項消化系統的構造(甲)口腔皮膜細胞；(乙)胃黏膜；(丙)小腸；(丁)消化道(由口腔到肛門的整個路徑)。以上四種構造由簡而繁的層次關係依序為下列何者？", "ex": "口腔皮膜細胞是細胞（甲）→胃黏膜是組織（乙）→小腸是器官（丙）→整條消化道屬於器官系統（丁），由簡而繁是甲乙丙丁。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["乙丙甲丁", "甲丙乙丁", "乙甲丙丁", "甲乙丙丁"], "ans": 3, "ch": "1"}, {"id": "s113_1_q45", "src": "school", "sec": "1-5", "concept": "植物組成層次", "q": "宥盛在阿里山看到高大的神木，想到生物老師介紹過的生物組成層次，於是他拿出隨身筆記本記錄下了一段話：「阿里山神木的組成層次由低到高為：細胞→組織→器官→個體。」請問宥盛所記錄的這段筆記是否正確？", "ex": "植物沒有器官系統，組成層次是細胞→組織→器官→個體，所以宥盛的筆記是正確的。動物才有器官系統。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["正確，多細胞生物的生物層次皆是如此", "正確，植物組成層次只有四個，無器官系統", "錯誤，神木為具有器官系統的植物", "錯誤，神木為植物，植物不具有組織"], "ans": 1, "ch": "1"}, {"id": "s113_1_q46", "src": "school", "sec": "1-5", "concept": "營養器官與生殖器官", "q": "生物老師請學生各自帶一種植物的「營養器官」來學校觀察，下列哪位同學所帶的構造不符合老師的要求？", "ex": "根、莖、葉是營養器官；花、果實、種子是生殖器官。玉米粒是種子，屬於生殖器官，不符合要求。甘蔗、馬鈴薯是莖，高麗菜是葉。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小美：一段甘蔗", "小福：一顆馬鈴薯", "小新：一包高麗菜葉", "小華：一罐玉米粒"], "ans": 3, "ch": "1"}, {"id": "s114_1_q1", "src": "school", "sec": "1-1", "concept": "科學方法步驟", "q": "研究有關生命的問題，必須用科學方法，而前四項步驟包括：(甲)提出假說；(乙)觀察；(丙)參考文獻資料；(丁)設計實驗。正確順序為：", "ex": "科學方法的前四步：先觀察（乙）→參考文獻資料（丙）→提出假說（甲）→設計實驗（丁）。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["乙→丙→甲→丁", "甲→乙→丙→丁", "丙→乙→甲→丁", "丁→丙→乙→甲"], "ans": 0, "ch": "1"}, {"id": "s114_1_q2", "src": "school", "sec": "1-1", "concept": "假說不被支持", "q": "使用科學方法來研究想知道的科學現象，若是實驗結果不支持原本的假說，請問該如何是好？", "ex": "實驗結果不支持假說時，應該檢查實驗設計或修正假說後再實驗，絕對不能修改數據或直接改結論。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["放棄使用科學方法", "直接修改結論", "修改實驗結果的數據", "調整實驗設計或修正假說"], "ans": 3, "ch": "1"}, {"id": "s114_1_q3", "src": "school", "sec": "1-1", "concept": "設計對照實驗", "q": "網路上盛傳在植物生長的過程中播放音樂，植物會長得較快。若想做實驗證實，應該如何設計實驗呢？", "ex": "要證實「播放音樂會讓植物長得較快」，兩株相同的植物要放在相同環境，只差「有沒有播放音樂」。(B)室內室外環境不同；(D)兩組都有音樂，無法比較。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["隨意找兩株含苞的植物，在旁播放音樂，看哪一株比較快開花", "種植兩株相同的植物，一株擺在有播放音樂的室內，一株放在沒有音樂的室外", "在相同的環境條件下，種植兩株相同的植物，對一株播放音樂，一株不播放音樂", "在相同的環境條件下，種植兩株相同的植物，對一株播放古典樂，對另一株播放搖滾樂。"], "ans": 2, "ch": "1"}, {"id": "s114_1_q4", "src": "school", "sec": "1-1", "concept": "選擇對照組", "q": "小芸想要知道綠豆發芽是否受到光線的影響，最好從附表的實驗中挑出哪兩組當作實驗組與對照組？", "ex": "研究「光線」的影響，兩組只能差在照不照光，其他條件（泡水）要相同。第 1 組（泡水、照光）和第 3 組（泡水、不照光）正好只差光線。", "fig": "fig/s114_1_q4.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["2、4", "1、3", "1、2", "2、3。"], "ans": 1, "ch": "1"}, {"id": "s114_1_q5", "src": "school", "sec": "1-1", "concept": "科學方法步驟", "q": "拉拉在使用雙氧水消毒傷口的時候，看到雙氧水一滴到傷口上，竟然冒出大量的氣泡。拉拉覺得很奇怪，就上網查資料，發現原來細胞中有一種酵素叫做「過氧化氫酶」，這種酵素可以分解雙氧水，並產生氧氣，所以才會看到傷口有氣泡。以上敘述中，拉拉至少進行了科學方法中的哪兩個步驟？", "ex": "拉拉看到雙氧水冒泡是「觀察」，上網查資料是「參考文獻資料」，所以至少進行了這兩個步驟。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["觀察＋參考文獻資料", "提出問題＋提出推論", "提出問題＋提出假說", "觀察＋實驗"], "ans": 0, "ch": "1"}, {"id": "s114_1_q6", "src": "school", "sec": "1-1", "concept": "實驗", "q": "博士正在研發一種減肥藥物，他將此藥物注射到老鼠體內並觀察日後該老鼠的體重變化。請問此過程為科學方法中的哪一步驟？", "ex": "把藥物注射到老鼠體內並觀察體重變化，是在實際操作來驗證想法，屬於「實驗」。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["參考資料", "假說", "實驗", "提出問題"], "ans": 2, "ch": "1"}, {"id": "s114_1_q7", "src": "school", "sec": "1-1", "concept": "控制變因", "q": "關於以科學方法進行實驗的敘述，何者正確？", "ex": "控制變因是實驗組和對照組保持相同的因素。實驗可以有多個實驗組；操作變因不同不代表應變變因一定不同；應變變因在設計實驗時就要決定。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["一次只能有一個實驗組和一個對照組", "控制變因是實驗組和對照組相同的因素", "實驗組和對照組的操作變因必定不同，應變變因也必定不同", "要先分析提出結論，之後才能得知實驗中的應變變因為何"], "ans": 1, "ch": "1"}, {"id": "s114_1_q8", "src": "school", "sec": "1-2", "concept": "生物圈概念", "q": "下列對於生物圈之敘述，何者正確？", "ex": "深海照不到陽光，沒有藻類，但仍有其他生物，仍屬於生物圈。兩萬公尺高空超出生物圈範圍；生物生存要素是陽光、空氣、水、養分等；生物圈範圍可能改變。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["日光不易穿透深層海洋，使得藻類在海洋深處絕跡，但深海仍屬於生物圈範圍", "波音747 飛機，可以在兩萬公尺的高空飛行，所以此處也算生物圈的範圍", "日光、土壤、空氣為生物生存的三要素", "生物圈的範圍不可能改變"], "ans": 0, "ch": "1"}, {"id": "s114_1_q9", "src": "school", "sec": "1-2", "concept": "生物圈分布", "q": "上圖為地球的高山與海洋示意圖，有關甲、乙、丙、丁區域的敘述，何者錯誤？", "ex": "甲處高空可能有細菌、乙處在海平面附近生物最多、丁處深海有會發光的燈籠魚等生物。水筆仔和招潮蟹生活在河口潮間帶，AI 判斷出題者認為牠們不在丙處（海平面以下的海洋），所以選(C)。", "fig": "fig/s114_1_q9.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "水筆仔、招潮蟹生活在河口潮間帶，大約在海平面附近，和丙處的位置有點重疊，這個選項有爭議；本題是由 AI 判讀圖中各區範圍後作答。", "pas": "", "opts": ["甲處可發現細菌等生物", "乙處的生物種類、數量較多", "丙處可發現水筆仔、招潮蟹等生物", "丁處可發現能夠發光的生物"], "ans": 2, "ch": "1"}, {"id": "s114_1_q10", "src": "school", "sec": "1-2", "concept": "虎克發現細胞", "q": "虎克是發現生物體基本單位的科學家，下列何項確實是他的觀察記錄內容？", "ex": "虎克觀察的是軟木栓薄片（不是蜂窩），並把看到的小格子命名為「細胞」。「動植物都由細胞構成」「細胞是基本單位」是後來細胞學說的內容。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["他以自製顯微鏡觀察蜂窩，發現格狀構造", "將所見的格狀構造命名為「細胞」", "動物、植物皆由細胞構成", "細胞是生物體構造和機能的最基本單位"], "ans": 1, "ch": "1"}, {"id": "s114_1_q11", "src": "school", "sec": "1-2", "concept": "感應與運動", "q": "小丸子在煮麵時，右手不小心碰到鍋子，發現右手會立刻自行縮回，這是屬於何種生命現象？", "ex": "手碰到燙的鍋子立刻縮回，是接受刺激後產生反應，屬於「感應與運動」。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["生殖", "生長與發育", "代謝", "感應與運動"], "ans": 3, "ch": "1"}, {"id": "s114_1_q12", "src": "school", "sec": "1-2", "concept": "顯微鏡倍率", "q": "顯微鏡的目鏡及物鏡長短與倍率有關，當目鏡愈長時，倍率愈低；物鏡愈長時，倍率愈高。附圖中甲、乙、丙為目鏡，P、Q、R 為物鏡。晶晶利用這臺顯微鏡觀察植物的表皮，請問：如果想要在視野中看見最大的細胞，應採用何種組合？", "ex": "想看到最大的細胞要用最高倍率：目鏡越短倍率越高（丙），物鏡越長倍率越高（R），所以選丙、R。", "fig": "fig/s114_1_q12.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲、R", "乙、Q", "丙、R", "甲、P"], "ans": 2, "ch": "1"}, {"id": "s114_1_q13", "src": "school", "sec": "1-2", "concept": "解剖顯微鏡眼焦", "q": "使用右圖顯微鏡觀察生物構造，想要使雙眼的焦距一致，則應該調整何種構造以解決此問題？", "ex": "要讓兩眼的焦距一致，要調整目鏡上的眼焦調整器（甲）。乙是眼距調整器，用來配合兩眼距離；丙、丁是調節輪等構造。", "fig": "fig/s114_1_q13.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ch": "1"}, {"id": "s114_1_q14", "src": "school", "sec": "1-2", "concept": "倍率與亮度", "q": "小華觀察同一標本四次，每次除調整放大倍率外，其他條件皆未變動，結果如附圖。試問：視野亮度最弱的是何者？", "ex": "倍率越高，看到的細胞越大、數量越少，視野也越暗。乙的細胞最大、只有一個，倍率最高，所以亮度最弱。", "fig": "fig/s114_1_q14.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1, "ch": "1"}, {"id": "s114_1_q15", "src": "school", "sec": "1-2", "concept": "換高倍物鏡步驟", "q": "用10 × 物鏡，如附圖(一)，觀察水中的小生物時，在視野內看到一個矽藻，如附圖(二)，如果要換較高倍的物鏡繼續觀察此矽藻，下列操作步驟：請問下列哪一項操作順序是正確的？(1)轉動旋轉盤換物鏡甲；(2)轉動旋轉盤換物鏡乙；(3)只要稍稍轉動粗調節輪；(4)只要稍稍轉動細調節輪；(5)將載玻片向左下方移(6)將載玻片向右上方移。", "ex": "矽藻在視野左下方，複式顯微鏡要往同方向移，所以先把玻片往左下方移（5）；再換較長、倍率較高的物鏡甲（1）；換高倍後只能轉細調節輪（4）。", "fig": "fig/s114_1_q15.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["5→2→3", "6→1→3", "6→1→4", "5→1→4"], "ans": 3, "ch": "1"}, {"id": "s114_1_q16", "src": "school", "sec": "1-2", "concept": "複式顯微鏡成像", "q": "琪琪利用複式顯微鏡觀察標示「68」的載玻片，若她在視野中只看到8，則應將玻片往哪個方向移動才能看到所有的數字？", "ex": "複式顯微鏡的影像轉了 180 度，「68」看起來會變成「89」。只看到左邊的 8，要看到右邊的 9，影像要往左移，所以玻片往右移動。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["向右移動，可看到68", "向右移動，可看到89", "向左移動，可看到68", "向左移動，可看到89"], "ans": 1, "ch": "1"}, {"id": "s114_1_q17", "src": "school", "sec": "1-3", "concept": "葉表皮細胞", "q": "附圖是植物葉的表皮構造，下列何者錯誤？", "ex": "甲是表皮細胞，沒有葉綠體，不能自行製造養分，所以(D)錯。乙是保衛細胞，含葉綠體；丙是氣孔，多分布在下表皮。", "fig": "fig/s114_1_q17.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲、乙細胞均含有細胞核及細胞壁", "丙多分布於葉的下表皮，可控制水分散失", "乙細胞含葉綠體，可行光合作用", "甲細胞具保護作用，並能自行製造養分"], "ans": 3, "ch": "1"}, {"id": "s114_1_q18", "src": "school", "sec": "1-3", "concept": "實驗 1-2 細胞的觀察", "q": "小靜用顯微鏡觀察以亞甲藍液染色後的口腔皮膜細胞，下列關於此實驗的敘述何者正確？", "ex": "觀察口腔皮膜細胞要用複式顯微鏡。亞甲藍液主要把細胞核染色；口腔皮膜細胞是動物細胞，沒有細胞壁，構造和植物表皮細胞不同，也沒有保衛細胞。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["需使用複式顯微鏡進行觀察", "被染色的部位主要為細胞膜", "其構造與植物表皮細胞相同", "可觀察到呈半月形的保衛細胞"], "ans": 0, "ch": "1"}, {"id": "s114_1_q19", "src": "school", "sec": "1-3", "concept": "葉綠體", "q": "光彥使用顯微鏡觀察水蘊草細胞如附圖，發現細胞質中有許多綠色的小顆粒(乙構造)。請問關於乙構造的敘述，下列何者錯誤？", "ex": "乙是葉綠體，含葉綠素，可以製造葡萄糖；動物細胞沒有葉綠體。把養分轉換成能量的是粒線體，所以(D)錯。", "fig": "fig/s114_1_q19.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["此構造可以製造葡萄糖", "此構造內含有葉綠素", "動物細胞無法觀察到此構造", "此構造可以將養分轉換成能量供細胞使用"], "ans": 3, "ch": "1"}, {"id": "s114_1_q20", "src": "school", "sec": "1-3", "concept": "植物細胞構造", "q": "附圖為白色的百合花，請問觀察其花瓣細胞所含構造，應該與下列何者最相似？", "ex": "白色的百合花瓣細胞沒有葉綠體，但有細胞壁和液胞，和同樣沒有葉綠體的洋蔥鱗葉表皮細胞最相似。水蘊草葉片細胞有葉綠體；雞蛋和肌肉細胞是動物細胞。", "fig": "fig/s114_1_q20.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["洋蔥鱗葉表皮細胞", "雞蛋", "水蘊草葉片細胞", "牛排肌肉細胞"], "ans": 0, "ch": "1"}, {"id": "s114_1_q21", "src": "school", "sec": "1-3", "concept": "植物細胞構造", "q": "附圖是某植物根部細胞模式圖，下列敘述何者錯誤？", "ex": "乙是液胞，亞甲藍液主要是把細胞核染色，不是液胞，所以(B)錯。甲是粒線體，負責產生能量；丁是細胞膜，控制物質進出；戊在細胞核內，含遺傳物質。", "fig": "fig/s114_1_q21.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["戊內含有遺傳物質", "使用亞甲藍液的主要目的是將乙染色", "丁可控制物質進出細胞", "甲的主要功能是產生能量"], "ans": 1, "ch": "1"}, {"id": "s114_1_q22", "src": "school", "sec": "1-3", "concept": "水蘊草細胞構造", "q": "附表是小蘭整理所觀察細胞的構造特徵，則何種細胞最可能是水蘊草葉片細胞", "ex": "水蘊草葉片細胞是植物細胞，有細胞核、粒線體、葉綠體和細胞壁，四項都有的是乙。", "fig": "fig/s114_1_q22.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲細胞", "乙細胞", "丙細胞", "丁細胞"], "ans": 1, "ch": "1"}, {"id": "s114_1_q23", "src": "school", "sec": "1-3", "concept": "肌肉細胞", "q": "下列何種細胞具有收縮舒張引起運動的功能？", "ex": "肌肉細胞呈長條狀，能收縮舒張產生運動，就是(D)。(A)是紅血球、(B)是植物細胞、(C)是神經細胞。", "fig": "fig/s114_1_q23.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 3, "ch": "1"}, {"id": "s114_1_q24", "src": "school", "sec": "1-3", "concept": "動植物細胞觀察", "q": "附圖分別取自人的口腔皮膜和葉的表皮，下列相關敘述哪一項錯誤？", "ex": "甲是口腔皮膜細胞的細胞膜，丁是葉表皮細胞最外層的細胞壁，兩者不同，所以(A)錯。葉上表皮細胞無色透明；亞甲藍液主要染細胞核（丙）；保衛細胞有葉綠體。", "fig": "fig/s114_1_q24.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲和丁的構造相同", "葉的上表皮細胞是薄而無色的", "亞甲藍液主要在於染「丙」的構造", "氣孔兩側的細胞可行光合作用"], "ans": 0, "ch": "1"}, {"id": "s114_1_q25", "src": "school", "sec": "1-3", "concept": "粒線體", "q": "甲和乙為某生物體內的兩種正常細胞，其所含的粒線體數目如附表。由表推論，下列哪一種生理作用應是甲細胞比乙細胞旺盛？", "ex": "粒線體負責分解養分產生能量。甲細胞的粒線體比乙多很多，表示甲細胞需要較多能量、產生能量的作用比較旺盛。", "fig": "fig/s114_1_q25.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["吸收光能", "吸收水分", "產生能量", "產生氧氣"], "ans": 2, "ch": "1"}, {"id": "s114_1_q26", "src": "school", "sec": "1-4", "concept": "粒子表示法", "q": "下列物質粒子的表示方式，何者錯誤？", "ex": "水分子由 2 個氫原子和 1 個氧原子組成，應該寫成 H₂O，寫成 HO₂ 是錯的。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["水分子—HO₂", "碳原子—C", "氧分子—O₂", "二氧化碳分子—CO₂"], "ans": 0, "ch": "1"}, {"id": "s114_1_q27", "src": "school", "sec": "1-5", "concept": "尺度的認識", "q": "(甲)水分子；(乙)細胞；(丙)蛋白質；(丁)氫原子；(戊)粒線體。若將上述五者由大到小排列，下列何者正確？", "ex": "由大到小：細胞（乙）＞粒線體（戊，細胞內的構造）＞蛋白質（丙，大分子）＞水分子（甲）＞氫原子（丁）。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["乙戊丙甲丁", "丁甲丙戊乙", "丁甲戊丙乙", "乙丙戊甲丁"], "ans": 0, "ch": "1"}, {"id": "s114_1_q28", "src": "school", "sec": "1-4", "concept": "葡萄糖分子", "q": "一個葡萄糖分子可用C₆H₁₂O₆表示，則下列有關葡萄糖分子特性的敘述，下列何者正確？", "ex": "葡萄糖是一種醣類（碳水化合物），可以提供細胞能量。C₆H₁₂O₆ 表示 6 個碳、12 個氫、6 個氧；很多葡萄糖組成的是澱粉不是蛋白質；葡萄糖可以直接被細胞利用。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["有6 個氫原子、12 個碳原子及6 個氧原子", "很多個葡萄糖分子可以組成蛋白質", "需再分解成更小的醣類才能被細胞直接利用", "是種碳水化合物，能提供細胞能量"], "ans": 3, "ch": "1"}, {"id": "s114_1_q29", "src": "school", "sec": "1-4", "concept": "擴散作用", "q": "對於擴散作用的敘述，下列何者錯誤？", "ex": "擴散作用在氣體和液體中都會發生，例如墨水在水中散開，所以(C)錯。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["可以自然發生，自然界常見許多例子", "擴散作用最後會使物質均勻分布在整個空間", "僅發生在氣體，液體不會有擴散現象", "如有外力介入，可加速作用進行"], "ans": 2, "ch": "1"}, {"id": "s114_1_q30", "src": "school", "sec": "1-4", "concept": "物質進出細胞", "q": "附圖為物質進出細胞的示意圖，下列各物質進出細胞的方式，何者正確？", "ex": "蛋白質是大分子，無法經由甲（蛋白質通道）或乙（直接穿過細胞膜）進出細胞。胺基酸要經由甲；氧氣直接穿過（乙）；水兩種方式都可以。", "fig": "fig/s114_1_q30.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["蛋白質無法利用甲或乙方式進出細胞", "胺基酸利用乙方式進出細胞", "氧氣利用甲方式進出細胞", "水只能用乙方式進出細胞"], "ans": 0, "ch": "1"}, {"id": "s114_1_q31", "src": "school", "sec": "1-4", "concept": "滲透作用", "q": "有關不同細胞放入不同液體中的結果，下列何者錯誤？", "ex": "口腔皮膜細胞是動物細胞，沒有細胞壁，所以不會有「細胞膜和細胞壁分離」的現象，(D)錯。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["洋蔥表皮細胞放入生理食鹽水後，流入和流出細胞的水量相近", "紅血球細胞放入濃食鹽水後，細胞會萎縮", "葉肉細胞放入清水後，細胞膨脹但不破裂", "口腔皮膜細胞放入濃糖水後，細胞膜和細胞壁會分離"], "ans": 3, "ch": "1"}, {"id": "s114_1_q32", "src": "school", "sec": "1-4", "concept": "滲透作用", "q": "琪琪家中有一個水族箱，裡面養了海葵、小丑魚等海洋生物。某日弟弟將湖中撈到的大肚魚丟入水族箱中，不久大肚魚就死亡了，請問大肚魚死亡的最可能原因為何？", "ex": "大肚魚是淡水魚，放進海水中，外面鹽分濃度高，細胞內的水分會滲透出去，細胞脫水而死。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["細胞脹破而死亡", "細胞脫水而死亡", "細胞外的鹽分大量進入細胞內而死亡", "大肚魚只能生活在野外環境，無法人為飼養"], "ans": 1, "ch": "1"}, {"id": "s114_1_q33", "src": "school", "sec": "1-4", "concept": "滲透作用", "q": "小航準備了三個燒杯，各裝了100ml 的純水，接著在甲燒杯中加入了0.6g 的食鹽，在乙燒杯加入了1.2g 的食鹽，並在丙燒杯中加了x 克的食鹽。接著將自己的血液分別滴在甲、乙、丙三杯食鹽水中，並在顯微鏡下觀察燒杯中紅血球，結果如附表所示，請問x 最有可能為下列何者？", "ex": "紅血球維持雙凹圓盤狀，表示外面濃度和細胞內差不多（約 0.9% 生理食鹽水）。0.6 克時細胞吸水破裂、1.2 克時萎縮，所以 x 介於兩者之間，最可能是 0.9。", "fig": "fig/s114_1_q33.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["0.3", "0.9", "1.5", "丙燒杯沒加食鹽"], "ans": 1, "ch": "1"}, {"id": "s114_1_q34", "src": "school", "sec": "1-4", "concept": "擴散與滲透比較", "q": "有關擴散作用和滲透作用的比較，何者正確？", "ex": "擴散和滲透都是物質（滲透是水）由濃度高往濃度低移動，所以丙正確。兩者都不是生命現象、也都不需要能量；紅血球放入清水會吸水脹大，不會萎縮。", "fig": "fig/s114_1_q34.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ch": "1"}, {"id": "s114_1_q35", "src": "school", "sec": "1-5", "concept": "多細胞生物分工", "q": "(甲)榕樹；(乙)細菌；(丙)跳蚤；(丁)眼蟲；(戊)青蛙；(己)新月藻；(庚)草履蟲；(辛)生物老師。以上有幾種生物細胞有分工合作的現象？", "ex": "有細胞分工合作的是多細胞生物：榕樹、跳蚤、青蛙、生物老師，共 4 種。細菌、眼蟲、新月藻、草履蟲是單細胞生物。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["3", "4", "5", "6"], "ans": 1, "ch": "1"}, {"id": "s114_1_q36", "src": "school", "sec": "1-5", "concept": "單細胞與多細胞比較", "q": "下表兩類生物的比較，何者正確？", "ex": "單細胞生物只有 1 個細胞，必須獨立完成所有生命活動，所以獨立性較高、單一細胞功能較多，也沒有分工合作；多細胞生物則相反。四項都正確。", "fig": "fig/s114_1_q36.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲乙丙丁", "甲乙丙", "甲丙", "甲丁"], "ans": 0, "ch": "1"}, {"id": "s114_1_q37", "src": "school", "sec": "1-5", "concept": "組成層次排序", "q": "丁丁去市場買了(甲)一條虱目魚；(乙)一盒雞蛋；(丙)一串香蕉；(丁)一塊豬里肌肉。已知市售雞蛋未經過受精，若依生物的組成層次，將此四者由簡單至複雜依序排列，應為下列何者？", "ex": "未受精雞蛋是細胞（乙）→豬里肌肉是肌肉組織（丁）→一串香蕉是果實，屬於器官（丙）→虱目魚是個體（甲），所以是乙丁丙甲。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["乙丁丙甲", "甲丁丙乙", "乙丙甲丁", "甲丙丁乙"], "ans": 0, "ch": "1"}, {"id": "s114_1_q38", "src": "school", "sec": "1-5", "concept": "組織層次", "q": "下列關於「組織」層次的敘述，何者正確？", "ex": "血液由紅血球、白血球、血小板和血漿組成，屬於組織層次。雞蛋是一個細胞；葉片是器官；消化道是器官系統。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["雞蛋有蛋黃和蛋白兩種細胞，屬於組織層次", "血液由三種血球細胞組成，屬於組織層次", "葉片包含表皮和葉肉等細胞，屬於組織層次", "消化道（從口腔到肛門）包含胃、小腸和大腸等，是較複雜的組織層次"], "ans": 1, "ch": "1"}, {"id": "s114_1_q41", "src": "school", "sec": "1-5", "concept": "營養器官與生殖器官", "q": "右圖為正在開花的香蕉的植株，甲為葉子、乙為果實、丙為尚未開完的花，丁為地下莖。現今栽種的香蕉，大多利用地下莖長出的新芽來繁殖，很少利用種子繁殖。請問，圖中各部位，分別屬於植物中的何類器官？", "ex": "葉（甲）和地下莖（丁）是營養器官；果實（乙）和花（丙）是生殖器官。香蕉雖然用地下莖繁殖，但莖仍屬於營養器官（這叫營養繁殖）。", "fig": "fig/s114_1_q41.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["營養器官：甲；生殖器官：乙丙丁", "營養器官：甲乙丙；生殖器官：丁", "營養器官：甲丁；生殖器官：乙丙", "營養器官：甲丙丁；生殖器官：乙"], "ans": 2, "ch": "1"}, {"id": "s112_1_q21", "src": "school", "sec": "2-1", "concept": "本氏液檢測", "q": "紹瑜買了「冬瓜茶」、「半糖烏龍茶」和「無糖綠茶」，分別將其放入試管中，再利用試劑檢測此三種飲料的含糖量，實驗後試管內液體的顏色如附表所示，下列敘述何者錯誤？", "ex": "本氏液要「隔水加熱」才會變色，所以(D)說不須加熱是錯的。顏色由淡藍→綠→黃→橙紅，糖越多越接近紅色，所以含糖量丙＞甲＞乙，淡藍色的乙就是無糖綠茶。", "fig": "fig/s112_1_q21.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["含糖量高低：丙＞甲＞乙", "飲料乙是無糖綠茶", "檢測所使用的試劑為本氏液", "檢測的過程不須加熱"], "ans": 3, "ch": "2"}, {"id": "s112_1_q22", "src": "school", "sec": "2-1", "concept": "碘液檢測澱粉", "q": "小文想知道白米飯中是否含有澱粉，該如何檢測，檢測後的變化應為？", "ex": "檢測澱粉要用碘液，澱粉遇碘液會變成藍黑色。本氏液是用來檢測葡萄糖等糖類的，不能拿來測澱粉；黃褐色是碘液原本的顏色，代表沒有澱粉。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["米飯滴加本氏液後靜置，會出現藍黑色變化", "米飯滴加碘液後靜置，會出現藍黑色變化", "米飯滴加本氏液後靜置，會出現黃褐色變化", "米飯滴加碘液後靜置，會出現黃褐色變化"], "ans": 1, "ch": "2"}, {"id": "s112_1_q43", "src": "school", "sec": "2-1", "concept": "食物熱量計算", "q": "超市的甜筒冰淇淋，一支200 公克，包裝上的營養標示如附表所示。吃完該冰淇淋可得到多少大卡的熱量？", "ex": "每公克醣類和蛋白質約提供4大卡、脂質約9大卡，鈉不提供熱量。每100公克熱量＝5×4＋25×9＋30×4＝365大卡，一支200公克要乘以2，所以是730大卡。常見錯誤是忘了乘2而選365。", "fig": "fig/s112_1_q43.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["150 大卡", "365 大卡", "580 大卡", "730 大卡"], "ans": 3, "ch": "2"}, {"id": "s112_1_q44", "src": "school", "sec": "2-1", "concept": "能量來源養分", "q": "下列何者是生物體內能量的主要來源？", "ex": "醣類、蛋白質、脂質是可以提供能量的三大養分。維生素、礦物質和水雖然很重要，但都不能提供能量。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["脂質、醣類、礦物質", "蛋白質、脂質、維生素", "醣類、蛋白質、脂質", "維生素、礦物質、水"], "ans": 2, "ch": "2"}, {"id": "s112_1_q45", "src": "school", "sec": "2-1", "concept": "六大類營養素功能", "q": "以下關於6 大類營養素的敘述，何者錯誤？", "ex": "分布在皮下、可以保溫防止熱量散失的是脂質，不是蛋白質，所以(A)錯。蛋白質是構成肌肉、頭髮的主要成分；鈣和骨骼有關、鐵和造血有關、維生素A和眼睛有關。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蛋白質分佈在皮下，具有防止熱量散失的功能", "鈣可減緩骨質疏鬆症的發生，鐵質可以幫助造血", "肌肉與頭髮的主要成分是蛋白質", "維生素A 和眼睛保健有關"], "ans": 0, "ch": "2"}, {"id": "s112_1_q46", "src": "school", "sec": "2-1", "concept": "纖維素", "q": "植物細胞壁的主要成分為纖維素。蔬果的纖維素含量高，有益人體健康。下列有關纖維素的敘述，何者錯誤？", "ex": "纖維素是大分子醣類，但人體沒有分解纖維素的酵素，所以無法消化吸收，也就不能提供能量。它的好處是增加排便量、促進腸胃蠕動。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["屬於大分子醣類", "可增加排便量", "可促進腸胃蠕動", "可提供人體所需的能量"], "ans": 3, "ch": "2"}, {"id": "s112_1_q47", "src": "school", "sec": "2-1", "concept": "維生素C", "q": "檸檬營養價值高，有助於抗氧化、降低心血管疾病的發生率、促進傷口的癒合和預防壞血症的發生。請問檸檬有這麼多功效主要是因為富含何種養分？", "ex": "維生素C有抗氧化、幫助傷口癒合的作用，缺乏時會得壞血症，柑橘類水果如檸檬含量豐富。維生素A和眼睛有關，鈣和骨骼有關，鐵和造血有關。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["維生素A", "鈣質", "維生素C", "鐵質"], "ans": 2, "ch": "2"}, {"id": "s112_2_q1", "src": "school", "sec": "2-2", "concept": "酵素特性", "q": "有關酵素的敘述，何者不正確？", "ex": "一種酵素可以反覆使用、在體外條件適合時也能作用。課本以唾液澱粉酶為例，它負責把澱粉分解，題目認定它不能合成澱粉，所以(C)不正確。記住：酵素有專一性，一種酵素只催化特定反應。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["酵素由活細胞產生", "生物體內的酵素可以反覆利用", "唾液中的澱粉酶能分解澱粉，也能合成澱粉", "唾液中的澱粉酶能在口腔中作用，也能在體外進行作用"], "ans": 2, "ch": "2"}, {"id": "s112_2_q2", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "派大星將吃剩的食物冰入冰箱中，請問此舉動主要的目的是？", "ex": "低溫會讓酵素活性變低，細菌生長和分解食物變慢，所以食物比較不容易壞。但低溫不會殺死細菌，也不會讓酵素永久失去活性，拿出來回溫後細菌又會繼續作用。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["冰箱可以殺死食物中的細菌", "放置於冰箱的食物可以永久保存", "冰箱可以讓細菌的酵素永久失去活性", "冰箱可以降低細菌的酵素活性"], "ans": 3, "ch": "2"}, {"id": "s112_2_q3", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "已知利用相同茶樹的葉片但不同的製作過程，可得綠茶及紅茶。茶葉中所含的酵素X 在超過70 ℃後，就無法再有催化能力。上圖為製作綠茶及紅茶時的四個步驟（依序由步驟I→II→III→IV）及其溫度調控示意圖，比較四個步驟中綠茶及紅茶的酵素X 之活性，下列何者最不合理？", "ex": "酵素X超過70℃就永久失去活性。綠茶在步驟I就被加熱超過70℃，之後酵素都沒有作用；紅茶到步驟III才超過70℃。所以步驟II結束時，綠茶的酵素已失效、紅茶的酵素還有活性，兩者不相等，(B)最不合理。", "fig": "fig/s112_2_q3.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["步驟I 結束時：綠茶＜紅茶", "步驟II 結束時：綠茶＝紅茶", "步驟III 結束時：綠茶＝紅茶", "步驟IV 結束時：綠茶＝紅茶"], "ans": 1, "ch": "2"}, {"id": "s112_2_q4", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "上圖為酵素Y 之活性與溫度的關係圖，酵素Y置於超過50 ℃的環境中，就無法再回復催化的能力。柯南在甲、乙、丙三支試管內都先裝入等量的澱粉液及酵素Y，再分別置於三種不同溫度的環境中，在進行實驗的第0、35、70分鐘時，分別從三支試管內各取出液體後，再用碘液檢測，其呈色結果如附表所示。已知柯南所使用的實驗溫度是10 ℃、30 ℃、55 ℃，則此三支試管最可能各置於何種溫度中？", "ex": "碘液變黃褐色代表澱粉被分解完了。酵素Y在30℃附近活性最高，所以最快變黃褐的甲是30℃；10℃活性較低、比較慢，是乙；55℃酵素已失去活性，澱粉一直沒被分解，是丙。", "fig": "fig/s112_2_q4.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲為10 ℃、乙為30 ℃、丙為55 ℃", "甲為30 ℃、乙為10 ℃、丙為55 ℃", "甲為55 ℃、乙為30 ℃、丙為10 ℃", "甲為55 ℃、乙為10 ℃、丙為30 ℃"], "ans": 1, "ch": "2"}, {"id": "s112_2_q5", "src": "school", "sec": "2-2", "concept": "唾液分解澱粉實驗", "q": "小明作「唾液對澱粉的影響實驗」，取四支試管甲乙丙丁，依上表處理方式，並放在37 度水浴20 分鐘後，各試管分別以2 mL 本氏液加熱檢驗，則溶液顏色變化最明顯的是哪一支試管？", "ex": "只有丁的新鮮唾液能在適合的溫度與酸鹼度下把澱粉分解成麥芽糖等糖類，加本氏液加熱後顏色變化最明顯。甲沒有唾液；乙的唾液煮沸過，酵素失去活性；丙加了鹽酸，酸鹼值不適合唾液澱粉酶作用。", "fig": "fig/s112_2_q5.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 3, "ch": "2"}, {"id": "s112_2_q6", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "取甲、乙、丙三支試管，先加入等量的物質X，再依序分別加入足量人體的唾液、胃液、胰液，並調整各試管的pH 值及溫度等條件，使其適合各消化液中的酵素作用。靜置足夠的反應時間後，結果三支試管內物質X 的含量皆沒有變化，推論物質X 最可能為何？", "ex": "唾液能分解澱粉，胃液能分解蛋白質，胰液能分解醣類、蛋白質和脂質。三種消化液都分解不了的是纖維素，因為人體沒有分解纖維素的酵素。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["纖維素", "脂質", "澱粉", "蛋白質"], "ans": 0, "ch": "2"}, {"id": "s112_2_q7", "src": "school", "sec": "2-2", "concept": "酵素本質是蛋白質", "q": "唾液中的甲物質可催化澱粉的分解，胃液中的乙物質則可催化蛋白質的分解，推測甲、乙兩物質本身的主要成分，下列何者最合理？", "ex": "唾液澱粉酶（甲）和胃蛋白酶（乙）都是酵素，而酵素的主要成分是蛋白質。不要把「酵素分解的對象」和「酵素本身的成分」搞混。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、乙成分皆為澱粉", "甲、乙成分皆為蛋白質", "甲成分為澱粉，乙成分為蛋白質", "甲成分為葡萄糖，乙成分為胺基酸"], "ans": 1, "ch": "2"}, {"id": "s112_2_q8", "src": "school", "sec": "2-3", "concept": "光合作用原料與產物", "q": "有關光合作用的敘述何者錯誤？", "ex": "光合作用的原料是水和二氧化碳，產物是葡萄糖和氧氣（也會產生水）。葉綠體是進行光合作用的場所，陽光是提供能量的來源，兩者都不是原料，所以(D)錯。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水是原料也是產物", "氧氣、葡萄糖為產物", "二氧化碳、水為原料", "葉綠體、陽光也是原料"], "ans": 3, "ch": "2"}, {"id": "s112_2_q9", "src": "school", "sec": "2-3", "concept": "光合作用產生氧氣", "q": "小美發現將水缸的燈光打開一段時間後，水草會開始冒出氣泡，請問這些氣泡為何？", "ex": "水草照光後進行光合作用，會產生氧氣並釋放出來，就是看到的氣泡。常見錯誤是以為植物吐出二氧化碳。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["二氧化碳", "氮氣", "氧氣", "氫氣"], "ans": 2, "ch": "2"}, {"id": "s112_2_q10", "src": "school", "sec": "2-3", "concept": "光合作用與呼吸作用", "q": "承上題，燈光打開時水草會進行什麼作用？", "ex": "植物的細胞隨時都在進行呼吸作用，有光的時候還會同時進行光合作用。所以開燈時兩種作用同時進行，不是輪流進行。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["光合作用和呼吸作用同時進行", "光合作用和呼吸作用交替進行", "只有呼吸作用", "只有光合作用"], "ans": 0, "ch": "2"}, {"id": "s112_2_q11", "src": "school", "sec": "2-3", "concept": "光合作用條件", "q": "下列有關綠色植物進行光合作用的敘述，何者錯誤？", "ex": "光合作用是一連串化學反應，需要酵素參與；除了水和二氧化碳，還需要光能和葉綠素，所以(D)錯。電燈的光也能提供光能，夜晚開燈植物仍可行光合作用。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["有牽涉能量的轉換", "夜晚可以打開電燈取代陽光提供能量", "葉綠素能吸收光能", "只需要水分和二氣化碳、不需要酵素"], "ans": 3, "ch": "2"}, {"id": "s112_2_q12", "src": "school", "sec": "2-3", "concept": "光合作用產物去向", "q": "光合作用可以產生具有能量的物質，關於此物質的敘述，下列何者錯誤？", "ex": "光合作用製造的葡萄糖是在葉綠體中產生的，不是粒線體；粒線體是分解養分產生能量的地方。葡萄糖可以轉換成澱粉儲存，或轉換成纖維素、蛋白質、脂質等物質。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["植物可將此物轉換成澱粉來儲存", "植物可將此物轉換成纖維素", "植物可將此物轉換成蛋白質、脂質等物質", "此具有能量的物質是在粒線體產生"], "ans": 3, "ch": "2"}, {"id": "s112_2_q13", "src": "school", "sec": "2-3", "concept": "光合作用變因實驗步驟", "q": "(甲)滴加本氏液；(乙)滴加碘液；(丙)在酒精中隔水加熱；(丁)在熱水中漂洗；(戊)以鋁箔包裹葉片；(己)在沸水中加熱。右圖為「光合作用變因的探討」的實驗裝置，請問正確順序為何？", "ex": "先用鋁箔遮住部分葉片照光，摘下後放沸水中加熱，再用酒精隔水加熱去除葉綠素，接著放熱水漂洗，最後滴碘液檢測澱粉。測澱粉要用碘液，不是本氏液。", "fig": "fig/s112_2_q13.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["戊己丙丁乙", "戊己丙丁甲", "戊丁己丙甲", "戊丁己丙乙"], "ans": 0, "ch": "2"}, {"id": "s112_2_q14", "src": "school", "sec": "2-3", "concept": "光合作用需要葉綠素", "q": "摘一片生於曠野的彩葉草葉子，把葉子上綠色部分和非綠色部分分別作記號，經實驗結果發現只有綠色部分有澱粉的存在，這是證明光合作用與哪一因素有關？", "ex": "彩葉草葉片綠色部分含葉綠素、非綠色部分沒有，兩部分都照到光，只有綠色部分有澱粉，說明光合作用需要葉綠素。比較時，兩組只差在有沒有葉綠素這個變因。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水", "葉綠素", "光", "二氧化碳"], "ans": 1, "ch": "2"}, {"id": "s112_2_q15", "src": "school", "sec": "2-3", "concept": "氣孔功能", "q": "以下有關氣孔功能的敘述，何者錯誤？", "ex": "氣孔是氣體進出葉片的通道，可以進出二氧化碳、氧氣和水蒸氣。植物吸收水分主要靠根，不是靠氣孔，所以(C)錯。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["吸收二氧化碳", "吸收氧", "吸收水分", "釋放氧"], "ans": 2, "ch": "2"}, {"id": "s112_2_q16", "src": "school", "sec": "2-4", "concept": "胃液分解蛋白質", "q": "已知胰島素是糖尿病患者的治療藥物之一，其成分是蛋白質。某些糖尿病患者以注射方式補充胰島素，卻不用口服，這是因為口服會造成胰島素被下列何者所含的物質分解？", "ex": "胰島素的成分是蛋白質，口服後會在胃中被胃液的酵素分解，失去作用，所以要用注射的。唾液只分解澱粉，膽汁不含酵素。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["胃液", "唾液", "血液", "膽汁"], "ans": 0, "ch": "2"}, {"id": "s112_2_q17", "src": "school", "sec": "2-4", "concept": "膽汁", "q": "下列關於膽汁的敘述，何者正確？", "ex": "膽汁由肝臟製造、儲存在膽囊，經由導管注入小腸。膽汁不含酵素，它的功能是把大油滴乳化成小油滴，幫助脂質消化。常見錯誤是以為膽汁由膽囊分泌。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["可以乳化脂質", "只含一種酵素", "由導管注入大腸作用", "由膽囊分泌"], "ans": 0, "ch": "2"}, {"id": "s112_2_q18", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "人體的消化液有：(甲)唾液；(乙)胃液；(丙)腸液；(丁)胰液；(戊)膽汁。其中與蛋白質分解有關的消化液有哪些？", "ex": "能分解蛋白質的消化液有胃液、腸液、胰液。唾液只分解澱粉，膽汁沒有酵素，所以答案是乙丙丁。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["只有甲乙丙丁", "只有乙丙丁", "只有丙丁戊", "只有乙丁"], "ans": 1, "ch": "2"}, {"id": "s112_2_q19", "src": "school", "sec": "2-4", "concept": "養分開始消化的位置", "q": "人體能消化的醣類、脂質與蛋白質，在消化道中「開始」分解的順序為何？", "ex": "醣類（澱粉）在口腔就開始被唾液分解，蛋白質在胃開始被分解，脂質要到小腸才開始被分解。所以開始分解的順序是醣類→蛋白質→脂質。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["脂質→醣類→蛋白質", "醣類→脂質→蛋白質", "醣類→蛋白質→脂質", "蛋白質→醣類→脂質"], "ans": 2, "ch": "2"}, {"id": "s112_2_q20", "src": "school", "sec": "2-1", "concept": "纖維素", "q": "醫療保健人員鼓勵人們多食用蔬菜補充纖維素，關於纖維素的敘述，何者不正確？", "ex": "人體無法消化纖維素，所以它不能提供熱量，(D)不正確。纖維素可以刺激腸胃蠕動、增加糞便體積。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "選項(B)「纖維素可以幫助消化吸收」也有爭議：纖維素本身不能被消化吸收，課本只說可促進腸胃蠕動、幫助排便。官方答案(D)無誤，但(B)的說法容易讓學生誤解。", "pas": "", "opts": ["纖維素可以刺激腸胃蠕動", "纖維素可以幫助消化吸收", "纖維素可以增加糞便的體積", "纖維素屬於醣類，可提供人體所需的熱量"], "ans": 3, "ch": "2"}, {"id": "s112_2_q21", "src": "school", "sec": "2-4", "concept": "消化腺", "q": "下列何者是消化腺？(甲)胰臟；(乙)膽囊；(丙)闌尾；(丁)肝臟。", "ex": "消化腺是能分泌消化液的器官，例如唾腺、胃腺、肝臟、胰臟、腸腺。膽囊只是儲存膽汁的地方，膽汁是肝臟製造的；闌尾也不分泌消化液。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲丁", "乙丁", "丙丁", "甲乙"], "ans": 0, "ch": "2"}, {"id": "s112_2_q22", "src": "school", "sec": "2-4", "concept": "消化作用的意義", "q": "人體的消化作用，需經過下列哪些步驟及順序？(甲)分泌消化液；(乙)大分子進入細胞；(丙)小分子進入細胞；(丁)食物分解。", "ex": "消化作用是先分泌消化液，把食物中的大分子分解成小分子，小分子才能被吸收進入細胞。大分子無法直接通過細胞膜，所以(乙)不會發生。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲→乙→丁", "甲→丁→乙", "甲→丁→丙", "乙→甲→丁"], "ans": 2, "ch": "2"}, {"id": "s112_2_q23", "src": "school", "sec": "2-4", "concept": "消化器官與消化液", "q": "下列有關消化作用的敘述，何者正確？", "ex": "胰臟分泌的胰液經導管送到小腸，幫助醣類、蛋白質、脂質的消化。唾液只能分解澱粉；胃中分解蛋白質主要靠胃液中的酵素，鹽酸是提供酸性環境；脂質在胃中不會被消化。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["人類的唾液含有某種成分，可將蛋白質分解", "蛋白質在胃中被分解，主要是因胃液中鹽酸的作用，而非酵素作用", "胰臟分泌胰液經由導管進入小腸，協助食物的消化", "當脂質進入胃中，脂質也能被消化"], "ans": 2, "ch": "2"}, {"id": "s112_2_q24", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "關於人體的消化作用，何者正確？", "ex": "圖中丁是大腸，能吸收水分，剩下的殘渣形成糞便。胃（甲）主要不負責吸收；乙不是主要分解養分的器官；己（肛門）排出糞便叫「排遺」，不是排泄。", "fig": "fig/s112_2_q24.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "附圖是人體消化系統的示意圖，請根據附圖回答下列24.25題", "opts": ["蛋白質在「甲」中被吸收", "「丁」可吸收水分形成糞便", "很多養分可以在「乙」器官中被分解", "「己」是排泄器官"], "ans": 1, "ch": "2"}, {"id": "s112_2_q25", "src": "school", "sec": "2-4", "concept": "脂質的消化與吸收", "q": "酪梨是一種生長於熱帶的植物的果實，但在營養學來說它被歸類為油脂類，因為其豐富的脂肪含量。小美吃了一顆酪梨，請問其主要養分乳化、分解、吸收，依序是在右圖中哪些地方？", "ex": "酪梨的主要養分是脂質。脂質在小腸被膽汁乳化，再被胰液和腸液分解，最後也在小腸吸收，所以三個步驟都在丙（小腸）。常見錯誤是以為乳化在肝臟或膽囊進行。", "fig": "fig/s112_2_q24.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "附圖是人體消化系統的示意圖，請根據附圖回答下列24.25題", "opts": ["戊、乙、丙", "甲、乙、丙", "乙、丙、丁", "丙、丙、丙"], "ans": 3, "ch": "2"}, {"id": "s112_2_q44", "src": "school", "sec": "2-4", "concept": "小腸絨毛吸收", "q": "右圖為小腸絨毛模式圖，若此時小腸正在吸收養分，比較中圖中甲、乙二血管，下列敘述何者錯誤？（血管旁的箭頭表示血流方向）", "ex": "小腸絨毛增加吸收養分的表面積，像植物的根毛一樣。小腸吸收養分後，流出絨毛的乙血管養分比流入的甲血管多，二氧化碳也較多；但甲是把血液送進來的動脈端，血流比乙快，所以(C)錯。", "fig": "fig/s112_2_q44.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血液中葡萄糖等養分含量，甲血管＜乙血管", "血液中二氧化碳濃度，甲血管＜乙血管", "血液流速，甲血管＜乙血管", "此構造功能與植物根毛類似，可增加吸收表面積"], "ans": 2, "ch": "2"}, {"id": "s113_1_q47", "src": "school", "sec": "2-1", "concept": "食物熱量計算", "q": "魯夫吃了一個控肉便當，此便當含有：醣類150 公克、脂質20 公克、蛋白質50 公克，鈉、鈣、鉀各10 毫克，維生素C 200 毫克。請問：這個餐盒所含的熱量共有多少大卡？", "ex": "醣類和蛋白質每公克約4大卡，脂質每公克約9大卡；鈉、鈣、鉀和維生素C不提供熱量。150×4＋20×9＋50×4＝600＋180＋200＝980大卡。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["880", "980", "1230", "1130"], "ans": 1, "ch": "2"}, {"id": "s113_1_q48", "src": "school", "sec": "2-1", "concept": "食物中的養分", "q": "現代人注重飲食的品質，不只要吃飽，還要吃得好，下列有關食物中所含營養素的敘述，何者錯誤？", "ex": "肉類除了脂質，也含有豐富的蛋白質，說「只含有脂質」是錯的。米飯麵食主要提供澱粉，奶類豆類富含蛋白質，蔬果富含維生素與礦物質。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["三餐所吃的米飯或麵食主要是提供澱粉", "奶類、豆類食物含有豐富的蛋白質", "肉類只含有豐富的脂質", "蔬菜水果含有豐富的維生素和礦物質"], "ans": 2, "ch": "2"}, {"id": "s113_1_q49", "src": "school", "sec": "2-1", "concept": "碘液檢測澱粉", "q": "小文想知道白米飯中是否含有澱粉，該如何檢測？", "ex": "檢測澱粉直接滴碘液就可以，不需要加熱，變藍黑色就代表有澱粉。本氏液是檢測葡萄糖等糖類用的，而且要隔水加熱。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["在白米飯滴加碘液即可", "將白米飯加本氏液後，隔水加熱", "將白米飯加本氏液即可", "在白米飯滴加碘液後，隔水加熱"], "ans": 0, "ch": "2"}, {"id": "s113_1_q50", "src": "school", "sec": "2-1", "concept": "本氏液檢測", "q": "紹瑜買了「正常甜珍珠奶綠」、「半糖烏龍茶」和「無糖四季春」，分別將其放入試管中，再利用試劑檢測此三種飲料的含糖量，實驗後試管內液體的顏色如附表所示，請依表選出錯誤的敘述為何？", "ex": "本氏液必須隔水加熱才會變色，所以(D)錯。藍色的甲幾乎沒有糖，是無糖四季春；黃色的乙是半糖烏龍茶；紅色的丙糖最多，是正常甜珍珠奶綠。", "fig": "fig/s113_1_q50.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["飲料甲的含糖量最低", "飲料乙是半糖烏龍茶", "飲料丙是珍珠奶綠", "檢測的過程不須加熱"], "ans": 3, "ch": "2"}, {"id": "s113_2_q1", "src": "school", "sec": "2-4", "concept": "消化腺", "q": "哪一個器官不具有消化腺？", "ex": "小腸有腸腺、肝臟和胰臟本身就是消化腺。課本說大腸不分泌消化液，只負責吸收水分和形成糞便，所以答案是大腸。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小腸", "肝臟", "胰臟", "大腸。"], "ans": 3, "ch": "2"}, {"id": "s113_2_q2", "src": "school", "sec": "2-4", "concept": "消化液注入位置", "q": "消化液和其注入的消化器官的配對，何者正確？", "ex": "胰液和膽汁都經導管注入小腸；腸液由小腸的腸腺分泌，在小腸作用；唾液在口腔作用。只有(C)胰液→小腸正確。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["膽汁→胃", "腸液→大腸", "胰液→小腸", "唾液→食道。"], "ans": 2, "ch": "2"}, {"id": "s113_2_q3", "src": "school", "sec": "2-2", "concept": "酵素特性", "q": "下列有關酵素的敘述，何者正確？", "ex": "光合作用是一連串化學反應，需要酵素幫忙。酵素各有最適合的酸鹼值和溫度，不是越酸或越熱越好；葉綠素是吸收光能的色素，不是酵素。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["pH 值愈小，酵素的活性愈大", "葉綠素是一種酵素", "光合作用需要酵素促進反應進行", "溫度愈高，酵素的活性愈大。"], "ans": 2, "ch": "2"}, {"id": "s113_2_q4", "src": "school", "sec": "2-2", "concept": "合成與分解作用", "q": "附圖為人體某處的代謝作用，請問此作用為合成作用或分解作用？何者為受質？", "ex": "圖中乙反應前後都沒有改變，是酵素；甲是被作用的受質，被分成兩個丙，所以是分解作用。判斷酵素的訣竅：反應後形狀不變的就是酵素。", "fig": "fig/s113_2_q4.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["分解作用，甲", "合成作用，乙", "合成作用，丙", "分解作用，乙。"], "ans": 0, "ch": "2"}, {"id": "s113_2_q5", "src": "school", "sec": "2-2", "concept": "唾液分解澱粉", "q": "在試管內加入少許澱粉與足量唾液，並置於37℃溫水內一小時，使其完全作用後再加入碘液檢測，則反應結束後試管內的溶液顏色應為下列何者？", "ex": "唾液澱粉酶在37℃作用一小時，澱粉已完全被分解，所以加碘液不會變藍黑色，只會呈現碘液本身的黃褐色。橙紅色是本氏液遇大量糖類加熱後的顏色，不要搞混。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["橙紅色", "黃褐色", "淡藍色", "藍黑色。"], "ans": 1, "ch": "2"}, {"id": "s113_2_q6", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "下列有關酵素特性的敘述，何者正確?", "ex": "酵素遇高溫會失去活性，降溫也回不來。不同酵素最適溫度不同，不一定都是37℃；酵素也可以促進合成反應；酵素反應後不會被用掉，可以重複使用。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "選項(C)用「所有酵素」過於絕對（實際上少數酵素可耐高溫或可恢復），在國中課本層級可接受，官方答案無誤。", "pas": "", "opts": ["所有酵素在37℃時活性最大", "所有酵素只能作用於將大分子轉變成小分子的反應", "所有酵素遇高溫而失去活性後，再降溫亦無法再作用", "所有的酵素在反應結束後，就失去活性，無法再參與新的反應。"], "ans": 2, "ch": "2"}, {"id": "s113_2_q7", "src": "school", "sec": "2-2", "concept": "酵素專一性", "q": "下列有關酵素專一性的說明何者最適合?", "ex": "專一性是指一種酵素只能催化特定的反應，例如唾液澱粉酶只能分解澱粉、不能分解纖維素。(B)是在說酵素受酸鹼值影響，不是專一性。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["唾液中的澱粉酶只能在口腔中作用", "唾液中的澱粉酶只能在特定範圍的酸鹼值內反應", "唾液中的澱粉酶，只能在白天促進反應進行", "唾液中的澱粉酶只能分解澱粉，不能分解纖維素。"], "ans": 3, "ch": "2"}, {"id": "s113_2_q8", "src": "school", "sec": "2-3", "concept": "光合作用產物轉換", "q": "甘薯含有大量的澱粉，請問這些澱粉是植物在什麼地方、利用什麼作用的產物轉換而來的？", "ex": "甘薯（地瓜）的澱粉是葉片行光合作用製造葡萄糖後，運送到根部再轉換成澱粉儲存的。植物沒有消化作用，蒸散作用也不會製造養分。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["葉、光合作用", "葉、蒸散作用", "莖、光合作用", "葉、消化作用。"], "ans": 0, "ch": "2"}, {"id": "s113_2_q9", "src": "school", "sec": "2-3", "concept": "葉的構造", "q": "關於植物葉片的構造與功能之敘述，下列何者錯誤？", "ex": "葉的表皮細胞是無色透明的，沒有葉綠體；葉子看起來是綠色，是因為葉肉細胞和保衛細胞含有葉綠體。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["植物的氣孔是由兩個保衛細胞控制", "由葉片與葉柄構成，多呈綠色片狀", "表皮細胞含有葉綠體，所以葉子是綠色的", "葉肉組織是葉中主要行光合作用的場所。"], "ans": 2, "ch": "2"}, {"id": "s113_2_q10", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "下列有關消化作用的敘述，何者正確？", "ex": "小腸和大腸都能吸收水分。胃液不分解脂質；食物在胃中不必完全消化就會進入小腸；膽汁是肝臟製造的，膽囊只負責儲存。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["人類的胃液含有某種成分，可將脂質分解", "食物在胃中必須完全消化，才能進入小腸", "膽囊製造的膽汁能幫助脂肪消化", "小腸和大腸皆可吸收水分。"], "ans": 3, "ch": "2"}, {"id": "s113_2_q11", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "人體的消化液除了唾液外，與醣類分解有關的消化液還有哪些?", "ex": "能分解醣類的消化液有唾液、胰液、腸液。胃液主要分解蛋白質，膽汁不含酵素。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["胰液、腸液", "胃液、膽汁", "膽汁、胰液", "腸液、胃液。"], "ans": 0, "ch": "2"}, {"id": "s113_2_q12", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響實驗", "q": "在實驗室進行酵素作用的實驗，在甲、乙、丙、丁四支試管內加入試液的情形如附表所示（○表示加入，╳表示不加入）。若想證明唾液內酵素的活性隨溫度升高而增加，應取哪兩組做實驗組與對照組？", "ex": "要證明「溫度升高會讓唾液酵素活性增加」，兩組必須只有溫度不同、其他條件相同。乙（40℃）和丙（10℃）都有唾液，只差溫度，最適合比較。甲的唾液先加熱到100℃已失去活性，丁沒有加唾液。", "fig": "fig/s113_2_q12.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙", "乙丙", "甲丙", "乙丁。"], "ans": 1, "ch": "2"}, {"id": "s113_2_q13", "src": "school", "sec": "2-4", "concept": "消化道蠕動", "q": "下列敘述中，何者是較合理的?", "ex": "食物在消化道中是靠肌肉蠕動推送的，不是靠重力，所以太空人倒立也能把食物送入胃。吃下的酵素會被消化分解；飯越嚼越甜是因為澱粉被分解成麥芽糖，唾液本身不含糖。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["吃酵素能夠補充人體細胞產生的酵素", "太空人在無重力情況下，即使倒立仍能吃喝，並將食物送入胃", "吃剩的食物冰入冰箱中，可降低酵素中細菌的活性，延長食物保鮮期", "用餐時，飯在口中咀嚼一段時間後會產生甜味，是因為唾液中含糖分。"], "ans": 1, "ch": "2"}, {"id": "s113_2_q14", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "如附圖，甲、乙、丙三試管均加入3mL 澱粉及3mL唾液，分別置於0℃、37℃、90℃水浴中。每隔一段時間，分別從甲、乙、丙三試管各取出等量的液體，分別滴入碘液，則哪一個試管的液體經此檢驗後，首先不再出現藍色的變化？", "ex": "37℃最接近唾液澱粉酶的最適溫度，澱粉最快被分解完，所以乙最先不再出現藍色。0℃酵素活性很低，90℃酵素已失去活性。", "fig": "fig/s113_2_q14.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "甲乙丙同時。"], "ans": 1, "ch": "2"}, {"id": "s113_2_q15", "src": "school", "sec": "2-3", "concept": "光合作用原料與產物", "q": "如附圖為植物葉片進行光合作用，下列有關各物質的敘述何者正確？", "ex": "甲來自空氣，是二氧化碳；乙和甲一起反應，是水；丙和葡萄糖一起產生並釋放到空氣中，是氧氣。", "fig": "fig/s113_2_q15.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲是二氧化碳，乙是水，丙是氧氣", "甲是水，乙是二氧化碳，丙是氧氣", "甲是氧氣，乙是水，丙是二氧化碳", "甲是水，乙是氧氣，丙是二氧化碳。"], "ans": 0, "ch": "2"}, {"id": "s113_2_q16", "src": "school", "sec": "2-4", "concept": "脂質在小腸分解", "q": "已知某藥品的設計是將蛋白質以脂質包裹，當外層的脂質被消化液分解後，內部的蛋白質才能釋出。若人體攝入此藥品，則推測其所含的蛋白質釋出之地點應在下列哪一消化器官中？", "ex": "外層的脂質要到小腸才會被膽汁乳化、被胰液和腸液分解，所以裡面的蛋白質在小腸才釋出。口腔、食道、胃都不能分解脂質。",
