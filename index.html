/* ───── 節次頁 ───── */
const TABS = [["cards","📖 觀念卡"],["sim","🧪 模擬實驗"],["practice","✏️ 練習"],["school","🏫 段考題"],["cap","🏆 會考題"]];
function vSec(app, s, tab, arg){
  const n = k => QS.filter(q => q.sec === s.id && q.src === k).length;
  const tabs = TABS.filter(([k]) => k === "cards" || (k === "sim" ? !!s.sim : n(k) > 0));
  app.innerHTML = `<div style="--c:${s.color}">
    <div class="sechead"><span class="ic">${s.icon}</span><div><span class="pill">${s.id}</span><h1 style="margin:2px 0">${esc(s.title)}</h1></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab ${k===tab?"on":""}" role="tab" aria-selected="${k===tab}" onclick="go('#/s/${s.id}/${k}')">${t}${["practice","school","cap"].includes(k) ? ` <small>${n(k)}</small>` : ""}</button>`).join("")}</div>
    <div id="pane"></div></div>`;
  const pane = $("#pane");
  if(tab === "cards") vCards(pane, s, +arg || 0);
  else if(tab === "sim") SIMS[s.sim](pane, s);
  else vQuizStart(pane, {kind: tab, sec: s.id, inline: true});
}

/* 觀念卡 */
function vCards(pane, s, i){
  i = Math.max(0, Math.min(i, s.cards.length - 1));
  const c = s.cards[i];
  S.cards[s.id] = Math.max(S.cards[s.id] || 0, i + 1); save(); checkCardsBadge();
  pane.innerHTML = `<div class="card flash">
    <div class="row" style="justify-content:space-between"><span class="pill">卡 ${i+1}/${s.cards.length}</span>${c.page ? `<span class="muted">課本 p.${c.page}</span>` : ""}</div>
    <div class="t">${esc(c.t)}</div>
    <div class="body">${c.html}</div>
    ${c.think ? `<details class="think"><summary>🤔 想一想：${esc(c.think)}</summary><div style="margin-top:6px">${c.hint}</div></details>` : ""}
  </div>
  <div class="dots">${s.cards.map((_, k) => `<i class="${k===i?"on":""}"></i>`).join("")}</div>
  <div class="row" style="justify-content:space-between">
    <button class="btn ghost" ${i===0?"disabled":""} onclick="go('#/s/${s.id}/cards/${i-1}')">← 上一張</button>
    ${i < s.cards.length - 1 ? `<button class="btn" onclick="go('#/s/${s.id}/cards/${i+1}')">下一張 →</button>`
      : `<button class="btn gold" onclick="go('#/s/${s.id}/${s.sim ? "sim" : "practice"}')">${s.sim ? "去做實驗 🧪" : "去練習 ✏️"}</button>`}
  </div>`;
  // 左右滑動換卡
  let x0 = null; const el = pane.querySelector(".flash");
  el.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  el.addEventListener("touchend", e => { if(x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if(Math.abs(dx) > 60) go(`#/s/${s.id}/cards/${dx < 0 ? i+1 : i-1}`); x0 = null; });
}

/* ───── 答題 ───── */
let Z = null;   // 目前的回合
function pool(o){
  if(o.kind === "wrong") return Object.keys(S.wrong).map(id => QBY[id]).filter(Boolean);
  return QS.filter(q => q.src === o.kind && (!o.sec || q.sec === o.sec) && (!o.ch || q.ch === o.ch));
}
function vQuizStart(el, o){
  const all = pool(o);
  const title = (o.kind === "wrong" ? "📕 錯題本" : o.kind === "school" ? "🏫 段考挑戰" : o.kind === "cap" ? "🏆 會考挑戰" : "✏️ 練習") + (o.ch ? `・第 ${o.ch} 章` : "");
  const scope = o.sec ? "這一節" : o.ch ? `第 ${o.ch} 章` : "七上生物";
  if(!all.length){ el.innerHTML = `${o.inline ? "" : `<h1>${title}</h1>`}<div class="card"><div class="big">🎉</div><p style="text-align:center">${o.kind === "wrong" ? "錯題本是空的，太棒了！" : "這裡還沒有題目。"}</p></div>`; if(o.kind === "wrong" && Object.keys(S.done).length) award("clean"); return; }
  const secs = [...new Set(all.map(q => q.sec))].sort((a, b) => a.localeCompare(b, undefined, {numeric:true}));
  const chs = [...new Set(all.map(q => q.ch))].sort((a, b) => a - b);
  const sizes = [10, 20, all.length].filter((v, i, a) => v <= all.length && a.indexOf(v) === i);
  el.innerHTML = `${o.inline ? "" : `<h1>${title}</h1>`}
  <div class="card">
    <p style="margin-top:0">${o.kind === "school" ? `學校 112～114 學年七上生物段考中，屬於${scope}的原題。` : o.kind === "cap" ? `歷屆國中教育會考中和${scope}有關的題目。111 學年以後附全國答對率，看看你能不能贏過全國考生！` : o.kind === "wrong" ? "答錯過的題目會進來；同一題連續答對 2 次就從錯題本畢業。" : "依課本內容出的練習題。"}</p>
    <p class="muted">共 ${all.length} 題</p>
    ${!o.sec && !o.ch && o.kind !== "wrong" && chs.length > 1 ? `<p class="muted" style="margin-bottom:4px">選範圍（可多選）</p><div class="chips" id="chpick">${chs.map(x => `<button class="chip on" data-c="${x}" onclick="this.classList.toggle('on')">第 ${x} 章 ${esc(CH[x].title)}</button>`).join("")}</div>` : ""}
    ${!o.sec && (o.ch || o.kind === "wrong") && secs.length > 1 ? `<p class="muted" style="margin-bottom:4px">選範圍（可多選）</p><div class="chips" id="secpick">${secs.map(x => `<button class="chip on" data-s="${x}" onclick="this.classList.toggle('on')">${x} ${esc(SEC[x]?.title || "")}</button>`).join("")}</div>` : ""}
    <p class="muted" style="margin-bottom:4px">一回合題數</p>
    <div class="row">${sizes.map(n => `<button class="btn ${n===sizes[0]?"":"ghost"}" onclick="startQuiz(${JSON.stringify(o).replace(/"/g,"&quot;")}, ${n})">${n === all.length ? `全部 ${n} 題` : `${n} 題`}</button>`).join("")}</div>
  </div>`;
}
function startQuiz(o, n){
  let all = pool(o);
  const pick = [...document.querySelectorAll("#secpick .chip.on")].map(b => b.dataset.s);
  if(document.querySelector("#secpick")){ if(!pick.length){ toast("至少選一節"); return; } all = all.filter(q => pick.includes(q.sec)); }
  const pc = [...document.querySelectorAll("#chpick .chip.on")].map(b => b.dataset.c);
  if(document.querySelector("#chpick")){ if(!pc.length){ toast("至少選一章"); return; } all = all.filter(q => pc.includes(q.ch)); }
  // 練習題選項每次重排；段考、會考題選項維持原卷順序（選項常寫「甲、乙」對應題幹）
  const list = shuffle(all).slice(0, n).map(q => {
    if(q.src !== "practice") return q;
    const ord = shuffle([0, 1, 2, 3]);
    return Object.assign({}, q, {opts: ord.map(k => q.opts[k]), ans: ord.indexOf(q.ans)});
  });
  Z = {o, list, i:0, ok:0, streak:0, maxStreak:0, t0:0, answered:false, wrongIds:[]};
  const host = o.inline ? $("#pane") : $("#app");
  Z.host = host; QUIZ_ON = true; $("#backbtn").hidden = false; showQ();
}
function showQ(){
  const q = Z.list[Z.i], host = Z.host, total = Z.list.length;
  Z.answered = false; Z.sel = null; Z.t0 = Date.now();
  const c = SEC[q.sec]?.color || "var(--pri)";
  const imgOpts = q.optsImg;
  host.innerHTML = `<div style="--c:${c}">
  <div class="row" style="justify-content:space-between"><span class="muted">第 ${Z.i+1} / ${total} 題</span><span class="stuonly muted">✅ ${Z.ok}　🔥 ${Z.streak}</span></div>
  <div class="prog"><i style="width:${Z.i/total*100}%"></i></div>
  <div class="card">
    <div class="qmeta"><span class="pill">${q.sec}</span><span class="pill">${esc(srcName(q))}</span>${q.rate ? `<span class="pill" title="全國考生答對率">全國答對率 ${Math.round(q.rate*100)}%</span>` : ""}${q.ansSrc === "ai" ? '<span class="pill" title="這份考卷沒有學校公布的解答">非官方解答</span>' : ""}</div>
    ${q.pas ? `<div class="pas">${esc(q.pas)}</div>` : ""}
    ${q.figTop ? `<div class="qfig"><img src="${q.fig}" alt="題目附圖" loading="lazy"></div>` : `<div class="qtext">${esc(q.q)}</div>`}
    ${q.fig && !q.figTop ? `<div class="qfig"><img src="${q.fig}" alt="題目附圖" loading="lazy"></div>` : ""}
    ${q.type === "open" ? vOpenBody(q) : `<div class="opts ${imgOpts ? "img" : ""}">${(imgOpts ? ["","","",""] : q.opts).map((t, k) => `<button class="opt" data-k="${k}" onclick="pickOpt(${k})"><span class="L">${LETTERS[k]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div class="row reveal">${TEACH ? `<button class="btn gold" id="sub" onclick="submitQ()">揭曉答案</button>` : `<button class="btn" id="sub" disabled onclick="submitQ()">送出答案</button>`}</div>`}
    <div id="fb"></div>
  </div></div>`;
}
function vOpenBody(q){
  return `<p class="muted">這是寫字題：先在紙上或心裡寫下答案，再按「看答案」自己對。</p>
  <div class="row reveal"><button class="btn" id="sub" onclick="openReveal()">看答案</button></div>`;
}
function openReveal(){
  const q = Z.list[Z.i];
  $("#sub").remove();
  $("#fb").innerHTML = `<div class="ex"><b>參考答案：</b>${esc(q.ansText)}<div style="margin-top:6px">${esc(q.ex)}</div></div>
  ${TEACH ? `<div class="row reveal"><button class="btn" onclick="nextQ()">下一題 →</button></div>` :
  `<div class="row reveal"><button class="btn" onclick="selfMark(true)">✅ 我寫對了</button><button class="btn ghost" onclick="selfMark(false)">❌ 沒寫對</button></div>`}`;
}
function selfMark(ok){ recordAns(ok, ok ? "自評對" : "自評錯"); nextQ(); }
function pickOpt(k){
  if(Z.answered) return;
  Z.sel = k;
  document.querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", +b.dataset.k === k));
  const s = $("#sub"); if(s) s.disabled = false;
}
function submitQ(){
  const q = Z.list[Z.i];
  if(Z.answered) return;
  if(!TEACH && Z.sel == null) return;
  Z.answered = true;
  const ok = Z.sel === q.ans;
  document.querySelectorAll(".opt").forEach(b => { const k = +b.dataset.k; b.disabled = true; if(k === q.ans) b.classList.add("right"); else if(k === Z.sel) b.classList.add("wrong"); });
  $("#sub").remove();
  if(!TEACH){ recordAns(ok, LETTERS[Z.sel]); beep(ok); if(ok && Z.streak >= 3) confetti(); }
  const rateLine = q.rate ? `<div class="muted" style="margin-top:6px">全國考生答對率 ${Math.round(q.rate*100)}%${q.wrongOpt ? `，最多人誤選 (${q.wrongOpt})` : ""}</div>` : "";
  $("#fb").innerHTML = `${TEACH ? `<div class="verdict ok">正確答案：(${LETTERS[q.ans]})</div>` : `<div class="verdict ${ok?"ok":"bad"}">${ok ? "✅ 答對了！" : `❌ 答錯了，正確答案是 (${LETTERS[q.ans]})`}</div>`}
    <div class="ex"><b>💡 解析</b>　<span class="pill">${esc(q.concept)}</span><div style="margin-top:4px">${esc(q.ex)}</div>${rateLine}</div>
    ${q.warn ? `<div class="warn">⚠️ ${esc(q.warn)}</div>` : ""}
    <div class="row reveal"><button class="btn" onclick="nextQ()">${Z.i < Z.list.length - 1 ? "下一題 →" : "看結果 🏁"}</button></div>`;
  $("#fb").scrollIntoView({behavior:"smooth", block:"nearest"});
}
function recordAns(ok, given){
  const q = Z.list[Z.i];
  if(ok){ Z.ok++; Z.streak++; Z.maxStreak = Math.max(Z.maxStreak, Z.streak); addXP(q.src === "cap" ? 15 : q.src === "school" ? 12 : 10); award("first"); if(Z.streak >= 5) award("streak5"); }
  else { Z.streak = 0; Z.wrongIds.push(q.id); }
  if(TEACH) return;
  S.done[q.id] = (S.done[q.id] || 0) + 1;
  if(ok){ if(S.wrong[q.id]){ S.wrong[q.id].c = (S.wrong[q.id].c || 0) + 1; if(S.wrong[q.id].c >= 2){ delete S.wrong[q.id]; toast("🎓 這題從錯題本畢業了！"); } } }
  else S.wrong[q.id] = {c:0, t:Date.now()};
  save();
  logEv({k:"ans", L:q.sec, src:q.src, sec:Z.o.kind, qid:q.id, t:q.type || "mc", c:q.concept, cn:q.concept, q:q.q.slice(0, 120), given, ans:q.type === "open" ? q.ansText : LETTERS[q.ans], ok, ms:Date.now() - Z.t0});
}
function nextQ(){
  if(Z.i < Z.list.length - 1){ Z.i++; showQ(); window.scrollTo(0, 0); return; }
  const n = Z.list.length, r = Z.ok / n, o = Z.o;
  if(!TEACH){
    if(o.sec && o.kind === "practice") { S.best[o.sec] = Math.max(S.best[o.sec] || 0, r); save(); }
    if(r === 1 && n >= 5) award("perfect");
    if(o.kind === "school") award("school");
    if(o.kind === "cap") award("cap");
    if(o.kind === "wrong" && !Object.keys(S.wrong).length) award("clean");
    if(r >= .8) confetti();
  }
  Z.host.innerHTML = `<div class="card" style="text-align:center">
    <div class="big">${r === 1 ? "🏆" : r >= .8 ? "🌟" : r >= .6 ? "👍" : "💪"}</div>
    <h2>${TEACH ? `全班完成 ${n} 題` : `答對 ${Z.ok} / ${n} 題`}</h2>
    ${TEACH ? "" : `<p>${starsHTML(r === 1 ? 3 : r >= .8 ? 2 : r > 0 ? 1 : 0)}　最長連對 ${Z.maxStreak} 題</p>`}
    ${!TEACH && Z.wrongIds.length ? `<p class="muted">答錯的 ${Z.wrongIds.length} 題已放進錯題本。</p>` : ""}
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="startQuiz(${JSON.stringify(o).replace(/"/g,"&quot;")}, ${n})">再來一回</button>
      ${!TEACH && Z.wrongIds.length ? `<button class="btn ghost" onclick="go('#/wrong')">練錯題 📕</button>` : ""}
      <button class="btn ghost" onclick="go('#/')">回地圖</button>
    </div></div>`;
}

/* ───── 徽章、說明 ───── */

  app.innerHTML = `<h1>🎖️ 徽章牆</h1><p class="muted">累積經驗值 ${S.xp} XP・等級 Lv ${Math.floor(S.xp / LV_XP) + 1}</p>

/* ───── 模擬實驗（每節一個，見 SIMS） ───── */
const SIMS = {};
function simDone(s){ if(!S.sims[s.id]){ S.sims[s.id] = Date.now(); save(); addXP(20); toast("🧪 完成實驗 +20 XP"); checkLabBadge(); } }
/* ── 模擬實驗：每節一個；結果顏色、步驟皆依課本 p.68–89 ── */
function tubeSVG(color, label, opts){
  opts = opts || {};
  const steam = opts.heat ? `<g opacity=".7"><path d="M40 10 q6 -8 0 -16" stroke="#ff7b54" stroke-width="3" fill="none"/><path d="M55 12 q6 -8 0 -16" stroke="#ff7b54" stroke-width="3" fill="none"/></g>` : "";
  return `<svg viewBox="0 0 100 210" style="max-width:110px">
    ${steam}
    <path d="M30 20 V170 a20 20 0 0 0 40 0 V20" fill="none" stroke="var(--sub)" stroke-width="4"/>
    <path class="tube" d="M33 ${opts.level || 90} V170 a17 17 0 0 0 34 0 V${opts.level || 90} Z" fill="${color}"/>
    ${opts.bits ? `<g fill="#fff" opacity=".85"><circle cx="45" cy="150" r="4"/><circle cx="56" cy="160" r="3"/><circle cx="50" cy="132" r="3.5"/></g>` : ""}
    <rect x="24" y="14" width="52" height="8" rx="4" fill="var(--sub)"/>
    <text x="50" y="205" text-anchor="middle" font-size="15" fill="var(--ink)">${label || ""}</text>
  </svg>`;
}
const COL = {iod:"#c9892b", blk:"#211c4f", pur:"#7d2a6e", ben:"#8fd0ec", grn:"#57b56a", yel:"#f2c230", org:"#f08a2c", red:"#e2502d", bgr:"#5fb3b3", blu:"#6aa8e8", none:"#e9eef5"};
const CNAME = {iod:"黃褐色", blk:"藍黑色", pur:"紫紅色", ben:"淺藍色", org:"橘紅色", yel:"黃色", bgr:"藍綠色", blu:"藍色"};

/* ═════ 2-1 食物檢測實驗室 ═════ */
SIMS.food = function(pane, s){
  const SAMPLES = {
    water:{n:"水", iod:"iod", ben:"ben"},
    starch:{n:"澱粉液", iod:"blk", ben:"ben"},
    glu:{n:"葡萄糖液", iod:"iod", ben:"org"},
    rice:{n:"米飯", iod:"blk", ben:"ben"},
    glut:{n:"糯米", iod:"pur", ben:null},
    apple:{n:"蘋果果肉", iod:"iod", ben:"org"},
  };
  let st = {re:"iod", sm:"starch", pred:null, tested:new Set()};
  pane.innerHTML = `
  <div class="card sim">
    <h2>🧪 食物檢測台</h2>
    <p class="muted" style="margin:0">選試劑和樣品 → 先猜顏色 → 動手檢測。課本 p.68–69、p.88。</p>
    <label>① 選試劑</label><div class="chips" id="fre"></div>
    <label>② 選樣品</label><div class="chips" id="fsm"></div>
    <label>③ 你猜會變成什麼顏色？</label><div class="chips" id="fpred"></div>
    <div class="simview"><div id="ftube"></div><div class="readout" id="fout">　</div></div>
    <div class="row" style="margin-top:10px" id="fact"></div>
    <p class="note" id="fnote"></p>
    <p class="muted">已完成 <b id="fcnt">0</b> 種組合（做滿 5 種完成實驗）</p>
  </div>
  <div class="card sim">
    <h2>🔥 熱量計算機</h2>
    <p class="muted" style="margin:0">醣類、蛋白質每公克 4 大卡，脂質每公克 9 大卡（p.67）。拉拉看，哪一種讓熱量長最快？</p>
    ${["醣類","蛋白質","脂質"].map((n,i) => `<label>${n}：<span id="kv${i}">10</span> 公克</label><input type="range" min="0" max="50" value="10" id="kr${i}" aria-label="${n}公克數">`).join("")}
    <div class="simview" id="kbar"></div>
  </div>`;
  const chips = (id, items, cur, fn) => { const el = pane.querySelector(id); el.innerHTML = items.map(([k, t, dis]) => `<button class="chip ${k===cur?"on":""}" data-k="${k}" ${dis?"disabled":""}>${t}</button>`).join(""); el.querySelectorAll(".chip").forEach(b => b.onclick = () => fn(b.dataset.k)); };
  function draw(){
    chips("#fre", [["iod","碘液（黃褐色）"],["ben","本氏液（淺藍色）"]], st.re, k => { st.re = k; if(k === "ben" && !SAMPLES[st.sm].ben) st.sm = "glu"; st.pred = null; draw(); });
    chips("#fsm", Object.entries(SAMPLES).map(([k, v]) => [k, v.n, st.re === "ben" && !v.ben]), st.sm, k => { st.sm = k; st.pred = null; draw(); });
    const preds = st.re === "iod" ? ["iod","blk","pur"] : ["ben","org"];
    chips("#fpred", preds.map(k => [k, `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${COL[k]};vertical-align:-2px"></span> ${CNAME[k]}`]), st.pred, k => { st.pred = k; draw(); });
    pane.querySelector("#ftube").innerHTML = tubeSVG(COL[st.re], SAMPLES[st.sm].n + "＋" + (st.re === "iod" ? "碘液" : "本氏液"), {bits: ["rice","glut","apple"].includes(st.sm)});
    pane.querySelector("#fout").textContent = "　";
    const act = pane.querySelector("#fact");
    act.innerHTML = st.re === "iod" ? `<button class="btn" id="fgo">💧 滴入碘液</button>` : `<button class="btn ghost" id="fnoheat">直接觀察（不加熱）</button><button class="btn" id="fgo">♨️ 隔水加熱</button>`;
    pane.querySelector("#fgo").onclick = () => run(true);
    const nh = pane.querySelector("#fnoheat"); if(nh) nh.onclick = () => run(false);
    pane.querySelector("#fnote").textContent = st.re === "ben" ? "本氏液只和葡萄糖、麥芽糖這類小分子醣類反應，而且要加熱。" : "碘液遇澱粉變藍黑色或紫紅色。";
  }
  function run(heat){
    if(st.pred == null){ toast("先猜猜看會變什麼顏色！"); return; }
    const smp = SAMPLES[st.sm];
    let res = st.re === "iod" ? smp.iod : (heat ? smp.ben : "ben");
    pane.querySelector("#ftube").innerHTML = tubeSVG(COL[st.re], smp.n, {heat: st.re === "ben" && heat, bits: ["rice","glut","apple"].includes(st.sm)});
    setTimeout(() => {
      pane.querySelector("#ftube .tube").setAttribute("fill", COL[res]);
      const right = st.pred === res;
      const why = st.re === "iod" ? (res === "iod" ? "沒有澱粉，碘液維持黃褐色。" : "含有澱粉！") : !heat ? "沒加熱，本氏液不會反應。" : res === "ben" ? (st.sm === "starch" || st.sm === "rice" ? "澱粉是大分子醣類，本氏液不會變色。" : "沒有小分子醣類。") : "含有葡萄糖等小分子醣類！";
      pane.querySelector("#fout").innerHTML = `結果：<span style="color:${COL[res]}">●</span> ${CNAME[res]}　${right ? "🎯 猜對了！" : "🤔 和你猜的不一樣"}<div class="muted" style="font-weight:400">${why}</div>`;
      if(right) addXP(2);
      if(st.re === "iod" || heat){ st.tested.add(st.re + st.sm); pane.querySelector("#fcnt").textContent = st.tested.size; if(st.tested.size >= 5) simDone(s); }
    }, st.re === "ben" && heat ? 1200 : 500);
  }
  function kcal(){
    const g = [0,1,2].map(i => +pane.querySelector("#kr" + i).value);
    g.forEach((v, i) => pane.querySelector("#kv" + i).textContent = v);
    const k = [g[0]*4, g[1]*4, g[2]*9], tot = k[0] + k[1] + k[2], mx = 450;
    const cs = ["#ff8a3d","#e84393","#f5a524"], ns = ["醣類","蛋白質","脂質"];
    pane.querySelector("#kbar").innerHTML = `<svg viewBox="0 0 320 130">${k.map((v, i) => `<text x="0" y="${28+i*36}" font-size="14" fill="var(--ink)">${ns[i]}</text><rect x="56" y="${14+i*36}" width="${Math.max(2, v/mx*200)}" height="20" rx="6" fill="${cs[i]}"/><text x="${62+v/mx*200}" y="${29+i*36}" font-size="13" fill="var(--ink)">${v} 大卡</text>`).join("")}</svg><div class="readout">合計 ${tot} 大卡</div>`;
  }
  [0,1,2].forEach(i => pane.querySelector("#kr" + i).oninput = kcal);
  draw(); kcal();
};

/* ═════ 2-2 酵素實驗室 ═════ */
SIMS.enzyme = function(pane, s){
  const TREAT = {
    body:{n:"37℃ 唾液（對照組）", res:"yel", src:"p.75", ok:true},
    boil:{n:"唾液先煮沸 10 分鐘", res:"blu", src:"p.75", ok:false},
    cold:{n:"唾液先放低溫 10 分鐘", res:"bgr", src:"p.75", ok:"partial"},
    vin:{n:"唾液加醋（酸性）", res:"blu", src:"p.75 例 1", ok:false},
    water:{n:"不加唾液，只加水", res:"blu", src:"p.89", ok:false},
  };
  let cur = "body", step = 0; const seen = new Set();
  pane.innerHTML = `
  <div class="card sim">
    <h2>🧫 唾液能分解澱粉嗎？</h2>
    <p class="muted" style="margin:0">選一種唾液處理方式，照實驗 2-2 的流程做，最後用本氏液檢測（課本 p.72–75）。</p>
    <label>選擇處理方式</label><div class="chips" id="etr"></div>
    <div class="simview"><div id="etube"></div><div class="readout" id="eout">　</div></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="enext">開始 ▶</button></div>
    <div id="eq"></div>
    <p class="muted">已做 <b id="ecnt">0</b>/5 種處理（做滿 3 種完成實驗）</p>
  </div>
  <div class="card sim">
    <h2>🌡️ 溫度、酸鹼值與酵素活性</h2>
    <p class="muted" style="margin:0">示意圖（依課本圖 2-5、2-6），拉動看看活性怎麼變。</p>
    <label>溫度：<span id="tv">37</span>℃</label><input type="range" min="0" max="100" value="37" id="tr" aria-label="溫度">
    <div class="simview"><svg viewBox="0 0 320 150" id="tsvg"></svg><div class="readout" id="tout"></div></div>
    <label>酸鹼值：<span id="pv">中性</span></label><input type="range" min="0" max="100" value="50" id="pr" aria-label="酸鹼值">
    <div class="simview"><svg viewBox="0 0 320 150" id="psvg"></svg><div class="readout" id="pout"></div></div>
  </div>
  <div class="card sim">
    <h2>🔑 專一性：鑰匙對鎖</h2>
    <p class="muted" style="margin:0">把受質送給「澱粉酶」，看看能不能結合（課本圖 2-4）。</p>
    <div class="row"><button class="btn ghost" id="ks">送入 澱粉</button><button class="btn ghost" id="kc">送入 纖維素</button></div>
    <div class="simview"><svg viewBox="0 0 320 120" id="ksvg"></svg><div class="readout" id="kout">　</div></div>
  </div>`;
  const STEPS = ["① 唾液處理 10 分鐘", "② 倒入澱粉液，放 37℃ 溫水 10 分鐘", "③ 加入本氏液、隔水加熱", "看結果"];
  function drawTr(){
    const el = pane.querySelector("#etr");
    el.innerHTML = Object.entries(TREAT).map(([k, v]) => `<button class="chip ${k===cur?"on":""}" data-k="${k}">${seen.has(k)?"✔ ":""}${v.n}</button>`).join("");
    el.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = b.dataset.k; step = 0; drawTr(); drawTube(); });
  }
  function drawTube(){
    const t = TREAT[cur];
    const col = step >= 3 ? COL[t.res] : step === 2 ? COL.ben : "#f3efe6";
    pane.querySelector("#etube").innerHTML = tubeSVG(col, step === 0 ? (cur === "water" ? "水" : "唾液") : "＋澱粉液", {heat: step === 3, level: step >= 1 ? 70 : 120});
    pane.querySelector("#eout").textContent = step === 0 ? t.n : STEPS[step - 1];
    pane.querySelector("#enext").textContent = step === 0 ? "開始 ▶" : step < 3 ? "下一步 ▶" : "換一種處理再做";
    pane.querySelector("#eq").innerHTML = "";
  }
  pane.querySelector("#enext").onclick = () => {
    if(step >= 3){ step = 0; drawTube(); return; }
    step++; drawTube();
    if(step === 3){
      const t = TREAT[cur];
      setTimeout(() => {
        pane.querySelector("#eout").innerHTML = `本氏液加熱後：<span style="color:${COL[t.res]}">●</span> ${CNAME[t.res]} <span class="muted">（${t.src}）</span>`;
        const q = pane.querySelector("#eq");
        q.innerHTML = `<p style="margin:10px 0 4px;font-weight:700">這代表澱粉有沒有被分解成小分子醣類？</p><div class="row"><button class="btn ghost" data-a="yes">有，分解了</button><button class="btn ghost" data-a="part">只分解一點點</button><button class="btn ghost" data-a="no">沒有分解</button></div><div id="efb"></div>`;
        q.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
          const want = t.ok === true ? "yes" : t.ok === "partial" ? "part" : "no";
          const msg = {body:"37℃ 是人體體溫，唾液酵素活性好，澱粉被分解成小分子醣類，本氏液變黃色。",
                       boil:"高溫破壞酵素的蛋白質構造，酵素失去活性，澱粉沒被分解，本氏液維持藍色。",
                       cold:"低溫讓酵素活性降低，只產生少量小分子醣類，所以只變成藍綠色。",
                       vin:"唾液酵素適合接近中性，酸性環境讓它活性降低，澱粉沒被分解。",
                       water:"沒有唾液就沒有酵素，澱粉不會被分解——這就是對照組的用意。"}[cur];
          q.querySelector("#efb").innerHTML = `<div class="ex">${b.dataset.a === want ? "✅ 答對！" : "❌ 再想想。"}${msg}</div>`;
          if(b.dataset.a === want) addXP(3);
        });
        seen.add(cur); pane.querySelector("#ecnt").textContent = seen.size; drawTr();
        if(seen.size >= 3) simDone(s);
      }, 1200);
    }
  };
  // 溫度曲線（示意）
  const tAct = T => T <= 37 ? 0.15 + 0.85 * (T / 37) ** 1.6 : T <= 55 ? Math.max(0, 1 - ((T - 37) / 18) ** 2) : 0;
  const curve = (f, color) => { let d = ""; for(let x = 0; x <= 100; x += 2) d += (x ? "L" : "M") + (30 + x * 2.8).toFixed(1) + " " + (130 - f(x) * 110).toFixed(1); return `<path d="${d}" fill="none" stroke="${color}" stroke-width="3.5"/>`; };
  const axes = (xl, xr, mid) => `<line x1="30" y1="130" x2="315" y2="130" stroke="var(--sub)"/><line x1="30" y1="10" x2="30" y2="130" stroke="var(--sub)"/><text x="4" y="20" font-size="11" fill="var(--sub)">活性</text><text x="30" y="146" font-size="11" fill="var(--sub)">${xl}</text>${mid ? `<text x="172" y="146" font-size="11" text-anchor="middle" fill="var(--sub)">${mid}</text>` : ""}<text x="315" y="146" font-size="11" text-anchor="end" fill="var(--sub)">${xr}</text>`;
  function temp(){
    const T = +pane.querySelector("#tr").value; pane.querySelector("#tv").textContent = T;
    const a = tAct(T), x = 30 + T * 2.8, y = 130 - a * 110;
    pane.querySelector("#tsvg").innerHTML = axes("0℃", "100℃") + curve(tAct, "#e84393") + `<line x1="${30+37*2.8}" y1="16" x2="${30+37*2.8}" y2="130" stroke="var(--gold)" stroke-dasharray="4 4"/><text x="${30+37*2.8}" y="14" font-size="11" text-anchor="middle" fill="var(--sub)">最適溫度</text><circle cx="${x}" cy="${y}" r="8" fill="var(--pri)"/>`;
    pane.querySelector("#tout").textContent = T > 55 ? "溫度過高：蛋白質構造被破壞，酵素永久失去活性（p.86）" : a > .85 ? "接近最適溫度：活性最高" : T < 37 ? "溫度偏低：活性較低" : "超過最適溫度：活性下降";
  }
  const pf = (c, w) => p => Math.exp(-(((p - c) / w) ** 2));
  const PH = [["胃中的酵素", 18, "#2f80ed"], ["唾液中的酵素", 50, "#e84393"], ["小腸中的酵素", 64, "#22a35a"]];
  function ph(){
    const p = +pane.querySelector("#pr").value;
    pane.querySelector("#pv").textContent = p < 40 ? "酸性" : p > 60 ? "鹼性" : "中性";
    pane.querySelector("#psvg").innerHTML = axes("酸性", "鹼性", "中性") + PH.map(([n, c, col]) => curve(pf(c, 13), col)).join("") + `<line x1="${30+p*2.8}" y1="10" x2="${30+p*2.8}" y2="130" stroke="var(--pri)" stroke-width="2"/>` + PH.map(([n, c, col], i) => `<text x="${30+c*2.8}" y="${22+i*0}" font-size="10.5" text-anchor="middle" fill="${col}" transform="translate(0 ${[0,12,24][i]})">${n}</text>`).join("");
    const best = PH.map(([n, c]) => [n, pf(c, 13)(p)]).sort((a, b) => b[1] - a[1])[0];
    pane.querySelector("#pout").textContent = best[1] > .5 ? `這個酸鹼值下「${best[0]}」最活躍` : "三種酵素在這裡活性都很低";
  }
  pane.querySelector("#tr").oninput = temp; pane.querySelector("#pr").oninput = ph;
  // 專一性
  function key(sub){
    const ok = sub === "s";
    const enz = `<path d="M150 30 h60 v60 h-60 v-18 h14 v-24 h-14 z" fill="#e84393"/><text x="185" y="110" font-size="12" text-anchor="middle" fill="var(--ink)">澱粉酶</text>`;
    const shape = ok ? `<rect x="40" y="48" width="30" height="24" rx="3" fill="#ff8a3d"/>` : `<polygon points="40,72 55,44 70,72" fill="#22a35a"/>`;
    const svg = pane.querySelector("#ksvg");
    svg.innerHTML = enz + `<g id="kmv">${shape}</g><text x="55" y="100" font-size="12" text-anchor="middle" fill="var(--ink)">${ok ? "澱粉" : "纖維素"}</text>`;
    const g = svg.querySelector("#kmv");
    g.style.transition = "transform .8s"; requestAnimationFrame(() => g.style.transform = `translateX(${ok ? 110 : 80}px)`);
    setTimeout(() => {
      if(ok){ g.innerHTML = `<rect x="40" y="48" width="12" height="24" rx="3" fill="#ff8a3d"/><rect x="58" y="48" width="12" height="24" rx="3" fill="#ff8a3d"/>`; g.style.transform = "translateX(200px)"; }
      pane.querySelector("#kout").textContent = ok ? "✅ 形狀吻合！澱粉被分解成小分子醣類，酵素還能重複使用。" : "❌ 形狀對不上，澱粉酶無法分解纖維素——這就是專一性。";
    }, 900);
  }
  pane.querySelector("#ks").onclick = () => key("s"); pane.querySelector("#kc").onclick = () => key("c");
  drawTr(); drawTube(); temp(); ph();
};

/* ═════ 2-3 葉片實驗＋光合作用方程式 ═════ */

  };

  let leaf = "foil", done = [];

  <div class="card sim">

    <label>選葉片</label><div class="chips" id="pl"></div>
    <div class="simview"><svg viewBox="0 0 320 170" id="psv"></svg><div class="readout" id="pout">　</div></div>

    <p class="note" id="pnote"></p>
  </div>
  <div class="card sim">
    <h2>⚗️ 組出光合作用反應式</h2>

  function leafColors(){

    if(n < 3) return L === "coleus" ? [green, purple] : L === "foil" && n >= 1 ? [green, "#cfd6dc"] : [green, green];
    if(n < 5) return ["#efe7b0", "#efe7b0"];
    const B = COL.blk, Y = COL.iod;
    return {foil:[B, Y], coleus:[B, Y], oil:[Y, Y], plain:[B, B]}[L];
  }
  function drawLeaf(){
    const [edge, mid] = leafColors(), n = done.length;
    const foil = leaf === "foil" && n === 1 ? `<rect x="120" y="20" width="80" height="130" fill="#c9ced3" opacity=".9"/><text x="160" y="90" font-size="12" text-anchor="middle">鋁箔</text>` : "";
    const beaker = n === 2 ? `<rect x="230" y="70" width="70" height="80" rx="6" fill="#8fd0ec55" stroke="var(--sub)"/><rect x="242" y="96" width="46" height="50" rx="4" fill="${COL.grn}88" stroke="var(--sub)"/><text x="265" y="64" font-size="11" text-anchor="middle" fill="var(--sub)">酒精變綠</text>` : "";
    const center = leaf === "coleus" ? `<ellipse cx="150" cy="85" rx="70" ry="38" fill="${mid}"/>` : `<rect x="120" y="22" width="80" height="126" fill="${mid}" clip-path="url(#lc)"/>`;
    pane.querySelector("#psv").innerHTML = `<defs><clipPath id="lc"><path d="M20 85 Q90 0 280 85 Q90 170 20 85Z"/></clipPath></defs>
      <path d="M20 85 Q90 0 280 85 Q90 170 20 85Z" fill="${edge}"/>
      <g clip-path="url(#lc)">${center}</g>
      <path d="M20 85 L280 85" stroke="#00000033" stroke-width="2"/>${foil}${beaker}`;
  }
  function drawLeafChips(){
    const el = pane.querySelector("#pl");
    el.innerHTML = Object.entries(LEAVES).map(([k, v]) => `<button class="chip ${k===leaf?"on":""}" data-k="${k}">${v.n}</button>`).join("");

  function stepClick(k){

                   coleus:"綠色部分<b>藍黑色</b>，紫紅色部分<b>黃褐色</b> → 光合作用需要綠色構造（葉綠體）。",

    pane.querySelector("#eqw").innerHTML = WORDS.map(w => `<button class="chip ${pick===w?"on":""}" data-w="${w}">${w}</button>`).join("");

    pane.querySelector("#eqv").querySelectorAll("[data-g]").forEach(b => b.onclick = () => { if(!pick){ toast("先點上面的詞"); return; } slots[+b.dataset.g][+b.dataset.i] = pick; pick = null; drawEq(); });
  }
  pane.querySelector("#eqchk").onclick = () => {
    const same = (a, b) => a.slice().sort().join() === b.slice().sort().join();
    const ok = slots.every((g, i) => same(g, ANS[i]));
    pane.querySelector("#eqfb").innerHTML = `<div class="ex">${ok ? "✅ 完全正確！水＋二氧化碳 ──(光、葉綠體)──▶ 氧氣＋葡萄糖＋水" : "❌ 還有格子不對。提示：原料兩個由根和氣孔進來；條件是能量來源和場所；產物有三個（有一個和原料同名）。澱粉是葡萄糖之後轉換成的，氮氣不參與。"}</div>`;
    if(ok) addXP(5);

  refresh(); drawEq();
};

/* ── 第 1、3、4、5 章模擬實驗；內容依課本逐頁轉錄 ── */

/* 共用：分類（先點項目，再點要放的格子） */
function sortWidget(el, cfg, onDone){
  const left = shuffle(cfg.items.map((x, i) => i)); const placed = {}; let pick = null;
  function draw(){
    el.innerHTML = `<p class="muted" style="margin:4px 0">${cfg.hint || "先點一張卡片，再點它屬於哪一格。"}</p>
    <div class="chips">${left.filter(i => placed[i] == null).map(i => `<button class="chip ${pick===i?"on":""}" data-i="${i}">${cfg.items[i].t}</button>`).join("") || "<span class='muted'>全部分完了！</span>"}</div>
    <div style="display:grid;grid-template-columns:repeat(${Math.min(cfg.bins.length, 3)},1fr);gap:8px;margin-top:10px">${cfg.bins.map((b, k) => `<button class="opt" data-b="${k}" style="flex-direction:column;align-items:stretch;min-height:90px"><b>${b}</b>${Object.keys(placed).filter(i => placed[i] === k).map(i => `<span class="pill" style="margin-top:4px;background:var(--okbg);color:var(--ok)">${cfg.items[i].t}</span>`).join("")}</button>`).join("")}</div>
    <div class="fb"></div>`;
    el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { pick = +b.dataset.i; draw(); });
    el.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
      if(pick == null){ toast("先點一張卡片"); return; }
      const it = cfg.items[pick], k = +b.dataset.b, fb = () => el.querySelector(".fb");
      if(it.bin === k){ placed[pick] = k; const w = it.why; pick = null; addXP(1); draw(); if(w) fb().innerHTML = `<div class="ex">✅ ${w}</div>`; if(Object.keys(placed).length === cfg.items.length){ fb().innerHTML += `<div class="ex">🎉 全部分類正確！</div>`; onDone && onDone(); } }
      else { fb().innerHTML = `<div class="warn">「${it.t}」不屬於「${cfg.bins[k]}」，再想想。</div>`; }
    });
  }
  draw();
}
/* 共用：排順序（依序點選） */
function orderWidget(el, cfg, onDone){
  const ord = shuffle(cfg.steps.map((x, i) => i)); let got = [];
  function draw(msg){
    el.innerHTML = `<p class="muted" style="margin:4px 0">${cfg.hint || "依正確順序點選。"}</p>
    <div class="readout" style="font-size:1em;font-weight:700;min-height:28px">${got.map(i => cfg.steps[i]).join(" → ") || "　"}</div>
    <div class="chips">${ord.map(i => `<button class="chip ${got.includes(i)?"on":""}" data-i="${i}" ${got.includes(i)?"disabled":""}>${cfg.steps[i]}</button>`).join("")}</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" data-r>重來</button></div><div class="fb">${msg || ""}</div>`;
    el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if(i !== got.length){ draw(`<div class="warn">「${cfg.steps[i]}」還不是下一站，再想想。</div>`); return; }
      got.push(i); addXP(1);
      if(got.length === cfg.steps.length){ draw(`<div class="ex">🎉 順序完全正確！${cfg.done || ""}</div>`); onDone && onDone(); } else draw();
    });
    el.querySelector("[data-r]").onclick = () => { got = []; draw(); };
  }
  draw();
}

/* ═════ 1-2 虛擬複式顯微鏡 ═════ */
SIMS.scope = function(pane, s){
  let obj = 4, ex = 10, x = 0, y = 0, light = 60, focus = false; const moves = new Set();
  pane.innerHTML = `<div class="card sim"><h2>🔬 虛擬複式顯微鏡</h2><p class="muted" style="margin:0">觀察透明直尺上的「5」（實驗 1-1）。試試推玻片、換物鏡。</p>
  <div class="simview"><svg viewBox="0 0 220 220" id="vw" style="max-width:260px"></svg><div class="readout" id="mag"></div></div>
  <label>物鏡</label><div class="chips" id="ob"></div>
  <label>推動玻片（實際移動方向）</label><div class="row"><button class="btn ghost" data-m="0,-1">⬆ 往上</button><button class="btn ghost" data-m="0,1">⬇ 往下</button><button class="btn ghost" data-m="-1,0">⬅ 往左</button><button class="btn ghost" data-m="1,0">➡ 往右</button></div>
  <label>光圈／光源亮度：<span id="lv"></span></label><input type="range" min="10" max="100" value="60" id="lr" aria-label="亮度">
  <div class="row" style="margin-top:8px"><button class="btn ghost" id="cf">粗調節輪</button><button class="btn ghost" id="ff">細調節輪</button></div>
  <p class="note" id="nt">先用低倍、粗調節輪找到影像。</p></div>`;
  function draw(){
    const m = obj * ex, z = obj / 4, bright = Math.max(.15, Math.min(1, light / 100 * (obj === 40 ? .55 : obj === 10 ? .8 : 1)));
    // 複式顯微鏡：影像上下顛倒、左右相反 → 影像位移與實際相反
    const ix = 110 - x * 14 * z, iy = 110 - y * 14 * z;
    pane.querySelector("#vw").innerHTML = `<defs><clipPath id="cv"><circle cx="110" cy="110" r="100"/></clipPath></defs>
      <circle cx="110" cy="110" r="102" fill="#111"/>
      <g clip-path="url(#cv)"><rect width="220" height="220" fill="rgb(${Math.round(255*bright)},${Math.round(250*bright)},${Math.round(225*bright)})"/>
      <g transform="translate(${ix} ${iy}) rotate(180) scale(${z})" style="${focus ? "" : "filter:blur(3px)"}"><text x="0" y="22" font-size="64" text-anchor="middle" font-weight="700" fill="#333">5</text><line x1="-80" y1="30" x2="80" y2="30" stroke="#555" stroke-width="2"/></g></g>`;
    pane.querySelector("#mag").textContent = `放大倍率＝目鏡 ${ex}X × 物鏡 ${obj}X＝${m} 倍`;
    pane.querySelector("#lv").textContent = light < 35 ? "太暗" : light > 90 ? "很亮" : "適中";
    pane.querySelector("#ob").innerHTML = [4, 10, 40].map(o => `<button class="chip ${o===obj?"on":""}" data-o="${o}">${o}X</button>`).join("");
    pane.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      const o = +b.dataset.o;
      if(o === 40 && (Math.abs(x) > 1 || Math.abs(y) > 1)){ pane.querySelector("#nt").innerHTML = "🤔 換高倍前要先把目標移到視野<b>中央</b>，不然換了就找不到。"; return; }
      obj = o; pane.querySelector("#nt").innerHTML = o === 40 ? "高倍：視野變小、變暗、看起來變大。現在<b>只能用細調節輪</b>，太暗就把光圈開大。" : "低倍：視野大、亮。"; draw();
    });
  }
  pane.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    const [dx, dy] = b.dataset.m.split(",").map(Number); x += dx; y += dy; moves.add(b.dataset.m);
    pane.querySelector("#nt").innerHTML = `你把玻片往${b.textContent.slice(2)}推，影像卻往<b>相反</b>方向跑——複式顯微鏡影像上下顛倒、左右相反。`; draw();
    if(moves.size >= 2 && obj === 40) simDone(s);
  });
  pane.querySelector("#lr").oninput = e => { light = +e.target.value; draw(); };
  pane.querySelector("#cf").onclick = () => { if(obj === 40){ pane.querySelector("#nt").innerHTML = "❌ 高倍時不可轉粗調節輪，會撞壞鏡頭和玻片！"; return; } focus = true; pane.querySelector("#nt").textContent = "找到影像了，再用細調節輪調清楚。"; draw(); };
  pane.querySelector("#ff").onclick = () => { focus = true; pane.querySelector("#nt").textContent = "影像清楚了！注意看：「5」是上下顛倒、左右相反的。"; draw(); if(obj === 40) simDone(s); };
  draw();
};

SIMS.osmosis = function(pane, s){
  let sol = "pure", kind = "animal"; const seen = new Set();
  const RES = {pure:{n:"清水", animal:["膨脹，甚至破裂", 1.35, "burst"], plant:["膨脹但不破裂（有細胞壁）", 1.12, "big"], flow:"進水＞出水"},
               iso:{n:"生理食鹽水", animal:["維持原狀", 1, ""], plant:["維持原狀", 1, ""], flow:"進水＝出水"},
               salt:{n:"濃食鹽水", animal:["萎縮", .72, "shrink"], plant:["萎縮，細胞膜和細胞壁分開", .7, "plas"], flow:"進水＜出水"}};
  pane.innerHTML = `<div class="card sim"><h2>💧 細胞泡在不同溶液裡</h2><p class="muted" style="margin:0">課本 p.40 滲透作用。</p>

  function draw(){
    pane.querySelector("#k").innerHTML = [["animal","🩸 紅血球（動物）"],["plant","🌿 植物細胞"]].map(([k, t]) => `<button class="chip ${k===kind?"on":""}" data-k="${k}">${t}</button>`).join("");
    pane.querySelector("#so").innerHTML = Object.entries(RES).map(([k, v]) => `<button class="chip ${k===sol?"on":""}" data-s="${k}">${v.n}</button>`).join("");
    pane.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { kind = b.dataset.k; draw(); });
    pane.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sol = b.dataset.s; draw(); });
    const r = RES[sol], [txt, sc, fx] = r[kind];
    const bg = sol === "pure" ? "#e6f6ff" : sol === "iso" ? "#d9eefc" : "#bcd9ef";
    const arrowsIn = sol === "pure" ? 3 : sol === "iso" ? 2 : 1, arrowsOut = sol === "salt" ? 3 : sol === "iso" ? 2 : 1;
    const arr = (n, dir) => Array.from({length:n}, (_, i) => { const y = 70 + i * 22; return dir > 0 ? `<path d="M30 ${y} h40" stroke="#2f80ed" stroke-width="3" marker-end="url(#ah)"/>` : `<path d="M290 ${y} h-40" stroke="#e2502d" stroke-width="3" marker-end="url(#ah2)"/>`; }).join("");
    let cell;
    if(kind === "animal") cell = fx === "burst" ? `<g fill="#e2502d" opacity=".8"><path d="M130 80 l15 -10 l10 18z"/><path d="M175 120 l20 5 l-8 15z"/><path d="M140 130 l-12 14 l18 2z"/></g><text x="160" y="105" text-anchor="middle" font-size="14" fill="var(--bad)">破裂！</text>`
      : `<ellipse cx="160" cy="100" rx="${48*sc}" ry="${40*sc}" fill="#e2502d" opacity=".85" ${fx==="shrink" ? 'stroke="#a8321a" stroke-dasharray="4 3" stroke-width="3"' : ""}/>`;
    else cell = `<rect x="110" y="55" width="100" height="90" rx="6" fill="none" stroke="#5c8f3a" stroke-width="6"/>` + (fx === "plas" ? `<ellipse cx="160" cy="100" rx="30" ry="26" fill="#9ccc7a"/>` : `<rect x="${116 + (1-sc)*40}" y="${61 + (1-sc)*30}" width="${88*sc}" height="${78*sc}" rx="5" fill="#9ccc7a"/>`);
    pane.querySelector("#ov").innerHTML = `<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#2f80ed"/></marker><marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#e2502d"/></marker></defs>
      <rect width="320" height="200" rx="14" fill="${bg}"/>${cell}${arr(arrowsIn, 1)}${arr(arrowsOut, -1)}
      <text x="50" y="40" text-anchor="middle" font-size="12" fill="#2f80ed">水進入</text><text x="270" y="40" text-anchor="middle" font-size="12" fill="#e2502d">水離開</text>`;
    pane.querySelector("#out").innerHTML = `${r.n}：${r.flow} → ${txt}`;
    seen.add(kind + sol); pane.querySelector("#n").textContent = seen.size; if(seen.size >= 4) simDone(s);
  }

  <div class="simview"><svg viewBox="0 0 220 220" id="cs" style="max-width:240px"></svg><div class="readout" id="co">　</div></div></div>`;
  function draw(){
    pane.querySelector("#lf").innerHTML = [[true,"保留葉片（對照組）"],[false,"摘除葉片（實驗組）"]].map(([k, tx]) => `<button class="chip ${k===leaf?"on":""}" data-l="${k}">${tx}</button>`).join("");
    pane.querySelector("#wd").innerHTML = [[true,"通風有日照"],[false,"陰暗不通風"]].map(([k, tx]) => `<button class="chip ${k===wind?"on":""}" data-w="${k}">${tx}</button>`).join("");
    pane.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { leaf = b.dataset.l === "true"; draw(); });
    pane.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { wind = b.dataset.w === "true"; draw(); });
    const rate = (leaf ? 1 : .15) * (wind ? 1 : .4), drop = rate * t / 15, lvl = 10 - drop;
    const y = v => 190 - v * 15;
    pane.querySelector("#xv").innerHTML = `<rect x="130" y="30" width="60" height="165" rx="6" fill="none" stroke="var(--sub)" stroke-width="3"/>
      <rect x="133" y="${y(lvl)}" width="54" height="${195 - y(lvl) - 3}" fill="#8fd0ec"/>
      ${[2,4,6,8,10].map(v => `<line x1="190" y1="${y(v)}" x2="200" y2="${y(v)}" stroke="var(--sub)"/><text x="204" y="${y(v)+4}" font-size="11" fill="var(--sub)">${v}</text>`).join("")}
      <path d="M160 ${y(lvl)} V10" stroke="#5aa04a" stroke-width="6"/>
      ${leaf ? `<g fill="#4c9a3c"><ellipse cx="140" cy="18" rx="22" ry="10"/><ellipse cx="182" cy="14" rx="22" ry="10"/><ellipse cx="160" cy="6" rx="16" ry="8"/></g>${t > 0 ? `<g fill="#8fd0ec" opacity=".8"><circle cx="118" cy="10" r="3"/><circle cx="205" cy="6" r="3"/><circle cx="110" cy="22" r="2"/></g>` : ""}` : ""}`;
    pane.querySelector("#out").innerHTML = t ? `水位約下降 ${drop.toFixed(1)} 格 — ${leaf ? "葉片多、氣孔多，蒸散多" : "沒有葉片，氣孔少，蒸散少"}${wind ? "" : "；陰暗不通風蒸散較慢"}` : "拉時間軸開始";
    if(t >= 20){ seen.add(String(leaf)); if(seen.size >= 2) simDone(s); }
  }
  pane.querySelector("#tr").oninput = e => { t = +e.target.value; pane.querySelector("#tv").textContent = t; draw(); };
  // 橫切面（環狀排列：外韌皮部、內木質部）
  let red = false;
  function cs(){
    const bundles = Array.from({length:8}, (_, i) => { const a = i / 8 * Math.PI * 2, cx = 110 + Math.cos(a) * 62, cy = 110 + Math.sin(a) * 62;
      return `<g transform="translate(${cx} ${cy}) rotate(${a*180/Math.PI})"><ellipse data-p="韌" cx="10" cy="0" rx="9" ry="12" fill="#f3b184"/><ellipse data-p="木" cx="-6" cy="0" rx="9" ry="12" fill="${red ? "#e23b3b" : "#7fb3e0"}"/></g>`; }).join("");
    pane.querySelector("#cs").innerHTML = `<circle cx="110" cy="110" r="95" fill="#dff0cf" stroke="#7bb35a" stroke-width="4"/>${bundles}<text x="110" y="214" text-anchor="middle" font-size="11" fill="var(--sub)">橘＝韌皮部（外側）　藍＝木質部（內側）</text>`;
    pane.querySelectorAll("#cs [data-p]").forEach(e => { e.style.cursor = "pointer"; e.onclick = () => {
      if(e.dataset.p === "木"){ red = true; cs(); pane.querySelector("#co").innerHTML = "✅ 對！紅色溶液跟著水走<b>木質部</b>（內側），由下往上。"; addXP(2); }
      else pane.querySelector("#co").innerHTML = "❌ 韌皮部運輸的是養分，紅色溶液是跟著水走的，再試試。"; }; });
  }
  draw(); cs();
};

/* ═════ 3-2 血液循環路徑 ═════ */
SIMS.heart = function(pane, s){
  pane.innerHTML = `<div class="card sim"><h2>❤️ 體循環：血液從哪裡出發？</h2><div id="w1"></div></div>

  <div class="simview"><svg viewBox="0 0 320 90" id="hb"></svg><div class="readout" id="ho">　</div></div><p class="note">次數為示意，實際以自己量的為準。</p></div>`;

  orderWidget(pane.querySelector("#w2"), {steps:["右心室", "肺動脈", "肺微血管", "肺靜脈", "左心房"], hint:"肺循環依序點（8～12）。", done:"在肺泡排出二氧化碳、帶回氧氣。"}, fin);
  sortWidget(pane.querySelector("#w3"), {bins:["充氧血（鮮紅）", "缺氧血（暗紅）"], items:[
    {t:"左心房", bin:0}, {t:"左心室", bin:0}, {t:"主動脈", bin:0}, {t:"肺靜脈", bin:0, why:"肺靜脈剛從肺回來，是充氧血！"},
    {t:"右心房", bin:1}, {t:"右心室", bin:1}, {t:"大靜脈", bin:1}, {t:"肺動脈", bin:1, why:"肺動脈把缺氧血送去肺——動脈不一定是充氧血。"}]});
  let timer = null;
  function beat(bpm){
    clearInterval(timer); let on = false;
    const draw = () => { on = !on; pane.querySelector("#hb").innerHTML = `<text x="70" y="62" font-size="${on ? 52 : 40}" text-anchor="middle">❤️</text><text x="210" y="40" font-size="14" fill="var(--ink)">心搏 ${bpm} 次／分</text><text x="210" y="64" font-size="14" fill="var(--ink)">脈搏 ${bpm} 次／分</text>`; };
    draw(); timer = setInterval(() => { if(!document.body.contains(pane)) { clearInterval(timer); return; } draw(); }, 30000 / bpm);
    pane.querySelector("#ho").textContent = bpm > 100 ? "運動後心搏、脈搏都增加，而且兩者仍然相等。" : "安靜時：心搏次數＝脈搏次數。";
  }
  pane.querySelector("#rest").onclick = () => beat(75); pane.querySelector("#run").onclick = () => beat(120);
};

/* ═════ 3-3 三道防線＋疫苗 ═════ */
SIMS.defense = function(pane, s){

    pane.querySelector("#vo").textContent = step === 1 ? "第一次反應：較慢、較弱，但白血球記住了病原體的表面特徵。" : step === 2 ? "第二次反應：更快、更強！這就是疫苗預防疾病的原理。" : "　";

/* ═════ 4-1 反應時間接尺＋神經路徑 ═════ */
SIMS.nerve = function(pane, s){
  pane.innerHTML = `<div class="card sim"><h2>📏 接尺測反應時間</h2><p class="muted" style="margin:0">按「準備」後，尺會在隨機時間掉落，看到就趕快按「接住！」（實驗 4-2）。</p>
  <div class="simview"><svg viewBox="0 0 160 260" id="rv" style="max-width:160px"></svg><div class="readout" id="ro">　</div></div>
  <div class="row"><button class="btn ghost" id="rd">準備</button><button class="btn" id="ct" disabled>✋ 接住！</button></div>
  <p class="muted" id="rh"></p></div>
  <div class="card sim"><h2>⚡ 神經傳導路徑</h2><div class="chips" id="sc"></div><div id="w"></div></div>`;
  let t0 = 0, falling = false, timer = null, raf = null; const rec = [];
  const ruler = (d) => `<rect x="60" y="${10 + d}" width="40" height="220" fill="#ffe8a3" stroke="#c9a23a"/>${Array.from({length:23}, (_, i) => `<line x1="60" y1="${10 + d + i*10}" x2="${i%5?70:78}" y2="${10 + d + i*10}" stroke="#8a6d1a"/>${i%5 ? "" : `<text x="82" y="${14 + d + i*10}" font-size="9" fill="#8a6d1a">${i}</text>`}`).join("")}<rect x="40" y="225" width="80" height="14" rx="7" fill="#f2c4a8"/>`;
  pane.querySelector("#rv").innerHTML = ruler(0);
  pane.querySelector("#rd").onclick = () => {
    clearTimeout(timer); cancelAnimationFrame(raf); pane.querySelector("#rv").innerHTML = ruler(0); pane.querySelector("#ro").textContent = "盯著尺……";
    pane.querySelector("#ct").disabled = false; falling = false;
    timer = setTimeout(() => { falling = true; t0 = performance.now(); const fall = () => { if(!falling) return; const t = (performance.now() - t0) / 1000, d = 0.5 * 9.8 * t * t * 1000; pane.querySelector("#rv").innerHTML = ruler(Math.min(d, 230)); if(d < 230) raf = requestAnimationFrame(fall); else { falling = false; pane.querySelector("#ro").textContent = "尺掉下去了！再試一次。"; pane.querySelector("#ct").disabled = true; } }; fall(); }, 1200 + Math.random() * 2500);
  };
  pane.querySelector("#ct").onclick = () => {
    if(!falling){ clearTimeout(timer); pane.querySelector("#ro").textContent = "太早了！尺還沒掉，要「看到」才接。"; pane.querySelector("#ct").disabled = true; return; }
    falling = false; cancelAnimationFrame(raf); pane.querySelector("#ct").disabled = true;
    const t = (performance.now() - t0) / 1000, cm = 0.5 * 9.8 * t * t * 100;
    rec.push(t); pane.querySelector("#ro").textContent = `接在約 ${cm.toFixed(1)} 公分處，反應時間約 ${t.toFixed(2)} 秒`;
    pane.querySelector("#rh").textContent = `已測 ${rec.length} 次，平均 ${(rec.reduce((a, b) => a + b, 0) / rec.length).toFixed(2)} 秒。接尺是意識反應，多練習可以縮短！`;
    addXP(1); if(rec.length >= 3) simDone(s);
  };
  const SC = {
    wave:{n:"看到同學揮手打招呼（意識）", steps:["眼睛的受器", "感覺神經元", "大腦", "脊髓", "運動神經元", "手的肌肉"]},
    hot:{n:"手摸到熱茶壺立刻縮回（反射）", steps:["手皮膚的受器", "感覺神經元", "脊髓", "運動神經元", "手的肌肉"], done:"反射不經過大腦，路徑短、反應快。"},
    ruler:{n:"看到尺掉落去接（意識）", steps:["眼睛的受器", "感覺神經元", "大腦", "脊髓", "運動神經元", "手的肌肉"]},
  };
  let cur = "wave";
  function sc(){
    pane.querySelector("#sc").innerHTML = Object.entries(SC).map(([k, v]) => `<button class="chip ${k===cur?"on":""}" data-k="${k}">${v.n}</button>`).join("");
    pane.querySelectorAll("#sc [data-k]").forEach(b => b.onclick = () => { cur = b.dataset.k; sc(); });
    orderWidget(pane.querySelector("#w"), {steps:SC[cur].steps, hint:"刺激之後，訊息依序經過哪裡？", done:SC[cur].done || "意識反應一定經過大腦。"});
  }
  sc();
};

/* ═════ 4-3 植物向性＋含羞草 ═════ */
SIMS.tropism = function(pane, s){
  let light = "right", pos = "up", day = 0; const seen = new Set();
  pane.innerHTML = `<div class="card sim"><h2>🌱 幼苗怎麼長？</h2>
  <label>擺放方式</label><div class="chips" id="ps"></div><label id="ll">光從哪裡來</label><div class="chips" id="lt"></div>
  <label>經過：第 <span id="dv">0</span> 天</label><input type="range" min="0" max="5" value="0" id="dr" aria-label="天數">
  <div class="simview"><svg viewBox="0 0 320 220" id="tv"></svg><div class="readout" id="to">　</div></div></div>
  <div class="card sim"><h2>🌿 碰碰含羞草</h2><p class="muted" style="margin:0">點葉子看看（觸發運動，和膨壓變化有關）。</p><div class="simview"><svg viewBox="0 0 320 120" id="mv"></svg><div class="readout" id="mo">　</div></div></div>`;
  function draw(){
    pane.querySelector("#ps").innerHTML = [["up","直立"],["side","橫放（在暗處）"]].map(([k, t]) => `<button class="chip ${k===pos?"on":""}" data-p="${k}">${t}</button>`).join("");
    pane.querySelector("#lt").innerHTML = pos === "up" ? [["left","⬅ 左邊"],["top","⬆ 上方"],["right","➡ 右邊"]].map(([k, t]) => `<button class="chip ${k===light?"on":""}" data-l="${k}">${t}</button>`).join("") : "<span class='muted'>暗處沒有光，只看地球引力的影響</span>";
    pane.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { pos = b.dataset.p; day = 0; pane.querySelector("#dr").value = 0; draw(); });
    pane.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { light = b.dataset.l; day = 0; pane.querySelector("#dr").value = 0; draw(); });
    pane.querySelector("#dv").textContent = day;
    const k = day / 5, gx = 160, gy = 150;
    let stem, root, sun = "", msg;
    if(pos === "up"){
      const bend = light === "left" ? -1 : light === "right" ? 1 : 0;
      stem = `M${gx} ${gy} Q${gx} ${gy-50} ${gx + bend*55*k} ${gy - 30 - 70*(.4+.6*k)}`;
      root = `M${gx} ${gy} Q${gx - bend*6*k} ${gy+30} ${gx - bend*14*k} ${gy + 55}`;
      sun = `<text x="${light==="left" ? 20 : light==="right" ? 280 : 160}" y="${light==="top" ? 30 : 60}" font-size="30" text-anchor="middle">☀️</text>`;
      msg = day ? (bend ? `莖彎向${light === "left" ? "左" : "右"}邊的光源（<b>向光性</b>）；根往下長（向地性），也背離光（負向光性）。` : "光從正上方來，莖直直往上長。") : "拉天數看看";
    } else {
      stem = `M${gx} ${gy-40} Q${gx + 50} ${gy - 40} ${gx + 60} ${gy - 40 - 60*k}`;
      root = `M${gx} ${gy-40} Q${gx - 40} ${gy - 40} ${gx - 50} ${gy - 40 + 60*k}`;
      msg = day ? "橫放後：莖頂端往上彎（<b>負向地性</b>），根尖往下彎（<b>向地性</b>）。" : "拉天數看看";
    }
    pane.querySelector("#tv").innerHTML = `<rect x="0" y="150" width="320" height="70" fill="#d8c3a5"/>${sun}<path d="${root}" stroke="#c7a46b" stroke-width="5" fill="none"/><path d="${stem}" stroke="#3c9a4a" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="${pos === "up" ? gx : gx}" cy="${pos === "up" ? gy : gy - 40}" r="7" fill="#8b6b3a"/>`;
    pane.querySelector("#to").innerHTML = msg + `<div class="muted" style="font-weight:400">向性要一段時間才看得出來。</div>`;
    if(day >= 4){ seen.add(pos + light); if(seen.size >= 3) simDone(s); }
  }
  pane.querySelector("#dr").oninput = e => { day = +e.target.value; draw(); };
  // 含羞草
  let closed = false, tm = null;
  function mim(){
    pane.querySelector("#mv").innerHTML = `<path d="M20 100 Q160 ${closed ? 112 : 60} 300 ${closed ? 112 : 70}" stroke="#5a8f3a" stroke-width="4" fill="none"/>` + Array.from({length:12}, (_, i) => { const x = 40 + i * 22, y = closed ? 100 + i*0.9 : 72 - Math.sin(i/11*Math.PI)*12; return closed ? `<path d="M${x} ${y} l6 -3 l6 3" stroke="#3c9a4a" stroke-width="3" fill="none"/>` : `<ellipse cx="${x}" cy="${y-9}" rx="5" ry="10" fill="#3c9a4a"/><ellipse cx="${x}" cy="${y+9}" rx="5" ry="10" fill="#3c9a4a"/>`; }).join("");
    pane.querySelector("#mo").textContent = closed ? "小葉迅速閉合、葉柄下垂！過一會兒會再打開。" : "　";
  }
  pane.querySelector("#mv").onclick = () => { closed = true; mim(); addXP(1); clearTimeout(tm); tm = setTimeout(() => { closed = false; if(document.body.contains(pane)) mim(); }, 4000); };
  draw(); mim();
};

/* ═════ 5-1 呼吸模型＋氣體檢測 ═════ */
SIMS.breath = function(pane, s){
  let pull = 0; const seen = new Set();
  pane.innerHTML = `<div class="card sim"><h2>🫁 呼吸模型</h2><p class="muted" style="margin:0">寶特瓶＝胸腔、瓶內氣球＝肺、底部氣球＝橫膈（課本 p.164）。</p>
  <label>拉動底部氣球（橫膈）</label><input type="range" min="-10" max="10" value="0" id="pr" aria-label="橫膈">
  <div class="simview"><svg viewBox="0 0 220 240" id="bv" style="max-width:240px"></svg><div class="readout" id="bo">　</div></div></div>
  <div class="card sim"><h2>🧪 呼出的氣體有什麼？</h2><p class="muted" style="margin:0">實驗 5-1。選一個檢測做做看。</p><div class="chips" id="tc"></div>
  <div class="simview"><div id="tt"></div><div class="readout" id="to">　</div></div></div>`;
  function draw(){
    const k = pull / 10; // 正＝往下拉（吸氣）
    const lung = 30 + 18 * k;
    pane.querySelector("#bv").innerHTML = `<path d="M70 20 h80 v20 q30 20 30 60 v${110} h-140 v-110 q0 -40 30 -60z" fill="#eef6ff" stroke="var(--sub)" stroke-width="3"/>
      <line x1="110" y1="10" x2="110" y2="75" stroke="var(--sub)" stroke-width="5"/>
      <ellipse cx="110" cy="${100 + 10*k}" rx="${lung}" ry="${lung + 6}" fill="#f4a3b4" stroke="#d26a83" stroke-width="2"/>
      <path d="M40 ${210} Q110 ${210 + 30*k} 180 ${210}" fill="#a7d88a" stroke="#5c8f3a" stroke-width="3"/>
      <text x="110" y="${225 + 20*Math.max(0,k)}" text-anchor="middle" font-size="12" fill="var(--sub)">${k > 0 ? "⬇ 往下拉" : k < 0 ? "⬆ 往上推" : ""}</text>`;
    pane.querySelector("#bo").innerHTML = k > .3 ? "橫膈下降 → 胸腔變大 → 肺變大，空氣進入＝<b>吸氣</b>" : k < -.3 ? "橫膈上升 → 胸腔變小 → 肺變小，空氣排出＝<b>呼氣</b>" : "拉一拉、推一推看看";
    if(k > .5) seen.add("in"); if(k < -.5) seen.add("out"); if(seen.size >= 2) simDone(s);
  }
  pane.querySelector("#pr").oninput = e => { pull = +e.target.value; draw(); };
  const T = {
    blow:{n:"對 A 管石灰水吹氣", a:"#f3f3f3", b:"#ffffff", r:"A 管（吹氣）變混濁，B 管（靜置、對照組）仍澄清 → 呼出的氣體含二氧化碳。"},
    paper:{n:"藍色氯化亞鈷試紙放鼻孔前", r:"試紙由藍色變粉紅色 → 呼出的氣體含水氣。"},
    bean:{n:"萌芽綠豆 vs 乾燥綠豆", a:"#f3f3f3", b:"#ffffff", r:"萌芽綠豆那管石灰水變混濁，乾燥綠豆（對照組）不變 → 萌芽綠豆行呼吸作用排出二氧化碳。"},
  };
  let cur = null;
  function tc(){
    pane.querySelector("#tc").innerHTML = Object.entries(T).map(([k, v]) => `<button class="chip ${k===cur?"on":""}" data-k="${k}">${v.n}</button>`).join("");
    pane.querySelectorAll("#tc [data-k]").forEach(b => b.onclick = () => { cur = b.dataset.k; tc(); run(); });
  }
  function run(){
    const t = T[cur];
    if(cur === "paper"){
      pane.querySelector("#tt").innerHTML = `<svg viewBox="0 0 200 80" style="max-width:220px"><rect id="pp" x="70" y="20" width="60" height="40" rx="4" fill="#3d6fd6" style="transition:fill 1.2s"/></svg>`;
      setTimeout(() => { const p = pane.querySelector("#pp"); if(p) p.setAttribute("fill", "#f4a3c4"); }, 300);
    } else {
      pane.querySelector("#tt").innerHTML = `<div class="row" style="justify-content:center">${tubeSVG("#f8fbff", cur === "blow" ? "A 吹氣" : "C 萌芽", {level:90})}${tubeSVG("#f8fbff", cur === "blow" ? "B 靜置" : "D 乾燥", {level:90})}</div>`;
      setTimeout(() => { const tb = pane.querySelectorAll("#tt .tube"); if(tb[0]) tb[0].setAttribute("fill", "#d9d6cf"); }, 400);
    }
    pane.querySelector("#to").textContent = t.r + (cur === "blow" ? "" : "");
    addXP(1);
  }
  draw(); tc();
};

/* ═════ 5-2 血糖平衡遊戲 ═════ */
SIMS.sugar = function(pane, s){
  let g = 90, hist = [90], okN = 0, wait = null;
  pane.innerHTML = `<div class="card sim"><h2>🍬 當胰臟的指揮官</h2><p class="muted" style="margin:0">發生事件後血糖會變化，你來決定胰島要分泌什麼，讓血糖回到 90 附近（課本圖 5-7、5-8）。</p>
  <div class="simview"><svg viewBox="0 0 320 150" id="sv"></svg><div class="readout" id="so">血糖 90 毫克／100 毫升</div></div>
  <label>發生了什麼事？</label><div class="row"><button class="btn ghost" data-e="eat">🍚 吃一大碗飯</button><button class="btn ghost" data-e="hungry">🏃 好久沒吃又一直活動</button><button class="btn ghost" data-e="scare">😱 被狗追</button></div>
  <label>胰島要分泌：</label><div class="row"><button class="btn" data-h="ins">胰島素</button><button class="btn" data-h="glu">升糖素</button></div>
  <div id="sfb"></div><p class="muted">成功穩住 <b id="n">0</b> 次（3 次完成）</p></div>`;
  function draw(){
    const y = v => 140 - (v - 40) * 1.1;
    const pts = hist.slice(-12).map((v, i) => `${20 + i * 26},${y(v)}`).join(" ");
    pane.querySelector("#sv").innerHTML = `<line x1="15" y1="${y(90)}" x2="315" y2="${y(90)}" stroke="var(--gold)" stroke-dasharray="5 4"/><text x="300" y="${y(90)-4}" font-size="11" fill="var(--sub)" text-anchor="end">90 平均值</text><polyline points="${pts}" fill="none" stroke="#e84393" stroke-width="3"/>`;
    pane.querySelector("#so").textContent = `血糖 ${Math.round(g)} 毫克／100 毫升${g > 120 ? "（偏高）" : g < 70 ? "（偏低，覺得餓）" : ""}`;
  }
  const push = v => { g = v; hist.push(v); draw(); };
  pane.querySelectorAll("[data-e]").forEach(b => b.onclick = () => {
    const e = b.dataset.e;
    if(e === "eat"){ push(150); wait = "ins"; pane.querySelector("#sfb").innerHTML = "<div class='ex'>飯後醣類消化吸收，血糖升高了！</div>"; }
    if(e === "hungry"){ push(60); wait = "glu"; pane.querySelector("#sfb").innerHTML = "<div class='ex'>細胞呼吸作用一直消耗葡萄糖，血糖降低，腦覺得餓。</div>"; }
    if(e === "scare"){ push(130); wait = "scare"; pane.querySelector("#sfb").innerHTML = "<div class='ex'>腎上腺素分泌，肝糖分解，血糖上升、心跳加快，準備逃跑！危險過後血糖會下降。</div>"; setTimeout(() => { if(!document.body.contains(pane)) return; push(95); wait = null; }, 2500); }
  });
  pane.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    const h = b.dataset.h, fb = pane.querySelector("#sfb");
    if(!wait || wait === "scare"){ fb.innerHTML = "<div class='muted'>先選一個事件。</div>"; return; }
    if(h === wait){ push(h === "ins" ? 110 : 80); setTimeout(() => { if(document.body.contains(pane)) push(90); }, 600); okN++; pane.querySelector("#n").textContent = okN; addXP(2);
      fb.innerHTML = `<div class='ex'>✅ ${h === "ins" ? "胰島素讓細胞多利用葡萄糖、肝臟把葡萄糖存成肝糖，血糖下降。" : "升糖素讓肝臟把肝糖分解成葡萄糖，血糖上升。"}</div>`; wait = null; if(okN >= 3) simDone(s); }
    else { push(h === "ins" ? g - 20 : g + 20); fb.innerHTML = `<div class='warn'>❌ 血糖${g > 90 ? "已經太高" : "已經太低"}，${h === "ins" ? "胰島素會讓它更低" : "升糖素會讓它更高"}！</div>`; }
  });
  draw();
};

/* ═════ 5-3 水分恆定＋尿液路徑 ═════ */
SIMS.water = function(pane, s){
  let w = 50; const seen = new Set();
  pane.innerHTML = `<div class="card sim"><h2>💦 身體的水分調節</h2><p class="muted" style="margin:0">課本圖 5-11。</p>
  <div class="row"><button class="btn ghost" data-a="drink">🥤 一口氣喝很多水</button><button class="btn ghost" data-a="sweat">🏃 大量流汗</button><button class="btn ghost" data-a="reset">恢復</button></div>
  <div class="simview"><svg viewBox="0 0 320 120" id="wv"></svg><div class="readout" id="wo">　</div></div></div>
  <div class="card sim"><h2>🚽 尿液的旅程</h2><div id="w1"></div></div>
  <div class="card sim"><h2>☣️ 誰排出哪種含氮廢物？</h2><div id="w2"></div></div>`;
  function draw(){
    const conc = 100 - w; // 血液濃度
    pane.querySelector("#wv").innerHTML = `<text x="10" y="30" font-size="13" fill="var(--ink)">血液中的水分</text><rect x="120" y="16" width="190" height="18" rx="9" fill="var(--line)"/><rect x="120" y="16" width="${w*1.9}" height="18" rx="9" fill="#8fd0ec"/>
      <text x="10" y="70" font-size="13" fill="var(--ink)">腎臟製造尿液</text><rect x="120" y="56" width="190" height="18" rx="9" fill="var(--line)"/><rect x="120" y="56" width="${Math.max(10, (w-20)*2.6)}" height="18" rx="9" fill="#f2d16b"/>
      <text x="10" y="108" font-size="13" fill="var(--ink)">感覺</text><text x="120" y="108" font-size="15" fill="var(--ink)">${w < 40 ? "😫 好渴！想喝水" : w > 60 ? "🚻 有尿意，想上廁所" : "🙂 剛剛好"}</text>`;
    pane.querySelector("#wo").textContent = w < 40 ? `血液濃度高（水太少）→ 腦發出訊息 → 腎臟製造較少尿液、排尿減少，並感到口渴。` : w > 60 ? `血液濃度低（水太多）→ 腦發出訊息 → 腎臟製造較多尿液、排尿增加。` : "喝水和排尿是調節水分的主要機制。";
  }
  pane.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const a = b.dataset.a; w = a === "drink" ? 80 : a === "sweat" ? 22 : 50; if(a !== "reset") seen.add(a); draw(); if(seen.size >= 2) simDone(s); });
  orderWidget(pane.querySelector("#w1"), {steps:["肝臟：氨→尿素", "腎臟：過濾形成尿液", "輸尿管", "膀胱", "尿道"], hint:"含氮廢物從產生到排出，依序點。", done:"肝臟不屬於泌尿系統，但尿素是它做的。"});
  sortWidget(pane.querySelector("#w2"), {bins:["氨（毒性最高）", "尿素（較弱）", "尿酸（最弱）"], items:[
    {t:"小丑魚", bin:0}, {t:"變形蟲", bin:0}, {t:"人", bin:1}, {t:"犀牛", bin:1, why:"哺乳類排尿素。"}, {t:"鳥", bin:2, why:"尿酸混在糞便中排出。"}, {t:"蠶（昆蟲）", bin:2}]});
  draw();
};

/* ═════ 5-4 體溫調節 ═════ */
SIMS.temp = function(pane, s){
  let T = 25; const seen = new Set();
  pane.innerHTML = `<div class="card sim"><h2>🌡️ 天氣變了，身體怎麼辦？</h2><label>環境溫度：<span id="tv">25</span>℃</label><input type="range" min="0" max="40" value="25" id="tr" aria-label="環境溫度">
  <div class="simview"><svg viewBox="0 0 320 170" id="tsv"></svg><div class="readout" id="to">　</div></div></div>
  <div class="card sim"><h2>🦎 外溫還是內溫？</h2><div id="w"></div></div>`;
  function draw(){
    pane.querySelector("#tv").textContent = T;
    const cold = T < 15, hot = T > 30;
    const vessel = cold ? 3 : hot ? 10 : 6;
    pane.querySelector("#tsv").innerHTML = `<text x="80" y="95" font-size="70" text-anchor="middle">${cold ? "🥶" : hot ? "🥵" : "🙂"}</text>
      <text x="170" y="34" font-size="13" fill="var(--ink)">皮膚血管</text><line x1="250" y1="30" x2="310" y2="30" stroke="#e2502d" stroke-width="${vessel}" stroke-linecap="round"/>
      <text x="170" y="70" font-size="13" fill="var(--ink)">排汗</text><text x="250" y="70" font-size="16">${hot ? "💧💧💧" : cold ? "—" : "💧"}</text>
      <text x="170" y="106" font-size="13" fill="var(--ink)">肌肉</text><text x="250" y="106" font-size="14" fill="var(--ink)">${cold ? "顫抖！" : hot ? "活動減少" : "正常"}</text>
      <text x="170" y="142" font-size="13" fill="var(--ink)">食慾</text><text x="250" y="142" font-size="14" fill="var(--ink)">${cold ? "增加" : hot ? "減退" : "正常"}</text>`;
    pane.querySelector("#to").textContent = cold ? "太冷：血管收縮減少散熱；發抖、食慾增加以增加產熱。" : hot ? "太熱：血管舒張、流汗增加散熱；食慾減退、活動減少以減少產熱。" : "腦內的體溫中樞讓體溫維持在一定範圍。";
    if(cold) seen.add("c"); if(hot) seen.add("h"); if(seen.size >= 2) simDone(s);
  }
  pane.querySelector("#tr").oninput = e => { T = +e.target.value; draw(); };
  sortWidget(pane.querySelector("#w"), {bins:["外溫動物", "內溫動物"], items:[
    {t:"蜥蜴曬太陽", bin:0}, {t:"蝴蝶", bin:0}, {t:"企鵝（羽毛＋皮下脂肪）", bin:1}, {t:"狗伸舌頭散熱", bin:1}, {t:"沙漠跳鼠（長耳朵）", bin:1}, {t:"人", bin:1}]}, () => { if(seen.size >= 2) simDone(s); else toast("也把溫度拉到很冷和很熱看看"); });
  draw();
};

applyTeach(); drawXP(); render();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
setInterval(flush, 60000); flush();
</script>
