量；呼吸運動只是讓氣體進出肺部，不產生能量。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["生物行呼吸作用的主要目的是吸入氧氣、排出二氧化碳", "生物行呼吸運動可以產生能量", "人體血液中氧氣不足時，會刺激腦幹，加快呼吸運動", "動物、植物行呼吸作用所產生的氣體皆相同"], "ans": 3, "ch": "5"}, {"id": "s112_3_q20", "src": "school", "sec": "5-1", "concept": "呼吸運動", "q": "附表為人體呼吸運動中吸氣和呼氣的比較表格，哪一個比較項目正確？", "ex": "呼氣時橫膈舒張上升、肋骨下降、胸腔和肺縮小；吸氣時橫膈收縮下降、肋骨上舉、胸腔和肺擴大。表中只有橫膈那一列正確。", "fig": "fig/s112_3_q20.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["肺：呼氣 脹大／吸氣 縮小", "胸腔：呼氣 擴大／吸氣 縮小", "肋骨：呼氣 上舉／吸氣 下降", "橫膈：呼氣 舒張上升／吸氣 收縮下降"], "ans": 3, "ch": "5"}, {"id": "s112_3_q21", "src": "school", "sec": "5-1", "concept": "呼吸模型", "q": "呼吸模型如附圖所示。關於此模型與人類呼吸運動的關聯，下列敘述何者錯誤？", "ex": "手把橡皮膜（戊，代表橫膈）往下拉，瓶內空間變大，氣球（丙，代表肺）脹大，模擬的是「吸氣」，所以(B)錯。", "fig": "fig/s112_3_q21.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丙代表肺，戊代表橫膈", "此時手下拉的動作是模擬著人體的呼氣", "將丁挖個洞，丙就不能隨戊的上下而脹縮", "此模型說明了人的肺是被動跟著胸腔大小而脹縮"], "ans": 1, "ch": "5"}, {"id": "s112_3_q22", "src": "school", "sec": "5-1", "concept": "呼吸頻率調節", "q": "小鍬在參加馬拉松路跑時，呼吸頻率增加而顯得氣喘吁吁。下列何者是產生此現象的原因？", "ex": "運動時細胞呼吸作用旺盛，血液中二氧化碳濃度增加，刺激腦幹使呼吸頻率增加。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血液中一氧化碳濃度降低，刺激大腦增加呼吸頻率", "血液中二氧化碳濃度增加，刺激腦幹增加呼吸頻率", "血液中氮氣濃度增加，刺激大腦增加呼吸頻率", "血液中氧氣濃度降低，刺激腦幹增加呼吸頻率"], "ans": 1, "ch": "5"}, {"id": "s112_3_q23", "src": "school", "sec": "5-1", "concept": "石灰水檢測", "q": "阿昇做「探測人體呼出的氣體成分」實驗時，試管中裝入澄清石灰水，在阿昇吹氣進去後，石灰水變混濁，請問是何種成分造成石灰水混濁？", "ex": "二氧化碳會使澄清石灰水變混濁，所以吹氣後石灰水變混濁，是呼出的氣體中含有二氧化碳。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["氧氣", "水氣", "二氧化碳", "氮氣"], "ans": 2, "ch": "5"}, {"id": "s112_3_q24", "src": "school", "sec": "5-1", "concept": "種子呼吸作用", "q": "將萌芽綠豆放於錐形瓶中，如右圖，倒入100mL 清水，發現澄清石灰水會變混濁，試回答下列問題由此實驗可知種子發芽時，何種作用最為旺盛，並且會產生大量的何種氣體？", "ex": "萌芽的綠豆生長旺盛，呼吸作用最旺盛，產生大量二氧化碳。倒入清水把瓶內氣體擠出，石灰水就變混濁。", "fig": "fig/s112_3_q24.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["光合作用、氧氣", "光合作用、二氧化碳", "蒸散作用、水氣", "呼吸作用、二氧化碳"], "ans": 3, "ch": "5"}, {"id": "s112_3_q25", "src": "school", "sec": "5-2", "concept": "飢餓感", "q": "以下何者為人體引發飢餓感的直接原因？", "ex": "血糖濃度太低時，會刺激腦部產生飢餓感，提醒我們進食。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血糖濃度太低", "細胞中缺少葡萄糖", "肝臟中肝糖太少", "腸胃中食物太少"], "ans": 0, "ch": "5"}, {"id": "s112_3_q26", "src": "school", "sec": "5-2", "concept": "血糖調節途徑", "q": "附圖為人體血糖增減的相關路徑示意圖，下列敘述何者錯誤？", "ex": "腎上腺素會促使肝糖分解成葡萄糖（乙路徑）來提高血糖，不是經由丁路徑（從小腸吸收），所以(D)錯。甲、丙是胰島素降血糖的路徑，乙是升糖素升血糖的路徑。", "fig": "fig/s112_3_q26.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["胰島素可促進甲路徑，降低血糖濃度", "升糖素可促進乙路徑，增加血糖濃度", "胰島素可促進丙路徑，降低血糖濃度", "腎上腺分泌腎上腺素後，會由丁路徑增加血糖濃度"], "ans": 3, "ch": "5"}, {"id": "s112_3_q27", "src": "school", "sec": "5-3", "concept": "排泄作用", "q": "下列哪一現象是排泄作用？", "ex": "排泄是把代謝產生的廢物排出體外，例如把尿素形成尿液排出。蛋白質氧化產生氨、葡萄糖氧化產生二氧化碳是代謝過程，脂肪分解是消化。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["將蛋白質氧化產生氨", "將尿素形成尿液後排出體外", "將葡萄糖氧化產生二氧化碳和能量", "將脂肪分解成脂肪酸"], "ans": 1, "ch": "5"}, {"id": "s112_3_q28", "src": "school", "sec": "5-3", "concept": "含氮廢物", "q": "生物代謝蛋白質會產生廢物。關於這些廢物及其處理方式，以下敘述何者錯誤？", "ex": "淡水魚是由鰓把氨直接排到水中，不是排尿液，所以(C)錯。昆蟲排尿酸、單細胞生物擴散排氨；毒性是氨＞尿素＞尿酸。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["昆蟲產生尿酸混在糞便中排出", "單細胞生物藉擴散作用將氨直接排除", "淡水魚透過鰓將尿液排至水中", "氨的毒性最大，尿素次之，尿酸最小"], "ans": 2, "ch": "5"}, {"id": "s112_3_q29", "src": "school", "sec": "5-3", "concept": "含氮廢物轉換", "q": "附圖為X 物質在人體內的代謝過程示意圖，下列相關敘述何者正確？", "ex": "X 物質在細胞代謝後產生含氮廢物 A，也就是氨；氨在肝臟轉成尿素（B），再到腎臟形成尿液（C）。會產生含氮廢物的 X 是蛋白質（胺基酸），不是脂肪酸。", "fig": "fig/s112_3_q29.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["A 是氨", "B 是尿液", "C 是尿酸", "X 物質是脂肪酸"], "ans": 0, "ch": "5"}, {"id": "s112_3_q30", "src": "school", "sec": "5-3", "concept": "尿素濃度變化", "q": "附圖為人體心臟、肝臟和腎臟之間血液循環的示意圖，箭頭代表血液流動的方向，甲、乙、丙及丁分別代表不同的血管。根據此圖的血液流動方向，分別比較甲和乙、丙和丁血液中的尿素濃度，下列何者最合理？", "ex": "肝臟會把氨轉成尿素，所以離開肝臟的血管尿素比較多（甲＞乙）；腎臟會把尿素濾出形成尿液，所以離開腎臟的血管尿素比較少（丙＜丁）。", "fig": "fig/s112_3_q30.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲＜乙，丙＜丁", "甲＞乙，丙＜丁", "甲＜乙，丙＞丁", "甲＞乙，丙＞丁"], "ans": 1, "ch": "5"}, {"id": "s112_3_q31", "src": "school", "sec": "5-3", "concept": "泌尿系統", "q": "已知人類形成尿液排出體外的路徑是腎臟→輸尿管→膀胱→尿道，則附圖中各器官與代號的配對，何者正確？", "ex": "尿液路徑是腎臟→輸尿管→膀胱→尿道。圖中丙是腎臟、丁是輸尿管、戊是膀胱、己是尿道，所以(C)正確。", "fig": "fig/s112_3_q31.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["乙是腎臟", "丁是尿道", "戊是膀胱", "己是輸尿管"], "ans": 2, "ch": "5"}, {"id": "s112_3_q32", "src": "school", "sec": "5-4", "concept": "體溫調節", "q": "附圖為人體的體溫調節示意圖，下列敘述何者正確？", "ex": "天氣炎熱時，皮膚血管舒張（丙）、排汗增加、食慾減退來增加散熱、減少產熱；天氣寒冷時，皮膚血管收縮、肌肉顫抖、食慾增加。", "fig": "fig/s112_3_q32.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丙為皮膚血管舒張", "乙為汗腺排汗增加", "甲為食慾減退", "丁為肌肉顫抖"], "ans": 0, "ch": "5"}, {"id": "s112_3_q33", "src": "school", "sec": "5-4", "concept": "外溫動物體溫調節", "q": "請問有幾項是鱷魚會表現的體溫調節行為？(甲)在寒冬的太陽下張開大嘴獲取熱能；(乙)冬天時鱗片下方的血管收縮減少熱的流失；(丙)夏天時，躲在清涼的水中；(丁)夏天時，減少食慾，減少熱量的產生。", "ex": "鱷魚是外溫動物，沒有體溫調節中樞，只能靠行為調節體溫，例如晒太陽取暖（甲）、躲進水中降溫（丙）。血管收縮、減少食慾是內溫動物的生理調節。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙", "乙丙", "乙丁", "甲丙"], "ans": 3, "ch": "5"}, {"id": "s112_3_q34", "src": "school", "sec": "5-4", "concept": "散熱方式", "q": "(甲)排汗；(乙)呼氣；(丙)皮膚血管收縮；(丁)排尿；(戊)排便；(己)顫抖；請問有幾項生理活動會使體熱散失？", "ex": "排汗、呼氣、排尿、排便都會把熱量帶出體外，共 4 項。皮膚血管收縮會減少散熱，顫抖是產熱。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["2", "3", "4", "5"], "ans": 2, "ch": "5"}, {"id": "s112_3_q35", "src": "school", "sec": "5-4", "concept": "內溫動物", "q": "(甲)臺灣藍鵲；(乙)大絹斑蝶；(丙)瓶鼻海豚；(丁)食蛇龜；(戊)櫻花鉤吻鮭。上述生物中，若以「是否具有體溫調節中樞」分成兩類，其分類結果為何？", "ex": "鳥類（臺灣藍鵲）和哺乳類（瓶鼻海豚）是內溫動物，有體溫調節中樞；蝴蝶、烏龜、魚是外溫動物。所以分成甲、丙和乙、丁、戊。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲和乙、丙、丁、戊", "甲、丙和乙、丁、戊", "甲、丁和乙、丙、戊", "甲、丙、戊和乙、丁"], "ans": 1, "ch": "5"}, {"id": "s112_3_q36", "src": "school", "sec": "5-4", "concept": "內溫與外溫動物", "q": "附圖是甲、乙兩種動物的「環境溫度與體溫變化」曲線圖，根據圖中資訊，下列哪個選項較為合理？", "ex": "甲的體溫不隨環境改變，是內溫動物，寒冷時皮膚血管收縮減少散熱。乙的體溫隨環境改變，是外溫動物，不會用肌肉顫抖維持體溫。", "fig": "fig/s112_3_q36.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["環境溫度15℃時，乙動物會藉由肌肉顫抖來維持體溫", "環境溫度40℃時，乙動物會藉由晒太陽來增加散熱", "環境溫度40℃時，甲動物可藉增加進食以維持體溫", "環境溫度10℃時，甲動物的血管會收縮來減少熱的散失"], "ans": 3, "ch": "5"}, {"id": "s112_3_q42", "src": "school", "sec": "5-2", "concept": "飯後血糖上升", "q": "甲→乙階段血糖濃度上升的原因為何？", "ex": "中午吃完午餐後，食物中的醣類被消化成葡萄糖，由小腸吸收進入血液，所以甲→乙階段血糖上升。", "fig": "fig/s112_3_q42.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖是瑞凡早上11:00 到下午19:00 這段時間體內血糖濃度的變化情形，他在中午12:00 吃午餐，下午16:30 開始和一群好友進行籃球比賽，依據附圖回答下列問題", "opts": ["食物中的醣類進入血液", "升糖素發揮作用", "腎上腺素發揮作用", "食物中的蛋白質進入血液"], "ans": 0, "ch": "5"}, {"id": "s112_3_q43", "src": "school", "sec": "5-2", "concept": "胰島素降血糖", "q": "乙→丙階段血糖濃度下降的原因為何？", "ex": "血糖升高後胰島素分泌增加，促使血糖進入細胞被利用或轉成肝糖儲存，所以乙→丙階段血糖下降。", "fig": "fig/s112_3_q42.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖是瑞凡早上11:00 到下午19:00 這段時間體內血糖濃度的變化情形，他在中午12:00 吃午餐，下午16:30 開始和一群好友進行籃球比賽，依據附圖回答下列問題", "opts": ["細胞中的肝糖轉變為血糖", "腎上腺素促使血糖儲藏在肝臟中", "血糖進入細胞，被細胞利用或儲存", "血糖隨尿液排出"], "ans": 2, "ch": "5"}, {"id": "s113_3_q20", "src": "school", "sec": "5-1", "concept": "恆定性", "q": "小明和家人們一起討論人體的恆定性，有關他們的討論內容，下列何者錯誤？", "ex": "人體要維持恆定的是血液中的氣體濃度、水分、血糖、體溫等，睡覺時數每天可以不同，不是恆定性的項目，所以(B)錯。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["爸爸：人體血液中氣體濃度必須維持恆定", "妹妹：人體每天睡覺的時數必須維持恆定", "小明：人體的水分含量必須維持恆定", "媽媽：人體的血糖必須維持恆定"], "ans": 1, "ch": "5"}, {"id": "s113_3_q21", "src": "school", "sec": "5-1", "concept": "呼吸作用", "q": "人體在何處進行呼吸作用？主要目的為何？", "ex": "呼吸作用在細胞內的粒線體進行，主要目的是分解養分產生能量。肺泡只是氣體交換的地方。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["在粒線體進行，目的是產生能量", "在肺泡進行，目的是產生能量", "在肺泡進行，目的是獲取氧氣及排出二氧化碳", "在粒線體進行，目的是獲取氧氣及排出二氧化碳。"], "ans": 0, "ch": "5"}, {"id": "s113_3_q22", "src": "school", "sec": "5-1", "concept": "呼吸道順序", "q": "人體呼吸系統有以下構造：(甲)鼻腔；(乙)咽；(丙)氣管；(丁)支氣管；(戊)肺；(己)喉。請問空氣由外進入人體內的通道順序，何者最為完整正確？", "ex": "空氣進入人體的路徑是：鼻腔（甲）→咽（乙）→喉（己）→氣管（丙）→支氣管（丁）→肺（戊）。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲己乙丙丁戊", "甲乙丁丙戊", "甲乙丙丁戊", "甲乙己丙丁戊。"], "ans": 3, "ch": "5"}, {"id": "s113_3_q23", "src": "school", "sec": "5-1", "concept": "氣體交換構造", "q": "關於動物氣體交換構造的特徵，何者正確？", "ex": "氣體交換構造通常總表面積很大、表面潮溼、密布微血管，有利於氣體交換。肺泡壁很薄，不是由肌肉組成。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["總表面積很小，以利快速交換氣體", "表面乾燥且堅硬，以利保護內部及交換氣體", "大多密佈許多微血管，以利氣體交換", "例如人類肺泡由許多肌肉組成，以利收縮舒張產生運動交換氣體。"], "ans": 2, "ch": "5"}, {"id": "s113_3_q24", "src": "school", "sec": "5-1", "concept": "動物呼吸構造", "q": "下列各種生物及其呼吸構造的配對何者正確？", "ex": "人類利用肺交換氣體。魚用鰓呼吸；樹蛙成體用肺和皮膚；水蠆長大後的蜻蜓用氣管呼吸，不是肺。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["海洋中的小丑魚使用氣管以利水中生活", "池塘旁的翡翠樹蛙，其成體仍利用鰓交換氣體，故無法遠離池塘邊", "蜻蜓的幼蟲水蠆會利用鰓在水中呼吸，長大後改利用肺呼吸，成為昆蟲界的空中霸主", "人類利用肺1111 交換氣體。"], "ans": 3, "ch": "5"}, {"id": "s113_3_q25", "src": "school", "sec": "5-3", "concept": "尿酸與節水", "q": "生活在沙漠的動物如蛇與蠍子，為了減少水分的散失，可能會利用何種形式排出含氮廢物？", "ex": "尿酸毒性最低、不太溶於水，可以用很少的水排出，沙漠中的蛇、蠍子排尿酸能減少水分散失。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["直接排氨", "大量的尿液", "排出尿酸", "不排出任何含氮廢物，以減少水分消耗"], "ans": 2, "ch": "5"}, {"id": "s113_3_q26", "src": "school", "sec": "5-3", "concept": "水分恆定", "q": "當人體處在水分不足的狀況時，試問下列各項敘述中，何者正確？", "ex": "缺水時血液濃度上升，刺激腦部產生口渴感；腎臟加強再吸收水分，排尿量減少、尿液變濃、顏色變深。所以(D)「減少排尿量以減少水分流失」正確。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["會出現口乾舌燥的感覺，並刺激唾腺分泌唾液", "血液濃度下降時會刺激腦部，進而產生口渴的感覺，促使攝取水分", "腎臟會加強對水分的再吸收，使排尿量下降，令尿液會變稀，顏色較淺", "泌尿系統會減少排尿量以減少水分流失。"], "ans": 3, "ch": "5"}, {"id": "s113_3_q27", "src": "school", "sec": "5-4", "concept": "外溫動物體溫調節", "q": "下列何者是鱷魚會表現的體溫調節行為？(甲)在寒冬的太陽下張開大嘴獲取熱能；(乙)冬天時鱗片下方血管收縮減少熱流失；(丙)夏天時，躲在清涼的水中；(丁)夏天時，減少食慾，減少熱量的產生。", "ex": "鱷魚是外溫動物，只能靠行為調節體溫，例如晒太陽（甲）、躲進水中（丙）。血管收縮、減少食慾是內溫動物的方式。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙丙丁", "甲丙", "乙丁", "乙丙"], "ans": 1, "ch": "5"}, {"id": "s113_3_q28", "src": "school", "sec": "5-3", "concept": "防止水分散失", "q": "陸生動植物體表通常要能防止水分散失以利生存，下列對於生物的防止水分散失構造的描述，何者錯誤？", "ex": "青蛙的皮膚薄而潮濕，需要保持溼潤，容易散失水分，不是防止水分散失的構造，所以(A)錯。昆蟲外骨骼、植物角質層、烏龜鱗片都能防止水分散失。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["青蛙具有薄且潮濕的皮膚", "昆蟲的外骨骼", "植物表皮細胞外的角質層", "烏龜的鱗片及骨板。"], "ans": 0, "ch": "5"}, {"id": "s113_3_q29", "src": "school", "sec": "5-4", "concept": "內溫動物", "q": "如附圖為甲、乙兩種動物的「環境溫度與體溫變化」曲線圖。下列敘述何者正確？", "ex": "甲的體溫維持在 40℃ 左右，是內溫動物，體溫低時會用發抖（肌肉顫抖）產熱來維持體溫。乙是外溫動物，不會用調節皮膚血流量來調節體溫。", "fig": "fig/s113_3_q29.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲是外溫動物", "乙是內溫動物", "甲動物於體溫低時會藉由發抖來維持體溫", "乙動物可藉增加皮膚血液流量來調節體溫"], "ans": 2, "ch": "5"}, {"id": "s113_3_q30", "src": "school", "sec": "5-4", "concept": "退燒處理", "q": "關於幼兒發高燒時，下列何種處理方式及其退燒原理是正確的？", "ex": "發燒時用溫水擦拭，皮膚血管會擴張，血液流到皮膚多，可以加速散熱。用冷水擦會讓血管收縮，反而不易散熱。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["用冷水擦拭全身，使皮膚的血管擴張加速將體熱散出", "用冷水擦拭全身，使皮膚的血管收縮加速將體熱散出", "用溫水擦拭全身，使皮膚的血管收縮加速將體熱散出", "用溫水擦拭全身，使皮膚的血管擴張加速將體熱散出。"], "ans": 3, "ch": "5"}, {"id": "s113_3_q31", "src": "school", "sec": "5-4", "concept": "體溫調節方式", "q": "關於生物體調節體溫的方式，下列敘述何者錯誤？", "ex": "金魚是外溫動物，沒有體溫調節中樞，不會用減少食慾來減少產熱，所以(A)錯。人、狗、麻雀是內溫動物，可以用活動、顫抖、皮膚血管擴張來調節體溫。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小金魚在天氣炎熱時，食慾減退、活動遲緩，可以減少體熱產生", "人類在天氣寒冷時，會增加活動量來產熱，以維持固定的體溫", "小狗在天氣寒冷時，肌肉顫抖，可以產熱", "麻雀在天氣炎熱時，皮膚血管擴張，流入皮膚的血液量增多，可以散熱。"], "ans": 0, "ch": "5"}, {"id": "s113_3_q32", "src": "school", "sec": "5-4", "concept": "運動時體溫調節", "q": "阿鴻參加馬拉松比賽，當他跑步時，下列關於身體體溫調節的敘述，何者錯誤？", "ex": "跑步時體溫上升，身體要散熱：流汗、皮膚血管擴張、食慾下降。肌肉顫抖是寒冷時用來產熱的方式，所以(B)錯。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["當下因體溫上升，將導致他的食慾會下降", "此時他的肌肉會不自覺顫抖，以增加產熱", "皮膚內汗腺會分泌汗液，來加速排除體熱", "皮膚的血管會擴張，來增加散熱"], "ans": 1, "ch": "5"}, {"id": "s113_3_q33", "src": "school", "sec": "5-1", "concept": "種子呼吸作用實驗", "q": "美美進行測定植物呼吸作用產生氣體的實驗，在錐形瓶內置入已萌芽的綠豆，蓋上瓶蓋，是為實驗組，另外以乾燥綠豆放入相當裝置作為對照組，靜置三小時後，由上方漏斗倒入清水。請問實驗檢測何種物質？而你推測實驗組和對照組最終有何結果為何？", "ex": "萌芽的綠豆會行旺盛的呼吸作用，產生二氧化碳，倒入清水擠出氣體後石灰水變混濁；乾燥綠豆幾乎不呼吸，石灰水維持澄清。", "fig": "fig/s113_3_q33.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["檢測物質：水氣；實驗組：石灰水澄清／對照組：石灰水混濁", "檢測物質：二氧化碳；實驗組：石灰水澄清／對照組：石灰水混濁", "檢測物質：水氣；實驗組：石灰水混濁／對照組：石灰水澄清", "檢測物質：二氧化碳；實驗組：石灰水混濁／對照組：石灰水澄清"], "ans": 3, "ch": "5"}, {"id": "s113_3_q38", "src": "school", "sec": "5-3", "concept": "含氮廢物產生與排除", "q": "根據上述內容，請問甲、乙、丙所指的構造是什麼？", "ex": "養分（胺基酸）在細胞（甲）中代謝產生氨，再由肝臟（乙）轉成尿素，最後在腎臟（丙）形成尿液，所以是細胞、肝臟、腎臟。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "含氮廢物在人體產生及排除的過程為：養分在甲產生含氮廢物Ａ，再由乙變成含氮廢物Ｂ，最終在丙處形成尿液排出體外。", "opts": ["細胞、肝臟、腎臟", "腎臟、肝臟、膀胱", "細胞、腎臟、肝臟", "肝臟、腎臟、膀胱。"], "ans": 0, "ch": "5"}, {"id": "s113_3_q39", "src": "school", "sec": "5-3", "concept": "氨與尿素", "q": "根據上述內容，文中所敘述的含氮廢物Ａ和Ｂ分別是什麼？", "ex": "細胞代謝產生的含氮廢物 A 是氨，肝臟把它轉成毒性較低的 B 尿素。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "含氮廢物在人體產生及排除的過程為：養分在甲產生含氮廢物Ａ，再由乙變成含氮廢物Ｂ，最終在丙處形成尿液排出體外。", "opts": ["尿素、氨", "氨、尿酸", "尿酸、氨", "氨、尿素。"], "ans": 3, "ch": "5"}, {"id": "s113_3_q44", "src": "school", "sec": "5-2", "concept": "血糖下降原因", "q": "在11～12 時之間正在進行第四節生物課，阿寶的血糖值開始有下降的情況，下列選項的解釋，何者最合理？", "ex": "上午 11～12 點已經過了一段時間沒吃東西，細胞持續進行呼吸作用消耗血糖，所以血糖逐漸下降。", "fig": "fig/s113_3_q44.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "小花以血糖機測量自己的血糖值，自上午11 時開始，每隔一小時記錄一次，得到紀錄表如下。請根據下表，回答以下問題：（人體空腹時正常血糖數值為70～110 mg/dl）", "opts": ["血糖正被細胞以肝糖形式儲存備用，估血糖逐漸下降", "肝糖正被激素分解以提供所需養分，進而導致血糖逐漸升高", "隨著各種排泄作用而排出，導致血糖逐漸下降", "血糖正被細胞進行呼吸作用逐漸消耗。"], "ans": 3, "ch": "5"}, {"id": "s113_3_q45", "src": "school", "sec": "5-2", "concept": "胰島素", "q": "小花在12 點享用營養午餐後，其於下午第一節課13 至14 時血糖產生變化，請問此時最需要何種激素介入作用？", "ex": "吃完午餐後血糖上升到 128、136，需要胰島素發揮作用，讓血糖進入細胞利用或轉成肝糖，使血糖降回來。", "fig": "fig/s113_3_q44.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "小花以血糖機測量自己的血糖值，自上午11 時開始，每隔一小時記錄一次，得到紀錄表如下。請根據下表，回答以下問題：（人體空腹時正常血糖數值為70～110 mg/dl）", "opts": ["胰島素", "升糖素", "腎上腺素", "甲狀腺素"], "ans": 0, "ch": "5"}, {"id": "s113_3_q46", "src": "school", "sec": "5-2", "concept": "腎上腺素", "q": "在16 時，正逢小花進行體育課活動，請問此時是哪一種激素作用造成其血糖發生變化？", "ex": "16 時上體育課，運動或緊張時腎上腺素分泌，使肝糖分解，血糖上升到 120。", "fig": "fig/s113_3_q44.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "小花以血糖機測量自己的血糖值，自上午11 時開始，每隔一小時記錄一次，得到紀錄表如下。請根據下表，回答以下問題：（人體空腹時正常血糖數值為70～110 mg/dl）", "opts": ["胰島素", "升糖素", "腎上腺素", "甲狀腺素。"], "ans": 2, "ch": "5"}, {"id": "s113_3_q47", "src": "school", "sec": "5-2", "concept": "判斷糖尿病", "q": "根據小花紀錄的血糖值，你判斷小花是否可能罹患糖尿病？理由為何？", "ex": "小花飯後血糖雖然升高，但之後都能降回正常範圍，表示血糖調節正常，不是糖尿病。飯後血糖高於空腹正常值是正常的現象。", "fig": "fig/s113_3_q44.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "小花以血糖機測量自己的血糖值，自上午11 時開始，每隔一小時記錄一次，得到紀錄表如下。請根據下表，回答以下問題：（人體空腹時正常血糖數值為70～110 mg/dl）", "opts": ["是，因其血糖曾經數度高過空腹血糖正常值", "是，其血糖的變化高低起伏不固定，沒有維持在恆定狀況", "否，血糖在升高後，都能降回正常值", "否，因為其血糖變化都落在空腹血糖正常值範圍內。"], "ans": 2, "ch": "5"}, {"id": "s113_3_q48", "src": "school", "sec": "5-2", "concept": "升糖素", "q": "請問小花在運動後就開始出現飢餓感，小花因為進行課後輔導，無法立即享用美味的晚餐，但是飢餓感持續一段時間後，飢餓感卻暫時消失，而且18 時血糖反而微幅上升，請問饑餓感消失且血糖上升最可能是因為體內哪種激素發揮功能所造成？", "ex": "飢餓一段時間後血糖偏低，胰臟分泌升糖素，使肝糖分解成葡萄糖，血糖上升，飢餓感也暫時消失。", "fig": "fig/s113_3_q44.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "小花以血糖機測量自己的血糖值，自上午11 時開始，每隔一小時記錄一次，得到紀錄表如下。請根據下表，回答以下問題：（人體空腹時正常血糖數值為70～110 mg/dl）", "opts": ["胰島素", "升糖素", "腎上腺素", "甲狀腺素。"], "ans": 1, "ch": "5"}, {"id": "s114_3_q13", "src": "school", "sec": "5-2", "concept": "升高血糖的激素", "q": "(甲)甲狀腺素；(乙)副甲狀腺素；(丙)胰島素；(丁)升糖素；(戊)腎上腺素；以上哪些激素可使血糖升高？", "ex": "升糖素（丁）和腎上腺素（戊）都會促使肝糖分解，使血糖升高。胰島素是降低血糖；副甲狀腺素調節血鈣。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丁戊", "丙丁戊", "甲丁", "丙丁。"], "ans": 0, "ch": "5"}, {"id": "s114_3_q22", "src": "school", "sec": "5-1", "concept": "動物呼吸構造", "q": "下列哪一種動物以及其所具有的呼吸構造配對，下列何者錯誤？", "ex": "鯨魚是哺乳類，用肺呼吸，需要浮出水面換氣，不是用鰓，所以(D)錯。鍬形蟲用氣管、樹蛙成體用肺和皮膚。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["鍬形蟲：氣管系統", "人類：肺", "樹蛙(成體)：肺和皮膚", "鯨魚：鰓"], "ans": 3, "ch": "5"}, {"id": "s114_3_q24", "src": "school", "sec": "5-1", "concept": "呼吸作用", "q": "生物需要藉由何種方式才能將養分轉換成能量？且在何處進行？", "ex": "生物藉由呼吸作用把養分分解產生能量，呼吸作用在細胞內的粒線體進行。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["呼吸作用；肺臟", "消化作用；小腸", "呼吸作用；細胞內粒線體", "消化作用；細胞內粒線體"], "ans": 2, "ch": "5"}, {"id": "s114_3_q25", "src": "school", "sec": "5-1", "concept": "氣體交換構造", "q": "有關生物體與環境進行氣體交換的敘述，下列何者正確？", "ex": "小丑魚是魚類，用鰓在水中進行氣體交換。蠶用氣管系統、桑樹靠葉片氣孔，人體主要靠肺。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小丑魚可利用鰓進行氣體交換", "蠶寶寶可利用皮膚進行氣體交換", "桑樹可利用樹幹上的氣門進行氣體交換", "人體可利用皮膚協助進行氣體交換"], "ans": 0, "ch": "5"}, {"id": "s114_3_q26", "src": "school", "sec": "5-1", "concept": "呼吸運動", "q": "附表為人體呼吸運動中吸氣和呼氣的比較表格，哪一個比較項目正確？", "ex": "吸氣時肋骨上舉、橫膈收縮下降，胸腔和肺擴大；呼氣時肋骨下降、橫膈舒張上升，胸腔和肺縮小。表中只有肋骨那一列正確。", "fig": "fig/s114_3_q26.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["肺：吸氣 縮小／呼氣 脹大", "胸腔：吸氣 縮小／呼氣 擴大", "肋骨：吸氣 上舉／呼氣 下降", "橫膈：吸氣 收縮上升／呼氣 舒張下降"], "ans": 2, "ch": "5"}, {"id": "s114_3_q27", "src": "school", "sec": "5-1", "concept": "氯化亞鈷試紙", "q": "下列關於氯化亞鈷試紙的敘述，何者錯誤？", "ex": "氯化亞鈷試紙是檢驗「水」的：乾燥時藍色，遇到水氣變粉紅色。它不會因為二氧化碳變色，所以(B)錯。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["從人體鼻孔與嘴巴呼出的氣體可以使試紙變色", "接觸到二氧化碳的試紙會變色", "乾燥的試紙會呈現藍色", "遇到水氣會變成粉紅色"], "ans": 1, "ch": "5"}, {"id": "s114_3_q28", "src": "school", "sec": "5-1", "concept": "呼吸頻率調節", "q": "小鍬在參加馬拉松路跑時，呼吸頻率增加而顯得氣喘吁吁。下列何者是產生此現象的原因？", "ex": "馬拉松時細胞呼吸作用旺盛，血液中二氧化碳濃度增加，刺激腦幹使呼吸頻率增加。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血液中二氧化碳濃度增加，進而刺激腦幹增加呼吸頻率", "血液中氧氣濃度減少，進而刺激腦幹增加呼吸頻率", "血液中二氧化碳濃度增加，進而刺激大腦增加呼吸頻率", "血液中氧氣濃度降低，進而刺激大腦增加呼吸頻率"], "ans": 0, "ch": "5"}, {"id": "s114_3_q29", "src": "school", "sec": "5-1", "concept": "石灰水檢測", "q": "阿昇做「探測人體呼出的氣體成分」實驗時，試管中裝入澄清石灰水，在阿昇吹氣進去後，石灰水變混濁，請問是何種成分造成石灰水混濁？", "ex": "呼出的氣體含較多二氧化碳，二氧化碳使澄清石灰水變混濁。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水氣", "氧氣", "二氧化碳", "唾液"], "ans": 2, "ch": "5"}, {"id": "s114_3_q30", "src": "school", "sec": "5-3", "concept": "含氮廢物來源", "q": "小海吃完食物後，在體內發生了下列反應：小分子養分＋氧氣→能量＋二氧化碳＋水＋氨。請問小海體內主要消耗何種養分才產生以下反應？", "ex": "反應產物中有氨，氨是含氮廢物，只有蛋白質含有氮，所以主要消耗的是蛋白質。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["脂質", "蛋白質", "醣類", "維生素"], "ans": 1, "ch": "5"}, {"id": "s114_3_q31", "src": "school", "sec": "5-3", "concept": "含氮廢物", "q": "生物代謝蛋白質會產生廢物。關於這些廢物及其處理方式，下列敘述何者正確？", "ex": "淡水魚生活在水中，可以透過鰓把毒性高但易溶於水的氨直接排到水中。單細胞生物排氨；昆蟲排尿酸；毒性是氨＞尿素＞尿酸。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["淡水魚透過鰓將氨排至水中", "單細胞生物藉擴散作用將尿酸直接排除", "昆蟲產生尿素混在糞便中排出", "尿酸的毒性最大，氨次之，尿素最小"], "ans": 0, "ch": "5"}, {"id": "s114_3_q32", "src": "school", "sec": "5-3", "concept": "含氮廢物轉換", "q": "附圖為X 物質在人體內的代謝過程示意圖，下列相關敘述何者正確？", "ex": "細胞代謝 X（蛋白質）產生氨（甲），肝臟把氨轉成尿素（乙），腎臟形成尿液（丙）。所以(C)正確。", "fig": "fig/s114_3_q32.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲是尿素", "乙是氨", "丙是尿液", "X 物質是葡萄糖"], "ans": 2, "ch": "5"}, {"id": "s114_3_q34", "src": "school", "sec": "5-4", "concept": "體溫調節方法", "q": "有關人體調節體溫的方法，下列何者錯誤？", "ex": "肌肉顫抖是寒冷時用來「產熱」的方式，不是炎熱時散熱的方法，所以(C)錯。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["炎熱時，食慾較差", "寒冷時，皮膚血管收縮，可減少體熱散失", "炎熱時，肌肉顫抖可增加散熱", "運動後，大量流汗可幫助散熱"], "ans": 2, "ch": "5"}, {"id": "s114_3_q35", "src": "school", "sec": "5-3", "concept": "水分恆定", "q": "人體在運動後會大量流汗，使得血液中的水分減少，請問此時人體會產生哪些生理現象？(甲)刺激腦部感到口渴；(乙)刺激脊髓感到口渴；(丙)排尿頻率增加；(丁)排尿頻率降低；", "ex": "流汗使血液中的水分減少，會刺激腦部產生口渴感（甲），腎臟加強水分再吸收，排尿頻率降低（丁）。口渴感是在腦部產生，不是脊髓。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲丙", "甲丁", "乙丁", "乙丙"], "ans": 1, "ch": "5"}, {"id": "s114_3_q36", "src": "school", "sec": "5-4", "concept": "內溫動物", "q": "(甲)帝雉 (印在千元鈔票背面) ；(乙)紫斑蝶；(丙)白海豚；(丁)食蛇龜；(戊)台灣黑熊。上述生物中，若以「是否具有體溫調節中樞」分成兩類，其分類結果為何？", "ex": "鳥類（帝雉）和哺乳類（白海豚、台灣黑熊）是內溫動物，有體溫調節中樞；紫斑蝶、食蛇龜是外溫動物。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲和乙、丙、丁、戊", "甲、丙、戊和乙、丁", "甲、丁和乙、丙、戊", "甲、丙和乙、丁、戊"], "ans": 1, "ch": "5"}, {"id": "s114_3_q37", "src": "school", "sec": "5-4", "concept": "內溫與外溫動物", "q": "如附圖為甲、乙兩種動物的「環境溫度與體溫變化」曲線圖。下列敘述何者錯誤？", "ex": "乙的體溫隨環境溫度改變，是外溫動物；狗是內溫動物，所以(D)錯。甲是內溫動物，可以增加皮膚血流量散熱；乙體溫低時會晒太陽取暖。", "fig": "fig/s114_3_q37.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲是內溫動物", "甲動物可藉增加皮膚血液流量，來調節體溫", "乙動物於體溫低時會藉由曬太陽來維持體溫", "乙可能是狗"], "ans": 3, "ch": "5"}, {"id": "s114_3_q38", "src": "school", "sec": "5-3", "concept": "泌尿系統構造", "q": "附圖為人體泌尿系統與附近構造示意圖，試問圖中各器官與代號的配對，何者錯誤？", "ex": "己是膀胱下方排出尿液的尿道，不是輸尿管，所以(D)錯。甲是血管、丙是腎臟、丁是輸尿管、戊是膀胱。", "fig": "fig/s114_3_q38.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體泌尿系統與附近構造示意圖，請根據附圖回答下列問題", "opts": ["甲是血管", "丙是腎臟", "戊是膀胱", "己是輸尿管"], "ans": 3, "ch": "5"}, {"id": "s114_3_q39", "src": "school", "sec": "5-3", "concept": "泌尿系統功能", "q": "下列關於泌尿系統的相關敘述，何者正確？", "ex": "腎臟（丙）負責過濾血液、製造尿液。尿素是在肝臟形成；丁是輸尿管，運送尿液到膀胱；膀胱只是暫存尿液，不負責再吸收水分。", "fig": "fig/s114_3_q38.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體泌尿系統與附近構造示意圖，請根據附圖回答下列問題", "opts": ["乙處可以形成尿素", "丙處可以製造尿液", "丁處將血液送回血管", "戊處將尿液中的水分再吸收"], "ans": 1, "ch": "5"}, {"id": "s114_3_q44", "src": "school", "sec": "5-2", "concept": "飯後血糖上升", "q": "甲→乙階段血糖濃度上升的主要原因為何？", "ex": "12 點吃午餐後，食物經消化變成葡萄糖，被小腸吸收進入血液，所以甲→乙血糖上升。", "fig": "fig/s114_3_q44.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖是瑞凡早上11:00 到下午19:00 這段時間體內血糖濃度的變化情形，他在中午12:00 吃午餐，下午16:30開始和一群好友進行籃球比賽，請依圖回答下列問題", "opts": ["\u0003胰島素開始發揮作用", "升糖素開始發揮作用", "腎上腺素開始發揮作用", "食物經過消化作用後，被小腸吸收並進入血液循環"], "ans": 3, "ch": "5"}, {"id": "s114_3_q45", "src": "school", "sec": "5-2", "concept": "血糖下降原因", "q": "乙→丙階段血糖濃度下降的原因，下列敘述何者錯誤？", "ex": "乙→丙血糖下降，是胰島素發揮作用，讓血糖進入細胞被使用或在肝臟形成肝糖。腎上腺素會使血糖上升，所以(D)錯。", "fig": "fig/s114_3_q44.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖是瑞凡早上11:00 到下午19:00 這段時間體內血糖濃度的變化情形，他在中午12:00 吃午餐，下午16:30開始和一群好友進行籃球比賽，請依圖回答下列問題", "opts": ["\u0003胰島素開始發揮作用", "血糖進入肝臟形成肝糖", "血糖進入細胞被細胞使用", "腎上腺素開始發揮作用"], "ans": 3, "ch": "5"}, {"id": "s114_3_q46", "src": "school", "sec": "5-2", "concept": "腎上腺素", "q": "在戊階段血糖濃度上升的主要原因為何？", "ex": "16:30 開始打籃球比賽，運動和興奮時腎上腺素分泌，使肝糖分解，所以戊階段血糖上升。", "fig": "fig/s114_3_q44.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖是瑞凡早上11:00 到下午19:00 這段時間體內血糖濃度的變化情形，他在中午12:00 吃午餐，下午16:30開始和一群好友進行籃球比賽，請依圖回答下列問題", "opts": ["\u0003胰島素開始發揮作用", "血糖進入細胞被細胞使用", "腎上腺素開始發揮作用", "食物經過消化作用後，被小腸吸收並進入血液循環"], "ans": 2, "ch": "5"}, {"id": "c104_01", "src": "cap", "sec": "2-3", "concept": "光合作用的原料與產物", "q": "圖(一)是生物進行某種生理作用的示意圖，圖中箭頭代表能量或物質在葉片中的進出，此生理作用最可能是下列何者？", "opts": ["呼吸作用", "蒸散作用", "光合作用", "觸發運動"], "ans": 2, "ex": "圖上葉片吸收陽光、二氧化碳和根送上來的水，並放出氧氣——這正是光合作用。呼吸作用是吸收氧氣、放出二氧化碳，方向剛好相反。", "fig": "fig/cap104_01_圖一.png", "figTop": false, "year": 104, "pas": "", "warn": "", "ch": "2"}, {"id": "c104_41", "src": "cap", "sec": "2-2", "concept": "酵素的主要成分", "q": "唾液中的甲物質可催化澱粉的分解，胃液中的乙物質則可催化蛋白質的分解，若推測甲、乙兩物質本身的主要成分，下列敘述何者最合理？", "opts": ["甲、乙成分皆為澱粉", "甲、乙成分皆為蛋白質", "甲成分為澱粉，乙成分為蛋白質", "甲成分為葡萄糖，乙成分為胺基酸"], "ans": 1, "ex": "甲是唾液澱粉酶、乙是胃蛋白酶，兩者都是酵素，酵素的主要成分是蛋白質。名字裡的「澱粉」「蛋白」說的是它分解的對象，不是它的成分。", "fig": "", "figTop": false, "year": 104, "pas": "", "warn": "", "ch": "2"}, {"id": "c105_07", "src": "cap", "sec": "2-3", "concept": "有葉綠體就能行光合作用", "q": "已知某種具有葉綠體的原生生物會分解養分產生能量，推測該生物能否進行光合作用或呼吸作用，下列敘述何者正確？", "opts": ["僅可進行光合作用", "僅可進行呼吸作用", "此兩種作用皆可進行", "此兩種作用皆無法進行"], "ans": 2, "ex": "有葉綠體就能行光合作用；題目又說它會分解養分產生能量，這就是呼吸作用。所有活細胞都會呼吸，所以兩種作用都能進行。", "fig": "", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "2"}, {"id": "c105_28", "src": "cap", "sec": "2-2", "concept": "酵素分解澱粉與碘液檢測", "q": "在甲、乙及丙三支試管中分別裝入等量且濃度相同的溶液X，依實驗設計分別再加入等量的葡萄糖液、澱粉液或水，充分混勻再靜置於適宜的溫度，待足夠的反應時間後，以碘液進行檢測。將上述各試管所含的物質與碘液檢測結果整理如表(四)，根據此實驗結果判斷溶液X中最可能含有下列何種成分？", "opts": ["澱粉", "葡萄糖", "分解澱粉的酵素", "分解葡萄糖的酵素"], "ans": 2, "ex": "乙管加了澱粉液，碘液卻是黃褐色（沒有變藍黑色），代表澱粉不見了——被溶液 X 裡的東西分解掉。能分解澱粉的就是分解澱粉的酵素。", "fig": "fig/cap105_28_表四.png", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "2"}, {"id": "c106_27", "src": "cap", "sec": "2-4", "concept": "膽汁幫助脂質消化", "q": "圖(十五)為人體部分消化器官的示意圖，若老王體內的甲處發生阻塞，則下列關於他的消化及養分吸收功能，何者最可能發生？", "opts": ["胰液無法排至小腸內", "胃液無法分解蛋白質", "消化脂質的功能下降", "吸收葡萄糖的功能下降"], "ans": 2, "ex": "甲是從膽囊通往小腸的膽管。膽管阻塞，膽汁到不了小腸，膽汁能把脂質乳化成小油滴，所以消化脂質的功能會下降。胰液走的是另一條管子。", "fig": "fig/cap106_27_圖十五.png", "figTop": false, "year": 106, "pas": "", "warn": "", "ch": "2"}, {"id": "c107_18", "src": "cap", "sec": "2-2", "concept": "酵素活性與分解速率", "q": "將酵素甲和澱粉溶液在試管中混合均勻，並定時測量試管內的澱粉濃度。已知試管內澱粉濃度會隨著時間而改變，如圖(十)所示，下列關於甲的敘述，何者正確？", "opts": ["甲主要由葡萄糖組成", "甲與澱粉反應後，會被分解成胺基酸", "若降低甲的活性，會使澱粉的合成速率變快", "若提高甲的活性，會使澱粉的分解速率變快"], "ans": 3, "ex": "圖中澱粉濃度隨時間下降，表示酵素甲在分解澱粉。酵素活性越高，分解得越快；酵素是蛋白質、作用前後本身不會被分解。", "fig": "fig/cap107_18_圖十.png", "figTop": false, "year": 107, "pas": "", "warn": "", "ch": "2"}, {"id": "c108_05", "src": "cap", "sec": "2-3", "concept": "光合作用速率的判斷", "q": "小帆想知道某一植株在不同環境條件下，葉片行光合作用時速率的快慢，應依據下列哪一資料進行推測最為合理？", "opts": ["單位時間內產生氧氣的量", "單位時間內消耗葉綠素的量", "單位時間內消耗葡萄糖的量", "單位時間內產生二氧化碳的量"], "ans": 0, "ex": "光合作用會產生氧氣，所以比較「單位時間內產生氧氣的量」就能知道快慢。葉綠素不會被消耗，葡萄糖是產物不是被消耗的，二氧化碳是被吸收而不是產生。", "fig": "", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "2"}, {"id": "c108_45", "src": "cap", "sec": "2-2", "concept": "溫度影響酵素", "q": "已知利用相同茶樹的葉片但不同的製作過程，可得綠茶及紅茶。茶葉中所含的酵素X在超過70℃後，就無法再有催化能力。圖(二十三)為製作綠茶及紅茶時的四個步驟(依序由步驟I→II→III→IV)及其溫度調控示意圖，比較四個步驟中綠茶及紅茶的酵素X之活性，下列何者最合理？", "opts": ["步驟I結束時：綠茶＞紅茶", "步驟II結束時：綠茶＝紅茶", "步驟III結束時：綠茶＜紅茶", "步驟IV結束時：綠茶＝紅茶"], "ans": 3, "ex": "超過 70℃ 酵素 X 就失去作用而且回不來。綠茶在步驟 I 就超過 70℃，紅茶到步驟 III 才超過；到步驟 IV 兩者的酵素都已失效，活性相同。", "fig": "fig/cap108_45_圖二十三.png", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "2"}, {"id": "c109_03", "src": "cap", "sec": "2-4", "concept": "澱粉的消化", "q": "澱粉在人體內經某種生理作用後可產生多個小分子X，如圖(二)所示。有關此生理作用及小分子X的名稱，下列何者最合理？", "opts": ["消化作用，葡萄糖", "消化作用，胺基酸", "呼吸作用，葡萄糖", "呼吸作用，胺基酸"], "ans": 0, "ex": "把大分子的澱粉分解成許多小分子葡萄糖，是消化作用。胺基酸是蛋白質分解的產物；呼吸作用是分解葡萄糖產生能量。", "fig": "fig/cap109_03_full.webp", "figTop": true, "year": 109, "pas": "", "warn": "", "ch": "2"}, {"id": "c109_41", "src": "cap", "sec": "2-2", "concept": "酵素的主要成分", "q": "在製作麵包的過程中，可添加澱粉酶、脂肪酶和蛋白酶等酵素，表(六)為甲～丁四位同學對於三種酵素主成分的說明，哪一位同學的說明最合理？", "opts": ["甲", "乙", "丙", "丁"], "ans": 3, "ex": "不論分解澱粉、脂肪或蛋白質，酵素的主成分都是蛋白質，所以丁同學對。甲、丙把酵素的成分和它分解的對象搞混了。", "fig": "fig/cap109_41_表六.png", "figTop": false, "year": 109, "pas": "", "warn": "", "ch": "2"}, {"id": "c110_42", "src": "cap", "sec": "2-4", "concept": "酵素在消化道中受 pH 影響", "q": "已知某種酵素最適合在37°C及pH＝8的環境中作用，且在pH＜5的環境下會被完全破壞。若某人吃下此種酵素，則此酵素在口腔、胃及小腸中的活性大小，下列何者最合理？", "opts": ["", "", "", ""], "ans": 2, "ex": "這種酵素在口腔（接近中性）還有活性；到了胃（強酸，pH＜5）會被完全破壞；被破壞的酵素到了小腸也不會恢復，所以只有口腔有活性。", "fig": "fig/cap110_42_full.webp", "figTop": true, "year": 110, "pas": "", "warn": "", "optsImg": true, "ch": "2"}, {"id": "c111_18", "src": "cap", "sec": "2-3", "concept": "哪些細胞能行光合作用", "q": "一株植物含有不同類型的細胞，以榕樹為例，關於其可行光合作用的細胞數目與可行呼吸作用的細胞數目之比較及其原因，下列何者最合理？", "opts": ["甲大於乙，因植物的部分細胞不具有粒線體", "甲小於乙，因植物的部分細胞不具有粒線體", "甲小於乙，因植物的部分細胞不具有葉綠體", "甲等於乙，因植物細胞皆具有葉綠體與粒線體"], "ans": 2, "ex": "只有含葉綠體的細胞（例如葉肉細胞）能行光合作用；根、莖內部很多細胞沒有葉綠體，但所有活細胞都要行呼吸作用，所以能光合的細胞比較少。", "fig": "", "figTop": false, "year": 111, "pas": "", "warn": "", "rate": 0.5027, "wrongOpt": "D", "ch": "2"}, {"id": "c111_32", "src": "cap", "sec": "2-2", "concept": "設計對照實驗檢驗酵素", "q": "已知蜂蜜中含有分解澱粉的酵素。現有甲、乙兩試管皆裝有等量且濃度相同的澱粉液，隨機在其中一支加入蜂蜜，另一支加入等量的水。將兩支試管充分搖勻，靜置於適宜的溫度，待足夠的反應時間後，以碘液檢測。結果顯示甲呈現藍黑色，乙呈現黃褐色。根據此結果，推測哪一支試管加入了蜂蜜及其理由，下列何者最合理？", "opts": ["甲，因未檢測出澱粉", "甲，因有檢測出澱粉", "乙，因未檢測出澱粉", "乙，因有檢測出澱粉"], "ans": 2, "ex": "蜂蜜裡的酵素會把澱粉分解，碘液就不會變藍黑色。乙呈黃褐色＝沒有澱粉了，所以乙加了蜂蜜；甲藍黑色是加水的對照組。", "fig": "", "figTop": false, "year": 111, "pas": "", "warn": "", "rate": 0.48, "wrongOpt": "B", "ch": "2"}, {"id": "c112_16", "src": "cap", "sec": "2-3", "concept": "光合作用反應式", "q": "已知維管束植物可進行某種代謝作用，其反應式為：「甲+二氧化碳→氧氣+乙+水」。有關甲的名稱及其在植物體內主要運送的構造，下列何者最合理？", "opts": ["水，由木質部運送", "水，由韌皮部運送", "葡萄糖，由木質部運送", "葡萄糖，由韌皮部運送"], "ans": 0, "ex": "光合作用：水＋二氧化碳 → 氧氣＋葡萄糖＋水。所以甲是水，由根吸收後經木質部往上運送；乙才是葡萄糖（由韌皮部運送）。", "fig": "", "figTop": false, "year": 112, "pas": "", "warn": "", "rate": 0.5943, "wrongOpt": "D", "ch": "2"}, {"id": "c112_43", "src": "cap", "sec": "2-1", "concept": "看營養標示選食物", "q": "若壯壯跟安安兩人對於早餐飲品的需求為：壯壯：我想要攝取較多的胺基酸。安安：我要減少攝取糖。則根據營養比較表，在攝取相同容量飲品的情況下，推論兩人的選擇，下列何者最合理？", "opts": ["兩人皆宜選擇牛奶", "兩人皆宜選擇燕麥奶", "壯壯選擇牛奶，安安選擇燕麥奶", "壯壯選擇燕麥奶，安安選擇牛奶"], "ans": 0, "ex": "胺基酸是蛋白質消化後的產物，牛奶的蛋白質（3 g）比燕麥奶（1.3 g）多；糖則是牛奶（4.5 g）比燕麥奶（8.1 g）少。兩人都該選牛奶。", "fig": "fig/cap112_43_表七.webp", "figTop": false, "year": 112, "pas": "燕麥奶與牛奶常被拿來做比較。燕麥奶是燕麥和水混合後的成品，其營養組成成分和牛奶有些不同，表(七)為X牌燕麥奶與Y牌牛奶的營養比較表。", "warn": "", "rate": 0.5686, "wrongOpt": "D", "ch": "2"}, {"id": "c113_41", "src": "cap", "sec": "2-2", "concept": "溫度影響酵素活性", "q": "某工廠進行原料加工的製程如表(十一)。當開始加工時，此原料中酵素X會持續催化原料中物質甲轉變成物質乙，但超過75℃後就無法再有催化的功能。若僅考慮酵素X的作用，這段加工製程中，哪兩時間點所含物質乙的量最相近？", "opts": ["10:00和10:10", "10:15和10:25", "10:25和10:45", "10:50和11:00"], "ans": 3, "ex": "步驟三（10:30 起）溫度 85℃，超過 75℃ 後酵素 X 失效，之後就算降回 35℃ 也不會恢復，物質乙不再增加。所以 10:50 和 11:00 物質乙的量相同。", "fig": "fig/cap113_41_表十一.png", "figTop": false, "year": 113, "pas": "", "warn": "", "rate": 0.382, "wrongOpt": "B", "ch": "2"}, {"id": "c114_08", "src": "cap", "sec": "2-3", "concept": "光照與光合作用", "q": "圖(四)為某蘆筍植株的示意圖，圖中甲部位經過日光照射，呈現綠色；乙部位未受到日光照射，呈現白色。有關兩部位進行生理作用時所釋出的氣體，下列敘述何者最合理？", "opts": ["甲能釋出O2，但乙不能", "甲能釋出CO2，但乙不能", "乙能釋出O2，但甲不能", "乙能釋出CO2，但甲不能"], "ans": 0, "ex": "甲照光呈綠色，有葉綠素能行光合作用、放出氧氣；乙埋在土裡呈白色，不能行光合作用、不會放出氧氣。兩部位都會行呼吸作用放出二氧化碳。", "fig": "fig/cap114_08_圖四.png", "figTop": false, "year": 114, "pas": "", "warn": "", "rate": 0.6833, "wrongOpt": "B", "ch": "2"}, {"id": "c114_36", "src": "cap", "sec": "2-2", "concept": "碘液與本氏液判斷酵素是否作用", "q": "有甲、乙、丙三杯濃度相同的澱粉液，分別加入經不同條件處理的等量澱粉酶，經相同的作用時間後，以碘液與本氏液分別檢測此三杯溶液，結果如表(八)。根據此結果推測，哪杯澱粉液加入的澱粉酶應已完全失去作用？", "opts": ["僅甲", "僅乙", "甲和丙", "乙和丙"], "ans": 0, "ex": "碘液變色＝還有澱粉；本氏液變色＝有糖產生。甲杯碘液有變色、本氏液沒變色：澱粉完全沒被分解，所以只有甲杯的澱粉酶完全失去作用。", "fig": "fig/cap114_36_表八.png", "figTop": false, "year": 114, "pas": "", "warn": "", "rate": 0.4156, "wrongOpt": "B", "ch": "2"}, {"id": "c115_24", "src": "cap", "sec": "2-3", "concept": "光合作用的原料與產物", "q": "已知綠色植物可同時進行光合作用與呼吸作用，而光合作用的過程如下：關於甲、乙、丙三種物質的敘述，下列何者最合理？", "opts": ["甲主要由植物從土壤中吸收", "乙主要由植物根部排出至土壤", "乙與呼吸作用的產物相同", "丙可作為呼吸作用的反應物"], "ans": 3, "ex": "水＋甲（二氧化碳）→ 乙＋丙＋水，乙、丙是氧氣和葡萄糖。題目答案 D：丙是葡萄糖，可以當呼吸作用的原料。二氧化碳是從葉的氣孔進來，不是從土壤吸收。", "fig": "fig/cap115_24_full.webp", "figTop": true, "year": 115, "pas": "", "warn": "", "rate": 0.5601, "wrongOpt": "C", "ch": "2"}, {"id": "c115_37", "src": "cap", "sec": "2-2", "concept": "消化酵素的作用", "q": "蘇蘇在試管中加入蛋白質溶液與人體消化液中以蛋白質為受質的某酵素，充分混合後放置於適宜作用的穩定環境，蘇蘇接著每隔一段時間測量試管中蛋白質與X物質的濃度，結果如圖(二十二)。已知X物質為蛋白質被分解後的產物，則關於此酵素的推論，下列何者最合理？", "opts": ["可能由膽汁中取得此酵素", "可能由胰液中取得此酵素", "此酵素催化X物質的分解", "此酵素催化X物質的合成0"], "ans": 1, "ex": "蛋白質濃度下降、X 物質增加，表示酵素把蛋白質分解成 X。膽汁不含酵素，胰液含有分解蛋白質的酵素，所以可能取自胰液。", "fig": "fig/cap115_37_圖二十二.webp", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.4099, "wrongOpt": "C", "ch": "2"}, {"id": "c110_07", "src": "cap", "sec": "1-1", "concept": "對照組與變因", "q": "小蘭看到一則網路新聞說「將銀幣放入牛奶中，可以抑制細菌生長！」她針對此新聞設計下列實驗。先將甲、乙和丙三個相同的燒杯和銀幣都消毒殺菌後，再將鮮奶開封立刻檢測細菌數，結果為「未檢測出」，接著在各燒杯中倒入鮮奶，並以保鮮膜密封，實驗條件與實驗結果如表(二)所示：僅依據上述實驗內容與結果，下列說明何者合理？", "opts": ["實驗結果支持銀幣能夠抑制細菌生長的說法", "抑制細菌生長的效果，放冰箱冷藏比放銀幣好", "室溫下放置3小時的牛奶，每杯牛奶細菌數達5.1×104CFU", "若將銀幣改成金幣進行相同的實驗，推測其檢測結果也是「未檢測出」"], "ans": 0, "ex": "甲（沒放銀幣）和乙（放銀幣）只差在有沒有銀幣，甲就是對照組：甲長出很多細菌、乙未檢測出，所以結果支持銀幣能抑制細菌。乙和丙都是「未檢測出」，比不出冰箱和銀幣哪個好；5.1×10⁴ 是「每公克」的細菌數，不是每杯；實驗也沒測金幣，不能亂推論。", "fig": "fig/cap110_07_full.webp", "figTop": true, "year": 110, "pas": "", "warn": "", "optsImg": true, "ch": "1"}, {"id": "c114_38", "src": "cap", "sec": "1-1", "concept": "控制變因", "q": "在核發節能標章時須檢測不同品牌、型號的產品是否符合標準，其檢測方式也隨年代而改進。表(九)為81年至106年期間檢測某類電扇的風速時，針對電扇樣品位置條件所做的改變，關於這項改變的目的，最可能為下列何者？", "opts": ["設立可觀察的對照組", "增加不同變因的實驗組", "增加電扇樣品位置的控制變因", "訂立電扇樣品位置的操作(縱)變因"], "ans": 2, "ex": "105、106 年把扇葉離地高度、和牆面的距離都規定好，目的是讓每臺電扇都在相同的位置條件下測風速，這些「刻意保持相同的條件」就是控制變因。真正要比較的是不同品牌、型號（操縱變因），位置不是要改變的條件，所以不是 D。", "fig": "fig/cap114_38_表九.png", "figTop": false, "year": 114, "pas": "", "warn": "", "rate": 0.4063, "wrongOpt": "D", "ch": "1"}, {"id": "c115_23", "src": "cap", "sec": "1-1", "concept": "一次只改變一個變因", "q": "網路流傳一種說法：「使用加食鹽的熱水拖地，地板會比較快乾。」小綺想要找出影響地板乾燥速率的變因，使用表(二)中四組的水來拖地，當中的哪兩組相互比較，最不可能達到他的目的？", "opts": ["第一組和第二組", "第一組和第三組", "第二組和第三組", "第二組和第四組"], "ans": 2, "ex": "要找出影響乾燥速率的變因，比較的兩組之間只能有一個條件不同。第二組（熱水、沒加鹽）和第三組（冷水、加鹽）同時改了溫度和加鹽兩個條件，就算結果不同也分不出是誰造成的。其他三個選項都只差一個條件。", "fig": "fig/cap115_23_表二.png", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.6024, "wrongOpt": "D", "ch": "1"}, {"id": "c113_20", "src": "cap", "sec": "1-1", "concept": "用反例檢驗說法", "q": "已知刺絲胞動物皆生活在水中。小花看到某網友提到：「所有刺絲胞動物都生活在海洋中。例如海月水母就是一種生活在海洋中的刺絲胞動物」，若小花想驗證「所有刺絲胞動物都生活在海洋中」這句話是否成立，則下列何種方法最能達到此目的？", "opts": ["從海洋中找到海月水母", "從海月水母身上找到刺絲胞", "從淡水中找到一種刺絲胞動物", "從海洋中找到很多種刺絲胞動物"], "ans": 2, "ex": "要檢驗「所有刺絲胞動物都生活在海洋中」，在海洋裡找到再多例子，也不能證明「所有」都是如此；只要在淡水中找到一種刺絲胞動物，就能證明這句話不成立。用一個反例推翻說法，是檢驗假說很有力的方法。", "fig": "", "figTop": false, "year": 113, "pas": "", "warn": "", "rate": 0.5699, "wrongOpt": "D", "ch": "1"}, {"id": "c104_15", "src": "cap", "sec": "1-2", "concept": "物鏡轉換與視野亮度", "q": "如圖(九)所示，甲、乙為一臺複式顯微鏡上兩種不同倍率的物鏡。小閔使用此顯微鏡觀察口腔皮膜細胞，他按照使用顯微鏡的標準步驟依序開始操作，有關物鏡的轉換及視野亮度的變化，下列敘述何者最合理？", "opts": ["先用甲再轉換到乙，視野亮度變暗", "先用甲再轉換到乙，視野亮度變亮", "先用乙再轉換到甲，視野亮度變暗", "先用乙再轉換到甲，視野亮度變亮"], "ans": 0, "ex": "物鏡越長、倍率越高，所以甲是低倍、乙是高倍。標準步驟是先用低倍物鏡找到目標，再轉到高倍。換成高倍後看到的範圍變小、進入眼睛的光變少，所以視野會變暗。", "fig": "fig/cap104_15_圖九.png", "figTop": false, "year": 104, "pas": "", "warn": "", "ch": "1"}, {"id": "c105_14", "src": "cap", "sec": "1-2", "concept": "倍率與視野範圍", "q": "甲、乙及丙為一臺複式顯微鏡上三種不同倍率的物鏡，其外型如圖(七)所示。小柏使用此顯微鏡觀察植物細胞，他利用乙物鏡觀察後，再轉換另一物鏡，結果視野下的細胞數目減少，有關他轉換後的物鏡及其視野範圍的變化，下列何者最合理？", "opts": ["甲，視野範圍放大", "甲，視野範圍縮小", "丙，視野範圍放大", "丙，視野範圍縮小"], "ans": 3, "ex": "細胞數目變少，代表放大倍率變高，所以換成比乙更長的丙物鏡。倍率越高，每個細胞看起來越大，但看到的範圍變小、細胞數目變少，所以視野範圍是縮小。", "fig": "fig/cap105_14_圖七.png", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "1"}, {"id": "c109_18", "src": "cap", "sec": "1-2", "concept": "解剖與複式顯微鏡的成像", "q": "某生使用放大倍率為40倍的解剖顯微鏡觀察某一圖形，視野下如圖(十三)所示。在不轉動圖形的情況下，若改以目鏡10X、物鏡4X的複式顯微鏡觀察，下列何者最可能是在該倍率的複式顯微鏡視野下觀察到的圖形？", "opts": ["", "", "", "圖(十二)XY"], "ans": 3, "ex": "複式顯微鏡的倍率＝目鏡×物鏡＝10×4＝40 倍，和原本的解剖顯微鏡一樣，所以圖形大小不變，排除較小的 A、B。解剖顯微鏡看到的是正立的像，複式顯微鏡的像上下左右都顛倒，原本在左上方的橫線會跑到右下方，所以是 D。", "fig": "fig/cap109_18_full.webp", "figTop": true, "year": 109, "pas": "", "warn": "", "optsImg": true, "ch": "1"}, {"id": "c110_25", "src": "cap", "sec": "1-2", "concept": "解剖顯微鏡的像是正立的", "q": "小宏利用解剖顯微鏡觀察蝴蝶幼蟲的細部構造，在觀察時，載物板上的幼蟲不斷地往右上角移動，則在視野下觀察到幼蟲的移動方向應為下列何者？", "opts": ["往右上角移動", "往右下角移動", "往左上角移動", "往左下角移動चᡀጱރݝ΍༧ТރํރᖓТԏ໣ޑډ਼਻ໆ(mL)3954863328180"], "ans": 0, "ex": "解剖顯微鏡看到的是正立的像，實物怎麼移動、視野裡就怎麼移動，所以幼蟲往右上角爬，視野中也往右上角移動。如果用的是複式顯微鏡，像上下左右顛倒，才會看到往左下角移動。", "fig": "fig/cap110_25_full.webp", "figTop": true, "year": 110, "pas": "", "warn": "", "optsImg": true, "ch": "1"}, {"id": "c111_17", "src": "cap", "sec": "1-2", "concept": "選擇適合的顯微鏡", "q": "圖(六)為實驗課的二臺顯微鏡，阿彥和阿秀想利用顯微鏡觀察一朵小花，若阿彥要觀察萼片細胞的葉綠體大小，而阿秀要觀察雄蕊的數目，則最適合他們使用的顯微鏡分別為何？", "opts": ["兩人皆為複式顯微鏡", "兩人皆為解剖顯微鏡", "阿彥為複式顯微鏡，阿秀為解剖顯微鏡", "阿彥為解剖顯微鏡，阿秀為複式顯微鏡"], "ans": 2, "ex": "葉綠體在細胞裡面、非常小，要用倍率高的複式顯微鏡（圖左）；數雄蕊只要把整朵花稍微放大、看立體的樣子，用解剖顯微鏡（圖右）就好。常見錯法是弄反，以為看細胞也能用解剖顯微鏡。", "fig": "fig/cap111_17_圖六.png", "figTop": false, "year": 111, "pas": "", "warn": "", "rate": 0.6807, "wrongOpt": "D", "ch": "1"}, {"id": "c114_27", "src": "cap", "sec": "1-2", "concept": "顯微鏡各構造的功能", "q": "博物館展示一臺19世紀的骨董複式顯微鏡，如圖(十三)。小文根據博物館提供的說明，比較該顯微鏡和現代複式顯微鏡各構造的功能，何者差異最大？", "opts": ["", "", "", ""], "ans": 3, "ex": "丁的功能是「調整角度讓光線射入樣本」，相當於現代顯微鏡的反光鏡（或光源）；光圈是調整進光量的多少，不是改變光的方向，所以 D 差異最大。甲＝可換倍率的物鏡、乙＝讓影像清晰的調節輪、丙＝放樣本的載物臺，功能都對得上。", "fig": "fig/cap114_27_full.webp", "figTop": true, "year": 114, "pas": "", "warn": "", "optsImg": true, "rate": 0.4166, "wrongOpt": "A", "ch": "1"}, {"id": "c106_18", "src": "cap", "sec": "1-3", "concept": "粒線體與葉綠體的功能", "q": "表(四)為甲細胞和乙細胞內有無兩種特定生理作用的比較。根據此表推測甲、乙細胞內特定構造的有無，下列敘述何者最合理？", "opts": ["僅甲細胞含有粒線體", "僅甲細胞含有葉綠體", "僅乙細胞含有粒線體", "僅乙細胞含有葉綠體"], "ans": 3, "ex": "第一欄「葡萄糖＋氧氣→水＋二氧化碳」是呼吸作用，在粒線體進行；第二欄是光合作用，在葉綠體進行。甲、乙都能行呼吸作用，所以都有粒線體；只有乙能行光合作用，所以只有乙含有葉綠體。", "fig": "fig/cap106_18_表四.webp", "figTop": false, "year": 106, "pas": "", "warn": "", "ch": "1"}, {"id": "c107_19", "src": "cap", "sec": "1-3", "concept": "粒線體提供能量", "q": "圖(十一)為植物葉肉細胞的構造示意圖，甲、乙、丙、丁分別代表細胞內不同的構造，則下列何者主要負責產生能量供細胞使用？", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ex": "圖中甲是細胞核、乙是液胞、丙是粒線體、丁是葉綠體。粒線體進行呼吸作用，分解養分產生能量給細胞使用；葉綠體負責製造養分，不是直接供應能量。", "fig": "fig/cap107_19_圖十一.webp", "figTop": false, "year": 107, "pas": "", "warn": "", "ch": "1"}, {"id": "c109_50", "src": "cap", "sec": "1-3", "concept": "細菌沒有細胞核", "q": "根據本文，肺炎鏈球菌不具有下列何者？", "opts": ["DNA", "細胞質", "細胞膜", "細胞核"], "ans": 3, "ex": "肺炎鏈球菌是一種細菌。細菌也是由細胞構成，有細胞膜、細胞質和遺傳物質 DNA，但 DNA 沒有被核膜包住，所以沒有細胞核。", "fig": "", "figTop": false, "year": 109, "pas": "某病患被細菌感染而引發肺炎，經檢查後證實為肺炎鏈球菌感染。", "warn": "", "ch": "1"}, {"id": "c105_01", "src": "cap", "sec": "1-4", "concept": "擴散作用", "q": "圖(一)為方糖投入水中的過程示意圖，其中乙到丙的過程與下列何種情形最類似？", "opts": ["在客廳聞到廚房飄來的飯菜味", "使用吸管可吸取杯內下方的水", "二氧化碳降溫加壓可製成乾冰", "純金項鍊長久維持原來的色澤"], "ans": 0, "ex": "乙到丙是方糖溶解後，糖分子從濃度高的杯底慢慢散開到整杯水，這是擴散作用。在客廳聞到廚房的飯菜味，也是氣味分子由濃度高處往濃度低處擴散。吸管吸水是靠大氣壓力，製成乾冰是狀態改變，都不是擴散。", "fig": "fig/cap105_01_圖一.webp", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "1"}, {"id": "c108_04", "src": "cap", "sec": "1-4", "concept": "滲透作用與細胞壁", "q": "若將人體的白血球及植物的保衛細胞分別置於兩杯蒸餾水中一段時間，關於哪一種細胞不會破裂及其原因，下列何者最合理？", "opts": ["白血球，因具粒線體", "白血球，因具細胞膜", "保衛細胞，因具液胞", "保衛細胞，因具細胞壁"], "ans": 3, "ex": "蒸餾水裡沒有溶質，水會從外面滲透進入細胞，使細胞脹大。白血球只有細胞膜，會脹破；保衛細胞是植物細胞，外面有堅韌的細胞壁撐住，所以不會破裂。液胞會吸水變大，但真正防止破裂的是細胞壁。", "fig": "", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "1"}, {"id": "c113_09", "src": "cap", "sec": "1-4", "concept": "滲透作用（醃漬）", "q": "醃漬高麗菜時，常會在高麗菜的葉片上灑鹽。圖(七)為正常的葉片細胞示意圖，表(一)中的圖為小凱與小萍預測醃漬後的葉片細胞可能的示意圖。推論醃漬後的示意圖與造成葉片細胞變化的原因，下列何者正確？", "opts": ["小凱的圖正確，水由細胞內流至外界", "小凱的圖正確，鹽由細胞內流至外界", "小萍的圖正確，水由外界流至細胞內", "小萍的圖正確，鹽由外界流至細胞內"], "ans": 0, "ex": "灑鹽後，細胞外的鹽水濃度比細胞內高，細胞內的水會往外滲透流失，細胞膜以內的部分縮小、和細胞壁分開，就像小凱畫的圖。細胞壁很堅硬，外形幾乎不變。移動的是水，不是鹽，所以不是 B。", "fig": "fig/cap113_09_full.webp", "figTop": true, "year": 113, "pas": "", "warn": "", "rate": 0.7435, "wrongOpt": "D", "ch": "1"}, {"id": "c115_06", "src": "cap", "sec": "1-5", "concept": "生物的尺度", "q": "圖(三)比較了斑馬魚幼魚與其構造和病毒的大小。圖(四)為透過顯微鏡觀察斑馬魚幼魚時的畫面。根據圖中資訊，推測灰色斑塊最可能為下列何者？", "opts": ["一個血紅素蛋白", "一個病毒", "一個粒線體", "一個細胞"], "ans": 3, "ex": "圖四的比例尺代表 20 μm，灰色斑塊的長度和比例尺差不多，大約十幾 μm。對照圖三，這個大小落在「細胞」（10～30 μm）的範圍；粒線體只有 0.5～1 μm、病毒和血紅素蛋白更小，在這個放大倍率下看不出單獨一個。", "fig": "fig/cap115_06_圖三圖四.webp", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.8717, "wrongOpt": "B", "ch": "1"}, {"id": "c104_21", "src": "cap", "sec": "3-1", "concept": "韌皮部的位置", "q": "圖(十二)為某種植物莖部橫切面的構造示意圖。已知「介殼蟲」是以此種植物韌皮部中的汁液為食，若想分析介殼蟲所吸取的成分，則應選擇圖中的哪一部位進行研究最合適？", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ex": "莖的維管束中，靠外側（白色）的是韌皮部，靠內側、靠近中心（灰色）的是木質部。介殼蟲吸的是韌皮部的汁液，所以要選指向維管束外側白色部分的甲；乙、丙指的是木質部，丁是莖中央的髓。", "fig": "fig/cap104_21_圖十二.webp", "figTop": false, "year": 104, "pas": "", "warn": "", "ch": "3"}, {"id": "c105_36", "src": "cap", "sec": "3-1", "concept": "木本莖由外而內的構造", "q": "研究員利用工具鑽取榕樹樹幹的維管束組織，從樹皮表面上的X點垂直鑽入樹幹中心後，將取出的組織依其主要功能分別標示為甲、乙、丙，如表(七)所示。依表中的主要功能判斷，比較此三者與X點間的距離，下列何者最合理？", "opts": ["甲＜丙＜乙", "甲＜乙＜丙", "乙＜丙＜甲", "乙＜甲＜丙"], "ans": 0, "ex": "從樹皮表面往樹幹中心鑽，依序會經過韌皮部（運輸養分，甲）、形成層（細胞分裂，丙）、木質部（運輸水分，乙）。所以和 X 點的距離是甲＜丙＜乙。", "fig": "fig/cap105_36_表七.png", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "3"}, {"id": "c107_26", "src": "cap", "sec": "3-1", "concept": "醣類由韌皮部運輸", "q": "圖(十八)為竹子與其鄰近竹筍的生長示意圖，圖中箭頭表示物質X由竹子到竹筍的運輸方向。已知物質X來自光合作用，則有關物質X及其由何種構造運輸的敘述，下列何者最合理？", "opts": ["物質X為醣類，由韌皮部運輸", "物質X為醣類，由木質部運輸", "物質X為水分，由韌皮部運輸", "物質X為水分，由木質部運輸"], "ans": 0, "ex": "光合作用製造的是醣類（養分），由韌皮部運輸。圖中箭頭從竹子的葉往下、經過地下莖送到竹筍，是往下送；木質部只會把水由根往上送，所以是韌皮部運輸醣類。", "fig": "fig/cap107_26_圖十八.png", "figTop": false, "year": 107, "pas": "", "warn": "", "ch": "3"}, {"id": "c108_41", "src": "cap", "sec": "3-1", "concept": "韌皮部可上下雙向運輸", "q": "圖(二十)為維管束植物體內物質流向的示意圖，甲為維管束內運輸物質的管道，乙為此種管道內主要的運送物質，箭頭表示乙物質在不同時間點於管道內可能的流動方向。下列有關甲和乙的敘述，何者最合理？", "opts": ["甲位在木質部，乙為醣類", "甲位在韌皮部，乙為醣類", "甲位在木質部，乙為礦物質", "甲位在韌皮部，乙為礦物質"], "ans": 1, "ex": "圖中同一種管道裡，箭頭有往上也有往下，表示運送的物質會雙向流動。木質部裡的水和礦物質只會由下往上；能上下雙向運送的是韌皮部裡的醣類，所以選 B。", "fig": "fig/cap108_41_圖二十.webp", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "3"}, {"id": "c109_05", "src": "cap", "sec": "3-1", "concept": "蒸散作用與氣孔", "q": "圖(三)為植物體內物質運輸示意圖，圖(四)為葉片氣孔狀態示意圖。白天植物進行旺盛的蒸散作用時，有關體內水分運輸方向(甲或乙)及葉片氣孔狀態(丙或丁)，下列組合何者正確？", "opts": ["甲，丙", "甲，丁", "乙，丙", "乙，丁"], "ans": 2, "ex": "蒸散作用時，水分由根往上運送到葉，圖三中箭頭往上的是乙。旺盛的蒸散需要氣孔打開讓水蒸氣散出去：丙的兩個保衛細胞中間有開口，是打開的氣孔；丁是關閉的。", "fig": "fig/cap109_05_圖三圖四.webp", "figTop": false, "year": 109, "pas": "", "warn": "", "ch": "3"}, {"id": "c110_11", "src": "cap", "sec": "3-1", "concept": "氣孔分布的實驗", "q": "小紀在某株植物上取了四個條件相同的枝條，分別標示為甲、乙、丙、丁，並對枝條上的葉子進行以下處理(已知葉片塗上白膠處的氣孔無法進行蒸散作用)：甲：不做任何處理乙：只在葉片上表皮塗上白膠丙：只在葉片下表皮塗上白膠丁：在葉片上下表皮皆塗上白膠之後將甲、乙、丙、丁分別插入水位高度相同的量筒中，再把量筒開口處以膜封閉，如圖(三)所示。將四組實驗裝置給予相同條件的環境，一段時間後記錄量筒內散失的水分量，實驗結果如圖(四)所示。根據此結果，下列關於此株植物氣孔位置分布的推論，何者最合理？", "opts": ["葉片上表皮無氣孔分布", "主要分布於葉片上表皮", "主要分布於葉片下表皮", "平均分布於葉片上下表皮"], "ans": 2, "ex": "塗白膠就堵住了那一面的氣孔。只塗上表皮的乙，散失的水比甲少一些；只塗下表皮的丙卻少很多，表示大部分的水是從下表皮散失，氣孔主要分布在下表皮。乙比甲少，代表上表皮也有少量氣孔，所以 A 不對。", "fig": "fig/cap110_11_圖三圖四.webp", "figTop": false, "year": 110, "pas": "", "warn": "", "ch": "3"}, {"id": "c111_46", "src": "cap", "sec": "3-1", "concept": "木質部與韌皮部的運輸方向", "q": "根據本文，推論哪一位同學的作答結果正確？", "opts": ["同學1", "同學2", "同學3", "同學4老師在介紹維管束植物體內的運輸構造時，繪製了某植物莖的切面示意圖，如圖(二十五)所示，並以甲、乙、丙及丁分別標示不同的構造。老師接著請4位同學上臺，各自寫出醣類與水在植物體內主要的運輸位置與方向，學生的作答結果如表(十一)所示。"], "ans": 3, "ex": "維管束中木質部在內側、韌皮部在外側：丙是木質部，運送水分，只會由下往上；丁是韌皮部，運送醣類，可以往上也可以往下。同學 4 的答案完全符合；同學 3 把醣類寫成只會往下，是常見的錯誤。", "fig": "fig/cap111_46_full.webp", "figTop": true, "year": 111, "pas": "", "warn": "", "optsImg": true, "rate": 0.6159, "wrongOpt": "B", "ch": "3"}, {"id": "c114_22", "src": "cap", "sec": "3-1", "concept": "蒸散作用與木質部", "q": "圖(十二)為某植物的莖部剖面示意圖。若想利用某儀器探測其蒸散作用的速率，關於實驗所需探測的圖中部位及對應理由，下列何者最合理？", "opts": ["甲，因為它是運輸水分的部位", "甲，因為它是運輸有機養分的部位", "乙，因為它是運輸水分的部位", "乙，因為它是運輸有機養分的部位"], "ans": 2, "ex": "蒸散作用散失的水，是木質部從根往上運送來的，所以要探測運輸水分的木質部。維管束中靠內側（灰色）的乙是木質部；靠外側（白色）的甲是運輸有機養分的韌皮部。", "fig": "fig/cap114_22_圖十二.png", "figTop": false, "year": 114, "pas": "", "warn": "", "rate": 0.6461, "wrongOpt": "A", "ch": "3"}, {"id": "c115_45", "src": "cap", "sec": "3-1", "concept": "蒸散作用的測量", "q": "若依據暄暄的方式操作實驗，但將實驗裝置移至通風良好的乾燥室內放置兩天，則最不可能發生下列哪一種情況？", "opts": ["第一、二天記錄到的氣泡移動距離總和相近", "在兩天的相同時段中，氣泡移動的距離相近", "植物氣孔關閉減緩蒸散，使管中氣泡移動量很小", "植物從氣孔吸收水分向下運輸，使管中氣泡向左移動"], "ans": 3, "ex": "氣孔是讓水蒸氣散出去的通道，植物不會從氣孔吸收水分再往下運輸；水是根吸收後經木質部往上送，所以 D 最不可能。室內通風乾燥、每天條件差不多，兩天的數據可能相近（A、B）；太乾燥時植物也可能關閉氣孔、減少水分散失（C）。", "fig": "fig/cap115_45_圖二十八二十九.webp", "figTop": false, "year": 115, "pas": "圖(二十八)為暄暄用來記錄植物蒸散作用速率的裝置，管中的氣泡會隨著植物的蒸散作用逐漸向右方移動，如箭頭所示，可以藉此推測植物的蒸散量。當需要使氣泡回到起始點時，可打開閥門使注水管的水向下流，氣泡就會向左移動。暄暄將此裝置放在室外一天，並重複於每一整點記錄氣泡的移動距離後，將氣泡的位置重新移動回起始點以收集下一整點的數據，最後得到圖(二十九)的數據。", "warn": "", "rate": 0.6309, "wrongOpt": "C", "ch": "3"}, {"id": "c104_24", "src": "cap", "sec": "3-2", "concept": "血液循環的路徑", "q": "圖(十四)為人體內甲、乙兩種器官各自的動脈及靜脈血液中氧氣含量之示意圖。根據此圖推測，紅血球從獲得氧氣到釋出氧氣的運輸過程中，有關血液流經甲、乙及心臟的途徑，下列何者最合理？", "opts": ["甲→心臟→乙", "甲→乙→心臟", "乙→心臟→甲", "乙→甲→心臟1"], "ans": 2, "ex": "紅血球在肺獲得氧氣：乙的靜脈含氧量比動脈高，表示血液流過乙時得到氧氣，乙是肺。甲的靜脈含氧量比動脈低，是釋出氧氣的身體器官。從肺回來的血液要先回心臟，再由心臟送到全身，所以是乙→心臟→甲。", "fig": "fig/cap104_24_full.webp", "figTop": true, "year": 104, "pas": "", "warn": "", "optsImg": true, "ch": "3"}, {"id": "c105_32", "src": "cap", "sec": "3-2", "concept": "動脈、靜脈與淋巴管", "q": "圖(十七)為人體血液循環和淋巴循環的部分示意圖，甲、乙和丙為不同的管道名稱，圖中代表液體的流動方向，代表物質由微血管滲出。根據此圖判斷，甲、乙和丙內有無紅血球的敘述，何者最合理？", "opts": ["僅甲、乙有", "僅甲、丙有", "甲、乙、丙皆有", "甲、乙、丙皆沒有"], "ans": 1, "ex": "丙把心臟的血液送往微血管，是動脈；甲收集微血管和乙的液體送回心臟，是靜脈；乙收集從微血管滲出的液體，是淋巴管。紅血球太大，不會滲出微血管，所以淋巴管裡沒有紅血球，只有甲、丙有。", "fig": "fig/cap105_32_圖十七.png", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "3"}, {"id": "c107_37", "src": "cap", "sec": "3-2", "concept": "全身的靜脈血先回右心房", "q": "圖(二十七)為人體注射藥劑的部位示意圖，關於藥劑從甲部位或乙部位注入人體的靜脈後，經由血液循環最先進入心臟腔室的敘述，下列何者最合理？", "opts": ["甲、乙部位的藥劑皆先進入右心房", "甲、乙部位的藥劑皆先進入左心房", "甲部位的藥劑先進入右心房，乙部位的藥劑先進入左心房", "甲部位的藥劑先進入左心房，乙部位的藥劑先進入右心房"], "ans": 0, "ex": "不論從左手（甲）或右手（乙）的靜脈注射，藥劑都會跟著靜脈血經大靜脈回到右心房。左、右心房不是看身體的哪一側，而是看血液從哪裡回來：從全身回來進右心房，從肺回來進左心房。", "fig": "fig/cap107_37_圖二十七.png", "figTop": false, "year": 107, "pas": "", "warn": "", "ch": "3"}, {"id": "c108_37", "src": "cap", "sec": "3-2", "concept": "體循環回到右心房", "q": "圖(十七)是人體心臟及其所連接的血管之示意圖，甲、乙為心臟右邊的腔室，丙、丁為心臟左邊的腔室。腦細胞的代謝廢物進入血液循環後，會最先到達圖中的哪一腔室？", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ex": "腦細胞的代謝廢物進入腦部微血管後，經靜脈、大靜脈回到心臟，最先到達右心房。圖中甲、乙在心臟右邊，上方的甲是右心房、下方的乙是右心室，所以答案是甲。", "fig": "fig/cap108_37_圖十七.png", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "3"}, {"id": "c110_34", "src": "cap", "sec": "3-2", "concept": "瓣膜防止血液逆流", "q": "小平心臟內的某一個瓣膜不能完全閉合，當他的心室收縮時，其心臟內的充氧血會逆流回心房。根據上述，推測此閉合不全的瓣膜最可能位於下列何處？", "opts": ["左心房和左心室之間", "右心房和右心室之間", "肺靜脈和左心房之間", "大靜脈和右心房之間ҘΌ΍Чᆵ᡼໌ᓐೂᆵчᐋຂᆵ᡼ଭαങᆵ᡼ᙔ᜹ټഁ᡼ᆵ"], "ans": 0, "ex": "充氧血在心臟的左半邊。心室收縮時充氧血逆流回心房，表示左心房和左心室之間的瓣膜關不緊。右心房、右心室裡是缺氧血；肺靜脈和左心房、大靜脈和右心房之間，也不是心室和心房的交界。", "fig": "fig/cap110_34_full.webp", "figTop": true, "year": 110, "pas": "", "warn": "", "optsImg": true, "ch": "3"}, {"id": "c111_26", "src": "cap", "sec": "3-2", "concept": "心室與連接的血管", "q": "表(五)為某人體心臟內甲、乙兩個心室的血液中O2含量，根據此表，推測此兩心室所連接的血管，下列敘述何者最合理？", "opts": ["甲與大靜脈連接", "甲與肺靜脈連接", "乙與主動脈連接", "乙與肺動脈連接"], "ans": 3, "ex": "甲心室含氧量高，是左心室，連接主動脈；乙心室含氧量較低，是右心室，把缺氧血送到肺，連接肺動脈。大靜脈和肺靜脈都是接到心房，不是接心室，所以 A、B 都錯。", "fig": "fig/cap111_26_表五.png", "figTop": false, "year": 111, "pas": "", "warn": "", "rate": 0.391, "wrongOpt": "B", "ch": "3"}, {"id": "c112_31", "src": "cap", "sec": "3-2", "concept": "顯微鏡下的小動脈、微血管、小靜脈", "q": "阿芳利用複式顯微鏡觀察小魚尾鰭內血液流動的方向，所觀察到的視野影像如圖(十七)所示，圖中的箭頭表示血液流動方向。若將培養皿往左緩慢地移動，則在視野中依序消失的血管，應為下列何者？", "opts": ["小動脈、微血管、小靜脈", "小動脈、小靜脈、微血管", "小靜脈、微血管、小動脈", "小靜脈、小動脈、微血管"], "ans": 2, "ex": "微血管中的血液由左往右流，所以左邊的血管把血送進微血管（小動脈），右邊的血管把血收集起來（小靜脈）。複式顯微鏡的影像上下左右顛倒，培養皿往左移，視野中的影像會往右移，最右邊的小靜脈最先消失，接著是微血管，最後是小動脈。很多人忘了影像會反向移動而選 A。", "fig": "fig/cap112_31_圖十七.png", "figTop": false, "year": 112, "pas": "", "warn": "", "rate": 0.5013, "wrongOpt": "A", "ch": "3"}, {"id": "c114_46", "src": "cap", "sec": "3-2", "concept": "血小板與凝血", "q": "表中的X最可能為下列何者？", "opts": ["淋巴", "白血球", "紅血球", "血小板閱讀下列敘述後，回答47～48題小花至醫院做「出血時間檢查」，步驟如下：ㄧ、以針刺耳垂使其流血。二、等30秒後以濾紙接觸耳垂。三、每隔30秒後再次以濾紙接觸耳垂，以此類推直到出血停止。小花檢測結果的紀錄如圖(二十七)，圖中●代表每次以濾紙接觸耳垂所得到的出血範圍。表(十二)為本項檢查的參考數值與相關判定的資料。如圖(二十八)，阿貴將砝碼掛在動滑輪下，在砝碼靜止不動後，施力使彈簧秤以穩定且緩慢的速度向上移動。他用質量100g、200g、300g的砝碼分別做三次上述實驗，並記錄彈簧秤拉力讀數F與砝碼質量M的關係，如圖(二十九)。"], "ans": 3, "ex": "圖二十七的出血點有十多個，每 30 秒接觸一次，出血超過 5 分鐘，屬於「過長」。出血停不下來和凝血有關，血液中負責凝血的是血小板，所以 X 減少症最可能是血小板減少。", "fig": "fig/cap114_46_full.webp", "figTop": true, "year": 114, "pas": "", "warn": "", "optsImg": true, "rate": 0.7205, "wrongOpt": "C", "ch": "3"}, {"id": "c115_39", "src": "cap", "sec": "3-2", "concept": "血液回到心臟先進心房", "q": "甲、乙兩人討論從人體肺臟、肝臟流出的血液進入心臟之路徑，以下為兩人看法：甲：肺臟流出的血液會由血管最先進入右心房。乙：肝臟流出的血液會由血管最先進入右心室。甲、乙兩人的看法是否正確？", "opts": ["僅甲正確", "僅乙正確", "兩人皆正確", "兩人皆錯誤"], "ans": 3, "ex": "肺臟流出的血液經肺靜脈，最先進入左心房，不是右心房；肝臟流出的血液經大靜脈，最先進入右心房，不是右心室。血液回到心臟一定先進心房，所以兩人都錯。", "fig": "", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.4154, "wrongOpt": "A", "ch": "3"}, {"id": "c109_51", "src": "cap", "sec": "3-3", "concept": "白血球對抗病原體", "q": "已知紅血球為血液中數量最多的血球，根據本文，關於甲、乙、丙的推論，下列何者正確？", "opts": ["甲：血小板，乙：白血球，丙：紅血球", "甲：血小板，乙：紅血球，丙：白血球", "甲：白血球，乙：紅血球，丙：血小板", "甲：白血球，乙：血小板，丙：紅血球某次小哲寒假出國旅行途中，發現飛機上方無雲，但下方卻有一片雲海，此時東方的滿月剛好升起。他朝向座位右側窗外拍攝了一張照片，如圖(三十二)所示，此時飛機位於北緯35度附近、高度約為1萬2千公尺。小哲回家查詢資料後，認為拍攝此照片時，飛機高度大致位於大氣分層中的甲層頂部和乙層底部之交界附近。某病患被細菌感染而引發肺炎，經檢查後證實為肺炎鏈球菌感染，以甲、乙、丙代表人體內的三種血球，表(七)為此病患檢驗結果及正常成年人血球數量統計資料的比較，結果顯示此病患體內對抗病原菌的某種血球數量有異常增加的現象。"], "ans": 3, "ex": "紅血球數量最多，所以丙是紅血球。被細菌感染時，負責對抗病原菌的白血球會增加：甲的正常值 0.4～1.0，病患卻有 2.9，異常增加，所以甲是白血球；剩下的乙是血小板。", "fig": "fig/cap109_51_full.webp", "figTop": true, "year": 109, "pas": "", "warn": "", "optsImg": true, "ch": "3"}, {"id": "c104_22", "src": "cap", "sec": "4-1", "concept": "意識行為與反射", "q": "當小庭看到驚悚畫面時，兩眼直視但身體刻意保持不動，而小瑋看到驚悚畫面時，則是大聲尖叫且用手遮眼。比較兩人從接受刺激到產生反應的相關敘述，下列何者最合理？", "opts": ["兩人的反應都是屬於反射作用", "兩人的反應都有藉著肌肉來表現", "小庭在此過程中的受器是眼睛；小瑋的受器則是手", "小庭只有感覺神經參與傳導；小瑋只有運動神經參與傳導"], "ans": 1, "ex": "小庭刻意保持不動、小瑋尖叫遮眼，都是大腦判斷後的意識行為，不是反射。兩人的受器都是眼睛；不論是用力保持不動，或是尖叫、用手遮眼，都要靠肌肉收縮來表現，也都需要感覺神經和運動神經一起參與。", "fig": "", "figTop": false, "year": 104, "pas": "", "warn": "", "ch": "4"}, {"id": "c106_24", "src": "cap", "sec": "4-1", "concept": "反射與感覺的神經路徑", "q": "一般人手指觸電後會立刻縮手，也會感覺疼痛而趕緊甩手。圖(十四)為人體指尖觸電時神經訊息傳導的示意圖，圖中甲、乙、丙分別為訊息傳導所經過的神經，下列有關此訊息傳導路徑相關敘述與所對應的神經之配對，何者最合理？", "opts": ["觸電後立刻縮手—甲、乙", "觸電後感覺疼痛—乙、丙", "受器接受刺激後傳至中樞神經—乙、丙", "中樞神經發出甩手的命令後傳至動器—丙、甲"], "ans": 0, "ex": "甲把指尖的訊息傳到脊髓（感覺神經），乙把脊髓的命令傳到手臂肌肉（運動神經），丙把訊息由脊髓往上傳到腦。立刻縮手是反射，路徑是甲→脊髓→乙；感覺疼痛是訊息經甲到脊髓、再經丙傳到大腦，沒有經過乙。", "fig": "fig/cap106_24_圖十四.png", "figTop": false, "year": 106, "pas": "", "warn": "", "ch": "4"}, {"id": "c107_24", "src": "cap", "sec": "4-1", "concept": "意識行為的神經傳導", "q": "小湘在街上看到久違的好朋友，興奮地立即揮手打招呼。下列與上述過程相關的神經系統運作之敘述，何者正確？", "opts": ["立即揮手是屬於反射作用", "此過程的受器是在手部肌肉", "興奮的感覺是由感覺神經產生", "揮手的命令是由運動神經傳遞"], "ans": 3, "ex": "看到好友才揮手，是經過大腦判斷的意識行為，不是反射。受器是眼睛，不是手部肌肉；「興奮」的感覺由大腦產生，感覺神經只負責傳遞訊息；揮手的命令由大腦發出，經運動神經傳到手部肌肉。", "fig": "", "figTop": false, "year": 107, "pas": "", "warn": "", "ch": "4"}, {"id": "c108_25", "src": "cap", "sec": "4-1", "concept": "感覺在大腦產生", "q": "人們對榴槤的特殊氣味會有不同感受，有些人覺得香，有些人覺得臭，而不同感受主要是由下列哪一部位所產生？", "opts": ["鼻子", "腦幹", "大腦", "小腦"], "ans": 2, "ex": "鼻子是受器，只負責接收氣味的刺激；訊息傳到大腦後才產生「香」或「臭」的感覺，每個人大腦的判斷不同，所以感受不同。腦幹管呼吸、心跳，小腦管平衡協調。", "fig": "", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "4"}, {"id": "c109_06", "src": "cap", "sec": "4-1", "concept": "小腦協調平衡", "q": "小芳閉上眼睛做某種動作，其過程如圖(五)所示。當她從甲動作轉換成乙動作時，協調肌肉活動以維持平衡主要是由下列何者調控？", "opts": ["腦垂腺", "小腦", "腦幹", "脊髓"], "ans": 1, "ex": "從雙腳站立換成單腳站立，需要協調全身肌肉來保持平衡，這是小腦的功能。腦幹負責心跳、呼吸等維持生命的活動；腦垂腺是內分泌腺，負責分泌激素。", "fig": "fig/cap109_06_圖五.webp", "figTop": false, "year": 109, "pas": "", "warn": "", "ch": "4"}, {"id": "c110_28", "src": "cap", "sec": "4-1", "concept": "練習與大腦", "q": "表(七)為阿煌重複完成5次相同動作的時間紀錄表，由此表的資訊推論，有關此動作的敘述，下列何者錯誤？", "opts": ["控制中樞僅為脊髓", "需有感覺神經元參與", "需有運動神經元參與", "經練習可縮短反應時間"], "ans": 0, "ex": "完成動作的時間從 59 秒縮短到 25 秒，表示練習可以改善表現，這是大腦學習的結果，不是只靠脊髓的反射，所以 A 錯。完成這個動作需要感覺神經元把訊息傳進來、運動神經元把命令傳出去，B、C、D 都對。", "fig": "fig/cap110_28_表七.webp", "figTop": false, "year": 110, "pas": "", "warn": "", "ch": "4"}, {"id": "c111_50", "src": "cap", "sec": "4-1", "concept": "受器、中樞與運動神經", "q": "根據本文，關於此回合兩人玩遊戲時的神經傳遞敘述，下列何者正確？", "opts": ["兩人從接受刺激至產生反應的時間相同", "眼睛內的肌肉接收刺激", "刺激經由感覺神經元傳遞至腦幹並發出命令", "命令經由運動神經元傳遞至手指以按鈴搶答阿明和小豪正在試玩一套自行設計的月相卡牌遊戲，其規則與流程說明如下所示：兩人在某次取牌後，阿明先放置好卡牌並按鈴，小豪聽到鈴聲數秒後，才將卡牌放置完成，兩人的卡牌組合如圖(二十八)所示。"], "ans": 3, "ex": "小豪聽到鈴聲數秒後才完成，兩人的反應時間不同。接收光刺激的是眼睛裡的感光細胞，不是肌肉；判斷月相、決定按鈴的中樞是大腦，不是腦幹。命令經運動神經元傳到手指的肌肉去按鈴，所以 D 正確。", "fig": "fig/cap111_50_full.webp", "figTop": true, "year": 111, "pas": "阿明和小豪正在試玩一套自行設計的月相卡牌遊戲：兩人取牌後，各自把卡牌放到紙板上，先放好的人按鈴。（遊戲的詳細規則與本題無關，略）", "warn": "", "optsImg": true, "rate": 0.6718, "wrongOpt": "C", "ch": "4"}, {"id": "c114_12", "src": "cap", "sec": "4-1", "concept": "受器、動器與控制中樞", "q": "當看到喜愛的明星時，小明站在原地大聲尖叫，而阿華則是追著明星跑。表(二)整理上述兩人行為中神經傳導的過程，其中哪一項目的敘述正確？", "opts": ["受器", "動器", "控制的中樞", "傳導的神經"], "ans": 2, "ex": "兩人都是看到明星後做出的意識行為：受器都是眼睛（不是嘴巴或腳），控制中樞都是大腦。尖叫和奔跑都要靠肌肉當動器，而且都需要感覺神經元和運動神經元一起參與。", "fig": "fig/cap114_12_表二.png", "figTop": false, "year": 114, "pas": "", "warn": "", "rate": 0.696, "wrongOpt": "A", "ch": "4"}, {"id": "c115_10", "src": "cap", "sec": "4-1", "concept": "腦的分區與功能", "q": "圖(七)為人體的中樞神經系統示意圖。阿強參加賽跑時，一聽到槍聲響起便邁開步伐起跑，關於此過程涉及的神經系統運作，下列敘述何者正確？", "opts": ["由甲產生槍聲的聽覺", "由乙調節呼吸的快慢", "由丙維持身體的平衡", "由丁主掌步伐的大小"], "ans": 0, "ex": "甲是大腦、乙是小腦、丙是腦幹、丁是脊髓。聽覺在大腦產生，A 正確；調節呼吸快慢的是腦幹（丙），維持平衡的是小腦（乙），步伐大小由大腦控制，脊髓負責傳導訊息和簡單的反射。", "fig": "fig/cap115_10_圖七.png", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.6213, "wrongOpt": "D", "ch": "4"}, {"id": "c112_08", "src": "cap", "sec": "4-2", "concept": "胰島素降低血糖", "q": "「若食物中所含的糖分容易被人體快速吸收，則會使血糖急遽上升，而引起某激素分泌增加，進而造成血糖快速下降，甚至形成餐後血糖過低的現象。」根據上述，有關此激素的敘述，下列何者正確？", "opts": ["是由肝臟分泌的胰島素", "是由肝臟分泌的升糖素", "是由胰島分泌的胰島素", "是由胰島分泌的升糖素"], "ans": 2, "ex": "能讓血糖下降的激素是胰島素，由胰臟裡的胰島分泌。升糖素的作用相反，會讓血糖上升。肝臟會把葡萄糖存成肝醣，但它不是分泌胰島素的內分泌腺。", "fig": "", "figTop": false, "year": 112, "pas": "", "warn": "", "rate": 0.6588, "wrongOpt": "A", "ch": "4"}, {"id": "c113_05", "src": "cap", "sec": "4-2", "concept": "激素由血液運送", "q": "人體副甲狀腺分泌的激素是經由X所運送，若此激素分泌過多，會影響骨骼中的Y含量，可能造成骨質疏鬆。根據上述說明，推論X和Y最可能為下列何者？", "opts": ["X為血液，Y為鈣", "X為血液，Y為鉀", "X為消化液，Y為鈣", "X為消化液，Y為鉀"], "ans": 0, "ex": "內分泌腺沒有導管，分泌的激素直接進入血液，由血液運送到全身，所以 X 是血液。骨骼的重要成分是鈣，副甲狀腺分泌的激素太多，會讓骨中的鈣流失，造成骨質疏鬆。", "fig": "", "figTop": false, "year": 113, "pas": "", "warn": "", "rate": 0.8132, "wrongOpt": "C", "ch": "4"}, {"id": "c107_46", "src": "cap", "sec": "4-3", "concept": "向光性與背地性", "q": "將種有植株的兩相同盆栽，分別放在甲、乙兩個獨立的黑暗房間內，且將光源擺放在不同位置照射植株，經一段時間後，其生長狀況如圖(三十六)所示。若此時把光源移開，再經一段時間後，觀察莖的生長方向。若圖(三十七)為預測莖生長方向的示意圖，則下列有關甲、乙兩處的莖生長之敘述，何者最合理？", "opts": ["兩處的莖皆如生長", "兩處的莖皆如生長", "甲處的莖如生長；乙處的莖如生長", "甲處的莖如生長；乙處的莖如生長"], "ans": 0, "ex": "原本莖朝著光源彎曲，是向光性。光源移走後房間全黑，莖不再受光的影響，但仍然受重力影響：莖有背地性，會往上（遠離地面）生長，所以甲、乙兩處的莖都會像①一樣向上彎。", "fig": "fig/cap107_46_full.webp", "figTop": true, "year": 107, "pas": "", "warn": "", "optsImg": true, "ch": "4"}, {"id": "c111_05", "src": "cap", "sec": "4-3", "concept": "植物感應的快慢", "q": "下列為四種植物對於環境刺激的感應，何者從接受刺激到出現反應，所需的時間最長?", "opts": ["朱槿植株受光刺激後向光彎曲", "捕蠅草受昆蟲刺激後葉片閉合", "酢漿草在太陽下山後葉片下垂", "含羞草受外力觸碰後小葉閉合"], "ans": 0, "ex": "向光彎曲是莖的兩側生長速度不同造成的，要慢慢長才看得出來，需要好幾天。捕蠅草、含羞草的葉片閉合是觸發運動，幾秒內就完成；酢漿草的睡眠運動也在天黑後不久就出現。", "fig": "", "figTop": false, "year": 111, "pas": "", "warn": "", "rate": 0.6888, "wrongOpt": "C", "ch": "4"}, {"id": "c104_38", "src": "cap", "sec": "5-1", "concept": "呼氣時橫膈上升", "q": "圖(二十一)為人體進行呼吸運動時，橫膈位置變動的示意圖。利用藍色氯化亞鈷試紙可檢測人體呼出氣體中的某物質。有關呼氣時橫膈位置的變化及可使試紙變色的物質，下列何者正確？", "opts": ["甲→乙，水", "甲→乙，二氧化碳", "乙→甲，水", "乙→甲，二氧化碳3"], "ans": 2, "ex": "呼氣時橫膈上升、胸腔變小，把肺裡的氣體擠出去。圖中甲的橫膈在虛線上方、乙在虛線下方，所以呼氣是乙→甲。藍色氯化亞鈷試紙遇到水會變成粉紅色，檢驗的是呼出氣體中的水；二氧化碳要用澄清石灰水檢驗。", "fig": "fig/cap104_38_full.webp", "figTop": true, "year": 104, "pas": "", "warn": "", "optsImg": true, "ch": "5"}, {"id": "c108_19", "src": "cap", "sec": "5-1", "concept": "呼氣時的胸腔變化", "q": "當人體呼吸系統內氣體由肺泡往支氣管、氣管移動，此時進行呼吸運動的相關構造之變化，下列何者最合理？", "opts": ["肺漸變大", "横膈上升", "胸腔變大", "肋骨上舉"], "ans": 1, "ex": "氣體由肺泡往支氣管、氣管移動，表示正在呼氣。呼氣時橫膈上升、肋骨下降，胸腔變小，肺也跟著變小，把氣體擠出去。A、C、D 都是吸氣時的變化。", "fig": "", "figTop": false, "year": 108, "pas": "", "warn": "", "ch": "5"}, {"id": "c115_11", "src": "cap", "sec": "5-1", "concept": "吸氣與呼氣時的胸腔變化", "q": "圖(八)記錄了某人盡力吸氣後、盡力呼氣後，肺部中分別容納的氣體量。依此圖判斷胸腔變化，下列敘述何者正確？", "opts": ["動作甲：橫膈上升且肋骨上舉", "動作甲：橫膈下降且肋骨下降", "動作乙：橫膈上升且肋骨下降", "動作乙：橫膈下降且肋骨上舉"], "ans": 2, "ex": "動作甲肺裡的氣體多，是盡力吸氣後；動作乙氣體少，是盡力呼氣後。吸氣時橫膈下降、肋骨上舉；呼氣時橫膈上升、肋骨下降，所以 C 正確。", "fig": "fig/cap115_11_圖八.webp", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.6673, "wrongOpt": "A", "ch": "5"}, {"id": "c114_20", "src": "cap", "sec": "5-2", "concept": "血糖恆定與胰島素", "q": "一群健康成人吃了等量的食物甲或乙後，平均血糖濃度的變化如圖(十)。已知健康成人空腹平均血糖濃度約為90mg/dL，根據此圖推論，下列何者最合理？", "opts": ["進食後，甲比乙更早導致升糖素分泌量增加", "進食後，甲比乙更早導致胰島素分泌量增加", "進食後，乙比甲更早導致升糖素分泌量增加", "進食後，乙比甲更早導致胰島素分泌量增加"], "ans": 1, "ex": "吃了食物甲後，血糖大約 40 分鐘就升到最高；吃乙要到 70 多分鐘才稍微上升。血糖升高時，胰島會分泌胰島素讓血糖下降，所以甲比乙更早使胰島素分泌增加。升糖素是在血糖太低時才增加。", "fig": "fig/cap114_20_圖十.webp", "figTop": false, "year": 114, "pas": "", "warn": "", "rate": 0.5454, "wrongOpt": "A", "ch": "5"}, {"id": "c106_36", "src": "cap", "sec": "5-3", "concept": "肝臟製造尿素、腎臟排除尿素", "q": "圖(二十一)為人體心臟、肝臟和腎臟之間血液循環的示意圖，箭頭代表血液流動的方向，甲、乙、丙及丁分別代表不同的血管。根據此圖的血液流動方向，分別比較甲和乙、丙和丁血液中的尿素濃度，下列何者最合理？", "opts": ["甲＜乙，丙＜丁", "甲＜乙，丙＞丁", "甲＞乙，丙＜丁", "甲＞乙，丙＞丁"], "ans": 2, "ex": "看箭頭方向：血液由乙流進肝臟、由甲流出；由丁流進腎臟、由丙流出。肝臟把含氮廢物轉成尿素，所以流出的甲尿素較多（甲＞乙）；腎臟把尿素濾出形成尿液，所以流出的丙尿素較少（丙＜丁）。", "fig": "fig/cap106_36_圖二十一.png", "figTop": false, "year": 106, "pas": "", "warn": "", "ch": "5"}, {"id": "c109_43", "src": "cap", "sec": "5-3", "concept": "尿素在肝臟形成", "q": "已知人體代謝甲物質後所產生的含氮廢物，會運送至乙器官中轉換成尿素。根據上述，關於甲和乙的配對，下列何者正確？", "opts": ["甲：脂質，乙：腎臟", "甲：脂質，乙：肝臟", "甲：蛋白質，乙：腎臟", "甲：蛋白質，乙：肝臟"], "ans": 3, "ex": "蛋白質含有氮，分解後會產生含氮廢物，由血液送到肝臟轉換成尿素，再由腎臟排出體外。脂質不含氮；腎臟負責排除尿素，不是製造尿素。", "fig": "", "figTop": false, "year": 109, "pas": "", "warn": "", "ch": "5"}, {"id": "c111_35", "src": "cap", "sec": "5-3", "concept": "肝臟會製造尿素", "q": "小萍比較人體血液中的尿素與氧氣在「流出甲器官後」的濃度變化，結果如表(八)所示。根據上述，推測甲器官最可能是下列何者？", "opts": ["膀胱", "肝臟", "肺臟", "腎臟"], "ans": 1, "ex": "血液流出甲器官後尿素上升，表示這個器官會製造尿素，所以是肝臟；氧氣下降，是因為肝細胞消耗了氧氣。流過腎臟後尿素會下降，流過肺臟後氧氣會上升。常見錯誤是一看到尿素就選腎臟。", "fig": "fig/cap111_35_表八.png", "figTop": false, "year": 111, "pas": "", "warn": "", "rate": 0.4172, "wrongOpt": "D", "ch": "5"}, {"id": "c113_33", "src": "cap", "sec": "5-3", "concept": "腎臟形成尿液", "q": "圖(十八)為人體的泌尿系統和其所連接血管的示意圖，其中乙血管中的氧氣含量比甲血管多。有關丙器官的生理功能及血液進出丙的路徑，下列敘述何者正確？", "opts": ["形成尿素，甲→丙→乙", "形成尿素，乙→丙→甲", "形成尿液，甲→丙→乙", "形成尿液，乙→丙→甲"], "ans": 3, "ex": "丙是腎臟，功能是過濾血液、形成尿液（尿素是在肝臟形成的）。乙血管含氧量較多，是從心臟送來的腎動脈，血液由乙流入腎臟，過濾後由甲（腎靜脈）流出，所以路徑是乙→丙→甲。", "fig": "fig/cap113_33_圖十八.webp", "figTop": false, "year": 113, "pas": "", "warn": "", "rate": 0.4961, "wrongOpt": "B", "ch": "5"}, {"id": "c115_20", "src": "cap", "sec": "5-3", "concept": "排泄器官的功能", "q": "蝦子的頭部有個稱為「觸角腺」的構造，可以過濾體內的液體，再將其中有用的物質吸收，並排出多餘的含氮廢物。依上述資訊推測，觸角腺的功能最類似人體哪個器官的功能？", "opts": ["肝臟", "大腸", "腎臟", "尿道"], "ans": 2, "ex": "觸角腺會過濾體內的液體、把有用的物質吸收回來、排出多餘的含氮廢物，這正是人體腎臟的工作。肝臟負責製造尿素，尿道只是排出尿液的通道，大腸主要吸收水分、形成糞便。", "fig": "", "figTop": false, "year": 115, "pas": "", "warn": "", "rate": 0.5181, "wrongOpt": "A", "ch": "5"}, {"id": "c105_08", "src": "cap", "sec": "5-4", "concept": "外溫動物", "q": "某動物在不同環境溫度下的體溫變化，如圖(三)所示。則此動物維持體溫方式的相關敘述，下列何者正確？", "opts": ["外溫動物，主要藉由代謝產生的熱量維持體溫", "外溫動物，主要從外界環境吸收熱量維持體溫", "內溫動物，主要藉由代謝產生的熱量維持體溫", "內溫動物，主要從外界環境吸收熱量維持體溫"], "ans": 1, "ex": "圖中這種動物的體溫隨環境溫度上升而上升，幾乎和環境一樣，是外溫動物。外溫動物主要從外界環境吸收熱量來維持體溫；內溫動物才是靠代謝產生的熱量，讓體溫維持恆定。", "fig": "fig/cap105_08_圖三.png", "figTop": false, "year": 105, "pas": "", "warn": "", "ch": "5"}, {"id": "c107_06", "src": "cap", "sec": "5-4", "concept": "內溫動物與外溫動物", "q": "圖(三)為某園區內的標示牌。根據此圖，若管理員想將此組標示牌再加上「外溫動物區」及「內溫動物區」，關於此想法是否適當及其原因，下列說明何者最合理？", "opts": ["適當，左方全為外溫動物，右方全為內溫動物", "適當，左方全為內溫動物，右方全為外溫動物", "不適當，左方全為外溫動物，但右方不全為內溫動物", "不適當，左方全為內溫動物，但右方不全為外溫動物"], "ans": 2, "ex": "魚類和兩生類都是外溫動物，左方可以標「外溫動物區」；但右方的爬蟲類也是外溫動物，只有哺乳類是內溫動物，右方不全是內溫動物，所以這樣標示不適當。", "fig": "fig/cap107_06_圖三.png", "figTop": false, "year": 107, "pas": "", "warn": "", "ch": "5"}, {"id": "c109_19", "src": "cap", "sec": "5-4", "concept": "體表溫度與體溫", "q": "小樺在氣溫27°C及17°C時的手部皮膚溫度分別如圖(十四)所示。表(三)是四種不同品牌零食開始熔化的溫度。正常體溫的情況下，若小樺希望「在27°C及17°C兩種氣溫下，零食拿在手上都不會熔化，但放入口中卻都會熔化」，則下列哪一品牌最符合他的期待？", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ex": "手部皮膚在 27℃ 時是 33℃、在 17℃ 時是 30℃，零食開始熔化的溫度要高於 33℃，拿在手上才不會熔化；口腔溫度接近體溫約 37℃，熔化溫度要低於 37℃ 才會在嘴裡熔化。只有丙（35℃）符合。", "fig": "fig/cap109_19_圖十四表三.webp", "figTop": false, "year": 109, "pas": "", "warn": "", "ch": "5"}, {"id": "c110_04", "src": "cap", "sec": "5-4", "concept": "體溫的調節", "q": "阿華分別進入甲和乙兩種環境，在甲環境中肌肉出現顫抖的現象，而在乙環境中皮膚表面的血管擴張、血液量增加。若僅以調節體溫恆定的正常反應判斷，則下列有關甲、乙環境溫度及阿華體溫的比較，何者可能成立？", "opts": ["甲環境溫度＞乙環境溫度＞體溫", "甲環境溫度＞體溫＞乙環境溫度", "乙環境溫度＞甲環境溫度＞體溫", "乙環境溫度＞體溫＞甲環境溫度"], "ans": 3, "ex": "肌肉顫抖是為了產生熱量，表示甲環境很冷，溫度比體溫低；皮膚血管擴張、血液量增加是為了散熱，表示乙環境很熱。所以可能是乙環境溫度＞體溫＞甲環境溫度。", "fig": "", "figTop": false, "year": 110, "pas": "", "warn": "", "ch": "5"}, {"id": "c112_22", "src": "cap", "sec": "5-4", "concept": "體溫恆定與發病", "q": "人體感染微生物到發病前所經過的時間稱為「潛伏期」。圖(十一)為小杉體溫恆定範圍及近十天每天早上的體溫紀錄，已知此段時間小杉感染了微生物X，其潛伏期為1～3天，發病時的症狀之一為體溫無法維持在恆定範圍內，則下列哪一天最可能為小杉初次感染此微生物的時間？", "opts": ["第1天", "第3天", "第6天", "第8天"], "ans": 1, "ex": "第 6 天體溫超出恆定範圍，表示這天開始發病。潛伏期 1～3 天，往前推算，感染的日子在第 3～5 天之間，選項中只有第 3 天符合。第 1 天離發病太久，第 6、8 天則已經發病或恢復了。", "fig": "fig/cap112_22_圖十一.webp", "figTop": false, "year": 112, "pas": "", "warn": "", "rate": 0.6907, "wrongOpt": "C", "ch": "5"}]};
const APP_ID = "n7bio", VER = DATA.meta.version, ENDPOINT = DATA.meta.endpoint || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEC = Object.fromEntries(DATA.secs.map(s => [s.id, s]));
const CH = Object.fromEntries(DATA.chapters.map(c => [c.id, c]));
const chSecs = id => DATA.secs.filter(s => s.ch === id);
const QS = DATA.qs, QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const LETTERS = "ABCD";

/* ───── 儲存（手機本機；讀寫一律包 try） ───── */
const KEY = "n7bio:state";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let S = Object.assign({xp:0, done:{}, wrong:{}, cards:{}, sims:{}, badges:{}, best:{}}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ───── 上課模式 ───── */
let TEACH = false;
try{ TEACH = localStorage.getItem("n7bio:teach") === "1"; }catch(e){}
function applyTeach(){
  document.body.classList.toggle("teach", TEACH);
  const b = $("#modebtn"); b.textContent = TEACH ? "🎓 上課模式中" : "🎓 上課模式"; b.setAttribute("aria-pressed", TEACH);
}
function toggleTeach(){ TEACH = !TEACH; try{ localStorage.setItem("n7bio:teach", TEACH ? "1" : "0"); }catch(e){} applyTeach(); render(); toast(TEACH ? "上課模式：字放大、答案由老師揭曉、不記分" : "回到自學模式"); }

/* ───── 後台紀錄佇列（上課模式不送） ───── */
const SID = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let DEV = ""; try{ DEV = localStorage.getItem("n7bio:dev") || ""; if(!DEV){ DEV = "d" + Math.random().toString(36).slice(2, 8); localStorage.setItem("n7bio:dev", DEV); } }catch(e){ DEV = "anon"; }
let QUEUE = []; try{ QUEUE = JSON.parse(localStorage.getItem("n7bio:queue")) || []; }catch(e){}
function logEv(ev){
  if(TEACH) return;
  QUEUE.push(Object.assign({id: SID + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5), ts: Date.now(), sid: SID, dev: DEV, v: VER}, ev));
  if(QUEUE.length > 500) QUEUE = QUEUE.slice(-500);
  try{ localStorage.setItem("n7bio:queue", JSON.stringify(QUEUE)); }catch(e){}
  flushSoon();
}
let flushT = null;
function flushSoon(){ clearTimeout(flushT); flushT = setTimeout(flush, 2500); }
async function flush(){
  if(!ENDPOINT || !QUEUE.length || !navigator.onLine) return;
  const batch = QUEUE.slice(0, 50);
  try{
    const r = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({app: APP_ID, events: batch})});
    const j = await r.json();
    if(j.ok){ const ids = new Set(batch.map(x => x.id)); QUEUE = QUEUE.filter(x => !ids.has(x.id)); try{ localStorage.setItem("n7bio:queue", JSON.stringify(QUEUE)); }catch(e){} if(QUEUE.length) flushSoon(); }
  }catch(e){}
}
addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flush(); });

/* ───── XP / 等級 / 徽章 ───── */
const LV_XP = 120;

function drawXP(){ const lv = Math.floor(S.xp / LV_XP) + 1; $("#lv").textContent = "Lv " + lv; $("#xpbar").style.width = (S.xp % LV_XP) / LV_XP * 100 + "%"; }
const BADGES = [
  {id:"first", ic:"🌱", name:"第一題", desc:"答對第一題"},
  {id:"streak5", ic:"🔥", name:"五連對", desc:"一回合連續答對 5 題"},
  {id:"perfect", ic:"💯", name:"全對過關", desc:"一回合全部答對"},
  {id:"cards", ic:"📚", name:"讀卡達人", desc:"看完一整章的觀念卡"},
  {id:"lab", ic:"🧪", name:"實驗家", desc:"一整章的模擬實驗都玩過"},

  {id:"cap", ic:"🏆", name:"會考挑戰者", desc:"完成一回會考挑戰"},

];
function award(id){ if(TEACH || S.badges[id]) return; S.badges[id] = Date.now(); save(); const b = BADGES.find(x => x.id === id); toast(`🎖️ 獲得徽章「${b.name}」`); confetti(); }
function checkCardsBadge(){ if(DATA.chapters.some(c => chSecs(c.id).every(s => (S.cards[s.id] || 0) >= s.cards.length))) award("cards"); }
function checkLabBadge(){ if(DATA.chapters.some(c => chSecs(c.id).some(s => s.sim) && chSecs(c.id).every(s => !s.sim || S.sims[s.id]))) award("lab"); }
function chStars(id){ const ss = chSecs(id).map(s => secStars(s.id)); return ss.length ? Math.round(ss.reduce((a, b) => a + b, 0) / ss.length) : 0; }

/* ───── 小工具 ───── */
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className = "confetti";
  const cs = ["#ff8a3d","#e84393","#22a35a","#2f80ed","#f5a524","#7c6cf0"];
  for(let i = 0; i < 40; i++){ const e = document.createElement("i"); e.style.left = Math.random()*100 + "vw"; e.style.background = cs[i % cs.length]; e.style.animationDelay = Math.random()*0.3 + "s"; box.appendChild(e); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 1700);
}
let AC = null;
function beep(ok){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination); o.frequency.value = ok ? 880 : 220; o.type = ok ? "triangle" : "sawtooth"; g.gain.setValueAtTime(.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .25); o.start(); o.stop(AC.currentTime + .26); }catch(e){} }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function starsHTML(n){ return '<span class="stars">' + [0,1,2].map(i => i < n ? "★" : '<span class="off">★</span>').join("") + "</span>"; }
function secStars(id){ const b = S.best[id] || 0; return b >= 1 ? 3 : b >= .8 ? 2 : b > 0 ? 1 : 0; }
function srcName(q){ return q.src === "cap" ? `會考 ${q.year}` : q.src === "school" ? `段考原題 ${q.year}-${q.exam}` : "練習題"; }

function go(h){ if(location.hash === h) render(); else location.hash = h; }
addEventListener("hashchange", render);
// 返回：答題中 → 回到題數選單；有站內上一頁 → 上一頁；直接開深層網址 → 回上一層
const STACK = [];
let QUIZ_ON = false;
function parentOf(h){
  const p = h.slice(2).split("/");
  if(p[0] === "s" && p[1] && p.length > 2) return "#/s/" + p[1];
  if(p[0] === "s" && SEC[p[1]]) return "#/c/" + SEC[p[1]].ch;
  if(["exam","cap","practice"].includes(p[0]) && CH[p[1]]) return "#/c/" + p[1];
  return "#/";
}
function goBack(){
  if(QUIZ_ON){ QUIZ_ON = false; render(); return; }
  if(STACK.length > 1) history.back();
  else { STACK.length = 0; location.replace(parentOf(location.hash || "#/")); }   // 往上一層：取代目前紀錄，不會又退回深層頁
}
let lastView = "";
function render(){
  const h = location.hash || "#/";
  QUIZ_ON = false;
  if(STACK.length > 1 && STACK[STACK.length - 2] === h) STACK.pop();
  else if(STACK[STACK.length - 1] !== h) STACK.push(h);
  $("#backbtn").hidden = (h === "#/" || h === "#");
  const p = h.slice(2).split("/");
  window.scrollTo(0, 0);
  const app = $("#app");
  const chOf = x => CH[x] ? x : undefined;
  if(p[0] === "s" && SEC[p[1]]) vSec(app, SEC[p[1]], p[2] || "cards", p[3]);
  else if(p[0] === "c" && CH[p[1]]) vChap(app, CH[p[1]]);
  else if(p[0] === "exam") vQuizStart(app, {kind:"school", ch:chOf(p[1])});
  else if(p[0] === "cap") vQuizStart(app, {kind:"cap", ch:chOf(p[1])});
  else if(p[0] === "practice") vQuizStart(app, {kind:"practice", ch:chOf(p[1])});
  else if(p[0] === "wrong") vQuizStart(app, {kind:"wrong"});
  else if(p[0] === "badges") vBadges(app);
  else if(p[0] === "about") vAbout(app);
  else vHome(app);
  if(h !== lastView){ lastView = h; logEv({k:"view", page:h.slice(1)}); }
}

/* ───── 首頁：選章 ───── */
function islandBtn(s){
  return `<button class="isl" style="--c:${s.color}" onclick="go('#/s/${s.id}')">
      <span class="ic">${s.icon}</span>
      <span><span class="pill">${s.id}</span><b>${esc(s.title)}</b>${starsHTML(secStars(s.id))}
      <span class="muted" style="display:block">觀念卡 ${Math.min(S.cards[s.id]||0, s.cards.length)}/${s.cards.length}${s.sim ? (S.sims[s.id] ? "・🧪 已實驗" : "・🧪 未實驗") : ""}</span></span>
    </button>`;
}
function vHome(app){
  const wrongN = Object.keys(S.wrong).length;
  const nSchool = QS.filter(q => q.src === "school").length, nCap = QS.filter(q => q.src === "cap").length;
  if(!TEACH && DATA.chapters.every(c => chStars(c.id) >= 1)) award("allch");
  app.innerHTML = `
  <div class="hero"><div class="blob">🔬</div>

    <p>${DATA.chapters.length} 座大島、${DATA.secs.length} 個小站。選一章出發：讀觀念卡 → 玩模擬實驗 → 闖關答題！</p>
  </div>
  <div class="islands">
    ${DATA.chapters.map(c => { const ss = chSecs(c.id), read = ss.reduce((a, s) => a + Math.min(S.cards[s.id]||0, s.cards.length), 0), all = ss.reduce((a, s) => a + s.cards.length, 0);
      return `<button class="isl" style="--c:${c.color}" onclick="go('#/c/${c.id}')">
      <span class="ic">${c.icon}</span>
      <span style="flex:1"><span class="pill">第 ${c.id} 章</span><b>${esc(c.title)}</b>${starsHTML(chStars(c.id))}
      <span class="muted" style="display:block">${ss.length} 節・觀念卡 ${read}/${all}</span>
      <span class="prog" style="display:block;margin:4px 0 0"><i style="width:${all ? read/all*100 : 0}%;background:${c.color}"></i></span></span>
    </button>`; }).join("")}
  </div>
  <div class="tiles">
    <button class="tile" onclick="go('#/exam')"><span class="ic">🏫</span><b>段考挑戰</b><small>學校歷屆段考原題 ${nSchool} 題，可選章節</small></button>
    <button class="tile" onclick="go('#/cap')"><span class="ic">🏆</span><b>會考挑戰</b><small>會考考古題 ${nCap} 題・附全國答對率</small></button>
    <button class="tile" onclick="go('#/wrong')"><span class="ic">📕</span><b>錯題本</b><small>${wrongN ? `還有 ${wrongN} 題，連對 2 次就畢業` : "目前沒有錯題"}</small></button>
    <button class="tile" onclick="go('#/badges')"><span class="ic">🎖️</span><b>徽章牆</b><small>已得 ${Object.keys(S.badges).length}/${BADGES.length} 枚</small></button>
    <button class="tile" onclick="go('#/about')"><span class="ic">ℹ️</span><b>怎麼用</b><small>自學與上課模式說明</small></button>
  </div>
  <p class="foot">版本 ${esc(VER)}・題目來源：課本、學校段考原題、國中教育會考</p>`;
}
function vChap(app, c){
  const n = k => QS.filter(q => q.ch === c.id && q.src === k).length;
  app.innerHTML = `
  <div class="hero" style="background:linear-gradient(135deg,${c.color},#7c6cf0)"><div class="blob">${c.icon}</div>
    <h1>第 ${c.id} 章 ${esc(c.title)}</h1><p>${esc(c.desc || "")}</p>
  </div>
  <div class="islands">${chSecs(c.id).map(islandBtn).join("")}</div>
  <div class="tiles">
    ${n("practice") ? `<button class="tile" onclick="go('#/practice/${c.id}')"><span class="ic">✏️</span><b>整章練習</b><small>${n("practice")} 題・各節混合</small></button>` : ""}
    ${n("school") ? `<button class="tile" onclick="go('#/exam/${c.id}')"><span class="ic">🏫</span><b>本章段考題</b><small>學校原題 ${n("school")} 題</small></button>` : ""}
    ${n("cap") ? `<button class="tile" onclick="go('#/cap/${c.id}')"><span class="ic">🏆</span><b>本章會考題</b><small>${n("cap")} 題</small></button>` : ""}
