 "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["口腔", "食道", "胃", "小腸。"], "ans": 3, "ch": "2"}, {"id": "s113_2_q17", "src": "school", "sec": "2-3", "concept": "葉的構造", "q": "植物進行光合作用時，水是藉由附圖中何種構造進入葉的內部參與反應？", "ex": "根吸收的水分經由莖的木質部，再由葉脈（維管束）送進葉片內部。圖中乙指的是葉脈，所以答案是乙；甲、丁是表皮，丙是葉肉，己是氣孔。", "fig": "fig/s113_2_q17.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "己。"], "ans": 1, "ch": "2"}, {"id": "s113_2_q18", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色", "q": "「測定光合作用產物」的實驗裝置如附圖。在實驗中，葉片放在酒精中隔水加熱的目的是什麼？", "ex": "酒精可以溶解葉綠素，把葉片的綠色去掉，滴碘液後才看得清楚顏色變化。要隔水加熱是因為酒精易燃，不能直接用火加熱。", "fig": "fig/s113_2_q18.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["使葉片變得較為柔軟", "加酒精可保持葉色翠綠", "因為酒精容易沸騰，可縮短加熱時間", "將葉綠素溶解除去，以免干擾實驗結果。"], "ans": 3, "ch": "2"}, {"id": "s113_2_q19", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色流程", "q": "試由下列選項中，選出與「測定光合作用產物」有關的四項實驗操作，並排出正確的順序：(甲)葉片在熱水中漂洗；(乙)葉片在本氏液中隔水加熱；(丙)加亞甲藍液；(丁)加碘液；(戊)葉片在酒精中隔水加熱；(己)葉片在沸水中煮沸2 分鐘。", "ex": "正確流程是：沸水中煮沸（己）→酒精中隔水加熱去除葉綠素（戊）→熱水中漂洗（甲）→滴碘液（丁）。本氏液和亞甲藍液都不是用來測葉片澱粉的。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己乙丁戊", "乙己丙丁", "甲已丁戊", "己戊甲丁。"], "ans": 3, "ch": "2"}, {"id": "s113_2_q20", "src": "school", "sec": "2-4", "concept": "小腸吸收", "q": "下列有關消化系統的敘述，何者正確?", "ex": "小腸是吸收胺基酸、葡萄糖等養分的主要場所。膽汁幫助的是脂質消化，不是蛋白質；小腸內壁的絨毛是用來增加吸收面積，不是增加蠕動；纖維素無法消化，最後進入大腸隨糞便排出。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["膽囊切除後，將會影響蛋白質的分解", "小腸內壁的微小突起構造，可增加小腸的蠕動，加速消化", "小腸是吸收胺基酸及葡萄糖的主要場所", "纖維素因無法消化而被堆積在小腸。"], "ans": 2, "ch": "2"}, {"id": "s113_2_q21", "src": "school", "sec": "2-4", "concept": "消化器官與消化液", "q": "小美用起司、生菜、蛋和飯做了一個起司蛋包飯，有關此蛋包飯的敘述，下列何者錯誤？", "ex": "脂質是在小腸被分解，不是在胰臟；胰臟只負責分泌胰液送到小腸。膽汁不含酵素，所以不能分解蛋白質；纖維素無法被消化，不能提供能量。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["起司中的脂質會在胰臟中被分解", "飯中的澱粉會在口腔中被分解", "蛋中的蛋白質無法被膽汁分解", "生菜中的纖維素無法提供小美能量。"], "ans": 0, "ch": "2"}, {"id": "s113_2_q22", "src": "school", "sec": "2-4", "concept": "養分開始消化的位置", "q": "現有三種由僅由醣類、脂質與蛋白質依不同比例混合而成的甲、乙、丙三種食物。若取等重的三種食物，可發現三種食物在人體內變化量情形如附圖。則依養分在人體消化順序情形，可推知三種食物中，何者的脂質含量比例最高？", "ex": "醣類在口腔、蛋白質在胃、脂質到小腸才開始消化。脂質比例最高的食物，重量最晚開始明顯減少，所以是曲線最晚下降的丙。", "fig": "fig/s113_2_q22.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "三種食物的脂質含量比例相同。"], "ans": 2, "ch": "2"}, {"id": "s113_2_q23", "src": "school", "sec": "2-2", "concept": "酵素受酸鹼值影響", "q": "某酵素在37℃且於不同的酸鹼環境下的活性測試結果如右圖所示。若吃下此酵素，其在口腔、胃及小腸中的活性大小，下列何者最合理？", "ex": "這種酵素在接近中性到微鹼性時活性高。在口腔（接近中性）有活性；到了胃中強酸使它失去活性，而且它本身是蛋白質，會被胃液分解，所以到小腸也沒有活性。常見錯誤是只看小腸偏鹼而選小腸活性最高。", "fig": "fig/s113_2_q23.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 0, "ch": "2"}, {"id": "s113_2_q24", "src": "school", "sec": "2-3", "concept": "光合作用需要光", "q": "進行「測定光合作用產物」的實驗，在實驗前5 天先將植物上的某個葉片作了如右圖的處理。在經過5 天正常日照後，將該葉片取下，再依課本「測定光合作用產物」的實驗步驟操作。實驗最終葉片顏色應該比較接近下列哪一個選項？", "ex": "貼黑紙的花形部分照不到光，不能行光合作用、沒有產生澱粉，滴碘液呈黃褐色；沒貼黑紙的部分有澱粉，呈藍黑色。", "fig": "fig/s113_2_q24.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 2, "ch": "2"}, {"id": "s113_2_q25", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "附圖是人體消化系統的示意圖。關於人體的消化作用，何者正確？", "ex": "戊是肝臟，分泌的膽汁沒有酵素。蛋白質在胃（甲）中被分解但不被吸收；糞便排出叫排遺，不是排泄；丁是大腸，大腸沒有絨毛，絨毛在小腸。", "fig": "fig/s113_2_q25.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蛋白質在「甲」中被吸收", "「戊」分泌的消化液沒有酵素", "糞便由「己」器官排出的過程稱為排泄", "「丁」中的絨毛可增加吸收養分及水分的表面積。"], "ans": 1, "ch": "2"}, {"id": "s113_2_q31", "src": "school", "sec": "2-3", "concept": "氣孔開閉", "q": "當保衛細胞從「甲」狀態變成「乙」狀態時，下列何者不會發生？", "ex": "保衛細胞由甲變成乙時氣孔打開，二氧化碳可以進入、氧氣和水蒸氣可以離開，蒸散作用加快。但植物不靠氣孔吸收水分，所以水分不會由氣孔進入葉片。", "fig": "fig/s113_2_q31.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蒸散速度加快", "水分由氣孔進入葉片", "氧氣由氣孔離開葉片", "二氧化碳由氣孔進入葉片"], "ans": 1, "ch": "2"}, {"id": "s114_1_q39", "src": "school", "sec": "2-1", "concept": "纖維素", "q": "蔬果的纖維素含量高，有益人體健康。下列有關纖維素的敘述，幾項錯誤？(甲)可促進腸道蠕動；(乙)可增加排便量；(丙)是一種醣類；(丁)是植物細胞壁的主要成分；(戊)可經人體腸道吸收；(己)是一種大分子物質。", "ex": "纖維素是植物細胞壁的主要成分，屬於大分子醣類，可促進腸道蠕動、增加排便量；但人體不能消化吸收纖維素，所以只有(戊)錯誤。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "依課本知識，六項中只有(戊)「可經人體腸道吸收」錯誤（1項），四個選項都沒有1；若題意是問「幾項正確」，則為5項，對應(C)。本站暫以(C)作答；這題題目可能印錯，練習時把每一項的對錯想清楚最重要。", "pas": "", "opts": ["3", "4", "5", "6"], "ans": 2, "ch": "2"}, {"id": "s114_1_q40", "src": "school", "sec": "2-1", "concept": "食物熱量計算", "q": "右表為便利商店黑胡椒烤雞腿排握便當的營養標示，小娟放學後買了一個當晚餐，請問她身體可獲得多少大卡熱量？", "ex": "每100克含蛋白質8克、脂肪2克、碳水化合物30克，熱量＝8×4＋2×9＋30×4＝170大卡。一包裝有2份（200克），整個便當是170×2＝340大卡。常見錯誤是只算一份而選170。", "fig": "fig/s114_1_q40.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["120", "170", "340", "560"], "ans": 2, "ch": "2"}, {"id": "s114_1_q42", "src": "school", "sec": "2-1", "concept": "食物中的養分", "q": "有關食物中所含營養素的敘述，何者正確？", "ex": "鈣是構成骨骼的重要成分，多補充可以減緩骨質疏鬆。奶類、豆類主要提供蛋白質，米飯麵食主要提供澱粉；維生素也不是攝取越多越好，過量反而可能有害。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["多補充鈣質可減緩骨質疏鬆症的發生", "奶類、豆類食物是獲得澱粉的最佳來源", "三餐所吃的米飯或麵食主要是提供蛋白質", "維生素B 群功能廣泛，攝取愈多越好"], "ans": 0, "ch": "2"}, {"id": "s114_1_q43", "src": "school", "sec": "2-1", "concept": "碘液檢測澱粉", "q": "小文想知道薯條中是否含有澱粉，該如何檢測？而檢驗後會呈現的顏色應為？", "ex": "檢測澱粉要滴碘液，有澱粉會變藍黑色。本氏液是檢測葡萄糖等糖類用的；亞甲藍液是觀察細胞時用來染細胞核的。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["將薯條滴加亞甲藍液，呈現出藍紫色。", "將薯條滴加碘液，呈現出藍黑色", "將薯條滴加本氏液，呈現出淡藍色", "將薯條滴加本氏液後加熱，呈現出紅色。"], "ans": 1, "ch": "2"}, {"id": "s114_1_q44", "src": "school", "sec": "2-1", "concept": "本氏液檢測", "q": "紹瑜買了「礦泉水」、「半糖烏龍茶」和「冬瓜茶」，放入三個試管中，隨意標上試管1、2 和3，再利用試劑檢測三個試管中液體的含糖量，實驗後試管內液體的顏色如附表所示(不考慮原本飲料顏色)，請依表選出錯誤的敘述為何？", "ex": "本氏液遇到葡萄糖等糖類並加熱後才會變色，試管2呈淡藍色代表幾乎沒有糖，是礦泉水，放一晚也不會自己變成綠色，所以(D)錯。試管1紅色，含糖量最高。", "fig": "fig/s114_1_q44.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["試管1 中的液體含糖量最高", "檢測的過程若加熱可加速反應", "檢測所使用的試劑為本氏液", "試管2 若放置一晚，隔天會變綠色。"], "ans": 3, "ch": "2"}, {"id": "s114_1_q45", "src": "school", "sec": "2-2", "concept": "酵素特性", "q": "有關酵素的敘述，何者錯誤？", "ex": "酵素可以促進分解作用，也可以促進合成作用；只要環境適合，離開生物體也能作用。酵素在反應後本身不會改變，可以重複使用，不會隨即被分解，所以(D)錯。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["酵素由細胞產生，能促進生物體內分解作用", "酵素由細胞產生，能促進生物體內合成作用", "若環境適合，酵素離開生物體仍可發揮作用", "酵素進行完一次反應後，隨即被分解"], "ans": 3, "ch": "2"}, {"id": "s114_1_q46", "src": "school", "sec": "2-2", "concept": "酵素專一性", "q": "酵素具有專一性。請問何謂「專一性」？", "ex": "專一性是指一種酵素只能催化特定一種反應，例如澱粉酶只分解澱粉。(C)講的是溫度對酵素的影響，不是專一性。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["一種酵素只能在消化道的某一段中進行反應", "一種酵素只能在固定時間促進反應進行", "一種酵素只能在某一溫度範圍內進行反應", "一種酵素只能進行特定一種反應"], "ans": 3, "ch": "2"}, {"id": "s114_1_q47", "src": "school", "sec": "2-2", "concept": "酵素受溫度與pH影響", "q": "附圖為某生物體內酵素活性變化的示意圖。下列關於此酵素的敘述何者最恰當？", "ex": "從右圖看，這個酵素在pH約3時活性最高，偏好酸性環境；在酸性範圍內，pH升到3之前活性上升，超過3之後反而下降，所以(C)正確。兩張圖的縱軸不能互相比較高低，所以(A)(D)無法判斷。", "fig": "fig/s114_1_q47.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["此酵素在環境溫度37℃時的活性，一定比在環境pH 值3 時來的高", "此酵素比較偏好中性的環境下作用", "在酸性環境下，其活性不會一直隨著酸鹼值升高而升高", "pH 值對酵素活性的影響比溫度的影響來得低"], "ans": 2, "ch": "2"}, {"id": "s114_1_q48", "src": "school", "sec": "2-2", "concept": "酵素反應示意圖", "q": "附圖為生物體內進行某種代謝反應的示意圖，請判斷哪一個分子是酵素？", "ex": "乙在反應前後形狀都沒有改變，又回到循環中重複使用，所以乙是酵素。甲是受質，被分解成丙和丁兩個產物。", "fig": "fig/s114_1_q48.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1, "ch": "2"}, {"id": "s114_1_q49", "src": "school", "sec": "2-2", "concept": "唾液分解澱粉實驗", "q": "小明作「唾液對澱粉的影響實驗」，取四支試管依附表方式裝置，並放在室溫下30 分鐘後，各試管分別以2 mL 本氏液加熱檢驗，則溶液顏色變化最明顯的是哪一支試管？", "ex": "丁的新鮮唾液能在室溫下把澱粉分解成糖，加本氏液加熱後顏色變化最明顯。甲沒有唾液；乙的唾液是冰凍的，活性很低；丙的唾液煮沸過，酵素已失去活性。", "fig": "fig/s114_1_q49.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 3, "ch": "2"}, {"id": "s114_1_q50", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "如附圖所示，明翰取了三支試管，分別加入2mL的澱粉液和唾液，並將三支試管放入0℃、37℃和98℃的水中，靜置15 分鐘後進行檢測。有關檢測的相關敘述，下列何者錯誤？", "ex": "不論哪一支試管，本氏液檢測都必須隔水加熱才會變色，所以(D)錯。37℃的乙酵素活性最高，最快把澱粉分解；98℃的丙酵素失去活性，澱粉不會被分解。", "fig": "fig/s114_1_q50.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["若利用碘液進行檢測，甲、乙、丙試管可能都會呈藍黑色", "若利用本氏液進行檢測，最快變色的是乙，接下來會變色的是甲，丙不會變色", "給予充足的時間反應後，若利用碘液進行檢測，乙管可能會呈黃褐色", "若利用本氏液進行檢測，只有甲試管需加熱，乙、丙不需加熱。"], "ans": 3, "ch": "2"}, {"id": "s114_2_q1", "src": "school", "sec": "2-3", "concept": "葉的構造", "q": "下列關於植物葉的構造與功能之敘述，下列敘述何者錯誤？", "ex": "葉的表皮細胞無色透明、沒有葉綠體；葉子的綠色來自葉肉細胞（和保衛細胞）中的葉綠體，所以(D)錯。角質層可以防止水分散失；葉脈負責運輸。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["由葉片與葉柄構成，多呈片狀", "葉脈可運輸水分及養分，但不能行光合作用", "葉子表面的角質層，能防止水分散失", "葉子多為綠色，其綠色來自於表皮細胞的顏色"], "ans": 3, "ch": "2"}, {"id": "s114_2_q2", "src": "school", "sec": "2-3", "concept": "光合作用條件", "q": "有關生物進行光合作用的敘述，何者正確？", "ex": "光合作用需要陽光提供能量，把光能轉換成化學能儲存在葡萄糖中。它的原料是水和二氧化碳，產物是葡萄糖和氧氣，不是二氧化碳。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["產生葡萄糖和二氧化碳", "需要陽光提供能量", "不牽涉能量的轉換", "需要水分和氧氣"], "ans": 1, "ch": "2"}, {"id": "s114_2_q3", "src": "school", "sec": "2-3", "concept": "葉肉行光合作用", "q": "下圖是某植物葉片橫切的構造圖，圖中哪個部位是主要進行光合作用的場所？", "ex": "葉肉細胞含有大量葉綠體，是葉片主要進行光合作用的地方。圖中乙是葉肉；甲是表皮，表皮細胞沒有葉綠體，不是主要行光合作用的地方。", "fig": "fig/s114_2_q3.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1, "ch": "2"}, {"id": "s114_2_q4", "src": "school", "sec": "2-3", "concept": "光合作用原料與產物", "q": "植物進行光合作用之原料為何？", "ex": "光合作用的原料是水和二氧化碳。葉綠體是進行光合作用的場所，葡萄糖是產物，氮氣不參與光合作用。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["葉綠體、二氧化碳", "水、二氧化碳", "水、氮氣", "二氧化碳、葡萄糖"], "ans": 1, "ch": "2"}, {"id": "s114_2_q5", "src": "school", "sec": "2-3", "concept": "葉的表皮與氣孔", "q": "貞宜利用複式顯微鏡觀察葉的表皮，看到如附圖所示的影像，下列相關敘述何者錯誤？", "ex": "丙指的是兩個保衛細胞中間的開口，也就是氣孔，不是保衛細胞，所以(C)錯。乙是保衛細胞，含有葉綠體；陸生植物的氣孔多分布在葉的下表皮。", "fig": "fig/s114_2_q5.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲具有粒線體", "乙具有葉綠體", "丙為保衛細胞", "陸生植物的下表皮較易觀察到丙構造"], "ans": 2, "ch": "2"}, {"id": "s114_2_q6", "src": "school", "sec": "2-3", "concept": "光合作用的重要性", "q": "下列何者是植物進行光合作用的重要性？(甲) 產生葡萄糖可以提供自身使用；(乙)會製造氧氣供生物進行呼吸作用；(丙)可以將能量儲存在葡萄糖中，讓生物可以從葡萄糖中獲得能量；(丁)維持大氣中氧氣和二氧化碳比例的穩定", "ex": "光合作用製造葡萄糖供植物自己使用、放出氧氣供生物呼吸、把光能儲存在葡萄糖中讓其他生物也能取得能量，還能維持大氣中氧氣與二氧化碳的比例。四項都正確。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲乙丙丁", "乙丙丁", "甲乙丁", "甲丙丁"], "ans": 0, "ch": "2"}, {"id": "s114_2_q7", "src": "school", "sec": "2-3", "concept": "光合作用的目的", "q": "承上題，何者是植物行光合作用的最主要目的？", "ex": "植物行光合作用最主要是為了替自己製造養分（葡萄糖）。產生氧氣、提供其他生物能量、維持大氣穩定，都是對其他生物或環境的附帶影響。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ch": "2"}, {"id": "s114_2_q8", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色流程", "q": "摘下葉片拿掉貼紙後，依下列步驟處理：(甲)放到熱水中漂洗；(乙)放入沸水中煮2 分鐘；(丙)加入碘液；(丁)加入本氏液；(戊)放入酒精中隔水加熱。下列哪一項步驟是測定葉片澱粉的正確順序？", "ex": "測葉片澱粉的流程：先放沸水中煮（乙）→放酒精中隔水加熱去除葉綠素（戊）→放熱水中漂洗（甲）→滴碘液（丙）。本氏液不是用來測澱粉的。", "fig": "fig/s114_2_q8.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "喬巴用不透光數字貼紙貼住一片地瓜葉的上表皮，讓此葉片在日光下照射數天之後，採下來，進行澱粉測試。請回答8-10 題。", "opts": ["乙甲戊丙", "乙戊甲丙", "乙戊丁甲", "甲乙戊丙"], "ans": 1, "ch": "2"}, {"id": "s114_2_q9", "src": "school", "sec": "2-3", "concept": "光合作用需要光", "q": "葉片經澱粉測定後，顯示的顏色應為？", "ex": "甲是被不透光貼紙蓋住的數字「2」部分，照不到光不能行光合作用、沒有澱粉，滴碘液呈黃褐色；乙沒被遮住，有澱粉，呈藍黑色。", "fig": "fig/s114_2_q8.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "喬巴用不透光數字貼紙貼住一片地瓜葉的上表皮，讓此葉片在日光下照射數天之後，採下來，進行澱粉測試。請回答8-10 題。", "opts": ["甲：黃褐色、乙：黃褐色", "甲：藍黑色、乙：黃褐色", "甲：黃褐色、乙：藍黑色", "甲：藍黑色、乙：藍黑色"], "ans": 2, "ch": "2"}, {"id": "s114_2_q10", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色", "q": "本實驗溶解出葉片中葉綠素的方法，下列何者正確？", "ex": "葉片要放在裝酒精的小燒杯裡，小燒杯再放進裝水的大燒杯中隔水加熱，因為酒精容易燃燒，不能直接加熱。圖(B)葉片泡在酒精中、外層是水，所以正確。", "fig": "fig/s114_2_q10.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "喬巴用不透光數字貼紙貼住一片地瓜葉的上表皮，讓此葉片在日光下照射數天之後，採下來，進行澱粉測試。請回答8-10 題。", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 1, "ch": "2"}, {"id": "s114_2_q11", "src": "school", "sec": "2-3", "concept": "角質層", "q": "小新逛水族館時發現有個水族用具名稱為「油膜處理器」，查詢資料後發現原來是水族箱內的部分水草葉片表面會有一層X 構造，X 構造含有油脂的成分能協助隔絕水分，當水草老化腐爛後，就是部分油膜的來源。某些水草因水中不缺水使得X 構造不發達。試問X 構造應為何？", "ex": "葉片表面有一層含油脂（蠟質）的角質層，可以防止水分散失。生活在水中的水草不怕缺水，所以角質層不發達。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["葉綠素", "角質層", "葉肉", "表皮"], "ans": 1, "ch": "2"}, {"id": "s114_2_q12", "src": "school", "sec": "2-4", "concept": "消化液注入位置", "q": "消化液和其注入的消化器官配對，何者正確？", "ex": "胰液和膽汁都經由導管注入小腸；唾液在口腔作用；膽汁是儲存在膽囊而不是注入膽囊；腸液在小腸作用。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["唾液→食道", "膽汁→膽囊", "腸液→大腸", "胰液→小腸"], "ans": 3, "ch": "2"}, {"id": "s114_2_q13", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "下列對於消化器官之敘述，何者錯誤？", "ex": "絨毛在小腸，大腸沒有絨毛，所以(C)錯。大腸主要吸收水分；肝臟是人體最大的腺體；胰液能幫助醣類、蛋白質和脂質的分解。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["肝臟位於右上腹部，是人體內最大的腺體", "胰臟分泌的胰液有助於醣類、蛋白質和脂質的分解", "大腸比小腸粗，且有更多的絨毛幫助吸收", "食物殘渣、水、大腸壁剝落的細胞、腸內細菌共同形成糞便"], "ans": 2, "ch": "2"}, {"id": "s114_2_q14", "src": "school", "sec": "2-4", "concept": "膽汁", "q": "下圖為人體部分消化器官的示意圖，若阿丹體內的甲處發生阻塞，則下列關於他的消化及養分吸收功能，何者最可能發生？", "ex": "圖中甲是把膽汁從肝臟、膽囊送到小腸的膽管。膽管阻塞，膽汁無法進入小腸，脂質無法被乳化，消化脂質的功能就會下降。", "fig": "fig/s114_2_q14.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["胃液無法分解蛋白質", "胰液無法排至小腸內", "吸收葡萄糖的功能下降", "消化脂質的功能下降"], "ans": 3, "ch": "2"}, {"id": "s114_2_q15", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "人體的消化液有：(甲)唾液；(乙)胃液；(丙)胰液；(丁)膽汁；(戊)腸液。其中與蛋白質分解有關的消化液有哪些？", "ex": "能分解蛋白質的消化液是胃液、胰液、腸液。唾液只分解澱粉，膽汁不含酵素。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲乙戊", "乙丁戊", "乙丙戊", "丙丁戊"], "ans": 2, "ch": "2"}, {"id": "s114_2_q16", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "有關人體消化液和其作用的養分配對，下列何者錯誤？", "ex": "人體沒有分解纖維素的酵素，胰液可以分解醣類（澱粉）、蛋白質、脂質，但不能分解纖維素，所以丙錯。膽汁本身不分解脂質，而是把脂質乳化，題目以「作用養分」說明它和脂質有關。", "fig": "fig/s114_2_q16.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ch": "2"}, {"id": "s114_2_q17", "src": "school", "sec": "2-4", "concept": "小腸吸收", "q": "新聞報導不健康的減重方式，例如：切除一部分的「某器官」，避免吸收過多經攝食、消化所獲得的養分。由此減重方式的描述，可推測被切除一部分的「某器官」，為何種器官？", "ex": "小腸是消化和吸收養分最主要的器官，切除一部分小腸會減少養分吸收。胃、胰臟和大腸都不是主要吸收養分的地方。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["胃", "胰臟", "大腸", "小腸"], "ans": 3, "ch": "2"}, {"id": "s114_2_q18", "src": "school", "sec": "2-2", "concept": "酵素本質是蛋白質", "q": "「吃酵素產品能夠補充人體細胞產生的酵素」，依據酵素的原理知識，這種說法是否適當？", "ex": "酵素的主要成分是蛋白質，吃下肚後會像其他蛋白質一樣在消化道中被分解成胺基酸，不能直接進入細胞補充酵素。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["適當，我們所吃的酵素在人體內的活性最高", "適當，我們所吃的酵素能直接進入人體的細胞", "不適當，我們所吃的酵素會被我們消化道中的酵素分解", "不適當，我們所吃的酵素無法在人體內發揮作用"], "ans": 2, "ch": "2"}, {"id": "s114_2_q19", "src": "school", "sec": "2-4", "concept": "纖維素", "q": "關於消化系統的敘述，何者正確？", "ex": "人體無法消化纖維素，它會留在消化道中增加糞便體積。食物在胃中不必完全消化就會進入小腸；肛門排出糞便叫排遺，不是排泄；大腸不分泌消化液（腸液）。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["食物在胃中必須完全消化才能進入小腸", "纖維素在人體內可以增加糞便的體積", "糞便由肛門排出，所以肛門是排泄器官", "小腸和大腸都有腸腺可以分泌腸液"], "ans": 1, "ch": "2"}, {"id": "s114_2_q20", "src": "school", "sec": "2-2", "concept": "酵素受酸鹼值影響", "q": "小智表示：「當胃液和食物一起進入小腸之後，胃液中的酵素就會逐漸失去活性。」關於這段話是否合理？", "ex": "胃液中的酵素在酸性環境作用最好，小腸環境偏鹼性，所以進入小腸後活性逐漸降低，這段話合理。人體各處溫度差不多；小腸也不會產生鹽酸，鹽酸是胃分泌的。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["合理，胃液中的酵素在鹼性環境活性較低", "合理，因為小腸和胃的溫度大約相差20 度", "不合理，所有酵素在小腸內具有較佳的活性", "不合理，小腸能產生鹽酸，有助於胃液中的酵素分解養分"], "ans": 0, "ch": "2"}, {"id": "s114_2_q21", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "附圖是人體消化系統的示意圖，關於人體的消化作用，何者正確？", "ex": "戊是肝臟，分泌的膽汁不含酵素，所以(D)正確。甲是胃，蛋白質在胃中被消化但不被吸收；脂肪是在小腸被分解，不是在乙；丁是大腸，主要吸收養分的是小腸（丙）。", "fig": "fig/s114_2_q21.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["蛋白質在「甲」中被消化和吸收", "脂肪在「乙」器官中被分解", "「丁」是人體主要吸收養分的器官", "「戊」分泌的消化液沒有酵素"], "ans": 3, "ch": "2"}, {"id": "s114_2_q22", "src": "school", "sec": "2-4", "concept": "消化道順序", "q": "(甲)食道；(乙)小腸；(丙)胃；(丁)口腔；(戊)大腸。人體的消化管由前至後的順序為何？", "ex": "消化管由前到後依序是：口腔→食道→胃→小腸→大腸，所以是丁甲丙乙戊。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["丁甲丙乙戊", "丁甲丙戊乙", "丁甲戊丙乙", "丁丙戊乙甲"], "ans": 0, "ch": "2"}, {"id": "s114_2_q23", "src": "school", "sec": "2-4", "concept": "養分開始消化的位置", "q": "附圖為人類消化a－澱粉，b－蛋白質，c－脂肪的過程，由甲～戊表示消化管，下列敘述哪一項錯誤？", "ex": "a（澱粉）在甲（口腔）開始減少，b（蛋白質）在丙開始減少，c（脂肪）在丁開始減少，所以甲是口腔、乙是食道、丙是胃、丁是小腸。蛋白質在丙（胃）被大量消化，丙不是食道，所以(B)錯。", "fig": "fig/s114_2_q23.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["蛋白質可在丙、丁處消化", "丙處消化不多，可能是食道", "脂肪在丁處開始被分解", "消化後的養分可在丁處大量吸收"], "ans": 1, "ch": "2"}, {"id": "s112_2_q26", "src": "school", "sec": "3-1", "concept": "維管束排列", "q": "下列有關維管束的敘述，何者正確？", "ex": "向日葵是雙子葉植物，莖內維管束排列成環狀。維管束是輸導組織，主要負責運輸、不行光合作用；根莖葉的維管束彼此相連；花、果實等繁殖器官也有維管束。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["就是輸導組織，具有葉綠體行光合作用", "呈現細長管狀，但根莖葉彼此不相連", "向日葵莖內維管束的排列方式成環狀", "營養器官具備此構造，但繁殖器官缺乏"], "ans": 2, "ch": "3"}, {"id": "s112_2_q27", "src": "school", "sec": "3-1", "concept": "木質部運輸", "q": "農夫在菜園施用了一些肥料，以利植物生長，請問大多從何處吸收並送到植物體各處", "ex": "肥料中的礦物質溶在水中，由根吸收後，經木質部向上運送到植物各處。韌皮部負責運送葉片製造的養分。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["藉由根吸收後，再利用木質部來運送", "藉由葉片吸收後，再由韌皮部來運送", "藉由表皮細胞吸收後，逐步擴散至全株", "藉由根吸收後，再由韌皮部來運送"], "ans": 0, "ch": "3"}, {"id": "s112_2_q28", "src": "school", "sec": "3-1", "concept": "形成層", "q": "上圖為多年生木本植物莖的橫切面，試問哪一個構造令其能夠逐年加粗的？", "ex": "木本植物莖的維管束內有形成層（ㄇ），形成層細胞會不斷分裂，向內產生木質部、向外產生韌皮部，使莖逐年加粗。ㄅ是表皮、ㄆ是韌皮部、ㄈ是木質部。", "fig": "fig/s112_2_q28.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["ㄅ", "ㄆ", "ㄇ", "ㄈ"], "ans": 2, "ch": "3"}, {"id": "s112_2_q29", "src": "school", "sec": "3-1", "concept": "雙子葉植物莖", "q": "上圖為三種不同植物的莖橫切面，請問何者最有可能是鬼針草的橫切面？", "ex": "鬼針草是雙子葉草本植物，莖內維管束排列成環狀，像甲圖。乙的維管束散生，是單子葉植物；丙有年輪，是木本植物。", "fig": "fig/s112_2_q29.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "以上皆不可能"], "ans": 0, "ch": "3"}, {"id": "s112_2_q30", "src": "school", "sec": "3-1", "concept": "年輪", "q": "小明在森林中看到如附圖所示的樹幹橫切面，下列相關敘述何者正確？", "ex": "春夏生長快，木質部細胞大、顏色淺（甲、丙）；秋冬生長慢，細胞小、顏色深（乙、丁）。最外側的甲最新，丁最靠內最老。", "fig": "fig/s112_2_q30.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲最外側為韌皮部，其餘為木質部", "乙的細胞比丁更早形成", "丙可能是秋冬季節所形成的細胞", "甲和丙是細胞較大且顏色較淺的木質部"], "ans": 3, "ch": "3"}, {"id": "s112_2_q31", "src": "school", "sec": "3-1", "concept": "環狀剝皮", "q": "木本植物莖的主幹，若經環狀剝皮，如何造成植物的死亡。(甲)葉細胞死亡；(乙)根細胞枯死；(丙)水分無法運送；(丁)養分運送受阻；(戊)木質部受損；(己)韌皮部受損，上述情況，其發生順序為何？", "ex": "環狀剝皮先破壞韌皮部（己），養分無法往下運送（丁），根部得不到養分而死亡（乙），根死了不能吸水，水分無法運送（丙），最後葉片也枯死（甲）。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己丁甲丙乙", "己丁乙丙甲", "戊丙甲丁乙", "戊丙乙丁甲"], "ans": 1, "ch": "3"}, {"id": "s112_2_q32", "src": "school", "sec": "3-1", "concept": "莖的構造排列", "q": "今剖開木本植物的莖，由於其為環狀排列維管束，其莖內維管束含有形成層，可不斷增生新的木質部細胞和新的韌皮部細胞使莖加粗，此時莖部所含有的細胞為：(甲)新生木質部細胞；(乙)老的木質部細胞；(丙)新生韌皮部細胞；(丁)老的韌皮部細胞；(戊)形成層，請問由外而內的排列順序為何？", "ex": "形成層向外產生韌皮部、向內產生木質部，新的細胞都靠近形成層。所以由外而內是：老韌皮部（丁）→新韌皮部（丙）→形成層（戊）→新木質部（甲）→老木質部（乙）。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["戊丙甲丁乙", "乙甲戊丙丁", "丁乙丙甲戊", "丁丙戊甲乙"], "ans": 3, "ch": "3"}, {"id": "s112_2_q33", "src": "school", "sec": "3-1", "concept": "單子葉植物莖", "q": "若將玉米插於裝有黑色墨水的量筒中，經過1小時之後將莖橫切，取一薄片置於顯微鏡下觀察，此時所見的情形，最可能為下列何者？(深色部分為黑色墨水染色部分)", "ex": "玉米是單子葉植物，維管束散生在莖中；墨水由木質部往上運送，所以每個維管束只有木質部那一部分被染色。符合「散生」的是(A)。", "fig": "fig/s112_2_q33.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 0, "ch": "3"}, {"id": "s112_2_q34", "src": "school", "sec": "3-1", "concept": "蒸散作用", "q": "曉華在路上看到運輸樹木活株的大貨車，他發現樹木的葉片都被修剪過才能運輸移植，請問最合理的原因為何？", "ex": "移植樹木時根部受損，吸水能力變差。把葉片修剪掉可以減少蒸散作用，避免水分過度散失而枯死。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["可以減緩蒸散作用，減少水分過度散失", "可以減緩光合作用，避免水分消耗殆盡", "可以有效促進新的葉片生長", "可以減少過多葉片，以減少消耗養分的速度"], "ans": 0, "ch": "3"}, {"id": "s112_2_q35", "src": "school", "sec": "3-1", "concept": "植物體內運輸方向", "q": "附圖為植物體內物質運輸的示意圖，甲、乙、丙分別表示輸送的方向。下列敘述何者錯誤？", "ex": "乙的箭頭向下，是養分由葉運往其他部位的方向，礦物質是由根往上運送（丙），所以(B)錯。甲是水分從氣孔蒸散離開，丙方向的動力來自蒸散作用。", "fig": "fig/s112_2_q35.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲為水分進行蒸散作用，由氣孔離開", "乙為礦物質的運輸方向", "丙方向的運輸動力為蒸散作用", "養分運輸遵循著乙方向"], "ans": 1, "ch": "3"}, {"id": "s112_2_q36", "src": "school", "sec": "3-1", "concept": "蒸散作用實驗", "q": "實驗後，下列哪一個是小南從實驗中可以得到的結論？", "ex": "有葉片的甲芹菜液面下降比較多，表示葉片愈多，水分散失愈快。題目沒有比較通風與否，也無法看出光合作用用掉多少水。", "fig": "fig/s112_2_q36.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "小南取了甲、乙兩個裝有紅墨水的量筒，分別插入兩支大小相近的芹菜，並將液面調整至等高，置於通風處約40分鐘，如附圖(一)所示。6 小時後，量筒液面的改變如附圖(二)所示", "opts": ["葉片愈多，水分的散失速率愈快", "植物體內的水分，少部分經由葉子散失", "在通風的地方，水分散失的速率較快", "照光時，葉片行光合作用會用掉水"], "ans": 0, "ch": "3"}, {"id": "s112_2_q37", "src": "school", "sec": "3-2", "concept": "血球功能", "q": "上圖為人體的血液抹片示意圖，下列相關敘述何者正確？", "ex": "丙是白血球，可以對抗外來的病原體，保護身體。甲是血小板、乙是血漿、丁是紅血球；能穿出微血管的是白血球，使血液呈紅色的是紅血球。", "fig": "fig/s112_2_q37.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲可藉由變形蟲運動穿過微血管管壁", "乙使血液呈鮮紅色，且具有攜帶養分的功能", "丙可對抗外來致病物質，保護人體健康", "丁在人體受傷時，具有幫助血液凝固的功能"], "ans": 2, "ch": "3"}, {"id": "s112_2_q38", "src": "school", "sec": "3-2", "concept": "動脈與靜脈", "q": "小祥用一條塑膠管綁住左手上臂，如附圖所示，結果發現a 血管變得不明顯，而b 血管浮現，則下列敘述何者正確？", "ex": "綁住上臂後，靜脈的血流不出去，所以 b 浮現，是靜脈；a 位置較深、變得不明顯，是動脈。", "fig": "fig/s112_2_q38.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["a 和b 皆為動脈", "a 為動脈，b 為靜脈", "a 和b 皆為靜脈", "a 為靜脈，b 為動脈"], "ans": 1, "ch": "3"}, {"id": "s112_2_q39", "src": "school", "sec": "3-2", "concept": "肺循環血管", "q": "附圖是人體甲、乙、丙三種不同血管中血液流動的示意圖，箭頭表示血液流動的方向。若血管內血液中的O₂含量為甲低於丙，則甲對應的血管名稱可能為下列何者？", "ex": "血液由甲經過乙（微血管）流到丙後氧氣變多，表示乙是肺部的微血管，甲是把減氧血送到肺的「肺動脈」。", "fig": "fig/s112_2_q39.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["肺動脈", "主動脈", "肺靜脈", "上大靜脈"], "ans": 0, "ch": "3"}, {"id": "s112_2_q40", "src": "school", "sec": "3-2", "concept": "血管特徵", "q": "關於人體血管之敘述，何者正確？", "ex": "動脈把血液運離心臟，管壁厚、富有彈性。血液不會流進細胞內；紅血球不能穿出微血管；最粗的動脈（主動脈）連接的是左心室，不是心房。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血液由微血管流入細胞內進行物質交換", "紅血球可經微血管管壁進入身體組織間", "最粗的動脈和心房相連，再發生許多分支", "動脈將血液運離心臟，且管壁厚富彈性"], "ans": 3, "ch": "3"}, {"id": "s112_2_q41", "src": "school", "sec": "3-2", "concept": "靜脈瓣膜", "q": "下列血管中何者具有瓣膜的存在？", "ex": "靜脈的血壓較低，管內有瓣膜可以防止血液倒流，尤其是四肢的靜脈。動脈一般沒有瓣膜，微血管也沒有。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["大條的動脈內才有，較小的缺乏", "通常動脈內都具有", "通常靜脈內具有", "通常動靜脈皆有，但微血管沒有"], "ans": 2, "ch": "3"}, {"id": "s112_2_q42", "src": "school", "sec": "3-2", "concept": "肺循環", "q": "血液自甲流至乙後，經過右圖物質交換完，關於甲乙兩血管敘述何者錯誤？", "ex": "血液從肺動脈（甲）經過肺部微血管交換氣體後流入肺靜脈（乙），二氧化碳會減少、氧氣增加，所以(B)「二氧化碳含量升高」錯。肺靜脈的血液流回左心房。", "fig": "fig/s112_2_q42.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "附圖是人體肺部血液循換的示意圖，左圖是連接肺部的甲、乙血管，箭號表示血液流動方向，右圖是表示人體內肺臟中肺泡與微血管進行氣體交換，請回答42.43 題", "opts": ["血液自甲流至乙，中間仍需經過微血管", "血液自甲流至乙後，二氧化碳含量會升高", "血液自乙可流回左心房", "甲從心臟流向肺臟，故為肺動脈"], "ans": 1, "ch": "3"}, {"id": "s112_2_q43", "src": "school", "sec": "3-2", "concept": "肺泡氣體交換", "q": "血液自甲流至乙後，經過右圖物質交換完，下列敘述何者正確？", "ex": "肺泡和微血管之間的氧氣、二氧化碳是靠擴散作用交換的：肺泡的氧氣多，擴散進微血管；微血管的二氧化碳多，擴散進肺泡。", "fig": "fig/s112_2_q42.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "附圖是人體肺部血液循換的示意圖，左圖是連接肺部的甲、乙血管，箭號表示血液流動方向，右圖是表示人體內肺臟中肺泡與微血管進行氣體交換，請回答42.43 題", "opts": ["二氧化碳的濃度，肺泡大於微血管", "氧氣的濃度，微血管大於肺泡", "氧氣與二氧化碳藉由擴散作用交換", "物質交換完後，微血管利用甲血管將氧氣送入肺臟"], "ans": 2, "ch": "3"}, {"id": "s112_2_q45", "src": "school", "sec": "3-2", "concept": "心臟血液", "q": "心臟在人體內擔任著血液流動的原動力來源，共分成四個腔室，分別和血管相連。根據附圖中，各選項中哪些血管或腔室內全為減氧血？", "ex": "心臟右側的甲（右心房）、乙（右心室）裝的是由全身流回的減氧血，所以(C)正確。左心房、左心室、主動脈（c）和肺靜脈（d）裡是充氧血。", "fig": "fig/s112_2_q45.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "a（上大靜脈）和 b（肺動脈）裡的血液也都是減氧血，所以(B)看起來也符合題意；官方答案為(C)。", "pas": "", "opts": ["c、d", "a、b", "甲、乙", "乙、丁"], "ans": 2, "ch": "3"}, {"id": "s112_2_q46", "src": "school", "sec": "3-2", "concept": "心臟瓣膜", "q": "心臟在人體內擔任血液流動的動力來源，共分成四個腔室，分別和血管相連。請問附圖中，哪兩個構造之間具有防止血液逆流的瓣膜？", "ex": "心房和心室之間、心室和動脈之間都有瓣膜防止血液倒流。丁（左心室）和 c（主動脈）之間有瓣膜。", "fig": "fig/s112_2_q45.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["乙、丁之間", "丁、c 之間", "甲、a 之間", "d、丙之間"], "ans": 1, "ch": "3"}, {"id": "s112_2_q47", "src": "school", "sec": "3-2", "concept": "體循環路徑", "q": "人體小腸絨毛吸收養分後，再進入血液循環後，將會最先到回到心臟哪一腔室？", "ex": "小腸吸收的養分進入血液後，經肝臟再由下大靜脈流回心臟，最先到達右心房（甲）。", "fig": "fig/s112_2_q45.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ch": "3"}, {"id": "s112_2_q48", "src": "school", "sec": "3-2", "concept": "觀察小魚尾鰭血流", "q": "用複式顯微鏡下觀察小魚尾鰭的血液流動情形如右圖所示。請問下列相關敘述何者正確？", "ex": "觀察小魚尾鰭時，血液由動脈流向微血管再流入靜脈，從血流方向可以推測心臟在哪一邊。乙管很細，紅血球只能排成一列通過，是微血管，但紅血球不能穿出管壁；微血管血流最慢。", "fig": "fig/s112_2_q48.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲血管將血液輸往心臟", "乙管的管壁最薄，可允許紅血球經由乙管進入組織交換物質", "丙管內血液的流速最快", "由血流方向判斷小魚心臟的實際位置是在觀察者的右邊。"], "ans": 3, "ch": "3"}, {"id": "s112_2_q49", "src": "school", "sec": "3-2", "concept": "心搏與脈搏", "q": "柯南於運動前、後分別測驗脈搏與心搏每分鐘跳動的次數如附表，則敘述何者正確？", "ex": "脈搏是心臟搏動時動脈的跳動，所以脈搏次數和心搏次數相同（甲＝乙、丙＝丁）。運動後心跳變快，所以運動後的心搏（丁）大於運動前的脈搏（甲）。", "fig": "fig/s112_2_q49.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲＞乙", "丙＞丁", "甲＞丙", "丁＞甲"], "ans": 3, "ch": "3"}, {"id": "s112_2_q50", "src": "school", "sec": "3-2", "concept": "心音", "q": "小雲到醫院檢測自己的心搏與脈搏，下列敘述何者正確？", "ex": "心臟搏動時血液衝擊關閉的瓣膜所發出的聲音稱為心音，「撲－通」代表一次心搏。脈搏和心搏次數相同，運動等身體狀態會讓兩者改變。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["兩者的跳動次數不會因身體狀態而改變", "心臟搏動時，心臟內的血液衝擊瓣膜的聲音，稱之為心音", "若小雲的脈搏次數加快，心搏次數也會加快，且大於脈搏", "使用聽診器聽小雲的心音，每聽到「撲－通」，代表兩次的心搏"], "ans": 1, "ch": "3"}, {"id": "s112_3_q1", "src": "school", "sec": "3-2", "concept": "淋巴", "q": "有關淋巴的敘述，何者正確？", "ex": "淋巴的成分和血漿相似，含有白血球，可以對抗病原體。淋巴來自組織液進入淋巴管，淋巴管一端是封閉的，最後流入靜脈；組織液、淋巴和血漿的成分並不完全相同。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["淋巴的成分與血漿成分相似，內含白血球對抗病原體", "淋巴的來源是部分血漿由微血管直接滲出到淋巴管內", "淋巴管一端連結微血管，另外一端則連結靜脈，以利淋巴完成循環", "與組織液及血漿成分完全相同，因為三者之間會藉由滲透作用互通有無。"], "ans": 0, "ch": "3"}, {"id": "s112_3_q2", "src": "school", "sec": "3-2", "concept": "淋巴管", "q": "根據附圖，請問何者屬於淋巴系統？", "ex": "乙是淋巴管，屬於淋巴系統。甲是血管（微血管），丙是細胞之間的組織液。", "fig": "fig/s112_3_q2.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "以上皆是。"], "ans": 1, "ch": "3"}, {"id": "s112_3_q3", "src": "school", "sec": "3-2", "concept": "淋巴循環", "q": "淋巴循環系統最後將淋巴送回何處以重新回到血液循環內？", "ex": "淋巴經由淋巴管匯集後，最後流入靜脈（鎖骨下靜脈），重新回到血液循環。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["靜脈", "微血管", "動脈", "心臟。"], "ans": 0, "ch": "3"}, {"id": "s112_3_q4", "src": "school", "sec": "3-2", "concept": "淋巴結", "q": "下列關於人體淋巴結功能的敘述，何者正確？", "ex": "淋巴結中聚集許多白血球，可以過濾淋巴中的病原體。淋巴結分布在全身，不只題目說的那幾處；它不運輸氧氣，紅血球也不會聚集在淋巴結。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["僅分布於脖子、腋下、內臟及鼠蹊部", "可以協助氧氣運輸", "可以過濾淋巴內的病原體", "白血球及紅血球等血球會聚集在淋巴結。"], "ans": 2, "ch": "3"}, {"id": "s112_3_q5", "src": "school", "sec": "3-3", "concept": "疫苗原理", "q": "關於施打疫苗防禦疾病的敘述，下列敘述何者正確？", "ex": "疫苗讓身體的特殊白血球認識病原體並產生記憶，下次真正感染時就能很快產生抗體。疫苗本身不是抗體，一種疫苗只能預防特定疾病，新生兒也需要接種疫苗。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["疫苗內有許多抗體，會直接殺死病原體", "施打疫苗後，便可以讓白血球防禦所有的疾病", "施打疫苗的原理是運用特殊白血球的記憶性", "剛出生的新生兒不需要注射疫苗。"], "ans": 2, "ch": "3"}, {"id": "s113_2_q26", "src": "school", "sec": "3-1", "concept": "環狀剝皮應用", "q": "如附圖所示果實生長位置，關於「環狀剝皮」的敘述何者錯誤？", "ex": "養分由葉片經韌皮部往下運送。要讓果實養分豐足，應在果實「下方」的乙處剝皮，讓葉片製造的養分留在果實附近；在果實上方的甲處剝皮，葉片的養分反而送不到果實，所以(A)錯。", "fig": "fig/s113_2_q26.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["若希望此顆果實養分特別豐足，可以在「甲」處環狀剝皮", "若希望此顆果實養分特別豐足，可以在「乙」處環狀剝皮", "若只在「甲」處環狀剝皮，此樹仍可存活", "若只在「丙」處環狀剝皮，此樹無法存活"], "ans": 0, "ch": "3"}, {"id": "s113_2_q27", "src": "school", "sec": "3-1", "concept": "環狀剝皮", "q": "木本植物莖的主幹，經環狀剝皮，會造成植物的死亡。(甲)根細胞死亡；(乙)葉細胞枯死；(丙)養分運送受阻；(丁)水分運送受阻；上述四種情況，其發生順序為何？", "ex": "環狀剝皮先讓養分運送受阻（丙），根得不到養分而死亡（甲），根死了無法吸水，水分運送受阻（丁），最後葉片枯死（乙）。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丁乙甲丙", "丙甲丁乙", "甲丁乙丙", "丁甲丙乙"], "ans": 1, "ch": "3"}, {"id": "s113_2_q28", "src": "school", "sec": "3-1", "concept": "年輪", "q": "如附圖所示的樹幹橫切面，下列敘述何者正確？", "ex": "甲在最外側，是最新長出的木質部，比丁的細胞年輕。甲是顏色較淺的木質部（不是韌皮部）；乙是秋冬形成的細胞，比春夏的丙小；丁是木質部，除了水分也運送礦物質。", "fig": "fig/s113_2_q28.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲的細胞是顏色較淺的韌皮部", "乙的細胞比丙的細胞大", "甲的細胞比丁的細胞年輕", "丁的細胞只能運送水分，不能運送養分"], "ans": 2, "ch": "3"}, {"id": "s113_2_q29", "src": "school", "sec": "3-1", "concept": "木質部運輸", "q": "美國約瑟朱堤國家公園有一棵樹的樹幹直徑達11公尺，汽車可由樹根底部中央的裂洞通過，這棵樹能持續生長的原因為何？", "ex": "樹幹中央挖空的是老舊的木質部，已經失去運輸功能；靠外側新生的木質部仍可運送水分，加上韌皮部完整，所以樹能繼續生長。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["只要根部在，樹木就不會死亡", "巨樹可由葉片吸收水分", "挖空的部分是老舊的木質部，樹木可依賴新生的木質部進行運輸", "巨樹的韌皮部可以運輸水分"], "ans": 2, "ch": "3"}, {"id": "s113_2_q30", "src": "school", "sec": "3-1", "concept": "莖的構造排列", "q": "剖開桑樹的莖，由於桑樹為環狀排列維管束，其莖內維管束含有形成層，可不斷增生新的木質部細胞和新的韌皮部細胞使莖加粗，此時莖部所含有的細胞為：(甲)新生韌皮部細胞；(乙)老的韌皮部細胞；(丙)新生木質部細胞；(丁)老的木質部細胞，請問由內而外的排列順序為何？", "ex": "由內而外：老木質部（丁）→新木質部（丙）→（形成層）→新韌皮部（甲）→老韌皮部（乙），所以是丁丙甲乙。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丙丁甲乙", "乙甲丙丁", "乙甲丁丙", "丁丙甲乙"], "ans": 3, "ch": "3"}, {"id": "s113_2_q32", "src": "school", "sec": "3-1", "concept": "蒸散作用", "q": "蠟筆小新的爸爸想將住家後方的櫻花樹移到鄉下奶奶家。爸爸首先以電鋸將樹枝鋸掉一大部分後才移植。蠟筆小新問爸爸：「為什麼將樹鋸得光禿禿的？這樣根本無法遮蔭！」請問爸爸為什麼這麼做呢？", "ex": "移植時樹根受損，吸水能力下降。鋸掉大部分樹枝和葉片可以減少水分蒸散，避免樹木失水過多而死亡。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["減少養分的吸收", "增加日晒面積，加速進行光合作用的速率", "增加養分運送的速率，促使植物快速生長", "減少水分蒸散，以免樹木因失水過多而死亡"], "ans": 3, "ch": "3"}, {"id": "s113_2_q33", "src": "school", "sec": "3-1", "concept": "韌皮部運輸", "q": "菟絲子是一種寄生性的植物，會利用莖上的吸取器插入另一綠色植物體內，以吸取其有機養分。下列何者是該綠色植物被吸取器插入吸收養分的主要部位？其吸取的養分為何？", "ex": "菟絲子要吸取的是有機養分，葉片製造的葡萄糖等養分在韌皮部中運輸，所以吸取器插入韌皮部。澱粉不能直接在韌皮部中運送；木質部運送的是水和礦物質。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["木質部：水分和礦物質", "木質部：肥料和葡萄糖", "韌皮部：葡萄糖", "韌皮部：澱粉"], "ans": 2, "ch": "3"}, {"id": "s113_2_q34", "src": "school", "sec": "3-2", "concept": "血球功能", "q": "附圖為人體的血液抹片示意圖，下列相關敘述何者正確？", "ex": "丙是白血球，可以利用變形蟲運動穿出微血管對抗病原體。乙是血漿（運輸養分、廢物、激素，不運輸酵素）、甲是血小板（幫助凝血）、丁是紅血球（不能產生抗體）。", "fig": "fig/s113_2_q34.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["乙可以運輸養分、廢物和酵素", "丙可藉由變形蟲運動穿過微血管管壁", "甲有血紅素可幫助凝血", "丁可以產生抗體，吞噬細菌"], "ans": 1, "ch": "3"}, {"id": "s113_2_q35", "src": "school", "sec": "3-2", "concept": "肺循環血管", "q": "已知血液離開心臟後，直接進入甲血管，然後流經乙血管，再由丙血管流回心臟，各血管內血液中O₂的含量如附圖所示。若乙血管是物質交換的場所，則甲、丙對應的血管名稱，下列何者正確？", "ex": "血液經過乙（物質交換的微血管）後氧氣變多，表示乙在肺部。所以甲是從心臟送血到肺的肺動脈，丙是流回心臟的肺靜脈。", "fig": "fig/s113_2_q35.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲是肺動脈", "甲是肺靜脈", "丙是主動脈", "丙是大靜脈"], "ans": 0, "ch": "3"}, {"id": "s113_2_q36", "src": "school", "sec": "3-1", "concept": "形成層", "q": "有關形成層的敘述，何者正確？", "ex": "水稻是單子葉植物，維管束散生，沒有形成層，莖不會逐年加粗。玉米、小麥也是單子葉，沒有形成層；相思樹是木本雙子葉植物，有形成層。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["玉米的莖內維管束環狀排列，有形成層", "相思樹的莖內維管束環狀排列，沒有形成層", "小麥的莖內維管束散生排列，有形成層", "水稻的莖內維管束散生排列，沒有形成層"], "ans": 3, "ch": "3"}, {"id": "s113_2_q37", "src": "school", "sec": "3-2", "concept": "微血管", "q": "下列有關人體微血管的敘述，何者錯誤？", "ex": "血液流動的方向是小動脈→微血管→小靜脈，微血管不會把血液送入小動脈，所以(A)錯。微血管管壁只有一層細胞，分布最廣、血流最慢。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["微血管將血液送入小動脈和小靜脈", "肺動脈和肺靜脈之間也有微血管", "微血管管壁僅由一層細胞構成，可使血液和組織間的物質進行交換", "微血管分布最廣，其內的血液流速最慢"], "ans": 0, "ch": "3"}, {"id": "s113_2_q38", "src": "school", "sec": "3-2", "concept": "小腸絨毛血管", "q": "若小腸正在吸收養分，比較小腸絨毛模式圖中甲、乙二血管，如附圖，下列敘述何者正確？（血管旁的箭頭表示血管內的血流方向）", "ex": "甲的血流流向絨毛，是從心臟流出的小動脈；乙流出絨毛，是流回心臟的小靜脈。小腸吸收的養分進入乙，所以乙的養分比較多；動脈管壁比靜脈厚。", "fig": "fig/s113_2_q38.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血液中葡萄糖等養分含量，甲血管＞乙血管", "血液中氧濃度，甲血管＜乙血管", "管壁厚度，甲血管＜乙血管", "甲血管帶領血液離開心臟，乙血管帶領血液返回心臟"], "ans": 3, "ch": "3"}, {"id": "s113_2_q39", "src": "school", "sec": "3-2", "concept": "動脈與靜脈", "q": "健康檢查要抽血時，用一條塑膠管綁住左手上臂，如附圖所示，結果發現a 血管變得不明顯，而b 血管浮現，則下列敘述何者正確？(甲) a 為靜脈，b 為動脈(乙) a 為動脈，b 為靜脈(丙) 應該從a 血管抽(丁) 應該從b 血管抽", "ex": "綁住上臂後 b 浮現，b 是靜脈；a 不明顯，是動脈。抽血是從靜脈抽，所以應從 b 抽，答案是乙丁。", "fig": "fig/s113_2_q39.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲丙", "甲丁", "乙丁", "乙丙"], "ans": 2, "ch": "3"}, {"id": "s113_2_q40", "src": "school", "sec": "3-2", "concept": "體循環血管", "q": "附圖是人體甲、乙、丙三種不同血管中血液流動的示意圖，箭頭表示血液流動的方向。若血管內血液中的O₂含量為甲高於丙，則丙對應的血管名稱可能為下列何者？", "ex": "血液經過乙（微血管）後氧氣變少，表示乙在身體的組織（例如肝臟），所以丙是離開肝臟、流回心臟的肝靜脈。", "fig": "fig/s113_2_q40.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["肝動脈", "肺動脈", "肺靜脈", "肝靜脈"], "ans": 3, "ch": "3"}, {"id": "s113_2_q41", "src": "school", "sec": "3-2", "concept": "觀察小魚尾鰭血流", "q": "用複式顯微鏡下觀察小魚尾鰭的血液流動情形如附圖所示。請問下列相關敘述何者正確？", "ex": "依官方答案，由血流方向可以判斷小魚心臟在觀察者的右邊。選尾鰭觀察是因為它薄而透明，不是只有尾鰭有血管；乙是微血管，但紅血球不能穿出管壁；甲、丙的血液含氧情形無法這樣判斷。", "fig": "fig/s113_2_q41.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["觀察小魚尾鰭是因為只有尾鰭有血管", "乙管管壁最薄，可允許紅血球經由乙管進入組織", "甲管內血液是缺氧血，丙管內是充氧血", "由血流方向判斷小魚心臟的實際位置是在觀察者的右邊。"], "ans": 3, "ch": "3"}, {"id": "s113_2_q42", "src": "school", "sec": "3-2", "concept": "心搏、脈搏與血壓", "q": "小昕到醫院檢測自己的心搏、脈搏與血壓，參考附圖。下列敘述何者正確？", "ex": "聽到一次「撲－通」代表一次心搏。脈搏和血壓測量的都是動脈；量脈搏要按在手腕拇指側的橈動脈；運動後心跳加快是為了運送更多氧氣和養分。", "fig": "fig/s113_2_q42.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["使用聽診器聽心音，每聽到「撲－通」，代表一次的心搏", "量脈搏是測量動脈的搏動，量血壓是測量靜脈管壁承受的壓力", "量脈搏應該要按住圖中甲的位置", "運動後心跳變快，其主要原因是為了減少廢物的形成"], "ans": 0, "ch": "3"}, {"id": "s113_2_q43", "src": "school", "sec": "3-2", "concept": "心音", "q": "為什麼心臟搏動時會有撲通撲通的聲音？", "ex": "心臟搏動時，血液衝擊關閉的瓣膜而發出聲音，就是撲通撲通的心音。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["因為心臟肌肉用力收縮而發出聲響", "因為瓣膜關閉而發出聲響", "因為血液撞擊到關閉的瓣膜而發出聲響", "因為血液在心臟裡澎湃湧動而發出聲響"], "ans": 2, "ch": "3"}, {"id": "s113_2_q44", "src": "school", "sec": "3-2", "concept": "含氧量比較", "q": "人體構造中的氧氣含量的比較何者正確？", "ex": "左心室裝的是充氧血，右心室是減氧血，所以左心室的氧氣含量大於右心室。肺動脈是減氧血，比肺靜脈、主動脈少；右心房也比左心房少。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["肺動脈＞肺靜脈", "肺動脈＞主動脈", "右心房＞左心房", "左心室＞右心室"], "ans": 3, "ch": "3"}, {"id": "s113_2_q45", "src": "school", "sec": "3-2", "concept": "心臟與血管", "q": "關於人體循環系統之敘述，何者錯誤？", "ex": "人體最粗的動脈是主動脈，和左心室相連，不是右心室，所以(B)錯。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["瓣膜可以防止血液倒流", "人體最粗的動脈和右心室相連", "肺靜脈內的血液因氧氣濃度高，呈鮮紅色", "動脈將血液運離心臟，且管壁厚富彈性"], "ans": 1, "ch": "3"}, {"id": "s113_2_q46", "src": "school", "sec": "3-2", "concept": "淋巴與組織液", "q": "附圖為細胞、淋巴管和血管的示意圖，下列敘述何者錯誤？", "ex": "甲是微血管（有紅血球），乙是淋巴管（有白血球），丙是細胞間的組織液（淡黃色）。液體流動的路徑是血管→組織液→淋巴管，也就是甲→丙→乙，所以(C)錯。", "fig": "fig/s113_2_q46.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲內有紅血球", "乙內有白血球", "甲乙丙中的液體流動路徑為：乙→丙→甲", "丙為淡黃色的液體"], "ans": 2, "ch": "3"}, {"id": "s113_2_q47", "src": "school", "sec": "3-2", "concept": "缺氧血", "q": "心臟在人體內擔任著血液流動的原動力來源，共分成四個腔室，分別和血管相連。請問附圖中，哪些血管或腔室內為缺氧血？", "ex": "a、e 是上、下大靜脈，b 是肺動脈，裡面都是缺氧血（減氧血）。右心房、右心室也是缺氧血，但選項中只有(B)全部都是缺氧血。", "fig": "fig/s113_2_q47.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、丙", "a、b、e", "c、b、d", "丙、丁"], "ans": 1, "ch": "3"}, {"id": "s113_2_q48", "src": "school", "sec": "3-2", "concept": "體循環路徑", "q": "承上題，人體肝臟細胞的代謝廢物進入血液循環後，會最先到回到哪一腔室？", "ex": "肝臟細胞的代謝廢物進入血液後，經肝靜脈、下大靜脈流回心臟，最先回到右心房（甲）。", "fig": "fig/s113_2_q47.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ch": "3"}, {"id": "s113_2_q49", "src": "school", "sec": "3-1", "concept": "蒸散作用實驗", "q": "關於本實驗，相關敘述何者正確？", "ex": "保留葉子的甲液面下降比較多，表示葉片越多，植物運輸水分越快。液面等高是控制變因；在水中剪枝條是為了避免空氣進入木質部；這個實驗看不出光合作用。", "fig": "fig/s113_2_q49.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "甲、乙兩個裝有黑墨水的量筒，分別插入兩支大小相近的芹菜(甲保留葉子，乙摘除葉子)，並將液面調整至等高如附圖(一)，置於通風處約40 分鐘後，量筒液面的改變如附圖(二)所示。", "opts": ["本實驗開始時，將甲乙液面調整至等高，是操作變因", "由實驗結果可知，葉片越多植物運輸水分越快", "修剪枝條時，須將枝條放入水中剪斷，目的是避免植物組織乾燥，延長植物壽命", "由本實驗結果可知，葉片可以行光合作用"], "ans": 1, "ch": "3"}, {"id": "s113_2_q50", "src": "school", "sec": "3-1", "concept": "雙子葉植物莖", "q": "40 分鐘之後將莖橫切，取一薄片置於顯微鏡下觀察，此時所見最可能為何者？", "ex": "芹菜是雙子葉植物，維管束排列成環狀，墨水只會染到維管束中靠內側的木質部，所以是(A)。", "fig": "fig/s113_2_q50.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "甲、乙兩個裝有黑墨水的量筒，分別插入兩支大小相近的芹菜(甲保留葉子，乙摘除葉子)，並將液面調整至等高如附圖(一)，置於通風處約40 分鐘後，量筒液面的改變如附圖(二)所示。", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 0, "ch": "3"}, {"id": "s113_3_q18", "src": "school", "sec": "3-3", "concept": "專一性免疫", "q": "關於免疫作用的敘述，下列何者正確？", "ex": "專一性免疫產生抗體的白血球具有記憶性，同一種病原體再入侵時能快速反應。疫苗是用來預防而不是治療；發炎反應屬於非專一性免疫；卡介苗預防的是結核病。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["接種流行性感冒疫苗可以治療流行性感冒", "專一性的免疫反應常具有記憶性", "發炎反應不屬於免疫反應", "接種卡介苗疫苗可以預防B 型肝炎的傳染"], "ans": 1, "ch": "3"}, {"id": "s113_3_q19", "src": "school", "sec": "3-3", "concept": "專一性免疫", "q": "下列何者屬於「專一性免疫反應」？", "ex": "某些白血球產生抗體、對抗特定的病原體，屬於專一性免疫。皮膚黏膜阻擋、胃酸殺菌、發炎反應都是對所有病原體一樣的非專一性防禦。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["皮膚與黏膜初步阻擋病原體入侵", "胃分泌強酸殺死細菌", "某些白血球產生抗體，對抗特定病原體", "當傷口出現紅、熱、腫、痛發炎反應時，會有更多血液流經帶來更多白血球吞噬細菌。"], "ans": 2, "ch": "3"}, {"id": "s113_3_q49", "src": "school", "sec": "3-3", "concept": "白血球與感染", "q": "當人體被病原入侵，某血球會大量增生以抵禦病原，請問表中哪一位同學最可能被細菌或病毒感染？", "ex": "被病原體入侵時白血球會大量增加。乙同學的白血球 15000，超過正常值 3250～9160，最可能被細菌或病毒感染。", "fig": "fig/s113_3_q49.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "升上國一的第一學期，國一新生依規定要進行全身健康檢查，其中包含抽血檢查，附表為四位同學的血液檢驗報告，請根據表中數據回答問題： ※B 肝表面抗體︰若呈陽性（＋），通常表示具有保護力若呈陰性（－），表示以往不曾感染過Ｂ型肝炎病毒。※B 肝表面抗原︰若呈陽性（＋），且持續６個月以上，表示是Ｂ型肝炎帶原者。", "opts": ["甲同學", "乙同學", "丙同學", "丁同學"], "ans": 1, "ch": "3"}, {"id": "s113_3_q50", "src": "school", "sec": "3-3", "concept": "疫苗與專一性免疫", "q": "請問表中有哪一位同學需要施打B 型肝炎疫苗？施打疫苗是為了引發何種免疫系統的記憶？", "ex": "丁同學的 B 肝表面抗原和抗體都是陰性，表示沒有保護力，需要施打 B 肝疫苗。疫苗是讓身體產生抗體和記憶，屬於專一性免疫。", "fig": "fig/s113_3_q49.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "升上國一的第一學期，國一新生依規定要進行全身健康檢查，其中包含抽血檢查，附表為四位同學的血液檢驗報告，請根據表中數據回答問題： ※B 肝表面抗體︰若呈陽性（＋），通常表示具有保護力若呈陰性（－），表示以往不曾感染過Ｂ型肝炎病毒。※B 肝表面抗原︰若呈陽性（＋），且持續６個月以上，表示是Ｂ型肝炎帶原者。", "opts": ["乙同學，非專一性免疫系統", "乙同學，專一性免疫系統", "丁同學，非專一性免疫系統", "丁同學，專一性免疫系統"], "ans": 3, "ch": "3"}, {"id": "s114_2_q24", "src": "school", "sec": "3-1", "concept": "韌皮部功能", "q": "某木本植物的莖具有樹皮及木材等構造，如右圖所示。下列何者為圖中「＃」標示處的主要功能？", "ex": "圖中「＃」是樹皮內側靠近木材的一層，屬於韌皮部，主要功能是運輸葉片製造的養分。", "fig": "fig/s114_2_q24.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["運輸養分", "運輸水分", "光合作用", "細胞分裂"], "ans": 0, "ch": "3"}, {"id": "s114_2_q25", "src": "school", "sec": "3-1", "concept": "木材的組成", "q": "家中餐廳擺的木製桌椅組，是由木材所製成。試問木材是由下列植物莖的哪種細胞所構成？", "ex": "木材是莖中累積多年的木質部細胞構成的。韌皮部在樹皮內，形成層很薄。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["木質部細胞", "韌皮部細胞", "形成層細胞", "木質部與韌皮部細胞"], "ans": 0, "ch": "3"}, {"id": "s114_2_q26", "src": "school", "sec": "3-1", "concept": "韌皮部位置", "q": "已知蚜蟲是以刺吸式口器插入植物維管束中的某部位，吸食光合作用產生的養分為食。右圖為某種植物莖部橫切面的構造示意圖。請問蚜蟲的口器主要是針對哪個圖中的哪個部位？", "ex": "蚜蟲吸食的是光合作用產生的養分，養分在韌皮部運輸。圖中維管束靠外側的乙是韌皮部，丙是形成層、丁是木質部，甲是表皮。", "fig": "fig/s114_2_q26.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1, "ch": "3"}, {"id": "s114_2_q27", "src": "school", "sec": "3-1", "concept": "年輪形成", "q": "下列有關不同植物莖構造之敘述，何者正確？", "ex": "春夏和秋冬產生的木質部細胞大小、顏色不同，交替排列形成年輪。向日葵是環狀排列、玉米是散生；木材多是死細胞，老的木質部不能再運輸水分。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["向日葵的維管束散生排列", "玉米的維管束排列成環狀", "不同季節產生的木質部細胞交替排列成年輪", "木材為活細胞永遠可以運輸水分"], "ans": 2, "ch": "3"}, {"id": "s114_2_q28", "src": "school", "sec": "3-1", "concept": "維管束排列", "q": "下列有關植物組織構造與一些生理功能的敘述，何者正確？", "ex": "榕樹是雙子葉植物，莖中維管束呈環狀排列。玉米沒有形成層；韌皮部的養分可以往上也可以往下運送；剝除韌皮部後根部得不到養分，植物無法正常生長。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["榕樹莖中的維管束呈環狀排列", "維管束中的形成層可以使玉米的莖加粗", "光合作用養分在韌皮部中的運輸只可能由上而下", "若把向日葵莖的韌皮部剝除，因木質部的功能仍然正常，所以植物仍可正常生長"], "ans": 0, "ch": "3"}, {"id": "s114_2_q29", "src": "school", "sec": "3-1", "concept": "蒸散作用", "q": "植物蒸散作用是植物運輸水分最重要的動力來源，有關蒸散作用，下列何者錯誤？", "ex": "蒸散作用是水分從葉片的氣孔散失，產生把水往上拉的力量，水是在木質部中運輸，不是韌皮部，所以(B)錯。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["蒸散作用有助於根部對水分的吸收", "韌皮部負責蒸散作用的進行", "摘除植物葉片會減緩蒸散作用", "蒸散作用時，水分移動的方向是由下往上運輸"], "ans": 1, "ch": "3"}, {"id": "s114_2_q30", "src": "school", "sec": "3-1", "concept": "蒸散作用", "q": "阿花將一棵生長旺盛的植物充分澆水後，用塑膠袋套起來，一段時間後，發現塑膠袋內壁上有很多水珠，試問這些水主要從何而來？", "ex": "植物吸收的水分大部分經由蒸散作用從葉片的氣孔以水蒸氣形式散失，遇到塑膠袋就凝結成水珠。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["植物行光合作用，水蒸氣由表皮排出", "植物行呼吸作用，水蒸氣由葉子邊緣排出", "植物行擴散作用，水蒸氣由表皮排出", "植物行蒸散作用，水蒸氣由氣孔排出"], "ans": 3, "ch": "3"}, {"id": "s114_2_q31", "src": "school", "sec": "3-1", "concept": "莖的構造排列", "q": "剖開相思樹的莖，由於相思樹為環狀排列維管束，其莖內維管束含有形成層，可不斷增生新的木質部細胞和新的韌皮部細胞使莖加粗，此時莖部所含有的細胞為：(甲)新生木質部細胞；(乙)老的木質部細胞；(丙)新生韌皮部細胞；(丁)老的韌皮部細胞，請問由外而內的排列順序為何？", "ex": "形成層向外產生韌皮部、向內產生木質部，新細胞都靠近形成層。由外而內是：老韌皮部（丁）→新韌皮部（丙）→新木質部（甲）→老木質部（乙）。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["乙→甲→丁→丙", "乙→甲→丙→丁", "丁→丙→甲→乙", "丙→丁→甲→乙"], "ans": 2, "ch": "3"}, {"id": "s114_2_q32", "src": "school", "sec": "3-1", "concept": "蒸散作用實驗", "q": "小南取了甲、乙兩個裝有紅墨水的量筒，分別插入兩支大小相近的芹菜，並將液面調整至等高，置於通風處約40 分鐘，如附圖(一)所示。6小時後，量筒液面的改變如附圖(二)所示。根據實驗結果，下列敘述何者錯誤？", "ex": "紅墨水減少的主要原因是芹菜進行蒸散作用，把水分從葉片散失到空氣中，不是光合作用，所以(B)錯。葉片多、放在通風處都會加快水分運輸。", "fig": "fig/s114_2_q32.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["葉片愈多，水的運送速率愈快", "紅墨水減少的主因是芹菜進行光合作用", "將裝置置於通風處，是為了加速水分的運輸", "修剪枝條須將枝條放入水中剪斷，是為了避免木質部內產生氣泡，阻礙水分的吸收"], "ans": 1, "ch": "3"}, {"id": "s114_2_q33", "src": "school", "sec": "3-1", "concept": "木質部與韌皮部比較", "q": "有關木本植物的維管束，下列比較何者錯誤？", "ex": "「細胞長得快顏色淺、長得慢顏色深」說的是春夏和秋冬形成的木質部（年輪），不是木質部和韌皮部的差別，所以丁錯。", "fig": "fig/s114_2_q33.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 3, "ch": "3"}, {"id": "s114_2_q34", "src": "school", "sec": "3-1", "concept": "韌皮部運輸", "q": "右圖為竹子與其鄰近竹筍的生長示意圖，圖中箭頭表示物質X 由竹子到竹筍的運輸方向。已知物質X 來自光合作用，則有關物質X 及其由何種構造運輸的敘述，下列何者最合理？", "ex": "物質 X 來自光合作用，又要送到竹筍當養分，是醣類（養分），由韌皮部運輸。氧氣是氣體、水和礦物質由木質部運送且來自根部。", "fig": "fig/s114_2_q34.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["物質X 為氧氣，由韌皮部運輸", "物質X 為水分，由木質部運輸", "物質X 為醣類，由韌皮部運輸", "物質X 為礦物質，由木質部運輸"], "ans": 2, "ch": "3"}, {"id": "s114_2_q35", "src": "school", "sec": "3-1", "concept": "環狀剝皮", "q": "木本植物莖的主幹，經環狀剝皮，能造成植物的死亡。(甲)根細胞死亡；(乙)葉細胞枯死；(丙)水分運送受阻；(丁)養分運送受阻；上述四種情況，其發生順序為何？", "ex": "環狀剝皮先使養分運送受阻（丁），根部因缺乏養分死亡（甲），接著無法吸水，水分運送受阻（丙），最後葉細胞枯死（乙）。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["丁甲丙乙", "丁乙甲丙", "甲乙丙丁", "甲丁乙丙"], "ans": 0, "ch": "3"}, {"id": "s114_2_q36", "src": "school", "sec": "3-1", "concept": "環狀剝皮應用", "q": "如附圖所示，臺灣果農利用「環狀剝皮」讓枝條上精選的果子養分特別豐足，可以賣得更好價錢。請問，農夫該在何處進行環狀剝皮？", "ex": "要讓果子養分特別豐足，應在果子「下方」的乙處環狀剝皮，葉片製造的養分往下送時被擋住，就會留給果子。甲在果子上方，剝了反而擋住養分；丙在主幹，剝了整棵樹會死。", "fig": "fig/s114_2_q36.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "都不行，被環狀剝皮的樹無法存活"], "ans": 1, "ch": "3"}, {"id": "s114_2_q37", "src": "school", "sec": "3-2", "concept": "動脈與靜脈的應用", "q": "小祥用一條塑膠管綁住左手上臂，如附圖所示，結果發現a 血管變得不明顯，而b 血管浮現，則下列小祥各種行為利用的血管何者正確？", "ex": "a 是動脈、b 是靜脈。量血壓測的是動脈（a）的壓力；抽血、打點滴用靜脈（b）；脈搏是動脈的跳動。", "fig": "fig/s114_2_q37.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["小祥在醫院量血壓，是利用a 血管", "小祥在醫院抽血，是利用a 血管", "小祥在教室測量脈搏，是利用b 血管", "小祥細菌感染，在醫院用點滴瓶注射抗生素，是利用a 血管"], "ans": 0, "ch": "3"}, {"id": "s114_2_q38", "src": "school", "sec": "3-2", "concept": "三種血管比較", "q": "關於人體三種血管之比較，何者錯誤？", "ex": "血液流動時壓力逐漸下降，血壓應該是動脈＞微血管＞靜脈，所以(D)錯。管壁彈性、管腔大小、血流速度的比較都正確。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["管壁彈性：動脈＞靜脈＞微血管", "管腔大小：靜脈＞動脈＞微血管", "血流速度：動脈＞靜脈＞微血管", "血壓大小：動脈＞靜脈＞微血管"], "ans": 3, "ch": "3"}, {"id": "s114_2_q39", "src": "school", "sec": "3-2", "concept": "動脈特徵", "q": "有關人體動脈的敘述，何者錯誤？", "ex": "肺動脈把右心室的減氧血送到肺，所以不是所有動脈都是充氧血，(D)錯。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["動脈分支後與微血管相接", "動脈上的搏動稱為脈搏", "將血液運離心臟的血管均為動脈", "人體內所有的動脈都是充氧血"], "ans": 3, "ch": "3"}, {"id": "s114_2_q40", "src": "school", "sec": "3-2", "concept": "靜脈特徵", "q": "有關人體靜脈的敘述，何者錯誤？", "ex": "最粗的靜脈（上、下大靜脈）連接的是右心房，不是心室，所以(A)錯。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["最粗的靜脈與心室相連", "將血液運回心臟的血管均為靜脈", "微血管匯集後的血液流入靜脈", "部分靜脈內有瓣膜，可防止血液倒流"], "ans": 0, "ch": "3"}, {"id": "s114_2_q41", "src": "school", "sec": "3-2", "concept": "肺循環血管", "q": "附圖是人體甲、乙、丙三種不同血管中血液流動的示意圖，箭頭表示血液流動的方向。若血管內血液中的O₂含量為甲低於丙，則甲對應的血管名稱可能為下列何者？", "ex": "血液經過乙後氧氣變多，乙是肺部的微血管，所以甲是把減氧血送到肺的肺動脈。", "fig": "fig/s114_2_q41.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["肺動脈", "肝動脈", "肺靜脈", "肝靜脈"], "ans": 0, "ch": "3"}, {"id": "s114_2_q42", "src": "school", "sec": "3-2", "concept": "心臟瓣膜", "q": "圖中哪兩個構造間具有防止血液逆流的瓣膜？", "ex": "心房和心室之間有瓣膜，防止血液由心室倒流回心房，所以甲（右心房）和乙（右心室）之間有瓣膜。大靜脈、肺靜脈和心房之間沒有瓣膜。", "fig": "fig/s114_2_q42.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "附圖是人體心臟及其所連接的血管之示意圖，甲、乙為心臟右邊的腔室，丙、丁為心臟左邊的腔室，請根據附圖回答42-45 題：", "opts": ["甲、e 之間", "丙、d 之間", "甲、a 之間", "甲、乙之間"], "ans": 3, "ch": "3"}, {"id": "s114_2_q43", "src": "school", "sec": "3-2", "concept": "充氧血", "q": "附圖中，哪些血管或腔室內為充氧血？", "ex": "左心房（丙）、左心室（丁）、主動脈（c）和肺靜脈（d）裡是充氧血，所以選 c、丁。", "fig": "fig/s114_2_q42.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "附圖是人體心臟及其所連接的血管之示意圖，甲、乙為心臟右邊的腔室，丙、丁為心臟左邊的腔室，請根據附圖回答42-45 題：", "opts": ["甲、丙", "a、b", "c、丁", "乙、a"], "ans": 2, "ch": "3"}, {"id": "s114_2_q44", "src": "school", "sec": "3-2", "concept": "體循環路徑", "q": "小腸吸收的養分進入血液循環後，會最先到回到圖中哪一腔室？", "ex": "小腸吸收的養分進入血液，經肝臟後由下大靜脈流回心臟，最先到達右心房（甲）。", "fig": "fig/s114_2_q42.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "附圖是人體心臟及其所連接的血管之示意圖，甲、乙為心臟右邊的腔室，丙、丁為心臟左邊的腔室，請根據附圖回答42-45 題：", "opts": ["甲", "乙", "丙", "丁"], "ans": 0, "ch": "3"}, {"id": "s114_2_q45", "src": "school", "sec": "3-2", "concept": "血液循環路徑", "q": "若以肺臟為起點，請問血液流經圖中各構造的順序為？", "ex": "從肺出發：肺靜脈（d）→左心房（丙）→左心室（丁）→主動脈（c）→全身→上、下大靜脈（a 或 e）→右心房（甲）→右心室（乙）→肺動脈（b）回到肺。", "fig": "fig/s114_2_q42.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "附圖是人體心臟及其所連接的血管之示意圖，甲、乙為心臟右邊的腔室，丙、丁為心臟左邊的腔室，請根據附圖回答42-45 題：", "opts": ["d→丙→丁→c→a 或e→甲→乙→b", "b→乙→甲→a 或e→c→丁→丙→d", "a 或e→甲→乙→b→d→丙→丁→c", "c→丁→丙→d→b→乙→甲→a 或c"], "ans": 0, "ch": "3"}, {"id": "s114_2_q46", "src": "school", "sec": "3-2", "concept": "血球與血漿", "q": "下圖為人體的血液抹片示意圖，下列相關敘述何者正確？", "ex": "乙是血漿，可以運輸養分、廢物、抗體和激素。甲是血小板，丙是白血球，丁是紅血球；對抗病原體的是白血球、使血液呈紅色的是紅血球、幫助凝血的是血小板。", "fig": "fig/s114_2_q46.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲能對抗入侵的病原體，且能穿出血管外", "乙可運輸養分、廢物、抗體和激素等物質", "丙使血液呈紅色，且能運送養分", "丁在人體受傷時，具有幫助血液凝固的功能"], "ans": 1, "ch": "3"}, {"id": "s114_2_q47", "src": "school", "sec": "3-2", "concept": "肺泡氣體交換", "q": "下圖中表示人體內甲（肺泡）及乙（微血管）進行氣體交換，下列敘述何者正確？", "ex": "氣體由濃度高往濃度低擴散。氧氣由肺泡（甲）進入微血管（乙），表示氧氣甲＞乙；二氧化碳由微血管進入肺泡，表示二氧化碳乙＞甲。", "fig": "fig/s114_2_q47.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["氧氣及二氧化碳的濃度，甲均大於乙", "氧氣及二氧化碳的濃度，甲均小於乙", "氧氣濃度甲小於乙、二氧化碳濃度乙小於甲", "氧氣濃度甲大於乙、二氧化碳濃度乙大於甲"], "ans": 3, "ch": "3"}, {"id": "s114_2_q48", "src": "school", "sec": "3-2", "concept": "心搏與脈搏", "q": "柯南於運動前、後分別測驗脈搏與心搏每分鐘跳動的次數如附表，則下列何者錯誤？", "ex": "脈搏次數等於心搏次數，所以甲＝乙、丙＝丁。運動後心跳加快，丙、丁都大於甲、乙，所以「甲＞丁」錯。", "fig": "fig/s114_2_q48.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲＝乙", "丙＝丁", "甲＞丁", "丙＞乙"], "ans": 2, "ch": "3"}, {"id": "s114_2_q49", "src": "school", "sec": "3-2", "concept": "淋巴結", "q": "下列有關人體淋巴結的敘述，何者錯誤？", "ex": "淋巴結集中在頸部、腋下、鼠蹊部等處，並不是平均分布在全身，所以(C)錯。淋巴結聚集白血球、能過濾病原體，感染時可能腫大。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["許多白血球會聚集在淋巴結", "淋巴結可以過濾病原體", "淋巴結平均分布在人體各處", "人體遭受病原體感染時，淋巴結可能會腫大"], "ans": 2, "ch": "3"}, {"id": "s114_2_q50", "src": "school", "sec": "3-2", "concept": "淋巴循環", "q": "附圖為細胞、淋巴管和血管的示意圖，請依圖選出正確的敘述為何？", "ex": "甲是微血管、乙是淋巴管、丙是組織液。淋巴管匯集後流入靜脈，再回到右心房，所以(D)正確。淋巴管中沒有血小板；組織液是淡黃色；流動路徑是甲→丙→乙。", "fig": "fig/s114_2_q50.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["乙內具有血小板", "丙具有淡紅色的液體", "甲、乙、丙中的液體流動路徑為：丙→甲→乙", "乙匯集後，最後流入右心房"], "ans": 3, "ch": "3"}, {"id": "s114_3_q1", "src": "school", "sec": "3-3", "concept": "疫苗作用機制", "q": "附圖為疫苗作用的機制示意圖，下列相關敘述，何者正確？", "ex": "甲是第一次注射疫苗的時間，產生較弱的防禦反應（ㄅ）；乙是病原體再次入侵，記憶細胞讓身體快速產生很強的防禦反應（ㄆ）。所以ㄅ表示注射疫苗後產生的防禦作用。", "fig": "fig/s114_3_q1.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲為病原體再次入侵時間", "乙為疫苗注射時間", "ㄅ表示預防性注射疫苗後產生防禦作用", "ㄆ表示產生專一性防禦作用的強度比甲低"], "ans": 2, "ch": "3"}, {"id": "s114_3_q2", "src": "school", "sec": "3-3", "concept": "疫苗原理", "q": "流感是具有明顯季節性特徵的疾病，臺灣的流行高峰期多自 12 月至隔年 3 月，因此學校健康中心會定期為全校同學安排施打流感疫苗。請問為什麼施打疫苗可避免流感疫情大爆發？", "ex": "疫苗讓人體自己製造抗體並產生記憶，相同病毒入侵時就能快速反應。疫苗本身不含抗體，也不是殺病毒的藥物。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["疫苗內含抗體，能提升免疫力", "疫苗內有藥物，可消滅病毒", "使體內運輸養分效率變高，提升免疫力", "疫苗可以促使人體製造抗體並產生記憶，相同病毒入侵時可快速反應"], "ans": 3, "ch": "3"}, {"id": "s114_3_q33", "src": "school", "sec": "3-1", "concept": "泌液作用", "q": "半夜下大雨會使得土壤潮溼，若到了隔天空氣的溼度還是很高，我們常會發現植物的葉片邊緣或尖端會出現許多小水珠，如附圖請問下列敘述何者正確？", "ex": "葉緣或葉尖出現的小水珠是植物從體內排出的水，稱為泌液作用，常發生在土壤潮溼、空氣溼度高、氣孔關閉、蒸散作用很弱的時候。水分是由木質部運輸，小水珠也不是水蒸氣凝結的露水。", "fig": "fig/s114_3_q33.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["此現象發生時氣孔應該是關閉狀態", "此小水珠是周圍水蒸氣凝結而成", "因此植物利用韌皮部將水分運輸到葉片", "此現象發生時可能蒸散作用旺盛"], "ans": 0, "ch": "3"}, {"id": "s112_3_q6", "src": "school", "sec": "4-1", "concept": "受器與視覺", "q": "大目博士想要研究生物的「受器」，下列關於他的研究發現，何者錯誤？", "ex": "視網膜是接受光線刺激的受器，但「視覺」是訊息傳到大腦後才產生的，不是在眼睛產生，所以(B)錯。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["受器能使生物接收環境中的刺激", "眼睛內的受器-視網膜，可以接受光線刺激，使得眼睛產生視覺", "人類的皮膚內具有多種受器，可以接受觸、壓、冷、熱及痛等不同刺激", "眼睛、耳朵、鼻子、舌頭及皮膚皆屬於受器。"], "ans": 1, "ch": "4"}, {"id": "s112_3_q7", "src": "school", "sec": "4-3", "concept": "向性", "q": "下列敘述何者與植物的向性有關？(甲)窗邊的綠豆芽朝著窗外的光彎曲生長；(乙)酢漿草葉片的睡眠運動；(丙)含羞草葉片的觸發運動；(丁)菊花的根向地生長；(戊)玫瑰葉片氣孔的開閉。", "ex": "向性是植物朝向或背離刺激方向「生長」的現象，例如莖向光生長（甲）、根向地生長（丁）。睡眠運動、觸發運動、氣孔開閉是膨壓改變造成的，不是向性。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲丁", "甲乙丙丁", "乙丙戊", "乙丙丁。"], "ans": 0, "ch": "4"}, {"id": "s112_3_q8", "src": "school", "sec": "4-1", "concept": "運動神經", "q": "肌萎縮性側索硬化症（ALS），俗稱「漸凍人」，是一種進行性的神經性退化疾病。患者的心智正常，意識、記憶、各種感覺都很清楚，可是卻逐漸無法運動；發病初期，咀嚼、吞嚥、說話先受到影響，最後甚至危急呼吸功能以致死亡。試問：這是由於神經系統中的哪一部分功能受損？", "ex": "漸凍人感覺和意識都正常，表示受器、感覺神經和腦都沒問題，但逐漸無法運動，是把命令從中樞傳到肌肉的運動神經受損。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["中樞神經中的大腦", "中樞神經中的脊髓", "由受器傳到中樞的感覺神經", "由中樞傳到動器的運動神經。"], "ans": 3, "ch": "4"}, {"id": "s112_3_q9", "src": "school", "sec": "4-1", "concept": "神經傳導途徑", "q": "海綿寶寶和派大星玩恐怖箱的遊戲，由派大星裝東西到箱子裡給海綿寶寶摸，當海綿寶寶把手伸進箱子，摸到軟綿綿又會動的東西，突然驚聲尖叫。請問海綿寶寶這個反應的神經傳導途徑依序為何？(甲)腦；(乙)脊髓；(丙)感覺神經元；(丁)運動神經元；(戊)動器；(己)受器。", "ex": "摸到東西後驚叫是有意識的反應：受器（己）→感覺神經元（丙）→脊髓（乙）→腦（甲）→運動神經元（丁）→動器（戊）。尖叫是由腦直接下令發聲，不必再經過脊髓。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己丙甲乙丁戊", "己丙乙甲丁戊", "己丙乙甲乙丁戊", "己丙甲丁戊。"], "ans": 1, "ch": "4"}, {"id": "s112_3_q10", "src": "school", "sec": "4-1", "concept": "感覺疲勞", "q": "最近天氣越來越冷，小明跟家人便去宜蘭礁溪泡溫泉，當小明剛剛泡到溫泉水時覺得很燙，但是一段時間後，感覺水溫漸漸降低，不再如原先一開始那麼熱。請問這種現象最可能是下列何種原因所造成？", "ex": "皮膚的受器連續接受同樣的刺激一段時間後，敏感度下降，就覺得水沒那麼燙了，這叫感覺疲勞。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水溫過高破壞了感覺神經", "水溫過高使得部分皮膚受器受損", "皮膚受器連續接受刺激，造成感覺疲勞", "腦部的體溫調節中樞功能失調。"], "ans": 2, "ch": "4"}, {"id": "s112_3_q11", "src": "school", "sec": "4-1", "concept": "後像", "q": "下列有關「後像」的敘述，何者錯誤？", "ex": "後像是視覺暫留或視覺疲勞造成的正常現象，不代表身體十分疲勞、需要馬上休息，所以(D)錯。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["視覺暫留及視覺疲勞會造成後像的產生", "跨年的燦爛煙火即是一種後像", "「青天白日」產生後像後會變成「橙天黑日」", "後像的產生代表身體已十分疲勞，此時需要馬上休息以免後續造成傷害。"], "ans": 3, "ch": "4"}, {"id": "s112_3_q12", "src": "school", "sec": "4-1", "concept": "反應時間測定", "q": "學生做「反應時間的測定」實驗，接尺 5 次的距離分別是18cm、20cm、22 cm、22cm 及 18 cm，利用上表推算，此學生的反應時間約為多少秒？", "ex": "五次接尺距離的平均是（18＋20＋22＋22＋18）÷5＝20 公分，查表 20 公分對應 0.20 秒。", "fig": "fig/s112_3_q12.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["0.20 秒", "0.21 秒", "0.22 秒", "0.23 秒。"], "ans": 0, "ch": "4"}, {"id": "s112_3_q13", "src": "school", "sec": "4-2", "concept": "性腺與月經", "q": "美芽做了輸卵管結紮手術（但卵巢並未切除），有關她手術後的敘述，下列何者正確？", "ex": "輸卵管結紮只是阻斷卵細胞和精子相遇，卵巢仍然正常製造卵細胞和雌性激素，所以仍會有月經。雌性激素是經由血液運送，不靠輸卵管。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["已無法運送雌性激素", "已無法製造雌性激素", "仍會有月經", "已無法產生卵細胞。"], "ans": 2, "ch": "4"}, {"id": "s112_3_q14", "src": "school", "sec": "4-2", "concept": "胰島素", "q": "關於胰島素的敘述，下列何者正確？", "ex": "胰島素由胰臟的胰島分泌，能促進細胞利用葡萄糖、把葡萄糖轉成肝糖，使血糖降低。激素是經由血液運送，不需要導管。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["由肝臟產生", "可增加血糖濃度", "由特定的管道運送", "能促進養分的利用"], "ans": 3, "ch": "4"}, {"id": "s112_3_q15", "src": "school", "sec": "4-3", "concept": "膨壓運動", "q": "植物雖然沒有神經系統，但是也能接受環境的刺激，而有所感應，下列那些植物的感應與膨壓的改變有關？ (甲)莖的向光性； (乙)根的向溼性； (丙)酢醬草的睡眠運動；(丁)含羞草的觸發運動；(戊)植物氣孔的開閉。", "ex": "酢醬草的睡眠運動（丙）、含羞草的觸發運動（丁）、氣孔開閉（戊）都是細胞膨壓改變造成的。莖的向光性、根的向溼性是生長造成的向性。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["丙丁戊", "乙丙丁", "甲乙戊", "甲乙丙"], "ans": 0, "ch": "4"}, {"id": "s112_3_q16", "src": "school", "sec": "4-3", "concept": "向性實驗", "q": "小儒將幼苗栽種於小容器中並橫放於水平地面上，先置於黑暗（甲環境）中生長一段時間，然後再給予光源持續照射（乙環境），整個實驗設計及結果如附圖所示。根據此實驗，有關幼苗在甲、乙環境中向性的表現或所受的影響，下列敘述何者最合理？", "ex": "在黑暗的甲環境中沒有光，幼苗的莖仍向上彎曲生長，是受地球引力影響的「背地性」。在乙環境中同時受光線和地心引力影響。", "fig": "fig/s112_3_q16.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["幼苗在甲環境中表現出莖的背光效應", "幼苗在甲環境中表現出莖的背地效應", "幼苗在乙環境中受光線的影響，不受地球引力的影響", "幼苗在乙環境中受地球引力的影響，不受光線的影響"], "ans": 1, "ch": "4"}, {"id": "s112_3_q37", "src": "school", "sec": "4-1", "concept": "大腦功能", "q": "某人因患了阿茲海默症，而產生了其記憶喪失和語言能力等障礙，此現象最可能與何處出現異常有關？", "ex": "記憶、語言、思考等功能由大腦（甲）負責，阿茲海默症就是大腦出現異常。", "fig": "fig/s112_3_q37.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為中樞神經系統示意圖，請依據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 0, "ch": "4"}, {"id": "s112_3_q38", "src": "school", "sec": "4-1", "concept": "小腦功能", "q": "馬戲團選手能走在鋼索上而不掉落，是因為哪一部分被訓練得特別發達，以利其可以協調全身肌肉的活動，維持身體的平衡？", "ex": "小腦（乙）負責協調全身肌肉的活動、維持身體平衡，走鋼索的人小腦被訓練得特別好。", "fig": "fig/s112_3_q37.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為中樞神經系統示意圖，請依據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 1, "ch": "4"}, {"id": "s112_3_q39", "src": "school", "sec": "4-1", "concept": "腦幹功能", "q": "有關運動員運動時，其中樞神經系統運作的相關敘述，下列何者正確？", "ex": "腦幹（丙）控制呼吸、心跳等維持生命的基本功能，運動時能增加呼吸頻率，幫助排除二氧化碳。", "fig": "fig/s112_3_q37.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為中樞神經系統示意圖，請依據附圖回答下列問題", "opts": ["甲可使心搏加快，加速血液循環", "乙能維持身體平衡，使運動員加速奔跑", "丁可產生反射動作，使運動員不跌倒", "丙能增加呼吸頻率，以利二氧化碳的排除。"], "ans": 3, "ch": "4"}, {"id": "s112_3_q40", "src": "school", "sec": "4-1", "concept": "腦幹與瞳孔反射", "q": "一名機車駕駛因超速而與汽車相撞，被送進醫院時，醫生用光照他的瞳孔，結果無反射的反應。醫生這麼做的目是為了查詢病人何處有無損傷，以判定其是否具有生命跡象？", "ex": "光照瞳孔會縮小是由腦幹控制的反射。若沒有反應，表示腦幹（丙）可能嚴重受損，是判斷生命跡象的方法之一。", "fig": "fig/s112_3_q37.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為中樞神經系統示意圖，請依據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 2, "ch": "4"}, {"id": "s112_3_q41", "src": "school", "sec": "4-1", "concept": "中樞神經功能", "q": "花花是一個花式溜冰選手，她可以快速直線前進、也可以向左或向右轉彎、或是在冰上多次轉圈而不頭暈，請問花花溜冰時，依據神經系統運作的相關敘述，下列何者正確？", "ex": "判斷要往左還是往右是大腦（甲）的思考判斷。呼吸由腦幹調節、轉圈不頭暈靠小腦維持平衡、前進速度也是大腦決定。", "fig": "fig/s112_3_q37.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為中樞神經系統示意圖，請依據附圖回答下列問題", "opts": ["向左或向右前進由甲判斷", "呼吸頻率的快慢由乙調節", "身體多次轉圈而不頭暈是藉由丙維持", "直線前進的速度由丁決定。"], "ans": 0, "ch": "4"}, {"id": "s112_3_q44", "src": "school", "sec": "4-2", "concept": "調控血糖的腺體", "q": "請問哪兩個腺體可以直接調控血糖濃度？", "ex": "直接調控血糖的是胰臟（丁，分泌胰島素和升糖素）和腎上腺（丙，分泌腎上腺素使血糖上升），所以選丙丁。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["甲丙", "丙丁", "乙丁", "甲丁。"], "ans": 1, "ch": "4"}, {"id": "s112_3_q45", "src": "school", "sec": "4-2", "concept": "副甲狀腺", "q": "小美血液中的含鈣量較低，故常會抽筋， 最可能為何種腺體分泌異常所致？", "ex": "副甲狀腺（庚）分泌的激素調節血液中鈣的濃度，分泌異常會使血鈣過低而抽筋。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["甲", "乙", "丙", "庚。"], "ans": 3, "ch": "4"}, {"id": "s112_3_q46", "src": "school", "sec": "4-2", "concept": "甲狀腺", "q": "幼年時期若身體的生長發育遲緩並且智力發展受阻最可能是何種腺體分泌不足所導致的結果？", "ex": "甲狀腺素可以促進代謝和生長發育，幼年時分泌不足會生長遲緩、智力發展受阻（呆小症），甲狀腺是乙。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["甲", "乙", "戊己", "庚。"], "ans": 1, "ch": "4"}, {"id": "s112_3_q47", "src": "school", "sec": "4-2", "concept": "睪丸與第二性徵", "q": "小智上了國中，發現長了喉結，且臉上明顯開始出現鬍子，請問此變化主要是哪一個腺體的作用？", "ex": "青春期男生長喉結、鬍子是第二性徵，由睪丸（己）分泌的雄性激素促成。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["甲", "丙", "戊", "己。"], "ans": 3, "ch": "4"}, {"id": "s112_3_q48", "src": "school", "sec": "4-2", "concept": "生長激素與性激素", "q": "寧寧是一名進入青春期的學生，某天學校進行健康檢查，發現自己這一年來竟然長高了５公分，且開始有月經，這主要是受到下列哪些腺體的影響？", "ex": "長高是腦垂腺（甲）分泌的生長激素作用；開始有月經是卵巢（戊）分泌的雌性激素作用，所以是甲戊。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["甲己", "乙丁", "甲戊", "甲乙"], "ans": 2, "ch": "4"}, {"id": "s112_3_q49", "src": "school", "sec": "4-2", "concept": "甲狀腺亢進", "q": "花花最近出現脖子腫大且體重急遽下降、神經緊張、雙手顫抖，花花抽血的結果可能為何？", "ex": "脖子腫大、體重下降、神經緊張、雙手顫抖，是甲狀腺素分泌過多（甲狀腺亢進）的症狀，甲狀腺是乙。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["丙腺體分泌量過低", "乙腺體分泌量過高", "丙腺體分泌量過高", "乙腺體分泌量過低。"], "ans": 1, "ch": "4"}, {"id": "s112_3_q50", "src": "school", "sec": "4-2", "concept": "腎上腺素", "q": "家九回家路上任意穿越馬路，機車朝他直衝而來，他急忙往馬路對向狂奔。此時體內哪個腺體的分泌量應該增加，對生理變化影響為何？", "ex": "遇到危險時腎上腺（丙）分泌腎上腺素，使呼吸、心跳加快，血壓、血糖上升，讓身體有能量應付緊急狀況。", "fig": "fig/s112_3_q44.webp", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統示意圖，依據附圖回答下列問題(庚呈豆狀，包埋於乙內)", "opts": ["乙；呼吸、心跳下降，血壓、血糖上升", "乙；呼吸、心跳加快，血壓、血糖下降", "丙；呼吸、心跳加快，血壓、血糖上升", "丙；呼吸、心跳下降，血壓、血糖下降"], "ans": 2, "ch": "4"}, {"id": "s113_3_q1", "src": "school", "sec": "4-1", "concept": "受器", "q": "大目博士想要研究生物的「受器」，下列關於他的研究發現，何者錯誤？", "ex": "汗腺流汗是對刺激做出的反應，汗腺屬於動器，不是受器的研究發現，所以(A)錯。視網膜、味蕾、皮膚中的熱受器都是受器。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["皮膚中汗腺流出汗", "眼睛內的受器-視網膜，可以接受光線刺激", "食物的味道分子碰觸舌頭上的味蕾", "人類皮膚的熱受器，只能接受熱的刺激。"], "ans": 0, "ch": "4"}, {"id": "s113_3_q2", "src": "school", "sec": "4-1", "concept": "神經元構造", "q": "附圖為神經元的構造示意圖，有關神經元的敘述，下列何者正確？", "ex": "丙是神經元細長的突起（軸突），負責傳導神經訊息。乙是細胞核，去掉後細胞無法存活；感覺神經和運動神經是依「傳導方向」區分；甲和丙是同一個細胞的不同部分。", "fig": "fig/s113_3_q2.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["去除乙構造後，該細胞仍然可以存活", "丙部分細長，協助神經訊息的傳導", "依神經長短不同可分為感覺神經及運動神經", "甲細胞加上丙細胞才能組成一個完整的神經元"], "ans": 1, "ch": "4"}, {"id": "s113_3_q3", "src": "school", "sec": "4-1", "concept": "縮手反射", "q": "貝貝的手不小心去碰到熱熨斗，反應的訊息傳遞過程如圖所示。請問下列何者錯誤？", "ex": "手碰到熱熨斗立刻縮回是反射，由脊髓控制：甲（感覺神經）把訊息從指尖傳到脊髓，乙（運動神經）把命令從脊髓傳到肌肉。「感覺到痛」是訊息傳到大腦才產生的，所以(C)錯。", "fig": "fig/s113_3_q3.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲的訊息傳遞方向為指尖向脊髓", "乙的訊息傳遞方向為脊髓向肌肉", "貝貝會感覺到痛，是因為訊息傳遞到脊髓", "此反應動作受脊髓控制"], "ans": 2, "ch": "4"}, {"id": "s113_3_q4", "src": "school", "sec": "4-1", "concept": "神經系統分類", "q": "小強和朋友們一起討論人體神經系統的相關知識，有關他們的討論內容，下列何者正確？", "ex": "運動神經屬於周圍神經。腦神經是周圍神經；脊神經要先把訊息傳到脊髓，再由脊髓傳到腦；感覺神經是把訊息從受器傳到中樞。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小強：腦神經屬於中樞神經", "小蓮：脊神經可以將訊息從手指直接傳到大腦", "小美：感覺神經可以將訊息傳到受器", "小嫻：運動神經屬於周圍神經"], "ans": 3, "ch": "4"}, {"id": "s113_3_q5", "src": "school", "sec": "4-1", "concept": "意識動作傳導途徑", "q": "下列哪一項描述的行為，符合下列的神經訊號傳導路線 : 受器→感覺神經→脊髓→腦→脊髓→運動神經→動器", "ex": "被蚊子叮咬後用另一隻手去拍，要經過大腦判斷：受器→感覺神經→脊髓→腦→脊髓→運動神經→動器。打噴嚏、腳踩尖物縮回是反射；張嘴唱歌是由腦直接經腦神經下令，不經過脊髓。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["聞到刺激的氣味而打噴嚏", "腳踩到尖物迅速縮回", "左手臂被蚊子叮咬，用右手去拍打蚊子", "聽到音樂想著歌詞張嘴跟著唱歌"], "ans": 2, "ch": "4"}, {"id": "s113_3_q6", "src": "school", "sec": "4-1", "concept": "反射動作", "q": "(甲)喝水嗆到馬上咳嗽；(乙)遇到強光眨眼；(丙)跳繩；(丁)寫字；(戊)手碰熱水立即縮回；(己)抓癢。以上所列哪些是屬於反射動作？", "ex": "反射是不經大腦思考、很快就發生的反應：嗆到咳嗽（甲）、強光眨眼（乙）、手碰熱水縮回（戊）。跳繩、寫字、抓癢都要經過大腦。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙戊", "甲乙己戊", "甲乙戊己", "乙丁己"], "ans": 0, "ch": "4"}, {"id": "s113_3_q7", "src": "school", "sec": "4-1", "concept": "接尺實驗傳導途徑", "q": "(甲)大腦；(乙)脊髓；(丙)感覺神經元；(丁)運動神經元；(戊)手部肌肉；(己)眼睛。接尺實驗的神經傳導途徑為何？", "ex": "接尺時眼睛看到尺落下：眼睛（己）→感覺神經元（丙）→大腦（甲）→脊髓（乙）→運動神經元（丁）→手部肌肉（戊）。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己丙乙甲丁戊", "己丙甲乙丁戊", "己丁甲乙丙戊", "己丁乙甲丙戊"], "ans": 1, "ch": "4"}, {"id": "s113_3_q8", "src": "school", "sec": "4-2", "concept": "激素特性", "q": "小智和朋友們一起討論人體內分泌系統的相關知識，有關他們的討論內容，下列何者正確？", "ex": "激素作用的時間比神經系統慢但比較持久。激素不是越多越好；一個腺體可以分泌多種激素；激素是經由血液運送，不靠導管。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小剛：激素的分泌量愈多，愈有利於人體健康", "小霞：每一個內分泌腺體只能分泌一種激素", "小智：人體的激素藉由導管運送", "小建：激素影響器官或組織的時間比神經系統持久"], "ans": 3, "ch": "4"}, {"id": "s113_3_q9", "src": "school", "sec": "4-1", "concept": "反應時間測定", "q": "學生做「反應時間的測定」實驗，接尺 5 次的距離分別是 18cm、16 cm、22 cm、24 cm 及 20cm，如表，推算此學生的反應時間為多少秒？", "ex": "五次接尺距離的平均是（18＋16＋22＋24＋20）÷5＝20 公分，查表 20 公分對應 0.20 秒。", "fig": "fig/s113_3_q9.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["0.20 秒", "0.21 秒", "0.22 秒", "0.23 秒。"], "ans": 0, "ch": "4"}, {"id": "s113_3_q10", "src": "school", "sec": "4-2", "concept": "影響生長的激素", "q": "下列哪些激素的分泌情況，會直接影響個體的生長？", "ex": "生長激素促進生長，甲狀腺素促進代謝和生長發育，兩者都會直接影響個體的生長。腎上腺素、胰島素主要和血糖、緊急反應有關。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["生長激素、甲狀腺素", "生長激素、腎上腺素", "甲狀腺素、腎上腺素", "生長激素、胰島素。"], "ans": 0, "ch": "4"}, {"id": "s113_3_q11", "src": "school", "sec": "4-2", "concept": "甲狀腺亢進", "q": "「甲狀腺亢進」是臺灣相當普遍的一種疾病。患者常見的症狀有心跳加快、焦慮、容易緊張、手會抖、多食、多汗、失眠等。下敘述何者正確？", "ex": "甲狀腺亢進是甲狀腺素分泌過多，細胞代謝變快，可以藉由抽血檢驗激素濃度來診斷。甲狀腺位在頸部氣管兩側，不在大腦下方。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲狀腺亢進是因為甲狀腺素分泌過少導致細胞活動旺盛而體重減輕", "甲狀腺亢進患者會有細胞代謝變慢的現象", "甲狀腺位於大腦下方", "可以藉由抽血檢驗是否患有甲狀腺亢進"], "ans": 3, "ch": "4"}, {"id": "s113_3_q12", "src": "school", "sec": "4-2", "concept": "腎上腺素", "q": "花花放學回家途中被狗追，她瞬間翻越平常不能翻過的圍牆，逃避小狗追擊。關於她的反應和生理變化描述，下列敘述何者正確？", "ex": "被狗追時腎上腺素大量分泌，使血壓升高、心跳加快，讓她能翻越平常翻不過的圍牆。翻牆是有意識的動作，不是反射；心跳、呼吸由腦幹調節。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["瞬間翻越圍牆的反應是屬於反射動作", "腎上腺素大量分泌，使血壓升高，心跳次數增加", "瞬間翻越圍牆的反射動作是由脊髓控制", "大腦參與調節，使心跳及呼吸頻率上升"], "ans": 1, "ch": "4"}, {"id": "s113_3_q13", "src": "school", "sec": "4-1", "concept": "後像", "q": "下列有關「後像」的敘述，何者錯誤？", "ex": "卡通影片是利用視覺暫留，也就是「正片後像」，不是負片後像，所以(D)錯。注視紅花綠葉後出現綠花紅葉才是負片後像。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["視覺暫留會造成後像的產生", "跨年煙火的原理是一種正片後像的運用", "「紅花綠葉」產生後像後會變成「綠花紅葉」", "卡通影片的原理是一種負片後像的運用。"], "ans": 3, "ch": "4"}, {"id": "s113_3_q14", "src": "school", "sec": "4-1", "concept": "溫度感覺", "q": "將三個盒子分別標註甲、乙、丙，各裝入45℃、20℃和2℃的水，將右手浸入甲盆水中，左手浸入丙盆水中，三分鐘後兩手同時移到乙盆水中，此時兩手傳入的訊息感覺如何？", "ex": "右手先泡 45℃ 熱水，再移到 20℃ 會覺得冷；左手先泡 2℃ 冷水，再移到 20℃ 會覺得熱。冷熱的感覺是和之前的溫度比較出來的。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["左手感覺熱，右手感覺冷", "雙手都感覺冷", "左手感覺冷，右手感覺熱", "雙手都感覺熱"], "ans": 0, "ch": "4"}, {"id": "s113_3_q15", "src": "school", "sec": "4-3", "concept": "膨壓運動", "q": "植物雖然沒有神經系統，但是也能接受環境的刺激，而有所感應，下列那些植物的感應與膨壓的改變有關？(甲)窗邊植物的莖朝向窗外生長；(乙)酢醬草在一日當中的葉片的展開與閉合；(丙)馬鈴薯的根向地生長；(丁)捕蠅草的捕蟲運動；(戊)蘆薈的氣孔開閉。", "ex": "酢醬草葉片開合（乙）、捕蠅草捕蟲（丁）、氣孔開閉（戊）都是膨壓改變造成的。莖向光、根向地生長是向性。", "fig": "", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["乙丁戊", "乙丙丁", "甲丙", "甲乙戊"], "ans": 0, "ch": "4"}, {"id": "s113_3_q16", "src": "school", "sec": "4-3", "concept": "氣孔開合", "q": "保衛細胞與氣孔開合有關。附圖中，保衛細胞的外形由甲轉變成乙，請問：保衛細胞發生了什麼變化？", "ex": "保衛細胞吸水後膨壓上升，細胞膨脹彎曲，中間的氣孔就張開。甲是氣孔關閉的樣子，乙是張開的樣子。", "fig": "fig/s113_3_q16.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["膨壓上升，氣孔關閉", "膨壓下降，氣孔張開", "膨壓上升，氣孔張開", "膨壓下降，氣孔關閉"], "ans": 2, "ch": "4"}, {"id": "s113_3_q17", "src": "school", "sec": "4-3", "concept": "向地性實驗", "q": "小強選取泡過水的綠豆4顆，置於培養皿中固定後，根尖端向著中心排列，並將培養皿垂直放在暗室中。3 天後，觀察綠豆幼苗的生長情形，並記錄結果如附圖所示，其中有一顆綠豆的生長方向紀錄錯誤，請你幫小強找出哪一個紀錄錯誤？", "ex": "培養皿垂直放在暗室中，幼苗的根都會向下（向地）生長、莖向上（背地）生長。紀錄中有一顆的生長方向不符合這個規律，官方判定是丙。", "fig": "fig/s113_3_q17.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 2, "ch": "4"}, {"id": "s113_3_q34", "src": "school", "sec": "4-1", "concept": "小腦功能", "q": "有隻貓不慎從高處摔下來，卻能在半空中翻轉身體，迅速維持平衡，平穩落地，請問：這種特性和貓的何種中樞神經較發達有關？", "ex": "貓在半空中翻轉身體、平穩落地，靠的是負責協調肌肉、維持平衡的小腦（乙）特別發達。", "fig": "fig/s113_3_q34.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 1, "ch": "4"}, {"id": "s113_3_q35", "src": "school", "sec": "4-1", "concept": "大腦功能", "q": "阿霞正在觀賞一部感人的電影，當劇情來到精采橋段時，她不禁感動到留下淚水。請問：讓阿霞產生「感動」的部位，位於附圖中的何處？", "ex": "感動、喜怒哀樂等情緒和意識都是大腦（甲）產生的。", "fig": "fig/s113_3_q34.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 0, "ch": "4"}, {"id": "s113_3_q36", "src": "school", "sec": "4-1", "concept": "腦幹功能", "q": "小葉因酒後開車，不幸發生車禍以致腦部受傷、呼吸困難，不久呼吸就停止而宣告死亡。請問他可能是圖中的哪一部位受到嚴重的傷害？", "ex": "腦幹（丙）控制呼吸和心跳，嚴重受傷時呼吸就會停止。", "fig": "fig/s113_3_q34.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 2, "ch": "4"}, {"id": "s113_3_q37", "src": "school", "sec": "4-1", "concept": "反射中樞", "q": "小婷喝玉米濃湯時，灑了太多胡椒粉，因此「猛打噴嚏」，結果一不小心「手被熱湯燙到而立刻縮回」。請問上述兩種反應分別由哪些構造所控制？", "ex": "打噴嚏是由腦幹（丙）控制的反射；手被燙到立刻縮回是由脊髓（丁）控制的反射，所以選丙、丁。", "fig": "fig/s113_3_q34.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲、丁", "丙、丁", "丙、乙", "乙、丁。"], "ans": 1, "ch": "4"}, {"id": "s113_3_q40", "src": "school", "sec": "4-2", "concept": "甲狀腺", "q": "何種腺體在幼年時期分泌不足，會導致智能低落及身材矮小症狀？", "ex": "幼年時甲狀腺素分泌不足會導致智能低落、身材矮小（呆小症），甲狀腺是乙。", "fig": "fig/s113_3_q40.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "庚"], "ans": 1, "ch": "4"}, {"id": "s113_3_q41", "src": "school", "sec": "4-2", "concept": "腎上腺", "q": "建成與同事相約下班後去看恐怖片，觀賞過程中，因為劇情實在太刺激，使得建成的心跳加快、血糖上升。請問此一生理反應為何種腺體所分泌的激素所致？", "ex": "受到驚嚇時，腎上腺（丙）分泌腎上腺素，使心跳加快、血糖上升。", "fig": "fig/s113_3_q40.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "庚"], "ans": 2, "ch": "4"}, {"id": "s113_3_q42", "src": "school", "sec": "4-2", "concept": "副甲狀腺", "q": "阿璋常有抽筋的情形，經過檢查發現他的血液中鈣濃度不正常，這是哪一種內分泌腺的問題？", "ex": "副甲狀腺（庚）分泌的激素調節血鈣濃度，異常時血鈣不正常會抽筋。", "fig": "fig/s113_3_q40.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "庚"], "ans": 3, "ch": "4"}, {"id": "s113_3_q43", "src": "school", "sec": "4-2", "concept": "睪丸與第二性徵", "q": "俊明上高中以後，聲音變得低沉、也長出鬍子，這和哪一種腺體分泌的激素有關？", "ex": "男生青春期聲音變低沉、長鬍子是第二性徵，和睪丸（己）分泌的雄性激素有關。", "fig": "fig/s113_3_q40.webp", "year": 113, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "丙", "己", "戊"], "ans": 2, "ch": "4"}, {"id": "s114_3_q3", "src": "school", "sec": "4-1", "concept": "皮膚受器", "q": "大目博士想要研究生物的「受器」，下列關於他的研究發現，何者正確？", "ex": "皮膚裡有多種受器，分別負責接受觸、壓、冷、熱、痛等刺激。視覺在大腦產生；受器只負責接收刺激，產生反應的是動器；肌肉是動器不是受器。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["人類的皮膚內具有多種單一功能的受器，可以分別接受觸、壓、冷、熱、痛..等刺激", "眼睛內的受器-視網膜，可以接受光線刺激，故視覺是在眼睛產生", "受器能使生物接收環境中的刺激並產生反應", "眼睛、耳朵、鼻子、舌頭及肌肉皆屬於受器。"], "ans": 0, "ch": "4"}, {"id": "s114_3_q4", "src": "school", "sec": "4-1", "concept": "神經元構造", "q": "附圖為神經元的構造示意圖，有關神經元的敘述，下列何者錯誤？", "ex": "甲是細胞本體，有細胞核，控制神經元的代謝；乙是細長的突起，負責傳導訊息。能收縮舒張引發運動的是肌肉細胞，不是神經元，所以(B)錯。", "fig": "fig/s114_3_q4.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲具有細胞核", "乙能交替收縮和舒張引發運動", "甲控制神經元的代謝", "甲加上乙才能組成一個完整的神經元"], "ans": 1, "ch": "4"}, {"id": "s114_3_q5", "src": "school", "sec": "4-1", "concept": "不經脊髓的傳導", "q": "何者的神經傳導途徑符合：受器→感覺神經→大腦→運動神經→動器？", "ex": "「看到媽媽馬上微笑」由眼睛接收刺激，訊息經腦神經進入大腦，再由腦神經下令臉部肌肉微笑，不經過脊髓。梳頭、舉手要用手，需經過脊髓；摸到熱水壺縮回是脊髓反射。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["一邊照鏡子，一邊梳理頭髮", "聽到老師點名，立刻舉手", "看到媽媽走過來，馬上露齒微笑", "手摸到熱水壺立刻縮回。"], "ans": 2, "ch": "4"}, {"id": "s114_3_q6", "src": "school", "sec": "4-1", "concept": "感覺與運動神經元", "q": "下列有關感覺神經元和運動神經元的敘述，何者正確？", "ex": "感覺神經元和運動神經元都屬於周圍神經。笑出來需要運動神經元下令肌肉；感覺神經元把訊息從受器傳到中樞，運動神經元把命令從中樞傳到動器。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["「想到有趣的事笑了出來」的神經傳導路徑不須經過運動神經元", "感覺神經元會將訊息由受器傳導到動器", "運動神經元會將訊息由動器傳導到中樞神經", "兩者皆屬於周圍神經"], "ans": 3, "ch": "4"}, {"id": "s114_3_q7", "src": "school", "sec": "4-1", "concept": "反射動作", "q": "(甲)分泌唾液；(乙)不經意的眨眼；(丙)手被蚊子叮咬後，用手抓癢；(丁)咳嗽；(戊)腳踩到釘子立刻縮回；(己)聽到哨聲起跑；以上所列哪些屬於反射動作？", "ex": "分泌唾液（甲）、不經意眨眼（乙）、咳嗽（丁）、踩到釘子縮腳（戊）都是不經大腦思考的反射。抓癢和聽到哨聲起跑都要經過大腦。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙丁己", "甲乙戊己", "甲乙丁戊", "甲丁戊己。"], "ans": 2, "ch": "4"}, {"id": "s114_3_q8", "src": "school", "sec": "4-1", "concept": "意識動作傳導途徑", "q": "(甲)大腦；(乙)脊髓；(丙)感覺神經元；(丁)運動神經元；(戊)手部肌肉；(己)眼睛。真真拿到生物考卷看完題目後，迅速寫出答案的過程中，訊息的傳導途徑依序為何？", "ex": "看題目後寫答案：眼睛（己）→感覺神經元（丙）→大腦（甲）→脊髓（乙）→運動神經元（丁）→手部肌肉（戊）。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己丙甲乙丁戊", "己丁乙甲丙戊", "己丁甲乙丙戊", "己丙乙甲丁戊"], "ans": 0, "ch": "4"}, {"id": "s114_3_q9", "src": "school", "sec": "4-1", "concept": "縮手反射", "q": "附圖為某神經傳導路徑的示意圖，下列相關敘述何者錯誤？", "ex": "乙把訊息從脊髓傳到手臂肌肉，是運動神經，不是感覺神經，所以(D)錯。甲是感覺神經，甲、乙都是脊神經；反射是天生的，練習不能縮短。", "fig": "fig/s114_3_q9.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["不能藉由練習縮短此神經傳導的反應時間", "甲的訊息傳遞方向為手指傳至脊髓", "甲和乙都是脊神經", "乙是感覺神經"], "ans": 3, "ch": "4"}, {"id": "s114_3_q10", "src": "school", "sec": "4-1", "concept": "後像", "q": "下列有關「後像」的敘述，何者錯誤？", "ex": "流星的長尾巴是視覺暫留造成的「正片後像」，不是負片後像，所以(A)錯。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["看到流星的「長尾巴」是負片後像", "注視「紅花綠葉」一段時間後，看到的後像會變成「綠花紅葉」", "國慶日施放煙火，我們看到的煙火是正片後像的運用", "視覺疲勞會造成後像的產生。"], "ans": 0, "ch": "4"}, {"id": "s114_3_q11", "src": "school", "sec": "4-1", "concept": "反應時間測定", "q": "學生做「反應時間的測定」實驗，接尺 5 次的距離分別是 26 cm、22cm、20 cm、18cm 及 14cm，如表，推算此學生的反應時間為多少秒？", "ex": "五次接尺距離的平均是（26＋22＋20＋18＋14）÷5＝20 公分，查表 20 公分對應 0.20 秒。", "fig": "fig/s114_3_q11.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["0.19 秒", "0.20 秒", "0.21 秒", "0.22 秒。"], "ans": 1, "ch": "4"}, {"id": "s114_3_q12", "src": "school", "sec": "4-2", "concept": "激素特性", "q": "有關人體的內分泌系統敘述，何者錯誤？", "ex": "內分泌腺沒有導管，激素是直接進入血液、隨血液運送到作用的器官，所以(D)錯。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["有些內分泌腺可受腦垂腺激素的影響", "激素對人體的助益與分泌量不會成正比", "激素對某一器官或某些細胞可發揮作用", "激素分泌後經由導管運送到作用的器官"], "ans": 3, "ch": "4"}, {"id": "s114_3_q14", "src": "school", "sec": "4-2", "concept": "甲狀腺素", "q": "人在兒童時期，若身體的生長發育遲緩並且智力發展受阻，最有可能是何種激素分泌不足所導致的結果？", "ex": "兒童時期甲狀腺素分泌不足，會生長發育遲緩、智力發展受阻。生長激素不足只會身材矮小，智力正常。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["性激素", "副甲狀腺素", "生長激素", "甲狀腺素"], "ans": 3, "ch": "4"}, {"id": "s114_3_q15", "src": "school", "sec": "4-2", "concept": "腎上腺素", "q": "小亞遇到窮追狂吠的野狗時，感到害怕，轉身逃跑。下列關於她的生理變化敘述何者正確？", "ex": "害怕逃跑時腎上腺素分泌增加，使血糖濃度上升，讓組織獲得足夠養分。聽見狗叫就逃跑要經大腦判斷，不是反射；使血壓上升、心跳加快的是腎上腺素不是升糖素；心跳、呼吸由腦幹調節。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["聽見狗吠就逃跑，屬於反射動作，傳導路徑不經大腦", "血糖濃度上升，使組織獲得足夠的養分", "升糖素大量分泌，使血壓上升，心跳次數增加", "大腦調節使心跳頻率及呼吸頻率上升"], "ans": 1, "ch": "4"}, {"id": "s114_3_q16", "src": "school", "sec": "4-2", "concept": "性腺", "q": "關於性腺的敘述，下列何者正確？", "ex": "青春期胸部發育、月經來臨是卵巢分泌的性激素造成的，屬於第二性徵。激素由血液運送；女性的性腺是卵巢（子宮不是）；性激素促進的是第二性徵。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["睪丸分泌的激素由輸精管運輸", "女性的性腺為子宮", "娜美進入青春期之後，有胸部的發育、月經的到來是因為性腺分泌的激素所致", "性腺分泌的激素會促進第一性徵的表現"], "ans": 2, "ch": "4"}, {"id": "s114_3_q17", "src": "school", "sec": "4-1", "concept": "溫度感覺", "q": "紹揚將右手放入甲杯水中，左手放入乙杯水中，經過一段時間後，他將雙手同時放入丙杯水中，此時右手覺得冷，左手覺得熱。請推測下列相關敘述何者正確？", "ex": "右手從甲杯移到丙杯覺得冷，表示甲比丙熱；左手從乙杯移到丙杯覺得熱，表示乙比丙冷，所以甲杯水溫最高。冷熱的感覺是在大腦產生的。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["三杯水之中，甲杯的水溫最高", "三杯水之中，丙杯的水溫最低", "冷、熱的感覺在脊髓產生", "冷、熱的感覺不涉及大腦的思考判斷"], "ans": 0, "ch": "4"}, {"id": "s114_3_q18", "src": "school", "sec": "4-3", "concept": "膨壓運動", "q": "當保衛細胞受到光線刺激時，會使水分進入細胞，導致細胞內的膨壓上升，造成保衛細胞膨脹而彎曲，於是氣孔就會開啟。請問下列哪些選項有幾項與此原理相同？(甲)豬籠草的莖朝向光源生長；(乙)酢漿草在夜晚葉片下垂；(丁)觸碰含羞草，葉片會閉合；(戊)牽牛花的莖會纏繞枝條向高處生長；(己)竹子莖的背地性；(庚)昆蟲觸碰到捕蠅草其特化的葉片會閉合；(辛)睡蓮花朵會在夜晚時閉合。", "ex": "和保衛細胞一樣是膨壓改變造成的有：酢漿草葉片下垂（乙）、含羞草閉合（丁）、捕蠅草閉合（庚）、睡蓮夜晚閉合（辛），共 4 項。莖向光、纏繞生長、背地性都是向性。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["3 項", "4 項", "5 項", "6 項。"], "ans": 1, "ch": "4"}, {"id": "s114_3_q19", "src": "school", "sec": "4-3", "concept": "向光性", "q": "曉鈴觀察種植在窗台上的含羞草時，她發現含羞草會朝向窗外彎曲生長，請問含羞草這種現象被稱為甚麼？", "ex": "含羞草朝窗外光線方向彎曲生長，是植物的莖朝向光源生長的「向光性」。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["睡眠運動", "觸發運動", "向光性", "向觸性。"], "ans": 2, "ch": "4"}, {"id": "s114_3_q20", "src": "school", "sec": "4-3", "concept": "向觸性", "q": "小云觀察發現，後院種植的菜豆會纏繞枝條往上生長，關於此現象的敘述，何者正確？", "ex": "菜豆纏繞枝條往上長是「向觸性」，可以讓植物爬到高處、得到更多陽光，有利光合作用。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["此生長的目的是為了獲得更多的水分", "纏繞枝條的現象稱為觸發運動", "纏繞枝條的現象稱為向光性", "經纏繞而向高處生長，有利光合作用的進行"], "ans": 3, "ch": "4"}, {"id": "s114_3_q21", "src": "school", "sec": "4-3", "concept": "向性", "q": "下列敘述有幾項與植物的向性有關？(甲)豆類植物的莖向光彎曲生長；(乙)酢漿草葉片的睡眠運動；(丙)含羞草葉片的觸發運動；(丁)番茄的根向地生長；(戊)葉片氣孔的開閉。(己)含羞草的觸發運動；(庚)牽牛花的莖會纏繞枝條向高處生長；。", "ex": "屬於向性的有：莖向光（甲）、根向地（丁）、牽牛花纏繞向上的向觸性（庚），共 3 項。睡眠運動、觸發運動、氣孔開閉都是膨壓改變造成的。", "fig": "", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["3 項", "4 項", "5 項", "6 項。"], "ans": 0, "ch": "4"}, {"id": "s114_3_q23", "src": "school", "sec": "4-3", "concept": "向地性", "q": "如附圖所示(圖片方向不一定是真實擺放方向)，這一個箱子的四面被標記為甲、乙、丙、丁，箱內有一株幼苗是以鐵絲固定在潮溼的棉花上生長，而且此箱子一直放置在黑暗環境中。請根據此幼苗彎曲生長的方向，判斷箱子在該環境中被放置時，是以哪一面朝下？", "ex": "在黑暗中幼苗不受光影響，莖會背地向上生長。圖中莖彎向丁那一面，表示丁朝上，所以箱子是以相對的乙面朝下。", "fig": "fig/s114_3_q23.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1, "ch": "4"}, {"id": "s114_3_q40", "src": "school", "sec": "4-1", "concept": "腦死", "q": "腦死的個體無法表現呼吸、心跳等生命徵象，因此腦死是哪一個構造嚴重受損？", "ex": "腦死是腦幹（丙）嚴重受損，無法維持呼吸、心跳等生命徵象。", "fig": "fig/s114_3_q40.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 2, "ch": "4"}, {"id": "s114_3_q41", "src": "school", "sec": "4-1", "concept": "小腦功能", "q": "小嫻是一位花式溜冰選手，她可以在冰上多次轉圈而不會頭暈，請問小嫻極佳的平衡感與哪一個構造有關？", "ex": "在冰上轉圈不頭暈、平衡感很好，和負責平衡協調的小腦（乙）有關。", "fig": "fig/s114_3_q40.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 1, "ch": "4"}, {"id": "s114_3_q42", "src": "school", "sec": "4-1", "concept": "植物人", "q": "植物人已經失去意識，但是仍然可以維持呼吸心跳，他們應該是哪一個部位嚴重受損？", "ex": "植物人失去意識，但還能呼吸心跳，表示大腦（甲）嚴重受損、腦幹仍正常。", "fig": "fig/s114_3_q40.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["甲", "乙", "丙", "丁。"], "ans": 0, "ch": "4"}, {"id": "s114_3_q43", "src": "school", "sec": "4-1", "concept": "反射與意識", "q": "「小惠縫衣服時，被針刺到手指尖端，立刻將手縮回，小惠感到痛並觀察指尖是否流血」上述反應的控制中樞主要為何？", "ex": "被針刺立刻縮手是脊髓（丁）控制的反射；感到痛並觀察是否流血是大腦（甲）的功能，所以選丁、甲。", "fig": "fig/s114_3_q40.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人類中樞神經系統的構造示意圖，請根據附圖回答下列問題", "opts": ["乙、甲", "丙、甲", "丁、甲", "丁、丙"], "ans": 2, "ch": "4"}, {"id": "s114_3_q47", "src": "school", "sec": "4-2", "concept": "生長激素", "q": "小奇15 歲時，身高已經接近200 公分，就醫檢查後發現是因為某個腺體分泌異常，導致身高快速增加，下列何者是小奇體內分泌異常的腺體？", "ex": "15 歲身高接近 200 公分，是腦垂腺（甲）分泌過多生長激素造成的。", "fig": "fig/s114_3_q47.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "丙", "己", "庚。"], "ans": 0, "ch": "4"}, {"id": "s114_3_q48", "src": "school", "sec": "4-2", "concept": "腎上腺素", "q": "一位身材嬌小的媽媽在發生火災時，她能夠一隻手抱著一位剛出生的女兒，又背著行動不便的兒子，從五樓跑到一樓逃生，請問這是哪一種腺體的分泌幫助她有這種爆發力？", "ex": "火災等緊急狀況時，腎上腺（丙）分泌腎上腺素，讓人產生爆發力。", "fig": "fig/s114_3_q47.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "丙", "丁", "戊。"], "ans": 1, "ch": "4"}, {"id": "s114_3_q49", "src": "school", "sec": "4-2", "concept": "甲狀腺素", "q": "小美在網路上購買標示不明的減肥藥，吃了後發現體重有明顯降低，但是常常會有神經興奮、心跳加快..等副作用。請問此藥中可能添加哪一種腺體分泌的激素？", "ex": "甲狀腺素會促進代謝，過多時體重下降、神經興奮、心跳加快，所以減肥藥可能添加甲狀腺（乙）分泌的甲狀腺素。", "fig": "fig/s114_3_q47.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["甲", "乙", "丁", "庚。"], "ans": 1, "ch": "4"}, {"id": "s114_3_q50", "src": "school", "sec": "4-2", "concept": "副甲狀腺", "q": "小松血液中含鈣量低，時常會抽搐，可能為何種腺體異常所致？", "ex": "血鈣過低、時常抽搐，是調節血鈣的副甲狀腺（庚）異常所致。", "fig": "fig/s114_3_q47.webp", "year": 114, "exam": 3, "ansSrc": "official", "warn": "", "pas": "附圖為人體內分泌系統圖，(庚呈豆狀，包埋於乙中)，請根據附圖回答下列問題", "opts": ["乙", "丙", "丁", "庚。"], "ans": 3, "ch": "4"}, {"id": "s112_3_q17", "src": "school", "sec": "5-1", "concept": "呼吸作用產物", "q": "動物、植物呼吸作用所釋出的氣體，有相同的成分嗎？", "ex": "動物和植物的細胞都會行呼吸作用，分解養分產生能量，同時放出二氧化碳，不分白天晚上。植物放出氧氣是光合作用的結果。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["有，都是二氧化碳", "沒有，動物排二氧化碳，植物排氧氣", "有，都是氧氣", "只有在夜晚時，二者呼吸所排氣體才會相同，都是二氧化碳"], "ans": 0, "ch": "5"}, {"id": "s112_3_q18", "src": "school", "sec": "5-1", "concept": "根的呼吸作用", "q": "連日豪雨後，菜園裡的蔬菜常因根部泡水過久而死亡。蔬菜根部泡水過久會死亡的原因為何？", "ex": "根部細胞也要行呼吸作用，需要氧氣。泡水太久，土壤中的空氣被水排走，根缺乏氧氣無法呼吸而死亡。", "fig": "", "year": 112, "exam": 3, "ansSrc": "official", "warn": "", "pas": "", "opts": ["因為細胞破裂而死亡", "因為缺乏養分而死亡", "因為缺乏氧氣而死亡", "因為缺乏二氧化碳而死亡"], "ans": 2, "ch": "5"}, {"id": "s112_3_q19", "src": "school", "sec": "5-1", "concept": "呼吸運動與呼吸作用", "q": "有關「呼吸運動」與「呼吸作用」的敘述，下列何者正確？", "ex": "血液中氧氣不足（或二氧化碳增加）時會刺激腦幹，使呼吸運動加快。呼吸作用的目的是產生能
