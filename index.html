<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七上生物闖關島</title>
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f1ff; --card:#ffffff; --ink:#22203a; --sub:#5d5a78; --line:#e3def7;
  --pri:#5b4bdb; --pri2:#7c6cf0; --ok:#1f9d55; --okbg:#e3f7ea; --bad:#d64545; --badbg:#fde8e8;
  --gold:#f5a524; --c21:#ff8a3d; --c22:#e84393; --c23:#22a35a; --c24:#2f80ed;
  --shadow:0 4px 0 rgba(40,30,110,.12), 0 8px 24px rgba(40,30,110,.08);
  --r:18px; --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16142a; --card:#221f3d; --ink:#f1efff; --sub:#b4b0d6; --line:#37335e;
    --pri:#8f82ff; --pri2:#a79dff; --okbg:#173b27; --badbg:#47202a;
    --shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#16142a; --card:#221f3d; --ink:#f1efff; --sub:#b4b0d6; --line:#37335e;
  --pri:#8f82ff; --pri2:#a79dff; --okbg:#173b27; --badbg:#47202a;
  --shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.65 system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
body.teach{--fs:24px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri)}
img{max-width:100%;height:auto}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
body.teach .wrap{max-width:1180px}

/* 頂列 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.backbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;font-weight:800;padding:6px 14px;min-height:44px;white-space:nowrap}
.backbtn[hidden]{display:none}
@media (max-width:480px){.top .home span{display:none}.xpbar{max-width:90px}}
.top .home{border:0;background:none;font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:6px;padding:6px 4px;min-height:44px}
.xpbox{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lv{background:var(--gold);color:#3b2300;font-weight:800;border-radius:999px;padding:2px 10px;font-size:.8em;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden;max-width:220px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd36b);border-radius:999px;transition:width .5s}
.modebtn{border:2px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85em;min-height:44px;white-space:nowrap}
body.teach .modebtn{background:var(--pri);color:#fff}

/* 卡片與按鈕 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:16px 0}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 60%,#000);min-height:48px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pri) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.gold{background:var(--gold);color:#3b2300;box-shadow:0 4px 0 #b97300}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--sub);font-size:.9em}
h1{font-size:1.6em;margin:18px 0 6px;line-height:1.3}
h2{font-size:1.25em;margin:8px 0;line-height:1.35}
h3{font-size:1.05em;margin:6px 0}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78em;font-weight:700;background:var(--line);color:var(--sub)}
.k{background:color-mix(in srgb,var(--gold) 28%,transparent);border-radius:6px;padding:0 4px;font-weight:700}

/* 首頁地圖 */
.hero{padding:22px 20px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#5b4bdb,#9b5de5 60%,#f15bb5);box-shadow:var(--shadow);margin-top:16px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;color:#fff}
.hero p{margin:0;opacity:.95}
.hero .blob{position:absolute;right:-30px;top:-30px;font-size:120px;opacity:.18;transform:rotate(-12deg)}
.islands{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media (max-width:560px){.islands{grid-template-columns:1fr}}
.isl{border:0;text-align:left;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;min-height:110px;border-left:8px solid var(--c)}
.isl .ic{font-size:44px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.isl b{display:block;font-size:1.08em}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05em}
.stars .off{color:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:0;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:center;min-height:104px}
.tile .ic{font-size:32px}
.tile b{display:block}
.tile small{color:var(--sub);display:block;line-height:1.35}

/* 節次分頁 */
.sechead{display:flex;align-items:center;gap:12px;margin-top:16px}
.sechead .ic{font-size:40px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap;min-height:44px}
.tab.on{border-color:var(--c,var(--pri));background:var(--c,var(--pri));color:#fff}

/* 觀念卡 */
.flash{min-height:300px;display:flex;flex-direction:column}
.flash .t{font-size:1.3em;font-weight:800;margin:4px 0 10px}
.flash .body{flex:1}
.flash .think{margin-top:14px;border:2px dashed var(--line);border-radius:14px;padding:12px}
.flash .think summary{cursor:pointer;font-weight:700;color:var(--pri);min-height:32px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c,var(--pri));width:24px;border-radius:999px}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92em}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:color-mix(in srgb,var(--c,var(--pri)) 14%,transparent)}
.tblwrap{overflow-x:auto}

/* 題目 */
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qtext{font-size:1.06em;white-space:pre-wrap}
.pas{background:color-mix(in srgb,var(--pri) 8%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.95em;white-space:pre-wrap}
.qfig{margin:10px 0;text-align:center}
.qfig img{border-radius:10px;background:#fff;padding:6px;max-height:420px;width:auto}
body.teach .qfig img{max-height:560px}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.img{grid-template-columns:repeat(4,1fr)}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:52px}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:800}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.opt.sel .L{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opts.img .opt{justify-content:center}
.verdict{font-size:1.5em;font-weight:900;margin:14px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ex{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:14px;padding:12px 14px;margin-top:8px}
.warn{background:var(--badbg);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.9em}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--c,var(--pri));transition:width .3s}
.hearts{font-size:1.1em}

/* 模擬 */
.sim{position:relative}
.sim label{font-weight:700;display:block;margin-top:10px}
.sim input[type=range]{width:100%;height:36px;accent-color:var(--c,var(--pri))}
.simview{background:color-mix(in srgb,var(--c,var(--pri)) 7%,var(--card));border-radius:16px;padding:10px;margin-top:10px;text-align:center}
.simview svg{width:100%;height:auto;max-height:340px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;min-height:44px}
.chip.on{border-color:var(--c,var(--pri));background:color-mix(in srgb,var(--c,var(--pri)) 16%,var(--card))}
.readout{font-size:1.1em;font-weight:800;margin-top:8px}
.note{font-size:.88em;color:var(--sub);margin-top:8px}
.tube{transition:fill .8s}
.order li{list-style:none;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card);display:flex;gap:8px;align-items:center;min-height:48px}
.order{padding:0}
.dgrid{display:grid;grid-template-columns:minmax(150px,1fr) 1.3fr;gap:10px;text-align:left;align-items:center}
@media (max-width:560px){.dgrid{grid-template-columns:1fr}.dgrid svg{max-height:300px!important}}
.order li button{border:0;background:var(--line);border-radius:10px;width:40px;height:40px;font-weight:900}
.order li.ok{border-color:var(--ok);background:var(--okbg)}
.order li.bad{border-color:var(--bad);background:var(--badbg)}

/* 結算 / 徽章 */
.big{font-size:3em;text-align:center;margin:8px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.badge .ic{font-size:36px;filter:grayscale(1);opacity:.35}
.badge.got .ic{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;z-index:50;transition:transform .35s;max-width:90vw;text-align:center}
.toast{opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.foot{text-align:center;color:var(--sub);font-size:.8em;margin:30px 0 10px}
.teachonly{display:none} body.teach .teachonly{display:block}
body.teach .stuonly{display:none}
.reveal{margin-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <button class="backbtn" id="backbtn" onclick="goBack()" aria-label="返回上一頁" hidden>← 返回</button>
  <button class="home" onclick="go('#/')" aria-label="回首頁">🏝️ <span>生物闖關島</span></button>
  <div class="xpbox stuonly"><span class="lv" id="lv">Lv 1</span><div class="xpbar"><i id="xpbar" style="width:0"></i></div></div>
  <div class="xpbox teachonly" style="display:none"></div>
  <button class="modebtn" id="modebtn" onclick="toggleTeach()" aria-pressed="false">🎓 上課模式</button>
</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script>
const DATA = {"meta": {"version": "10/23 18:17", "endpoint": ""}, "chapters": [{"id": "1", "title": "生命的發現", "icon": "🔬", "color": "#5b4bdb", "desc": "科學家怎麼找答案？什麼叫「活著」？顯微鏡下的細胞長什麼樣子？"}, {"id": "2", "title": "生物體的營養", "icon": "🍎", "color": "#ff8a3d", "desc": "食物裡有什麼養分？酵素怎麼幫忙？植物怎麼自己做養分？人又是怎麼消化吸收的？"}, {"id": "3", "title": "生物體內的運輸", "icon": "🫀", "color": "#e2502d", "desc": "水怎麼從根爬到樹梢？血液在身體裡走哪條路？身體又怎麼抵抗病原體？"}, {"id": "4", "title": "生物體的協調作用", "icon": "🧠", "color": "#9b5de5", "desc": "眼睛看到球飛來，手怎麼知道要接？激素怎麼調節身體？植物也會「感覺」嗎？"}, {"id": "5", "title": "生物體內的恆定", "icon": "⚖️", "color": "#2f80ed", "desc": "氣體、血糖、水分、體溫——身體怎麼把它們都維持在剛剛好的範圍？"}], "secs": [{"id": "1-0", "title": "進入實驗室", "icon": "🥽", "color": "#7c6cf0", "sim": "lab", "cards": [{"t": "實驗室安全守則", "page": 6, "html": "<ul><li>先開窗通風，確認消防器材、急救設備與逃生路線。<\/li><li>禁止飲食、嬉鬧；長髮綁好。<\/li><li>穿<b>實驗衣<\/b>，必要時戴<b>手套、護目鏡<\/b>。<\/li><li>用藥品前先看清<b>標籤<\/b>，不可擅自動用。<\/li><li>碰到腐蝕性藥品：<b>立即用大量清水沖洗<\/b>並報告老師。<\/li><li>廢棄物分類回收，不可隨意倒掉；離開時關電源、桌椅歸位。<\/li><\/ul>"}, {"t": "器材使用 ○ 與 ✕", "page": 8, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>器材<\/th><th>○ 正確<\/th><th>✕ 錯誤<\/th><\/tr><tr><td>滴管<\/td><td>管口朝下，輕壓橡皮頭<\/td><td>不可倒持<\/td><\/tr><tr><td>溫度計<\/td><td>和杯底留一點距離<\/td><td>不可拿來攪拌<\/td><\/tr><tr><td>量筒<\/td><td>視線和液面中央等高<\/td><td>不可加熱、不可在裡面配溶液<\/td><\/tr><tr><td>酒精燈<\/td><td>酒精 1/3～2/3；用燈罩蓋熄<\/td><td>不可用點燃的燈引燃另一盞；不可用口吹熄<\/td><\/tr><\/table><\/div><p>加熱方式：<b>隔水加熱<\/b>（受熱均勻）與<b>直接加熱<\/b>（管口勿對著人）。<\/p>"}], "ch": "1"}, {"id": "1-1", "title": "探究自然的方法", "icon": "🧪", "color": "#5b4bdb", "sim": "method", "cards": [{"t": "科學方法七步驟", "page": 14, "html": "<p style='font-weight:700'>觀察 → 提出問題 → 參考文獻資料 → 提出假設 → 設計並進行實驗 → 分析實驗結果 → 討論並提出結論<\/p><p>結果<b>支持假設<\/b>→提出結論；<b>不支持<\/b>→回去修正假設。合理的假設經其他科學家重複驗證並被接受，可能成為<b>學說<\/b>。<\/p>", "think": "假設一定是對的嗎？", "hint": "不一定。假設只是「可能的答案」，要靠實驗結果來支持或推翻。"}, {"t": "饅頭的小洞：一個完整例子", "page": 15, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>步驟<\/th><th>饅頭例子<\/th><\/tr><tr><td>觀察<\/td><td>饅頭上有好多小洞<\/td><\/tr><tr><td>提出問題<\/td><td>為什麼會有小洞？<\/td><\/tr><tr><td>假設<\/td><td>可能是酵母菌產生氣體造成的<\/td><\/tr><tr><td>實驗<\/td><td>麵糰加／不加酵母菌，比較高度<\/td><\/tr><tr><td>結論<\/td><td>加酵母菌的麵糰膨脹較多，支持假設<\/td><\/tr><\/table><\/div>"}, {"t": "實驗組與對照組", "page": 16, "html": "<p>加酵母菌的麵糰是<b>實驗組<\/b>，不加的是<b>對照組<\/b>，用來確認結果是不是酵母菌造成的。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>變因<\/th><th>意義<\/th><th>饅頭例子<\/th><\/tr><tr><td><b>操作變因<\/b><\/td><td>兩組刻意不同的因素（每次只設 1 項）<\/td><td>有沒有加酵母菌<\/td><\/tr><tr><td><b>控制變因<\/b><\/td><td>兩組保持相同的因素<\/td><td>麵粉量、糖量、水量、水溫…<\/td><\/tr><tr><td><b>應變變因<\/b><\/td><td>實驗後要測量比較的結果<\/td><td>麵糰膨脹程度<\/td><\/tr><\/table><\/div><p>實驗至少<b>重複 3 次<\/b>以減少誤差。<\/p>"}, {"t": "數據要畫成圖表", "page": 17, "html": "<p>圖表要寫<b>標題、單位、刻度<\/b>。麵糰實驗每 5 分鐘記錄一次：<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>時間（分）<\/th><th>0<\/th><th>10<\/th><th>20<\/th><th>30<\/th><\/tr><tr><td>有酵母（cm）<\/td><td>4.5<\/td><td>6.0<\/td><td>8.0<\/td><td>10.0<\/td><\/tr><tr><td>無酵母（cm）<\/td><td>4.5<\/td><td>4.5<\/td><td>4.5<\/td><td>4.5<\/td><\/tr><\/table><\/div>"}, {"t": "例：吐司發霉實驗", "page": 30, "html": "<p>想知道<b>溼度<\/b>的影響，要比「噴水」和「不噴水」、<b>溫度相同<\/b>的兩組（甲 25℃不噴 vs 乙 25℃噴）。最能保鮮：<b>低溫乾燥<\/b>。<\/p>", "think": "甲（25℃不噴水）和丙（5℃噴水）能比較嗎？", "hint": "不行。兩組有兩個因素不同（溫度和溼度），不知道差異是哪一個造成的——每次只能改一個操作變因。"}], "ch": "1"}, {"id": "1-2", "title": "生命現象與細胞的發現", "icon": "🐿️", "color": "#2f80ed", "sim": "scope", "cards": [{"t": "四種生命現象", "page": 18, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>生命現象<\/th><th>說明<\/th><\/tr><tr><td><b>代謝<\/b><\/td><td>體內的分解與合成，常伴隨能量轉換<\/td><\/tr><tr><td><b>生殖<\/b><\/td><td>成熟後產生新個體<\/td><\/tr><tr><td><b>生長與發育<\/b><\/td><td>細胞增大或變多；形態功能趨於成熟<\/td><\/tr><tr><td><b>感應與運動<\/b><\/td><td>察覺環境變化並反應（冬眠、植物朝光生長）<\/td><\/tr><\/table><\/div><p>具有生命現象的是<b>生物<\/b>，沒有的是<b>非生物<\/b>。非洲肺魚休眠時看似不動，仍是生物。<\/p>"}, {"t": "生物對環境的適應", "page": 20, "html": "<p>多數生物需要<b>日光、空氣、水、養分<\/b>。溫暖多水的珊瑚礁、熱帶雨林生物多；沙漠、深海較少。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>生物<\/th><th>適應<\/th><\/tr><tr><td>蝙蝠<\/td><td>回聲定位，適應黑暗<\/td><\/tr><tr><td>深海鮟鱇<\/td><td>能發光<\/td><\/tr><tr><td>仙人掌<\/td><td>莖儲水、針狀葉減少水分散失<\/td><\/tr><tr><td>水筆仔<\/td><td>胎生苗，適應河口<\/td><\/tr><\/table><\/div>"}, {"t": "生物圈", "page": 22, "html": "<p>所有生物和賴以生存的環境＝<span class='k'>生物圈<\/span>。以海平面為準<b>上下各約 1 萬公尺<\/b>（共約 20 公里），比地球半徑（約 6371 公里）小很多，像蘋果皮一樣薄。範圍可能因生物適應或滅絕而改變。<\/p>"}, {"t": "虎克與細胞學說", "page": 23, "html": "<p>英國科學家<b>虎克<\/b>用自製顯微鏡看<b>軟木塞薄片<\/b>，看到一格一格的構造，命名為<b>細胞<\/b>（其實是死掉的植物細胞留下的<b>細胞壁<\/b>）。<\/p><p><span class='k'>細胞學說<\/span>：細胞是生物體構造與功能的基本單位。許萊登（植物）、許旺（動物）提出，菲可補充「細胞都來自另一個細胞」。<\/p>"}, {"t": "複式顯微鏡", "page": 24, "html": "<p><b>放大倍率＝目鏡倍率×物鏡倍率<\/b>（目鏡越短倍率越大；物鏡越長倍率越大）。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>功能<\/th><\/tr><tr><td>光圈、光源（反光鏡）<\/td><td>調節亮度<\/td><\/tr><tr><td>粗調節輪<\/td><td>大幅調整距離<\/td><\/tr><tr><td>細調節輪<\/td><td>微調，使影像清晰<\/td><\/tr><tr><td>旋轉盤<\/td><td>更換物鏡<\/td><\/tr><\/table><\/div><p>標本要做成<b>透光薄片<\/b>；影像<b>上下顛倒、左右相反<\/b>（平面）。<\/p>"}, {"t": "解剖顯微鏡", "page": 25, "html": "<p>觀察<b>表面構造<\/b>，物體直接放載物板；影像<b>立體正像<\/b>，倍率較低。<\/p><ul><li><b>眼距調整器<\/b>：讓兩眼視野重合。<\/li><li><b>眼焦調整器<\/b>：調右眼焦距。<\/li><li>淺色觀測物用黑色載物板；深色用白色；用下光源時用透明載物板。<\/li><\/ul>"}, {"t": "實驗 1-1：顯微鏡操作重點", "page": 26, "html": "<ol><li>一手握鏡臂、一手托鏡座，放在離桌緣約 10 公分。<\/li><li>先用<b>低倍<\/b>物鏡，調光源光圈，再用粗調節輪找影像、細調節輪調清楚。<\/li><li>換<b>高倍<\/b>前先把目標移到視野<b>中央<\/b>；換高倍後<b>只能用細調節輪<\/b>。<\/li><li>複式顯微鏡：影像往左上跑，代表標本被往<b>右下<\/b>推。<\/li><\/ol><div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>低倍<\/th><th>高倍<\/th><\/tr><tr><td>視野範圍<\/td><td>大<\/td><td>小<\/td><\/tr><tr><td>亮度<\/td><td>亮<\/td><td>暗<\/td><\/tr><tr><td>細胞大小<\/td><td>小<\/td><td>大<\/td><\/tr><tr><td>細胞數目<\/td><td>多<\/td><td>少<\/td><\/tr><\/table><\/div>", "think": "換高倍後視野變暗，要怎麼辦？", "hint": "把光圈開大、光源調亮（或改用凹面反光鏡）。（課本 p.48）"}], "ch": "1"}, {"id": "1-3", "title": "細胞的形態與構造", "icon": "🧫", "color": "#22a35a", "sim": "cell", "cards": [{"t": "細胞的形態與功能有關", "page": 32, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>細胞<\/th><th>形態<\/th><th>功能<\/th><\/tr><tr><td>神經細胞<\/td><td>有許多突起<\/td><td>傳遞訊息<\/td><\/tr><tr><td>口腔皮膜細胞<\/td><td>扁平<\/td><td>保護<\/td><\/tr><tr><td>肌肉細胞<\/td><td>細長<\/td><td>收縮引起運動<\/td><\/tr><tr><td>紅血球<\/td><td>雙凹圓盤<\/td><td>運送氧氣<\/td><\/tr><tr><td>植物表皮細胞<\/td><td>扁平、排列緊密<\/td><td>保護<\/td><\/tr><tr><td>保衛細胞<\/td><td>半月形、兩兩成對<\/td><td>調節氣孔開閉<\/td><\/tr><\/table><\/div><p>鳥類的卵細胞（蛋黃部分）大到肉眼看得見；多數細胞要用顯微鏡才看得清。<\/p>"}, {"t": "細胞的基本構造", "page": 34, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>功能<\/th><\/tr><tr><td><b>細胞核<\/b><\/td><td>含遺傳物質，生命中樞<\/td><\/tr><tr><td><b>細胞質<\/b><\/td><td>代謝的主要場所<\/td><\/tr><tr><td>粒線體<\/td><td>產生能量<\/td><\/tr><tr><td>液泡<\/td><td>暫存水分、養分、廢物<\/td><\/tr><tr><td><b>細胞膜<\/b><\/td><td>區隔內外、控制物質進出；動物細胞最外層<\/td><\/tr><\/table><\/div>"}, {"t": "動物細胞 vs 植物細胞", "page": 45, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>動物<\/th><th>植物<\/th><\/tr><tr><td>細胞核、細胞質、細胞膜、粒線體、液泡<\/td><td>○<\/td><td>○<\/td><\/tr><tr><td><b>細胞壁<\/b>（纖維素，保護、維持形狀）<\/td><td>✕<\/td><td>○<\/td><\/tr><tr><td><b>葉綠體<\/b>（光合作用）<\/td><td>✕<\/td><td>綠色細胞才有<\/td><\/tr><\/table><\/div>", "think": "洋蔥鱗葉表皮細胞有葉綠體嗎？", "hint": "沒有。鱗葉埋在土裡不是綠色；葉綠體只在綠色的植物細胞裡，例如保衛細胞、葉肉細胞。"}, {"t": "實驗 1-2：細胞的觀察", "page": 36, "html": "<ul><li>植物：水蘊草葉片、洋蔥鱗葉表皮、鴨跖草葉下表皮，放在一滴清水中。<\/li><li>動物：牙籤<b>鈍端<\/b>刮口腔內側，放進<b>亞甲藍液<\/b>。<\/li><li>蓋蓋玻片：<b>45 度角<\/b>慢慢放下，減少氣泡。<\/li><li>染色（亞甲藍液或碘液）讓<b>細胞膜和細胞核<\/b>較明顯。<\/li><\/ul><div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>口腔皮膜細胞<\/th><th>植物表皮細胞<\/th><th>保衛細胞<\/th><\/tr><tr><td>細胞壁<\/td><td>✕<\/td><td>○<\/td><td>○<\/td><\/tr><tr><td>葉綠體<\/td><td>✕<\/td><td>✕<\/td><td>○<\/td><\/tr><\/table><\/div>"}], "ch": "1"}, {"id": "1-4", "title": "細胞的組成與物質進出", "icon": "💧", "color": "#22a3c4", "sim": "osmosis", "cards": [{"t": "原子→分子→大分子→細胞", "page": 38, "html": "<p><b>原子<\/b>是組成物質最基本的單位（C 碳、H 氫、O 氧、N 氮）；原子組成<b>分子<\/b>（水、氧氣、葡萄糖）。<\/p><p>多個<b>葡萄糖<\/b>連成<b>澱粉<\/b>；多個<b>胺基酸<\/b>連成<b>蛋白質<\/b>。大分子再組成細胞。<\/p>"}, {"t": "擴散作用", "page": 39, "html": "<p><span class='k'>擴散作用<\/span>：物質由<b>高濃度往低濃度<\/b>移動，最後均勻分布（紅墨水滴入水中）。是物質進出細胞最常見的方式。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>物質<\/th><th>怎麼通過細胞膜<\/th><\/tr><tr><td>氧氣、二氧化碳<\/td><td>直接通過<\/td><\/tr><tr><td>葡萄糖、礦物質、胺基酸<\/td><td>經細胞膜上的特殊構造<\/td><\/tr><tr><td>水<\/td><td>兩種都可以<\/td><\/tr><tr><td>澱粉、蛋白質<\/td><td><b>不能通過<\/b>，要先分解成小分子<\/td><\/tr><\/table><\/div>"}, {"t": "滲透作用", "page": 40, "html": "<p>水通過細胞膜的擴散叫<span class='k'>滲透作用<\/span>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>放在<\/th><th>水的進出<\/th><th>動物細胞<\/th><th>植物細胞<\/th><\/tr><tr><td>清水<\/td><td>進＞出<\/td><td>膨脹，甚至<b>破裂<\/b><\/td><td>膨脹但<b>不破裂<\/b><\/td><\/tr><tr><td>生理食鹽水<\/td><td>進＝出<\/td><td>維持原狀<\/td><td>維持原狀<\/td><\/tr><tr><td>濃食鹽水<\/td><td>進＜出<\/td><td>萎縮<\/td><td>萎縮，<b>細胞膜和細胞壁分開<\/b><\/td><\/tr><\/table><\/div>", "think": "植物細胞放進清水為什麼不會破？", "hint": "外面有細胞壁撐住、保護，動物細胞沒有細胞壁，吸太多水就會破。"}], "ch": "1"}, {"id": "1-5", "title": "生物體的組成層次", "icon": "🧩", "color": "#f5a524", "sim": "levels", "cards": [{"t": "單細胞與多細胞生物", "page": 41, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>單細胞生物<\/th><th>多細胞生物<\/th><\/tr><tr><td>細胞數目<\/td><td>1 個<\/td><td>2 個以上<\/td><\/tr><tr><td>分工合作<\/td><td>✕（一個細胞做全部）<\/td><td>○<\/td><\/tr><tr><td>例子<\/td><td>草履蟲、新月藻、眼蟲<\/td><td>榕樹、黴菌、人、蝸牛<\/td><\/tr><\/table><\/div>"}, {"t": "組成層次", "page": 42, "html": "<p style='font-weight:700'>細胞 → 組織 → 器官 → 器官系統 → 個體<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>層次<\/th><th>動物例<\/th><th>植物例<\/th><\/tr><tr><td>組織<\/td><td>肌肉組織、皮膜組織<\/td><td>表皮、輸導、葉肉組織<\/td><\/tr><tr><td>器官<\/td><td>肝臟、小腸、心臟<\/td><td>根、莖、葉、花、果實、種子<\/td><\/tr><tr><td>器官系統<\/td><td>消化系統、循環系統<\/td><td><b>沒有<\/b><\/td><\/tr><tr><td>個體<\/td><td>人<\/td><td>柚子樹<\/td><\/tr><\/table><\/div><p>植物器官：<b>營養器官<\/b>（根、莖、葉）、<b>生殖器官<\/b>（花、果實、種子）。<\/p>", "think": "葉子是組織還是器官？", "hint": "器官。葉子由表皮組織、葉肉組織、輸導組織等不同組織組成。"}, {"t": "跨科：尺度與觀察工具", "page": 54, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>工具<\/th><th>大約能看到<\/th><\/tr><tr><td>肉眼<\/td><td>0.1 毫米以上<\/td><\/tr><tr><td>光學顯微鏡<\/td><td>最小約 200 奈米<\/td><\/tr><tr><td>電子顯微鏡<\/td><td>約 0.05 奈米<\/td><\/tr><\/table><\/div><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>單位<\/th><th>換成公尺<\/th><\/tr><tr><td>1 公分<\/td><td>0.01<\/td><\/tr><tr><td>1 毫米<\/td><td>0.001<\/td><\/tr><tr><td>1 微米（μm）<\/td><td>0.000001<\/td><\/tr><tr><td>1 奈米（nm）<\/td><td>0.000000001<\/td><\/tr><\/table><\/div><p>照片要看<b>比例尺<\/b>：冠狀病毒約 100 奈米、紅血球約 7 微米，相差 70 倍。沒尺時可用硬幣（10 元約 2.6 公分）比較。<\/p>"}, {"t": "跨科：望遠鏡與巨觀尺度", "page": 58, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>工具<\/th><th>影像<\/th><th>用途<\/th><\/tr><tr><td>雙筒望遠鏡<\/td><td>正立<\/td><td>賞鳥、賞鯨<\/td><\/tr><tr><td>天文望遠鏡<\/td><td>上下顛倒、左右相反<\/td><td>觀測星球<\/td><\/tr><\/table><\/div><p>高度越高，看到的範圍越大，但越看不清個體。<\/p>"}], "ch": "1"}, {"id": "2-1", "title": "食物中的養分", "icon": "🍱", "color": "#ff8a3d", "sim": "food", "cards": [{"t": "六大養分：誰能產生能量？", "page": 66, "html": "<p>養分是維持生命的必需條件。人體需要的養分分成兩組：<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>可以產生能量<\/th><th>無法產生能量<\/th><\/tr><tr><td><b>醣類<\/b>（碳水化合物）<\/td><td><b>礦物質<\/b><\/td><\/tr><tr><td><b>蛋白質<\/b><\/td><td><b>維生素<\/b><\/td><\/tr><tr><td><b>脂質<\/b><\/td><td><b>水<\/b><\/td><\/tr><\/table><\/div><p>只含單一養分的食物很少見，不同食物的養分種類與比例不同。<\/p>", "think": "維生素很重要，為什麼它不能提供能量？", "hint": "「重要」不等於「有能量」。維生素、礦物質、水負責維持正常生命機能，但燃燒它們不會產生熱量（0 大卡）。"}, {"t": "哪些食物富含哪種養分", "page": 66, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>養分<\/th><th>常見食物<\/th><\/tr><tr><td>醣類（例如澱粉）<\/td><td>米飯、麵包、地瓜、馬鈴薯、義大利麵<\/td><\/tr><tr><td>蛋白質<\/td><td>海鮮、肉類、蛋、牛奶、豆類、起司<\/td><\/tr><tr><td>脂質<\/td><td>食用油、橄欖油、奶油、酪梨、堅果<\/td><\/tr><tr><td>礦物質、維生素<\/td><td>各式食物，例如蔬菜、水果<\/td><\/tr><\/table><\/div>"}, {"t": "養分也是建造身體的材料", "page": 67, "html": "<ul><li><span class='k'>纖維素<\/span>（醣類的一種）組成植物的<b>細胞壁<\/b>。<\/li><li><span class='k'>蛋白質<\/span>是肌肉與頭髮的主要成分。<\/li><li>皮膚下層的<span class='k'>脂肪<\/span>可以防止熱量散失、保溫。<\/li><li>鈣：骨骼和牙齒的重要成分；鐵：影響紅血球；維生素 A：眼睛保健；維生素 C：增加復原力和抵抗力；水：協助代謝反應進行。<\/li><\/ul>"}, {"t": "纖維素：是醣類，卻不能給人體能量", "page": 67, "html": "<p>纖維素屬於醣類，但<b>人體無法直接分解它<\/b>來產生能量。適量攝取蔬果中的纖維素能促進腸胃蠕動、維持腸道健康。<\/p><p>高纖食品含較多<b>膳食纖維<\/b>（果膠、纖維素等不易被消化酵素分解的碳水化合物），能幫助糞便形成、避免便祕。（p.85）<\/p>", "think": "纖維素是醣類，1 公克能提供人體 4 大卡嗎？", "hint": "不能。4 大卡指的是人體能分解利用的醣類；人體沒有分解纖維素的酵素，所以纖維素不會變成能量。"}, {"t": "食物的熱量怎麼算", "page": 67, "html": "<p>熱量單位：<b>卡<\/b>或<b>大卡<\/b>，<span class='k'>1000 卡＝1 大卡<\/span>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>養分<\/th><th>每 1 公克產生<\/th><\/tr><tr><td>醣類<\/td><td>4 大卡<\/td><\/tr><tr><td>蛋白質<\/td><td>4 大卡<\/td><\/tr><tr><td>脂質<\/td><td><b>9 大卡<\/b><\/td><\/tr><tr><td>礦物質、維生素、水<\/td><td>0 大卡<\/td><\/tr><\/table><\/div><p>測量方法：燃燒食物加熱錐形瓶裡的水，看水溫上升多少來推估熱量。<\/p>", "think": "一包餅乾含醣類 20 g、蛋白質 2 g、脂質 10 g，大約多少大卡？", "hint": "20×4＋2×4＋10×9＝80＋8＋90＝178 大卡。脂質雖然只有 10 g，提供的熱量卻最多。"}, {"t": "檢測澱粉：碘液", "page": 68, "html": "<p>黃褐色的<span class='k'>碘液<\/span>遇到<b>澱粉<\/b>會變成<b>藍黑色或紫紅色<\/b>；沒有澱粉就維持黃褐色。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>樣品<\/th><th>澱粉液<\/th><th>米飯<\/th><th>糯米<\/th><th>蘋果<\/th><th>水<\/th><\/tr><tr><td>碘液結果<\/td><td>藍黑<\/td><td>藍黑<\/td><td>紫紅<\/td><td>黃褐<\/td><td>黃褐<\/td><\/tr><\/table><\/div><p>「碘液＋水」是<b>對照組<\/b>：確認讓碘液變色的是澱粉，不是水。（p.88）<\/p>"}, {"t": "檢測葡萄糖：本氏液要加熱", "page": 68, "html": "<p>淺藍色的<span class='k'>本氏液<\/span>加入葡萄糖（或麥芽糖）溶液後<b>隔水加熱<\/b>，會依糖的多寡和作用時間變成<b>綠→黃→橙→紅<\/b>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>樣品<\/th><th>葡萄糖液<\/th><th>蘋果果肉汁<\/th><th>米飯<\/th><th>水<\/th><\/tr><tr><td>本氏液加熱後<\/td><td>橘紅<\/td><td>橘紅<\/td><td>淺藍<\/td><td>淺藍<\/td><\/tr><\/table><\/div><p>🔴 <b>澱粉是大分子醣類，不會讓本氏液變色<\/b>；要先被分解成小分子醣類才會。隔水加熱是為了讓試管均勻受熱。（p.88）<\/p>", "think": "米飯含很多醣類，為什麼本氏液測米飯還是淺藍色？", "hint": "米飯裡主要是澱粉（大分子醣類），本氏液只檢測葡萄糖、麥芽糖這類小分子醣類。"}], "ch": "2"}, {"id": "2-2", "title": "酵素", "icon": "🔑", "color": "#e84393", "sim": "enzyme", "cards": [{"t": "代謝作用：分解與合成", "page": 70, "html": "<p>養分在體內經過各種化學反應，產生能量或其他物質，統稱<span class='k'>代謝作用<\/span>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>類型<\/th><th>發生什麼事<\/th><\/tr><tr><td><b>分解作用<\/b><\/td><td>大分子 → 小分子<\/td><\/tr><tr><td><b>合成作用<\/b><\/td><td>小分子 → 結合成大分子<\/td><\/tr><\/table><\/div><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>大分子<\/th><th>澱粉<\/th><th>蛋白質<\/th><th>脂質<\/th><\/tr><tr><td>分解後的小分子<\/td><td>葡萄糖<\/td><td>胺基酸<\/td><td>甘油、脂肪酸<\/td><\/tr><\/table><\/div>"}, {"t": "酵素（酶）與受質", "page": 70, "html": "<p><span class='k'>酵素<\/span>又稱<b>酶<\/b>，能<b>促進<\/b>代謝反應進行。和酵素結合、被它作用的物質叫做<span class='k'>受質<\/span>。<\/p><p>只要環境的溫度、酸鹼性沒有改變，酵素反應結束後還能和新的受質作用——<b>可以重複使用<\/b>。<\/p>"}, {"t": "專一性：一把鑰匙開一個鎖", "page": 70, "html": "<p>酵素和受質的結合具有<span class='k'>專一性<\/span>。例如唾液中的<b>澱粉酶<\/b>能和澱粉結合、把澱粉分解成小分子醣類，卻<b>不能<\/b>和纖維素結合，所以無法分解纖維素。<\/p>", "think": "澱粉和纖維素都是醣類，為什麼澱粉酶只分解澱粉？", "hint": "酵素只能和形狀吻合的受質結合（專一性）。纖維素和澱粉雖然都是醣類，但和澱粉酶「對不上」。"}, {"t": "酵素的主要成分是蛋白質", "page": 71, "html": "<p>大部分酵素的主要成分是<span class='k'>蛋白質<\/span>。所以凡是會影響蛋白質的因素——例如<b>溫度<\/b>、<b>酸鹼值<\/b>——都可能改變酵素的<b>活性<\/b>（反應快慢）。<\/p><p>🔴 「澱粉酶」的名字說的是它分解澱粉，<b>不是<\/b>它由澱粉組成。<\/p>"}, {"t": "溫度與酵素活性", "page": 71, "html": "<p>在一定範圍內，活性隨溫度升高而增加，到<b>最適溫度<\/b>最高；溫度過高，活性降低甚至失去活性。<\/p><p>課本章末強調：溫度過高會<b>破壞蛋白質構造，酵素會永久失去活性<\/b>。（p.86）<\/p><p>實驗 2-2 延伸（本氏液加熱後）：煮沸組<b>藍色<\/b>、低溫組<b>藍綠色<\/b>、37℃ 組<b>黃色<\/b>。（p.75）<\/p>", "think": "食物放冰箱比較不容易壞，為什麼？", "hint": "低溫會降低微生物體內酵素的活性，分解食物的速度變慢；但不是完全停止，所以冷藏太久還是會壞。"}, {"t": "酸鹼值與酵素活性", "page": 71, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>酵素在哪裡<\/th><th>最適合的環境<\/th><\/tr><tr><td>胃<\/td><td><b>酸性<\/b><\/td><\/tr><tr><td>唾液（口腔）<\/td><td>接近<b>中性<\/b><\/td><\/tr><tr><td>小腸<\/td><td><b>鹼性<\/b><\/td><\/tr><\/table><\/div><p>酸鹼值超過可以忍受的範圍，酵素可能降低或失去活性。課本例 1：唾液先加醋（酸性）再加澱粉液，本氏液結果是<b>藍色<\/b>；加水的對照組是<b>橘紅色<\/b>。（p.75）<\/p>", "think": "唾液澱粉酶跟著食物進到胃裡，還能分解澱粉嗎？", "hint": "胃是酸性環境，唾液酵素適合接近中性，到了胃裡活性會大幅降低。"}, {"t": "實驗 2-2：唾液讓米飯變甜", "page": 72, "html": "<p>假說：唾液能讓澱粉產生有甜味的小分子醣類。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>組別<\/th><th>加入<\/th><th>本氏液加熱後<\/th><th>推論<\/th><\/tr><tr><td>實驗組<\/td><td>唾液＋澱粉液<\/td><td>黃色<\/td><td>出現小分子醣類<\/td><\/tr><tr><td>對照組<\/td><td>水＋澱粉液<\/td><td>藍色<\/td><td>沒有小分子醣類<\/td><\/tr><\/table><\/div><p>為什麼要放在 <b>37℃<\/b> 溫水 10 分鐘？因為唾液來自人體，要模擬唾液所在的環境（體溫）。（p.89）<\/p><p>操作變因：是否加唾液；控制變因：澱粉液濃度與體積、溫度、反應時間等。<\/p>"}], "ch": "2"}, {"id": "2-3", "title": "植物如何製造養分", "icon": "🌿", "color": "#22a35a", "sim": "photo", "cards": [{"t": "葉的構造", "page": 76, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>功能<\/th><\/tr><tr><td>角質層<\/td><td>避免水分過度散失<\/td><\/tr><tr><td>上、下表皮<\/td><td>保護葉片（透明無色、排列緊密）<\/td><\/tr><tr><td><b>葉肉<\/b><\/td><td>含大量葉綠體，<b>主要行光合作用<\/b>的場所<\/td><\/tr><tr><td>葉脈<\/td><td>運輸水分和養分<\/td><\/tr><tr><td><b>氣孔<\/b><\/td><td>氣體進出的主要通道<\/td><\/tr><tr><td><b>保衛細胞<\/b><\/td><td>半月形、兩兩成對，調整氣孔開合；含葉綠體<\/td><\/tr><\/table><\/div>"}, {"t": "光合作用", "page": 78, "html": "<p>葉綠體中的<span class='k'>葉綠素<\/span>吸收光能，配合酵素作用，把水和二氧化碳變成氧氣、葡萄糖和水：<\/p><p style='text-align:center;font-weight:800;font-size:1.1em'>水＋二氧化碳 ──(光、葉綠體)──▶ 氧氣＋葡萄糖＋水<\/p><p>光合作用把<b>光能儲存在葡萄糖<\/b>中。<\/p>", "think": "反應式左右兩邊都有水，那水算原料還是產物？", "hint": "兩者都是：水是原料（由根吸收），反應過程中也會產生水。考題常問「原料」，答案要包含水和二氧化碳。"}, {"t": "原料從哪來？產物去哪裡？", "page": 87, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>物質<\/th><th>來源／去處<\/th><\/tr><tr><td>原料<\/td><td>水<\/td><td>主要由<b>根<\/b>吸收<\/td><\/tr><tr><td>原料<\/td><td>二氧化碳<\/td><td>主要由<b>氣孔<\/b>進入<\/td><\/tr><tr><td>產物<\/td><td>葡萄糖<\/td><td>直接利用、形成纖維素，或轉換成<b>澱粉<\/b>等儲存<\/td><\/tr><tr><td>產物<\/td><td>氧氣<\/td><td>過多的氧氣釋放到空氣中<\/td><\/tr><\/table><\/div>"}, {"t": "實驗 2-3：照光才能製造養分", "page": 79, "html": "<p>假說：照光是植物進行光合作用的必要條件之一。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>步驟<\/th><th>目的<\/th><\/tr><tr><td>活動前 3～5 天用鋁箔包住葉片中段<\/td><td>遮光，並<b>消耗<\/b>該部位原本的澱粉<\/td><\/tr><tr><td>葉片放入水中加熱<\/td><td>軟化葉片（角質層會阻擋碘液）<\/td><\/tr><tr><td>改放酒精中<b>隔水加熱<\/b><\/td><td>溶出葉綠素（酒精變綠）；隔水加熱避免酒精燃燒<\/td><\/tr><tr><td>放回熱水漂洗<\/td><td>洗去色素與酒精<\/td><\/tr><tr><td>滴碘液<\/td><td>檢測是否含澱粉<\/td><\/tr><\/table><\/div><p>結果：照光部位<b>藍黑色<\/b>（有澱粉），包鋁箔部位<b>黃褐色<\/b>（沒有澱粉）。<\/p>", "think": "為什麼要 3～5 天前包鋁箔，而不是 3～5 小時前？", "hint": "要讓被包住的部位有足夠時間把原本存著的澱粉用完；如果時間太短，原有的澱粉還在，就看不出是不是照光造成的。"}, {"t": "延伸：需要綠色構造（葉綠體）", "page": 81, "html": "<p>用有綠色、也有非綠色部分的<b>彩葉草<\/b>葉片做同樣的流程：滴碘液後<b>綠色部分呈藍黑色<\/b>。<\/p><p>結論：綠色構造（葉綠體）是光合作用的必要條件之一。<\/p><p>例 2：想驗證「吸收二氧化碳」會影響製造澱粉，可以用<b>油脂塗抹整個葉片<\/b>隔絕氣體進出當實驗組。<\/p>"}, {"t": "光合作用 vs 澱粉檢測", "page": 89, "html": "<p>碘液測的是<b>澱粉<\/b>，不是葡萄糖。光合作用產生的葡萄糖大量產生後會轉換成澱粉儲存，所以「照光部位有澱粉」可以<b>間接<\/b>推論光合作用有進行。<\/p>"}], "ch": "2"}, {"id": "2-4", "title": "人體如何獲得養分", "icon": "🫃", "color": "#2f80ed", "sim": "digest", "cards": [{"t": "消化作用：大分子變小分子", "page": 82, "html": "<p>食物中的大分子養分在體內分解為小分子的過程叫<span class='k'>消化作用<\/span>：<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>大分子<\/th><th>→ 小分子<\/th><\/tr><tr><td>澱粉<\/td><td>葡萄糖<\/td><\/tr><tr><td>蛋白質<\/td><td>胺基酸<\/td><\/tr><tr><td>（部分）脂質<\/td><td>甘油與脂肪酸<\/td><\/tr><\/table><\/div>"}, {"t": "消化系統＝消化道＋消化腺", "page": 82, "html": "<p><b>消化道<\/b>（食物走的路）：口腔 → 咽 → 食道 → 胃 → 小腸 → 大腸 → 肛門。管壁肌肉會<b>蠕動<\/b>推送食物。<\/p><p><b>消化腺<\/b>（分泌消化液）：唾腺、胃腺、腸腺、肝臟、胰臟。多數消化液含酵素。<\/p>", "think": "食物會經過肝臟和胰臟嗎？", "hint": "不會。肝臟、胰臟是消化腺，不在食物通過的消化道上；它們分泌的膽汁、胰液經由管道注入小腸。"}, {"t": "口腔、咽、食道", "page": 82, "html": "<ul><li><b>口腔<\/b>：牙齒切斷、磨碎食物；舌頭攪拌讓食物和<b>唾液<\/b>混合；唾液的酵素讓<b>澱粉初步分解<\/b>。<\/li><li><b>咽<\/b>：吞嚥時控制食物進入食道。<\/li><li><b>食道<\/b>：<b>不分泌消化液<\/b>，靠管壁肌肉收縮把食物推到胃。<\/li><\/ul>"}, {"t": "胃", "page": 82, "html": "<p>囊袋狀，可暫時貯存食物；蠕動讓食物和<b>胃液<\/b>充分混合。<\/p><ul><li>胃液含<b>酵素<\/b>：初步分解<b>蛋白質<\/b>。<\/li><li>胃液含<b>鹽酸<\/b>：殺死部分細菌，並促進胃中酵素的分解作用（胃中酵素適合酸性）。<\/li><\/ul><p>胃還分泌黏液與鹼性物質形成<b>胃黏膜層<\/b>，所以不會被自己的鹽酸腐蝕。（p.90）<\/p>"}, {"t": "小腸：消化與吸收的主角", "page": 84, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>消化液<\/th><th>來自<\/th><th>作用<\/th><\/tr><tr><td><b>膽汁<\/b><\/td><td>肝臟分泌、<b>膽囊<\/b>儲存<\/td><td><b>不含酵素<\/b>，乳化脂質，加快脂質分解<\/td><\/tr><tr><td><b>胰液<\/b><\/td><td>胰臟<\/td><td>分解醣類、蛋白質、脂質<\/td><\/tr><tr><td><b>腸液<\/b><\/td><td>腸腺<\/td><td>分解醣類、蛋白質<\/td><\/tr><\/table><\/div><p>三種消化液都是<b>鹼性<\/b>，能中和胃酸、促進小腸酵素活性。<\/p>", "think": "膽汁沒有酵素，算是消化液嗎？它怎麼幫忙消化？", "hint": "算。膽汁把大油滴乳化成小油滴，增加和酵素接觸的面積，讓脂質分解得更快——它幫忙，但自己不分解。"}, {"t": "絨毛：增加吸收面積", "page": 84, "html": "<p>小腸是<b>吸收水分和養分的主要部位<\/b>。內壁皺褶上有許多指狀小突起叫<span class='k'>絨毛<\/span>，可以增加吸收的表面積；吸收的小分子養分由<b>血液<\/b>運送到全身。<\/p>"}, {"t": "大腸與排遺", "page": 84, "html": "<p>沒被消化吸收的殘渣進入<b>大腸<\/b>（比小腸粗短），繼續吸收<b>水分與礦物質<\/b>。剩下的殘渣和水、剝落的腸壁細胞、腸內細菌混合成糞便，由肛門排出，叫做<span class='k'>排遺<\/span>。<\/p><p>能和人體共生互利的腸道菌叫<b>益生菌<\/b>，可協助合成部分維生素或胺基酸。（p.85）<\/p>"}, {"t": "消化總整理", "page": 87, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>消化道<\/th><th>消化液<\/th><th>酸鹼<\/th><th>作用<\/th><\/tr><tr><td>口腔<\/td><td>唾液<\/td><td>中性<\/td><td>分解澱粉<\/td><\/tr><tr><td>胃<\/td><td>胃液<\/td><td>酸性<\/td><td>分解蛋白質<\/td><\/tr><tr><td>小腸<\/td><td>膽汁<\/td><td>鹼性<\/td><td>乳化脂質<\/td><\/tr><tr><td>小腸<\/td><td>胰液<\/td><td>鹼性<\/td><td>分解醣類、蛋白質、脂質<\/td><\/tr><tr><td>小腸<\/td><td>腸液<\/td><td>鹼性<\/td><td>分解醣類、蛋白質<\/td><\/tr><tr><td>大腸<\/td><td>—<\/td><td>—<\/td><td>吸收剩餘水分<\/td><\/tr><\/table><\/div>"}], "ch": "2"}, {"id": "3-1", "title": "植物的運輸構造", "icon": "🌳", "color": "#22a35a", "sim": "xylem", "cards": [{"t": "維管束：木質部與韌皮部", "page": 96, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>運輸<\/th><th>在莖中的位置<\/th><\/tr><tr><td><b>木質部<\/b><\/td><td>水分和礦物質（由下往上）<\/td><td>內側<\/td><\/tr><tr><td><b>韌皮部<\/b><\/td><td>養分（可上可下）<\/td><td>外側<\/td><\/tr><\/table><\/div><p>維管束從根延伸到葉、花和果實。橘子、香蕉的白色細絲、葉片上的紋路（葉脈）都含維管束。<\/p>"}, {"t": "散生排列 vs 環狀排列", "page": 97, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>排列<\/th><th>形成層<\/th><th>例子<\/th><\/tr><tr><td>散生排列<\/td><td>沒有<\/td><td>玉米、水稻、小麥<\/td><\/tr><tr><td>環狀排列<\/td><td><b>有<\/b><\/td><td>向日葵、鬼針草（一年生）；相思樹、榕樹（多年生）<\/td><\/tr><\/table><\/div><p><span class='k'>形成層<\/span>向內產生新的木質部、向外產生新的韌皮部，所以莖能<b>加粗<\/b>。<\/p>"}, {"t": "木材、樹皮與年輪", "page": 98, "html": "<p>木質部逐年累積形成<b>木材<\/b>；韌皮部和它外側的部位合稱<b>樹皮<\/b>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>季節<\/th><th>生長<\/th><th>木質部細胞<\/th><th>顏色<\/th><\/tr><tr><td>春夏（溫暖多雨）<\/td><td>快<\/td><td>大<\/td><td>淺<\/td><\/tr><tr><td>秋冬（寒冷少雨）<\/td><td>慢<\/td><td>小<\/td><td>深<\/td><\/tr><\/table><\/div><p>深淺交替的環紋就是<span class='k'>年輪<\/span>。巨木樹心中空仍能活，因為中空的是已不具運輸功能的老化木質部。<\/p>"}, {"t": "環狀剝皮：為什麼整棵樹會死？", "page": 99, "html": "<p>松鼠環狀啃掉柳杉樹皮 → <b>韌皮部被破壞<\/b> → 養分無法往下運到根 → 根缺養分死亡、無法吸水 → 枝葉枯黃凋零。<\/p>", "think": "樹皮被剝一圈，為什麼葉子不是馬上枯萎？", "hint": "木質部在內側還在，水分仍能往上送；是根慢慢缺養分死掉之後，才吸不到水。"}, {"t": "水往上運的動力：蒸散作用", "page": 100, "html": "<p>根毛吸收水分 → 木質部連成細管、形成<b>連續水柱<\/b> → 水從葉的<b>氣孔<\/b>散失＝<span class='k'>蒸散作用<\/span>。<\/p><p>水從氣孔散出時產生<b>拉力<\/b>，把水往上拉——蒸散作用是<b>水分向上運輸的主要動力<\/b>。根毛則增加吸收表面積。<\/p>", "think": "移植老樹前為什麼要剪掉大部分枝葉？", "hint": "葉子少、氣孔少，蒸散作用減少，剛移植、根還吸不太到水的樹比較不會缺水。"}, {"t": "養分的運輸與儲存", "page": 100, "html": "<p>光合作用產生的養分由<b>韌皮部<\/b>運到其他部位利用或儲藏，需要時再分解運出。<\/p><p>例：冬天過後櫻花、梅花還沒長葉，先分解<b>根部儲存的養分<\/b>運到莖供花芽發育，所以早春就開花。<\/p>"}, {"t": "實驗 3-1：芹菜染色與蒸散", "page": 102, "html": "<p>芹菜葉柄插在紅色食用色素溶液中，橫切後看到<b>木質部被染紅<\/b>。（要在水中切取芹菜。）<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>組別<\/th><th>處理<\/th><th>量筒水位<\/th><\/tr><tr><td>實驗組<\/td><td>摘除葉片（氣孔數減少）<\/td><td>下降較少<\/td><\/tr><tr><td>對照組<\/td><td>不摘除葉片<\/td><td>下降較多<\/td><\/tr><\/table><\/div><p>結論：相同環境下，氣孔數越多，蒸散越快。溫度、溼度、通風也會影響蒸散速率。（p.122）<\/p>"}], "ch": "3"}, {"id": "3-2", "title": "人體的循環", "icon": "❤️", "color": "#e2502d", "sim": "heart", "cards": [{"t": "循環系統的組成", "page": 104, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>系統<\/th><th>組成<\/th><\/tr><tr><td><b>心血管系統<\/b><\/td><td>心臟、血管、血液<\/td><\/tr><tr><td><b>淋巴系統<\/b><\/td><td>淋巴結、淋巴管、淋巴<\/td><\/tr><\/table><\/div>"}, {"t": "心臟：四個腔室與瓣膜", "page": 105, "html": "<p>心臟在胸腔中央偏左，由<b>心肌<\/b>構成：上方<b>左心房、右心房<\/b>，下方<b>左心室、右心室<\/b>。<\/p><p>心臟收縮與舒張＝<span class='k'>心搏<\/span>，是血液流動的動力。心房與心室間、心室與動脈間有<b>瓣膜<\/b>防止血液倒流。<\/p><ul><li>心房收縮：血液進入心室<\/li><li>心室收縮：血液進入動脈<\/li><li>都舒張：靜脈血液流回心房、心室<\/li><\/ul>"}, {"t": "動脈、微血管、靜脈", "page": 107, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>動脈<\/th><th>微血管<\/th><th>靜脈<\/th><\/tr><tr><td>流向<\/td><td>離開心臟<\/td><td>連接小動脈與小靜脈<\/td><td>回到心臟<\/td><\/tr><tr><td>管壁<\/td><td>最厚、彈性最好<\/td><td>最薄（一層細胞）<\/td><td>中；部分有瓣膜<\/td><\/tr><tr><td>內徑<\/td><td>中<\/td><td>最小<\/td><td>最大<\/td><\/tr><tr><td>流速<\/td><td>最快<\/td><td>最慢<\/td><td>中<\/td><\/tr><tr><td>血壓<\/td><td>最大<\/td><td>中<\/td><td>最小<\/td><\/tr><\/table><\/div><p>微血管管壁薄、流速慢、分布廣，最適合和組織細胞交換物質。<\/p>"}, {"t": "血液：血漿與血球", "page": 108, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>成分<\/th><th>特徵<\/th><th>功能<\/th><\/tr><tr><td>血漿<\/td><td>主要是水<\/td><td>運送養分、廢物、抗體、激素<\/td><\/tr><tr><td><b>紅血球<\/b><\/td><td>雙凹圓盤、無細胞核、數量最多<\/td><td>含血紅素，攜帶氧氣<\/td><\/tr><tr><td><b>白血球<\/b><\/td><td>有細胞核、體積最大、數量最少<\/td><td>吞噬病原體、產生抗體<\/td><\/tr><tr><td><b>血小板<\/b><\/td><td>不規則、無細胞核、最小<\/td><td>促使血液凝固<\/td><\/tr><\/table><\/div>"}, {"t": "體循環", "page": 110, "html": "<p style='font-weight:700'>左心室 → 主動脈 → 小動脈 → 組織微血管 → 小靜脈 → 上／下大靜脈 → 右心房<\/p><p>在組織微血管：氧和養分進入細胞，二氧化碳和廢物進入血液。左心室的血是<b>充氧血<\/b>（鮮紅），回到右心房變<b>缺氧血<\/b>（暗紅）。<\/p>"}, {"t": "肺循環", "page": 111, "html": "<p style='font-weight:700'>右心室 → 肺動脈 → 肺微血管 → 肺靜脈 → 左心房<\/p><p>在肺泡：氧從肺泡擴散進血液，二氧化碳從血液擴散到肺泡。<\/p><p>🔴 <b>肺動脈裡是缺氧血、肺靜脈裡是充氧血<\/b>——動脈、靜脈是看血液「離開或回到心臟」，不是看含氧多少。<\/p>", "think": "右心房、右心室裡是什麼血？", "hint": "都是缺氧血：右心房收集全身回來的血，右心室再把它送去肺。左心房、左心室才是充氧血。"}, {"t": "實驗 3-2、3-3：心音、脈搏與小魚尾鰭", "page": 112, "html": "<ul><li>心音：血液撞擊關閉的瓣膜發出聲音，<b>心跳一次有兩個心音<\/b>（撲、通）。<\/li><li>脈搏：動脈隨心臟收縮舒張而擴張、恢復；同一人同時間<b>心搏次數＝脈搏次數<\/b>，運動後兩者都增加。<\/li><li>小魚尾鰭：<b>分支成微血管的是小動脈<\/b>、匯流而成的是小靜脈；移動的顆粒是紅血球；複式顯微鏡影像上下顛倒、左右相反。<\/li><\/ul>"}, {"t": "淋巴系統", "page": 114, "html": "<p>血漿從微血管滲出 → <b>組織液<\/b> → 進入淋巴管成為<b>淋巴<\/b> → 經淋巴結 → <b>注入靜脈<\/b>回到血液。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>心血管系統<\/th><th>淋巴系統<\/th><\/tr><tr><td>組成<\/td><td>心臟、血管、血液<\/td><td>淋巴結、淋巴管、淋巴<\/td><\/tr><tr><td>功能<\/td><td>運輸、防禦疾病<\/td><td><b>回收滲漏的血漿<\/b>、防禦疾病<\/td><\/tr><\/table><\/div><p>淋巴結能過濾異物，其中的白血球吞噬細菌或病毒。<\/p>"}], "ch": "3"}, {"id": "3-3", "title": "人體的防禦", "icon": "🛡️", "color": "#2f80ed", "sim": "defense", "cards": [{"t": "三道防線", "page": 116, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>類型<\/th><th>防線<\/th><th>方式<\/th><\/tr><tr><td>非專一性<\/td><td>第一道<\/td><td><b>皮膜的阻隔<\/b>（皮膚、消化道／呼吸道／泌尿道黏膜）<\/td><\/tr><tr><td>非專一性<\/td><td>第二道<\/td><td><b>發炎反應<\/b>（紅、腫、熱、痛）、<b>吞噬作用<\/b><\/td><\/tr><tr><td>專一性<\/td><td>第三道<\/td><td>特殊白血球破壞受感染細胞、針對病原體<b>產生抗體<\/b><\/td><\/tr><\/table><\/div><p>能致病的微生物（某些細菌、病毒）叫<span class='k'>病原體<\/span>。<\/p>"}, {"t": "專一性：只認得特定病原體", "page": 117, "html": "<p>第三道防線對病原體有<b>專一性<\/b>：對抗腸病毒的防禦只對腸病毒有效，無法對抗流感病毒。<\/p>", "think": "打了流感疫苗，膝蓋擦傷會比較不容易發炎嗎？", "hint": "不會。流感疫苗只讓身體認得流感病毒（專一性）；傷口發炎是第二道防線，和流感疫苗無關。（課本例 1）"}, {"t": "疫苗與免疫記憶", "page": 118, "html": "<p><span class='k'>疫苗<\/span>模擬病原體的<b>表面特徵<\/b>，引發專一性防禦但不會致病（成分可以是沒感染力的病原體、弱化的病原體、病原體表面的特殊蛋白質）。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>反應速度<\/th><th>強度<\/th><\/tr><tr><td>第一次接觸（打疫苗）<\/td><td>較慢<\/td><td>較弱<\/td><\/tr><tr><td>第二次接觸相同病原體<\/td><td><b>更快<\/b><\/td><td><b>更強<\/b><\/td><\/tr><\/table><\/div><p>因為部分白血球留下了<b>記憶<\/b>。<\/p>"}], "ch": "3"}, {"id": "4-1", "title": "神經系統", "icon": "⚡", "color": "#9b5de5", "sim": "nerve", "cards": [{"t": "刺激、受器、動器", "page": 130, "html": "<p>人體用<span class='k'>受器<\/span>接收環境刺激，再由<span class='k'>動器<\/span>產生反應。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>受器在哪<\/th><th>接收的刺激<\/th><\/tr><tr><td>眼<\/td><td>光線<\/td><\/tr><tr><td>耳<\/td><td>聲音<\/td><\/tr><tr><td>鼻<\/td><td>氣味<\/td><\/tr><tr><td>舌<\/td><td>味道<\/td><\/tr><tr><td>皮膚<\/td><td>冷、熱、觸、壓、痛<\/td><\/tr><\/table><\/div><p>動器包括<b>肌肉<\/b>和<b>腺體<\/b>：眼睛進沙時淚腺分泌淚液沖走沙子；看到球靠近，手部肌肉收縮接住球。<\/p>", "think": "流眼淚是哪一種動器在作用？", "hint": "淚腺——腺體也是動器，不是只有肌肉。"}, {"t": "神經元：神經系統的基本單位", "page": 131, "html": "<p><span class='k'>神經元<\/span>（神經細胞）由<b>細胞本體<\/b>和<b>神經纖維<\/b>組成：<\/p><ul><li>細胞本體：內有細胞核，調節神經元的代謝與訊息整合。<\/li><li>神經纖維：接收及傳導訊息。<\/li><\/ul>"}, {"t": "中樞神經與周圍神經", "page": 132, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>分類<\/th><th>包含<\/th><th>說明<\/th><\/tr><tr><td><b>中樞神經<\/b><\/td><td>腦、脊髓<\/td><td>都有骨骼保護；腦包括大腦、小腦、腦幹<\/td><\/tr><tr><td><b>周圍神經<\/b><\/td><td>腦神經 12 對、脊神經 31 對<\/td><td>和腦、脊髓相連，傳遞訊息<\/td><\/tr><\/table><\/div><p>感覺神經元和運動神經元都屬於周圍神經。（p.150）<\/p>"}, {"t": "大腦、小腦、腦幹、脊髓", "page": 133, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>部位<\/th><th>功能<\/th><\/tr><tr><td><b>大腦<\/b><\/td><td>感覺、運動、意識、記憶、思考、語言；<b>左半球控制右半身<\/b>，右半球控制左半身<\/td><\/tr><tr><td><b>小腦<\/b><\/td><td>協調全身肌肉、維持身體平衡<\/td><\/tr><tr><td><b>腦幹<\/b><\/td><td>控制呼吸、心跳、血壓、唾液分泌，是<b>生命中樞<\/b><\/td><\/tr><tr><td><b>脊髓<\/b><\/td><td>上下傳遞訊息；是四肢的反射中樞<\/td><\/tr><\/table><\/div>", "think": "植物人失去意識卻還能呼吸、心跳；腦死的人無法自己呼吸心跳。分別是哪裡受損？", "hint": "意識由大腦掌管，所以植物人是大腦嚴重受損；呼吸心跳由腦幹控制，腦死是腦幹嚴重受損。（本站依課本 p.133 內文推論）"}, {"t": "神經傳導途徑", "page": 134, "html": "<p style='text-align:center;font-weight:800'>刺激 → 受器 → 感覺神經元 → 中樞神經 → 運動神經元 → 動器 → 反應<\/p><ul><li><span class='k'>感覺神經元<\/span>：受器 → 中樞神經<\/li><li><span class='k'>運動神經元<\/span>：中樞神經 → 動器<\/li><\/ul><p>課本比喻：結帳時掃描器接收（受器）→ 電腦處理（中樞神經）→ 列印機印出（動器）。<\/p>"}, {"t": "意識反應：一定經過大腦", "page": 135, "html": "<p>看到同學揮手打招呼：<\/p><p style='font-weight:700'>受器（眼）→ 感覺神經元 → <b>大腦<\/b> → 脊髓 → 運動神經元 → 動器（手的肌肉）<\/p><p>用手接掉落的尺也是意識反應，練習可以縮短反應時間。（p.178）<\/p>"}, {"t": "反射：不經過大腦的快速反應", "page": 136, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>控制中樞<\/th><th>例子<\/th><\/tr><tr><td><b>腦幹<\/b><\/td><td>不經意的眨眼、咳嗽、唾液分泌、瞳孔遇強光縮小<\/td><\/tr><tr><td><b>脊髓<\/b><\/td><td>手摸到熱茶壺立刻縮回、腳踩到尖物立刻縮回<\/td><\/tr><\/table><\/div><p>反射路徑短、反應快，用來應付緊急狀況、降低傷害。<\/p><p>摸到熱茶壺：手<b>立刻縮回<\/b>是反射（受器→感覺神經元→脊髓→運動神經元→肌肉）；之後<b>感到痛、撫摸檢查<\/b>是意識反應（會經過大腦）。<\/p>", "think": "手縮回來的時候，還沒感覺到痛，為什麼？", "hint": "縮手由脊髓直接下命令；「痛」要等訊息傳到大腦才產生，路徑較長，所以比較晚。"}, {"t": "實驗 4-1：感覺疲勞與後像", "page": 138, "html": "<p>右手放冰水（約 10℃）、左手放熱水（約 40℃）15 秒，再同時放室溫水（約 25℃）：同一盆水，兩手感覺不同——<b>感覺疲勞<\/b>使感覺不準確。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>現象<\/th><th>原因<\/th><th>生活例子<\/th><\/tr><tr><td>感覺疲勞<\/td><td>受器持續受相同刺激，敏銳度降低<\/td><td>進臭廁所一陣子後不覺得臭<\/td><\/tr><tr><td>正片後像（顏色同原物）<\/td><td>視覺暫留<\/td><td>電扇轉動看到一整圈扇葉、快速翻書變動畫<\/td><\/tr><tr><td>負片後像（顏色和原物不同）<\/td><td>視覺暫留＋視覺疲勞<\/td><td>盯著白燈再移開看到黑影<\/td><\/tr><\/table><\/div>"}, {"t": "科學漫遊：麻醉的秘密", "page": 153, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>麻醉<\/th><th>作用部位<\/th><th>例子<\/th><\/tr><tr><td>局部麻醉<\/td><td>感覺神經元<\/td><td>拔牙<\/td><\/tr><tr><td>半身麻醉<\/td><td>脊髓<\/td><td>剖腹產<\/td><\/tr><tr><td>全身麻醉<\/td><td>中樞神經系統<\/td><td>頭頸部、胸部手術<\/td><\/tr><\/table><\/div>"}], "ch": "4"}, {"id": "4-2", "title": "內分泌系統", "icon": "💧", "color": "#e84393", "sim": "gland", "cards": [{"t": "激素：經血液送到目標細胞", "page": 141, "html": "<p><span class='k'>內分泌腺<\/span>分泌<span class='k'>激素<\/span>（荷爾蒙），激素經<b>血液<\/b>運送到<b>目標細胞<\/b>，調節生理活動。只需<b>適量<\/b>，太多或太少都不好。<\/p><p>消化腺、汗腺、淚腺是<b>外分泌腺<\/b>，分泌物要經特定<b>管道<\/b>送出。<\/p>"}, {"t": "神經系統 vs 內分泌系統", "page": 151, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>比較<\/th><th>神經系統<\/th><th>內分泌系統<\/th><\/tr><tr><td>傳遞方式<\/td><td>神經元<\/td><td>血液運送激素<\/td><\/tr><tr><td>速率<\/td><td>快<\/td><td>慢<\/td><\/tr><tr><td>時效<\/td><td>短暫<\/td><td>持久<\/td><\/tr><tr><td>範圍<\/td><td>局部<\/td><td>廣泛<\/td><\/tr><\/table><\/div>"}, {"t": "腦垂腺與甲狀腺", "page": 143, "html": "<ul><li><b>腦垂腺<\/b>（大腦下方）：分泌<b>生長激素<\/b>；成長期太少→<b>侏儒症<\/b>、太多→<b>巨人症<\/b>；也有激素影響其他腺體。<\/li><li><b>甲狀腺<\/b>（喉部氣管兩側，像蝴蝶結）：分泌<b>甲狀腺素<\/b>促進細胞代謝。孩童太少→生長遲緩、智能不足；成人太少→體重增加；太多→體重減輕。<\/li><\/ul>"}, {"t": "副甲狀腺與腎上腺", "page": 143, "html": "<ul><li><b>副甲狀腺<\/b>（甲狀腺背面四顆）：調節血液中<b>鈣<\/b>的濃度；異常可能抽筋或骨質疏鬆。<\/li><li><b>腎上腺<\/b>（腎臟上方）：緊張、害怕、運動時分泌<b>腎上腺素<\/b>→呼吸心跳加快、血壓上升、肌肉血液量增加、<b>血糖上升<\/b>。<\/li><\/ul>"}, {"t": "胰島：升糖素與胰島素", "page": 144, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>情況<\/th><th>分泌增加<\/th><th>結果<\/th><\/tr><tr><td>飢餓、血糖低<\/td><td><b>升糖素<\/b><\/td><td>血糖升高<\/td><\/tr><tr><td>進食後、血糖高<\/td><td><b>胰島素<\/b><\/td><td>血糖降低<\/td><\/tr><\/table><\/div><p>胰島素分泌不足，過多血糖隨尿液排出＝<b>糖尿病<\/b>。胰島散布在胰臟中（胰臟同時有分泌胰液的外分泌部分）。<\/p>"}, {"t": "性腺", "page": 144, "html": "<p><b>睪丸<\/b>：製造精子、分泌雄性激素（聲音低沉、長鬍鬚）。<b>卵巢<\/b>：製造卵、分泌雌性激素（乳房發育、月經週期）。<\/p><p>結紮只截斷輸精管或輸卵管，激素靠血液運送，所以不影響這些特徵。<\/p>"}, {"t": "內分泌腺總表", "page": 145, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>內分泌腺<\/th><th>激素<\/th><th>功能<\/th><\/tr><tr><td>腦垂腺<\/td><td>生長激素等<\/td><td>促進生長；影響其他腺體<\/td><\/tr><tr><td>甲狀腺<\/td><td>甲狀腺素<\/td><td>調節細胞代謝<\/td><\/tr><tr><td>副甲狀腺<\/td><td>副甲狀腺素<\/td><td>調節鈣濃度<\/td><\/tr><tr><td>腎上腺<\/td><td>腎上腺素<\/td><td>心跳加快、血糖上升<\/td><\/tr><tr><td>胰島<\/td><td>胰島素／升糖素<\/td><td>降低／提高血糖<\/td><\/tr><tr><td>睪丸／卵巢<\/td><td>雄性／雌性激素<\/td><td>男／女性生理特徵<\/td><\/tr><\/table><\/div>"}], "ch": "4"}, {"id": "4-3", "title": "植物的感應", "icon": "🌱", "color": "#22a35a", "sim": "tropism", "cards": [{"t": "較快速的感應：膨壓運動", "page": 146, "html": "<p><span class='k'>膨壓<\/span>：細胞內水分推擠細胞壁的壓力。較快速的感應和膨壓變化有關。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>感應<\/th><th>例子<\/th><\/tr><tr><td>觸發運動<\/td><td>含羞草被碰觸，小葉閉合、葉柄下垂<\/td><\/tr><tr><td>捕蟲運動<\/td><td>捕蠅草葉閉合、毛氈苔葉捲曲<\/td><\/tr><tr><td>睡眠運動<\/td><td>酢漿草葉片、睡蓮花朵白天展開、夜晚閉合<\/td><\/tr><tr><td>氣孔開閉<\/td><td>保衛細胞吸水膨壓變大→氣孔打開<\/td><\/tr><\/table><\/div>"}, {"t": "向性：朝向或背離刺激生長", "page": 148, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>部位<\/th><th>向性<\/th><th>刺激<\/th><\/tr><tr><td>莖<\/td><td><b>向光性<\/b><\/td><td>光<\/td><\/tr><tr><td>莖<\/td><td><b>負向地性<\/b>（背地性）<\/td><td>地球引力<\/td><\/tr><tr><td>莖<\/td><td><b>向觸性<\/b><\/td><td>接觸（牽牛花纏繞）<\/td><\/tr><tr><td>根<\/td><td><b>向地性<\/b><\/td><td>地球引力<\/td><\/tr><tr><td>根<\/td><td><b>負向光性<\/b>（背光性）<\/td><td>光<\/td><\/tr><\/table><\/div><p>向性要<b>一段時間<\/b>才看得出來，和快速的膨壓運動不同。<\/p>", "think": "含羞草閉合和莖彎向光源，最大的差別是什麼？", "hint": "含羞草是膨壓改變，幾秒就發生；向光性是生長方向改變，要好幾天。"}, {"t": "探索活動：綠豆對光的感應", "page": 149, "html": "<p>A 紙盒開口朝<b>側面<\/b>、B 紙盒開口<b>朝上<\/b>，觀察綠豆幼苗生長方向。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>變因<\/th><th>內容<\/th><\/tr><tr><td>操作變因<\/td><td>光源方向<\/td><\/tr><tr><td>控制變因<\/td><td>綠豆數目、棉花量、澆水量<\/td><\/tr><tr><td>應變變因<\/td><td>綠豆（是否朝向光源）生長方向<\/td><\/tr><\/table><\/div><p>想讓莖長成「S」形：開口先朝右，幾天後改朝左，再改回朝右。<\/p>"}, {"t": "科學漫遊：聰明的「花現」", "page": 152, "html": "<p>光照長短會影響開花。菊花原本秋冬開花，花農秋冬<b>夜間點燈延長光照<\/b>阻止開花，春夏<b>用黑布遮光縮短光照<\/b>促使開花，錯開盛產期賣好價錢。<\/p>"}], "ch": "4"}, {"id": "5-1", "title": "呼吸與氣體的恆定", "icon": "🫁", "color": "#2f80ed", "sim": "breath", "cards": [{"t": "恆定性", "page": 160, "html": "<p>生物能自動調節生理作用，讓<b>體內環境維持在一定範圍<\/b>，稱為<span class='k'>恆定性<\/span>。例如血液中葡萄糖濃度、廢物濃度、體溫，都要維持在適當範圍，酵素反應才能順利進行。<\/p><p>本章四個主題：<b>氣體、血糖、水分、體溫<\/b>。<\/p>"}, {"t": "呼吸作用：細胞獲得能量", "page": 161, "html": "<p><span class='k'>呼吸作用<\/span>：細胞在酵素協助下，把葡萄糖等養分的能量釋放出來，主要在<b>粒線體<\/b>進行。<\/p><p style='text-align:center;font-weight:800'>養分＋氧氣 → 二氧化碳＋水＋能量<\/p><p>植物白天行光合作用，<b>也同時行呼吸作用<\/b>；夜晚只行呼吸作用。（p.159）<\/p>", "think": "植物白天會不會產生二氧化碳？", "hint": "會。植物的細胞一直在行呼吸作用；白天只是光合作用也同時進行，常常把二氧化碳用掉了。"}, {"t": "生物怎麼交換氣體", "page": 161, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>生物<\/th><th>交換氣體的構造<\/th><\/tr><tr><td>草履蟲等簡單水中生物<\/td><td>直接靠<b>擴散作用<\/b><\/td><\/tr><tr><td>植物<\/td><td>葉的<b>氣孔<\/b>、莖的<b>皮孔<\/b>、根的表皮細胞（<b>根毛<\/b>）<\/td><\/tr><tr><td>青蛙<\/td><td>肺和皮膚<\/td><\/tr><tr><td>魚<\/td><td>鰓<\/td><\/tr><tr><td>昆蟲<\/td><td>氣管（體表開口叫<b>氣門<\/b>）<\/td><\/tr><\/table><\/div><p>呼吸器官共同特徵：<b>表面溼潤、表面積廣大、有充分血液流經<\/b>。<\/p>"}, {"t": "人體呼吸系統與肺泡", "page": 163, "html": "<p>鼻 → 咽 → 喉 → 氣管 → 支氣管 → 肺臟。<\/p><p>肺臟由許多<span class='k'>肺泡<\/span>組成；肺泡只有<b>一層細胞<\/b>、表面布滿微血管，氧氣從肺泡進入微血管，二氧化碳從微血管進入肺泡。肺臟本身<b>沒有肌肉<\/b>。（p.176）<\/p>"}, {"t": "呼吸運動：吸氣與呼氣", "page": 164, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>吸氣<\/th><th>呼氣<\/th><\/tr><tr><td>肋骨<\/td><td>上舉外張<\/td><td>下降內縮<\/td><\/tr><tr><td>橫膈<\/td><td><b>收縮下降<\/b><\/td><td>舒張上升<\/td><\/tr><tr><td>胸腔<\/td><td>變大<\/td><td>變小<\/td><\/tr><tr><td>肺<\/td><td>變大<\/td><td>變小<\/td><\/tr><\/table><\/div><p>呼吸模型：寶特瓶＝胸腔、瓶內氣球＝肺、底部氣球＝橫膈；底部氣球往下拉→瓶內氣球變大＝吸氣。<\/p>", "think": "肺沒有肌肉，那它怎麼「吸」進空氣？", "hint": "靠肋骨和橫膈讓胸腔變大，肺跟著被撐大，空氣就流進來。"}, {"t": "呼吸作用 vs 呼吸運動", "page": 164, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>呼吸作用<\/th><th>呼吸運動<\/th><\/tr><tr><td>是什麼<\/td><td>細胞獲得能量的方式<\/td><td>吸氣與呼氣<\/td><\/tr><tr><td>場所<\/td><td>粒線體<\/td><td>胸腔<\/td><\/tr><tr><td>氣體<\/td><td>消耗氧氣、產生二氧化碳<\/td><td>帶入氧氣、排出二氧化碳<\/td><\/tr><\/table><\/div><p>劇烈運動時血液中二氧化碳增加，刺激<b>腦幹的呼吸中樞<\/b>，呼吸加快，維持氣體恆定。<\/p>"}, {"t": "實驗 5-1：檢測呼出的氣體", "page": 166, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>檢測<\/th><th>試劑<\/th><th>變化<\/th><\/tr><tr><td>二氧化碳<\/td><td>澄清石灰水<\/td><td>變<b>混濁<\/b><\/td><\/tr><tr><td>水氣<\/td><td>藍色氯化亞鈷試紙<\/td><td>變<b>粉紅色<\/b><\/td><\/tr><\/table><\/div><p>人：對 A 管石灰水吹氣、B 管靜置當對照；試紙放鼻孔前呼氣。綠豆：甲瓶<b>萌芽綠豆<\/b>、乙瓶<b>乾燥綠豆<\/b>（對照），倒清水把瓶內氣體擠進石灰水。<\/p>"}], "ch": "5"}, {"id": "5-2", "title": "血糖的恆定", "icon": "🍬", "color": "#f5a524", "sim": "sugar", "cards": [{"t": "血糖從哪裡來", "page": 168, "html": "<p><span class='k'>血糖<\/span>是血液中的葡萄糖，是細胞呼吸作用產生能量的主要來源；太低或太高都可能昏迷甚至死亡。<\/p><p>來源：<b>醣類食物消化吸收<\/b>、<b>肝臟儲存的肝糖分解<\/b>。<\/p>"}, {"t": "胰島素與升糖素", "page": 168, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>狀況<\/th><th>胰臟分泌<\/th><th>肝臟<\/th><th>結果<\/th><\/tr><tr><td>血糖高（飯後）<\/td><td><b>胰島素<\/b><\/td><td>儲存：葡萄糖→肝糖<\/td><td>血糖下降<\/td><\/tr><tr><td>血糖低（飢餓）<\/td><td><b>升糖素<\/b><\/td><td>分解：肝糖→葡萄糖<\/td><td>血糖上升<\/td><\/tr><\/table><\/div><p>血糖低時腦也會產生<b>飢餓感<\/b>，讓人去進食。<\/p>"}, {"t": "腎上腺素也會讓血糖上升", "page": 169, "html": "<p>運動、緊張、憤怒或恐懼時，<b>腎上腺素<\/b>分泌增加：心跳加快、血壓上升，也促使肝糖分解，血糖升高，應付緊急狀況。<\/p>"}, {"t": "讀懂血糖曲線", "page": 169, "html": "<p>血糖平均值約 <b>90<\/b> 毫克／100 毫升：<\/p><ol><li>血糖下降 → 飢餓感<\/li><li>進食 → 血糖上升<\/li><li>胰島素分泌增加 → 血糖下降<\/li><li>胰島素和升糖素共同調控 → 在 90 附近小波動<\/li><li>緊張、運動 → 腎上腺素 → 血糖上升後下降<\/li><\/ol>"}, {"t": "胰臟：內分泌＋外分泌", "page": 177, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>內分泌（胰島）<\/th><th>外分泌<\/th><\/tr><tr><td>分泌<\/td><td>胰島素、升糖素<\/td><td>胰液<\/td><\/tr><tr><td>運輸<\/td><td>血液<\/td><td>特定管道<\/td><\/tr><tr><td>功能<\/td><td>調節血糖<\/td><td>分解醣類、蛋白質、脂質<\/td><\/tr><\/table><\/div><p>胰島素發現史：1921 年班廷和貝斯特用胰臟萃取液降低失去胰臟的狗的血糖。（p.181）<\/p>"}], "ch": "5"}, {"id": "5-3", "title": "排泄與水分的恆定", "icon": "💦", "color": "#22a3c4", "sim": "water", "cards": [{"t": "排泄作用與含氮廢物", "page": 170, "html": "<p><span class='k'>排泄作用<\/span>：排除代謝廢物（二氧化碳、水、氨等含氮廢物）。<b>氨<\/b>是代謝<b>蛋白質<\/b>產生的，毒性很強。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>含氮廢物<\/th><th>毒性<\/th><th>生物<\/th><th>排出方式<\/th><\/tr><tr><td>氨<\/td><td>最高<\/td><td>多數水中生物<\/td><td>直接擴散到水中<\/td><\/tr><tr><td>尿素<\/td><td>較弱<\/td><td>人類與哺乳類<\/td><td>尿液<\/td><\/tr><tr><td>尿酸<\/td><td>最弱<\/td><td>鳥類、昆蟲<\/td><td>混在糞便中<\/td><\/tr><\/table><\/div>"}, {"t": "人體排泄器官", "page": 175, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>器官<\/th><th>排除<\/th><th>和哪種恆定有關<\/th><\/tr><tr><td>肺臟<\/td><td>二氧化碳、水<\/td><td>氣體<\/td><\/tr><tr><td>腎臟<\/td><td>尿素、水（鹽類）<\/td><td>水分<\/td><\/tr><tr><td>皮膚<\/td><td>含氮廢物（尿素）、水（鹽類）<\/td><td>體溫<\/td><\/tr><\/table><\/div>"}, {"t": "尿液怎麼形成", "page": 171, "html": "<ol><li><b>肝臟<\/b>：把氨轉換成尿素（肝臟不屬於泌尿系統）。<\/li><li><b>腎臟<\/b>：過濾血液，有用物質再吸收回體內；尿素、多餘水分與鹽類形成尿液。<\/li><li><b>輸尿管<\/b>：運送尿液到膀胱。<\/li><li><b>膀胱<\/b>：暫存尿液。<\/li><li><b>尿道<\/b>：排出尿液。<\/li><\/ol>", "think": "尿素是在腎臟產生的嗎？", "hint": "不是。尿素是肝臟把氨轉換來的，腎臟負責把尿素從血液過濾出來。"}, {"t": "人體水分的恆定", "page": 172, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>腎臟<\/th><th>感覺<\/th><th>排尿<\/th><th>行為<\/th><\/tr><tr><td>血液濃度高（水太少）<\/td><td>製造較少尿液<\/td><td>口渴<\/td><td>減少<\/td><td>喝水<\/td><\/tr><tr><td>血液濃度低（水太多）<\/td><td>製造較多尿液<\/td><td>尿意<\/td><td>增加<\/td><td>上廁所<\/td><\/tr><\/table><\/div><p><b>喝水和排尿<\/b>是調節水分的主要機制。成人每天攝入與排出約 2350 mL，尿液約 1300 mL。<\/p>"}, {"t": "動植物防止水分散失", "page": 173, "html": "<ul><li>陸生動物：人的<b>角質層<\/b>、蜥蜴的<b>鱗片<\/b>、烏龜的鱗片及骨板、昆蟲的<b>外骨骼<\/b>。<\/li><li>植物：白天氣孔打開會蒸散，夜晚多數氣孔關閉；葉片有<b>角質層<\/b>；水太多又蒸散太慢時，水從<b>葉緣或葉尖<\/b>排出。<\/li><\/ul>"}], "ch": "5"}, {"id": "5-4", "title": "體溫的恆定", "icon": "🌡️", "color": "#e2502d", "sim": "temp", "cards": [{"t": "外溫動物與內溫動物", "page": 174, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>類型<\/th><th>怎麼維持體溫<\/th><th>例子<\/th><\/tr><tr><td><b>外溫動物<\/b><\/td><td>主要靠外界環境：曬太陽升溫、躲陰涼處降溫<\/td><td>蝴蝶、蜥蜴<\/td><\/tr><tr><td><b>內溫動物<\/b><\/td><td>利用體內代謝活動產熱<\/td><td>哺乳類、鳥類<\/td><\/tr><\/table><\/div><p>內溫動物的構造：保溫——毛髮、羽毛、皮下脂肪；散熱——狗的舌頭、沙漠跳鼠的長耳朵。<\/p>"}, {"t": "人體怎麼調節體溫", "page": 175, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>皮膚血管<\/th><th>汗腺<\/th><th>食慾<\/th><th>肌肉<\/th><\/tr><tr><td>太冷<\/td><td><b>收縮<\/b>（減少散熱）<\/td><td>排汗減少<\/td><td>增加（增加產熱）<\/td><td><b>顫抖<\/b>（增加產熱）<\/td><\/tr><tr><td>太熱<\/td><td><b>舒張<\/b>（增加散熱）<\/td><td>排汗增加<\/td><td>減退<\/td><td>活動減少<\/td><\/tr><\/table><\/div><p>由<b>腦內的體溫中樞<\/b>發出訊息；汗液蒸發會吸收體熱。<\/p>", "think": "冷的時候臉色比較蒼白、熱的時候臉紅，為什麼？", "hint": "冷時皮膚血管收縮，流到體表的血少；熱時血管舒張，體表血量增加來散熱。"}], "ch": "5"}], "qs": [{"id": "p_10_01", "src": "practice", "sec": "1-0", "concept": "實驗室安全", "q": "不小心碰到腐蝕性藥品，第一步應該？", "opts": ["用衛生紙擦掉", "立即用大量清水沖洗並報告老師", "塗上乳液", "先繼續做完實驗"], "ans": 1, "ex": "腐蝕性藥品要立刻用大量清水沖洗，並報告老師。", "fig": "", "ch": "1"}, {"id": "p_10_02", "src": "practice", "sec": "1-0", "concept": "酒精燈", "q": "酒精燈用完要怎麼熄滅？", "opts": ["用口吹熄", "用燈罩蓋熄", "倒水澆熄", "等酒精燒完"], "ans": 1, "ex": "用燈罩蓋熄；用口吹可能把火吹進燈裡引燃酒精。", "fig": "", "ch": "1"}, {"id": "p_10_03", "src": "practice", "sec": "1-0", "concept": "器材使用", "q": "下列操作何者正確？", "opts": ["用溫度計攪拌溶液", "在量筒中配製溶液", "讀量筒刻度時視線與液面中央等高", "倒持滴管"], "ans": 2, "ex": "讀量筒要平視液面中央；溫度計不能攪拌、量筒不能配溶液、滴管不能倒持。", "fig": "", "ch": "1"}, {"id": "p_11_01", "src": "practice", "sec": "1-1", "concept": "科學方法順序", "q": "科學方法中，「提出假設」的下一步通常是？", "opts": ["觀察", "提出問題", "設計並進行實驗", "參考文獻資料"], "ans": 2, "ex": "觀察→提問→查資料→假設→設計並進行實驗→分析→結論。", "fig": "", "ch": "1"}, {"id": "p_11_02", "src": "practice", "sec": "1-1", "concept": "假設", "q": "關於假設，下列何者正確？", "opts": ["假設一定正確", "假設是問題可能的答案，需要實驗驗證", "假設是實驗結果", "提出假設後就不用實驗"], "ans": 1, "ex": "假設只是可能的答案，不一定正確，要用實驗來檢驗。", "fig": "", "ch": "1"}, {"id": "p_11_03", "src": "practice", "sec": "1-1", "concept": "操作變因", "q": "探討「酵母菌是否讓麵糰膨脹」，操作變因是？", "opts": ["麵粉量", "水溫", "有沒有加酵母菌", "麵糰膨脹的高度"], "ans": 2, "ex": "兩組刻意不同的是有沒有加酵母菌；麵糰高度是應變變因，麵粉量水溫是控制變因。", "fig": "", "ch": "1"}, {"id": "p_11_04", "src": "practice", "sec": "1-1", "concept": "應變變因", "q": "上題實驗中，麵糰膨脹的高度屬於？", "opts": ["操作變因", "控制變因", "應變變因", "不是變因"], "ans": 2, "ex": "實驗後要測量比較的結果是應變變因。", "fig": "", "ch": "1"}, {"id": "p_11_05", "src": "practice", "sec": "1-1", "concept": "對照組", "q": "設置對照組的目的是？", "opts": ["讓實驗更快", "和實驗組比較，確認結果是由操作變因造成", "增加操作變因", "不需要記錄數據"], "ans": 1, "ex": "對照組和實驗組只差操作變因，比較兩者才能確定是它造成的影響。", "fig": "", "ch": "1"}, {"id": "p_11_06", "src": "practice", "sec": "1-1", "concept": "一次一個變因", "q": "想知道溫度會不會影響黴菌生長，下列哪兩組最適合比較？", "opts": ["25℃噴水 vs 5℃不噴水", "25℃噴水 vs 5℃噴水", "25℃不噴水 vs 25℃噴水", "5℃噴水 vs 25℃不噴水"], "ans": 1, "ex": "只讓溫度不同、溼度相同（都噴水），才能看出溫度的影響。", "fig": "", "ch": "1"}, {"id": "p_11_07", "src": "practice", "sec": "1-1", "concept": "重複實驗", "q": "實驗為什麼要重複多次？", "opts": ["浪費材料", "減少誤差，增加可信度", "讓結果一定支持假設", "改變操作變因"], "ans": 1, "ex": "重複實驗可以減少偶然誤差，讓結果更可信。", "fig": "", "ch": "1"}, {"id": "p_12_01", "src": "practice", "sec": "1-2", "concept": "生命現象", "q": "花栗鼠冬天冬眠，屬於哪一種生命現象？", "opts": ["代謝", "生殖", "生長與發育", "感應與運動"], "ans": 3, "ex": "察覺氣溫太低並做出反應（冬眠），是感應與運動。", "fig": "", "ch": "1"}, {"id": "p_12_02", "src": "practice", "sec": "1-2", "concept": "代謝", "q": "植物吸收光能製造養分，屬於哪一種生命現象？", "opts": ["代謝", "生殖", "感應", "發育"], "ans": 0, "ex": "代謝包含體內的合成與分解作用，常伴隨能量轉換。", "fig": "", "ch": "1"}, {"id": "p_12_03", "src": "practice", "sec": "1-2", "concept": "生物圈", "q": "生物圈大約的範圍是？", "opts": ["海平面上下各約 1 萬公尺", "整個地球", "只有陸地", "只有大氣層"], "ans": 0, "ex": "以海平面為基準，上下各約一萬公尺，約 20 公里。", "fig": "", "ch": "1"}, {"id": "p_12_04", "src": "practice", "sec": "1-2", "concept": "虎克", "q": "虎克用顯微鏡觀察軟木塞薄片，看到的其實是？", "opts": ["活的動物細胞", "死亡植物細胞的細胞壁", "細胞核", "細菌"], "ans": 1, "ex": "虎克看到的是死亡植物細胞留下的細胞壁，但他是第一個描述細胞的人。", "fig": "", "ch": "1"}, {"id": "p_12_05", "src": "practice", "sec": "1-2", "concept": "放大倍率", "q": "目鏡 10X、物鏡 40X，放大倍率是？", "opts": ["50 倍", "400 倍", "4 倍", "4000 倍"], "ans": 1, "ex": "放大倍率＝目鏡倍率×物鏡倍率＝10×40＝400 倍。", "fig": "", "ch": "1"}, {"id": "p_12_06", "src": "practice", "sec": "1-2", "concept": "影像方向", "q": "用複式顯微鏡看到影像往左上方移動，標本實際被推往？", "opts": ["左上方", "右下方", "左下方", "右上方"], "ans": 1, "ex": "複式顯微鏡影像上下顛倒、左右相反，所以標本移動方向和影像相反。", "fig": "", "ch": "1"}, {"id": "p_12_07", "src": "practice", "sec": "1-2", "concept": "高倍操作", "q": "換成高倍物鏡後要調清楚，應該轉？", "opts": ["粗調節輪", "細調節輪", "光圈", "眼距調整器"], "ans": 1, "ex": "換高倍後只能用細調節輪，用粗調節輪可能撞壞鏡頭和玻片。", "fig": "", "ch": "1"}, {"id": "p_12_08", "src": "practice", "sec": "1-2", "concept": "高低倍比較", "q": "從低倍換到高倍，視野會？", "opts": ["變大變亮", "變小變暗", "變大變暗", "變小變亮"], "ans": 1, "ex": "高倍時視野範圍小、亮度低、細胞看起來大但數目少。", "fig": "", "ch": "1"}, {"id": "p_12_09", "src": "practice", "sec": "1-2", "concept": "解剖顯微鏡", "q": "觀察蜜蜂觸角的外形，最適合用？", "opts": ["複式顯微鏡", "解剖顯微鏡", "電子顯微鏡", "望遠鏡"], "ans": 1, "ex": "觀察表面構造、不透光的物體用解剖顯微鏡，影像是立體正像。", "fig": "", "ch": "1"}, {"id": "p_13_01", "src": "practice", "sec": "1-3", "concept": "細胞構造功能", "q": "細胞中含有遺傳物質的構造是？", "opts": ["細胞膜", "細胞核", "液泡", "細胞壁"], "ans": 1, "ex": "細胞核含遺傳物質，是細胞的生命中樞。", "fig": "", "ch": "1"}, {"id": "p_13_02", "src": "practice", "sec": "1-3", "concept": "粒線體", "q": "產生細胞活動所需能量的構造是？", "opts": ["葉綠體", "粒線體", "液泡", "細胞壁"], "ans": 1, "ex": "粒線體產生能量；葉綠體行光合作用製造養分。", "fig": "", "ch": "1"}, {"id": "p_13_03", "src": "practice", "sec": "1-3", "concept": "動植物細胞差異", "q": "下列哪一個構造動物細胞沒有？", "opts": ["細胞膜", "細胞核", "細胞壁", "粒線體"], "ans": 2, "ex": "細胞壁只有植物細胞有，主要成分是纖維素。", "fig": "", "ch": "1"}, {"id": "p_13_04", "src": "practice", "sec": "1-3", "concept": "葉綠體", "q": "下列哪一種細胞含有葉綠體？", "opts": ["口腔皮膜細胞", "洋蔥鱗葉表皮細胞", "保衛細胞", "紅血球"], "ans": 2, "ex": "保衛細胞含葉綠體；洋蔥鱗葉表皮不是綠色，沒有葉綠體。", "fig": "", "ch": "1"}, {"id": "p_13_05", "src": "practice", "sec": "1-3", "concept": "形態與功能", "q": "紅血球呈雙凹圓盤狀，主要有利於？", "opts": ["傳遞訊息", "運送氧氣", "收縮運動", "保護"], "ans": 1, "ex": "雙凹圓盤狀有利於運送氧氣。", "fig": "", "ch": "1"}, {"id": "p_13_06", "src": "practice", "sec": "1-3", "concept": "染色", "q": "觀察口腔皮膜細胞時加亞甲藍液，目的是？", "opts": ["殺死細菌", "讓細胞膜和細胞核較明顯", "讓細胞變大", "增加葉綠體"], "ans": 1, "ex": "染色讓透明的細胞膜和細胞核看得更清楚。", "fig": "", "ch": "1"}, {"id": "p_13_07", "src": "practice", "sec": "1-3", "concept": "動物細胞最外層", "q": "動物細胞最外層的構造是？", "opts": ["細胞壁", "細胞膜", "細胞核", "液泡"], "ans": 1, "ex": "動物細胞沒有細胞壁，最外層是細胞膜。", "fig": "", "ch": "1"}, {"id": "p_14_01", "src": "practice", "sec": "1-4", "concept": "擴散作用", "q": "紅墨水滴入清水，一段時間後整杯變紅，這是？", "opts": ["滲透作用", "擴散作用", "光合作用", "消化作用"], "ans": 1, "ex": "物質由高濃度往低濃度移動、最後均勻分布，是擴散作用。", "fig": "", "ch": "1"}, {"id": "p_14_02", "src": "practice", "sec": "1-4", "concept": "大分子進出", "q": "下列哪一種物質不能直接通過細胞膜？", "opts": ["氧氣", "二氧化碳", "水", "澱粉"], "ans": 3, "ex": "澱粉、蛋白質是大分子，要先分解成葡萄糖、胺基酸才能進入細胞。", "fig": "", "ch": "1"}, {"id": "p_14_03", "src": "practice", "sec": "1-4", "concept": "滲透作用", "q": "紅血球放入清水中，最可能？", "opts": ["萎縮", "保持原狀", "膨脹甚至破裂", "變成植物細胞"], "ans": 2, "ex": "清水中進水多於出水，動物細胞沒有細胞壁，會膨脹甚至破裂。", "fig": "", "ch": "1"}, {"id": "p_14_04", "src": "practice", "sec": "1-4", "concept": "滲透作用", "q": "植物細胞放進濃食鹽水，會看到？", "opts": ["細胞破裂", "細胞膜和細胞壁分開，細胞萎縮", "細胞變大", "沒有變化"], "ans": 1, "ex": "出水多於進水，細胞膜內縮與細胞壁分開。", "fig": "", "ch": "1"}, {"id": "p_14_05", "src": "practice", "sec": "1-4", "concept": "生理食鹽水", "q": "生理食鹽水的特色是？", "opts": ["濃度和細胞質相近，細胞維持原狀", "比清水更淡", "會讓細胞破裂", "會讓細胞萎縮"], "ans": 0, "ex": "生理食鹽水和細胞質濃度相近，水進出量相近，細胞維持原大小。", "fig": "", "ch": "1"}, {"id": "p_14_06", "src": "practice", "sec": "1-4", "concept": "分子組成", "q": "多個葡萄糖連結在一起可形成？", "opts": ["蛋白質", "澱粉", "胺基酸", "原子"], "ans": 1, "ex": "葡萄糖連成澱粉；胺基酸連成蛋白質。", "fig": "", "ch": "1"}, {"id": "p_15_01", "src": "practice", "sec": "1-5", "concept": "單細胞生物", "q": "下列何者是單細胞生物？", "opts": ["黴菌", "蝸牛", "草履蟲", "榕樹"], "ans": 2, "ex": "草履蟲、眼蟲、新月藻是單細胞生物；黴菌是多細胞生物。", "fig": "", "ch": "1"}, {"id": "p_15_02", "src": "practice", "sec": "1-5", "concept": "組成層次", "q": "動物體的組成層次由小到大是？", "opts": ["細胞→器官→組織→器官系統→個體", "細胞→組織→器官→器官系統→個體", "組織→細胞→器官→個體", "細胞→組織→器官系統→器官→個體"], "ans": 1, "ex": "細胞→組織→器官→器官系統→個體。", "fig": "", "ch": "1"}, {"id": "p_15_03", "src": "practice", "sec": "1-5", "concept": "植物沒有器官系統", "q": "植物體缺少哪一個層次？", "opts": ["細胞", "組織", "器官", "器官系統"], "ans": 3, "ex": "植物由各種器官直接形成個體，沒有器官系統。", "fig": "", "ch": "1"}, {"id": "p_15_04", "src": "practice", "sec": "1-5", "concept": "器官", "q": "心臟屬於哪一個層次？", "opts": ["細胞", "組織", "器官", "器官系統"], "ans": 2, "ex": "心臟由多種組織組成，是器官；心臟和血管組成循環系統。", "fig": "", "ch": "1"}, {"id": "p_15_05", "src": "practice", "sec": "1-5", "concept": "營養器官", "q": "下列何者是植物的生殖器官？", "opts": ["根", "莖", "葉", "花"], "ans": 3, "ex": "花、果實、種子是生殖器官；根、莖、葉是營養器官。", "fig": "", "ch": "1"}, {"id": "p_15_06", "src": "practice", "sec": "1-5", "concept": "尺度", "q": "大小約 100 奈米的病毒，要用什麼工具觀察？", "opts": ["肉眼", "放大鏡", "光學顯微鏡", "電子顯微鏡"], "ans": 3, "ex": "光學顯微鏡最小約 200 奈米，100 奈米的病毒要用電子顯微鏡。", "fig": "", "ch": "1"}, {"id": "p_15_07", "src": "practice", "sec": "1-5", "concept": "單位換算", "q": "1 微米等於多少公尺？", "opts": ["0.001 公尺", "0.000001 公尺", "0.01 公尺", "1000 公尺"], "ans": 1, "ex": "1 微米＝0.000001 公尺（10 的負 6 次方）；1 毫米＝0.001 公尺。", "fig": "", "ch": "1"}, {"id": "p_21_01", "src": "practice", "sec": "2-1", "concept": "能產生能量的養分", "q": "下列哪一組養分都能為人體產生能量？", "opts": ["醣類、蛋白質、脂質", "醣類、維生素、水", "蛋白質、礦物質、脂質", "維生素、礦物質、水"], "ans": 0, "ex": "能產生能量的是醣類、蛋白質、脂質；礦物質、維生素、水雖然重要，但不能產生能量。", "fig": "", "ch": "2"}, {"id": "p_21_02", "src": "practice", "sec": "2-1", "concept": "熱量計算", "q": "1 公克的哪一種養分可以產生最多熱量？", "opts": ["醣類", "蛋白質", "脂質", "維生素"], "ans": 2, "ex": "1 公克脂質約 9 大卡，醣類和蛋白質各約 4 大卡，維生素 0 大卡。", "fig": "", "ch": "2"}, {"id": "p_21_03", "src": "practice", "sec": "2-1", "concept": "熱量計算", "q": "某食物含醣類 10 公克、蛋白質 5 公克、脂質 2 公克，約可產生多少大卡？", "opts": ["17 大卡", "68 大卡", "78 大卡", "153 大卡"], "ans": 2, "ex": "醣類和蛋白質每公克 4 大卡、脂質 9 大卡：10×4＋5×4＋2×9＝40＋20＋18＝78 大卡。17 是只把公克數相加，忘了乘上熱量。", "fig": "", "ch": "2"}, {"id": "p_21_04", "src": "practice", "sec": "2-1", "concept": "碘液檢測", "q": "在米飯上滴碘液，最可能出現什麼顏色？", "opts": ["淺藍色", "黃褐色", "藍黑色", "橘紅色"], "ans": 2, "ex": "米飯含澱粉，碘液遇澱粉會由黃褐色變成藍黑色（或紫紅色）。", "fig": "", "ch": "2"}, {"id": "p_21_05", "src": "practice", "sec": "2-1", "concept": "本氏液檢測", "q": "用本氏液檢測葡萄糖時，下列哪一個步驟是必要的？", "opts": ["先用酒精脫色", "隔水加熱", "放入冰水中", "加入碘液"], "ans": 1, "ex": "本氏液要加熱才會反應；用隔水加熱讓試管均勻受熱，含葡萄糖就會由淺藍色變成綠、黃、橙、紅。", "fig": "", "ch": "2"}, {"id": "p_21_06", "src": "practice", "sec": "2-1", "concept": "本氏液只測小分子醣類", "q": "把澱粉液加入本氏液後隔水加熱，結果最可能是？", "opts": ["變成橘紅色，因為澱粉是醣類", "維持淺藍色，因為澱粉是大分子醣類", "變成藍黑色，因為含有澱粉", "變成黃褐色，因為沒有葡萄糖"], "ans": 1, "ex": "本氏液只和葡萄糖、麥芽糖這類小分子醣類反應；澱粉是大分子醣類，不會讓本氏液變色。藍黑色是碘液遇澱粉的顏色。", "fig": "", "ch": "2"}, {"id": "p_21_07", "src": "practice", "sec": "2-1", "concept": "對照組的意義", "q": "糖分測定實驗中，試管 A 放「本氏液＋水」，它的目的是什麼？", "opts": ["讓實驗更快完成", "當作對照組，確認讓本氏液變色的不是水", "測試水裡有沒有澱粉", "讓本氏液變得更藍"], "ans": 1, "ex": "「本氏液＋水」是對照組，和加了食物的試管比較，才能確定變色是葡萄糖造成的。", "fig": "", "ch": "2"}, {"id": "p_21_08", "src": "practice", "sec": "2-1", "concept": "纖維素", "q": "關於纖維素，下列敘述何者正確？", "opts": ["屬於蛋白質", "人體可以直接分解它產生能量", "組成植物細胞的細胞壁，適量攝取可促進腸胃蠕動", "只存在於肉類中"], "ans": 2, "ex": "纖維素是醣類的一種，組成植物細胞壁；人體不能直接分解它來產生能量，但能幫助腸胃蠕動。", "fig": "", "ch": "2"}, {"id": "p_21_09", "src": "practice", "sec": "2-1", "concept": "養分的功能", "q": "下列配對何者正確？", "opts": ["鈣：影響紅血球的製造", "鐵：骨骼和牙齒的重要成分", "蛋白質：肌肉與頭髮的主要成分", "維生素 C：組成細胞壁"], "ans": 2, "ex": "鈣是骨骼牙齒的成分、鐵影響紅血球、維生素 C 增加復原力和抵抗力；蛋白質是肌肉與頭髮的主要成分。", "fig": "", "ch": "2"}, {"id": "p_21_10", "src": "practice", "sec": "2-1", "concept": "碘液與本氏液", "q": "蘋果果肉用碘液檢測呈黃褐色，用本氏液加熱後呈橘紅色，代表蘋果果肉？", "opts": ["有澱粉、有葡萄糖", "有澱粉、沒有葡萄糖", "沒有澱粉、有小分子醣類", "沒有澱粉、也沒有醣類"], "ans": 2, "ex": "碘液沒變色（黃褐）＝沒有澱粉；本氏液變橘紅＝有葡萄糖等小分子醣類。", "fig": "", "ch": "2"}, {"id": "p_22_01", "src": "practice", "sec": "2-2", "concept": "酵素的主要成分", "q": "唾液中的澱粉酶，主要成分是什麼？", "opts": ["澱粉", "葡萄糖", "蛋白質", "脂質"], "ans": 2, "ex": "大部分酵素的主要成分是蛋白質。「澱粉酶」是指它分解澱粉，不是由澱粉組成。", "fig": "", "ch": "2"}, {"id": "p_22_02", "src": "practice", "sec": "2-2", "concept": "專一性", "q": "唾液澱粉酶可以分解澱粉，卻不能分解纖維素，這說明酵素具有什麼特性？", "opts": ["可重複使用", "專一性", "會被消耗", "只在低溫作用"], "ans": 1, "ex": "酵素只能和特定的受質結合作用，這叫專一性。", "fig": "", "ch": "2"}, {"id": "p_22_03", "src": "practice", "sec": "2-2", "concept": "分解與合成", "q": "下列哪一個屬於「合成作用」？", "opts": ["澱粉變成葡萄糖", "蛋白質變成胺基酸", "許多葡萄糖結合成澱粉", "脂質變成甘油和脂肪酸"], "ans": 2, "ex": "合成作用是小分子結合成大分子；其他三個選項都是大分子變小分子的分解作用。", "fig": "", "ch": "2"}, {"id": "p_22_04", "src": "practice", "sec": "2-2", "concept": "酵素可重複使用", "q": "在溫度、酸鹼性都不變的情況下，酵素反應完一次之後會怎樣？", "opts": ["被分解掉", "變成產物", "還能再和新的受質作用", "變成受質"], "ans": 2, "ex": "酵素促進反應但本身不會被用掉，條件不變時可以重複使用。", "fig": "", "ch": "2"}, {"id": "p_22_05", "src": "practice", "sec": "2-2", "concept": "溫度影響酵素", "q": "實驗中把唾液先煮沸 10 分鐘，再加入澱粉液，最後以本氏液檢測，結果最可能是？", "opts": ["黃色，澱粉被分解了", "藍色，澱粉沒有被分解", "藍黑色，有葡萄糖", "紅色，有很多澱粉"], "ans": 1, "ex": "高溫會破壞酵素的蛋白質構造使它失去活性，澱粉沒被分解，本氏液維持藍色。（課本 p.75）", "fig": "", "ch": "2"}, {"id": "p_22_06", "src": "practice", "sec": "2-2", "concept": "實驗設計：37℃", "q": "實驗 2-2 為什麼要把唾液和澱粉液放在 37℃ 的溫水中？", "opts": ["讓澱粉溶化", "模擬唾液在人體內的溫度環境", "殺死唾液中的細菌", "讓本氏液變色"], "ans": 1, "ex": "唾液來自人體，人體溫度約 37℃，放在 37℃ 是模擬唾液原本作用的環境。", "fig": "", "ch": "2"}, {"id": "p_22_07", "src": "practice", "sec": "2-2", "concept": "酸鹼值影響酵素", "q": "胃中的酵素在哪一種環境下活性最好？", "opts": ["酸性", "中性", "鹼性", "任何環境都一樣"], "ans": 0, "ex": "胃中的酵素適合酸性環境；唾液酵素接近中性；小腸酵素適合鹼性。", "fig": "", "ch": "2"}, {"id": "p_22_08", "src": "practice", "sec": "2-2", "concept": "變因判斷", "q": "小玲把唾液加醋（實驗組）或加水（對照組），再加澱粉液反應。這個實驗的操作變因是什麼？", "opts": ["澱粉液的體積", "反應的溫度", "唾液所處環境是否為酸性", "本氏液的用量"], "ans": 2, "ex": "兩組只差在加醋（酸性）或加水，所以操作變因是酸鹼環境；其餘都要保持相同（控制變因）。", "fig": "", "ch": "2"}, {"id": "p_22_09", "src": "practice", "sec": "2-2", "concept": "米飯嚼久變甜", "q": "米飯咀嚼久了會有甜味，主要原因是？", "opts": ["牙齒把米飯磨成糖", "唾液中的酵素把澱粉分解成有甜味的小分子醣類", "胃液流到口腔", "米飯遇到空氣變甜"], "ans": 1, "ex": "唾液澱粉酶把沒甜味的澱粉分解成有甜味的小分子醣類（例如麥芽糖）。", "fig": "", "ch": "2"}, {"id": "p_22_10", "src": "practice", "sec": "2-2", "concept": "溫度與活性曲線", "q": "關於一般酵素活性和溫度的關係，何者正確？", "opts": ["溫度越高活性一定越高", "在最適溫度活性最高，溫度過高會失去活性", "溫度越低活性越高", "溫度不會影響酵素"], "ans": 1, "ex": "一定範圍內溫度升高活性增加，到最適溫度最高；溫度過高會破壞蛋白質構造，使酵素永久失去活性。", "fig": "", "ch": "2"}, {"id": "p_23_01", "src": "practice", "sec": "2-3", "concept": "葉的構造", "q": "葉片中主要進行光合作用的部位是？", "opts": ["表皮", "葉肉", "葉脈", "角質層"], "ans": 1, "ex": "葉肉細胞含大量葉綠體，是光合作用的主要場所。", "fig": "", "ch": "2"}, {"id": "p_23_02", "src": "practice", "sec": "2-3", "concept": "氣孔與保衛細胞", "q": "調整氣孔開合的是什麼構造？", "opts": ["表皮細胞", "葉脈", "保衛細胞", "角質層"], "ans": 2, "ex": "兩個半月形的保衛細胞成對排列，中間就是氣孔，由保衛細胞調整開合。", "fig": "", "ch": "2"}, {"id": "p_23_03", "src": "practice", "sec": "2-3", "concept": "光合作用的原料", "q": "光合作用的原料是？", "opts": ["氧氣和葡萄糖", "水和二氧化碳", "氧氣和水", "葡萄糖和二氧化碳"], "ans": 1, "ex": "水＋二氧化碳 →(光、葉綠體)→ 氧氣＋葡萄糖＋水。原料是水和二氧化碳。", "fig": "", "ch": "2"}, {"id": "p_23_04", "src": "practice", "sec": "2-3", "concept": "原料來源", "q": "光合作用需要的二氧化碳主要從哪裡進入植物？", "opts": ["根", "氣孔", "葉脈", "花"], "ans": 1, "ex": "二氧化碳主要由氣孔進入；水主要由根吸收。", "fig": "", "ch": "2"}, {"id": "p_23_05", "src": "practice", "sec": "2-3", "concept": "能量轉換", "q": "光合作用把光能儲存在哪一種物質中？", "opts": ["氧氣", "水", "葡萄糖", "二氧化碳"], "ans": 2, "ex": "光合作用把光能儲存在葡萄糖中，葡萄糖可再轉換成澱粉等養分。", "fig": "", "ch": "2"}, {"id": "p_23_06", "src": "practice", "sec": "2-3", "concept": "脫色步驟", "q": "實驗 2-3 中，把葉片放入酒精隔水加熱的目的是？", "opts": ["軟化葉片", "溶出葉綠素", "檢測澱粉", "殺死細菌"], "ans": 1, "ex": "酒精可以溶出葉綠素（酒精會變綠），葉片變淡後滴碘液才看得清楚顏色變化；隔水加熱是避免酒精燃燒。", "fig": "", "ch": "2"}, {"id": "p_23_07", "src": "practice", "sec": "2-3", "concept": "實驗結果判讀", "q": "葉片中段包鋁箔照光幾天後做碘液檢測，包鋁箔的部位呈什麼顏色？", "opts": ["藍黑色", "黃褐色", "綠色", "橘紅色"], "ans": 1, "ex": "包鋁箔處沒照光、不能行光合作用，原有的澱粉也已消耗，沒有澱粉所以維持碘液的黃褐色。", "fig": "", "ch": "2"}, {"id": "p_23_08", "src": "practice", "sec": "2-3", "concept": "鋁箔要提早包", "q": "為什麼要在實驗前 3～5 天就包上鋁箔？", "opts": ["讓葉片長大", "讓被包住部位原本的澱粉消耗掉", "讓鋁箔黏緊", "讓葉綠素增加"], "ans": 1, "ex": "時間夠長，被遮光的部位才會把原有澱粉用完，結果才能證明澱粉是照光後才產生的。", "fig": "", "ch": "2"}, {"id": "p_23_09", "src": "practice", "sec": "2-3", "concept": "葉綠體是必要條件", "q": "用彩葉草（有綠色和紫紅色部分）做照光後碘液檢測，結果哪裡呈藍黑色？", "opts": ["整片葉子", "只有綠色部分", "只有紫紅色部分", "都不會變色"], "ans": 1, "ex": "只有含葉綠體的綠色部分能行光合作用、產生澱粉，所以綠色部分呈藍黑色。", "fig": "", "ch": "2"}, {"id": "p_23_10", "src": "practice", "sec": "2-3", "concept": "實驗設計", "q": "想驗證「二氧化碳」是光合作用需要的，下列哪一種處理最適合當實驗組？", "opts": ["用鋁箔包住整片葉子", "用油脂塗滿整片葉子表面", "把葉子泡在酒精裡", "多澆水"], "ans": 1, "ex": "油脂能隔絕氣體進出葉子（二氧化碳進不來），其他條件和對照組相同，才能看出二氧化碳的影響（課本例 2）。", "fig": "", "ch": "2"}, {"id": "p_24_01", "src": "practice", "sec": "2-4", "concept": "消化道順序", "q": "食物通過消化道的正確順序是？", "opts": ["口腔→食道→咽→胃→大腸→小腸→肛門", "口腔→咽→食道→胃→小腸→大腸→肛門", "口腔→咽→胃→食道→小腸→大腸→肛門", "口腔→咽→食道→小腸→胃→大腸→肛門"], "ans": 1, "ex": "口腔→咽→食道→胃→小腸→大腸→肛門。", "fig": "", "ch": "2"}, {"id": "p_24_02", "src": "practice", "sec": "2-4", "concept": "消化腺", "q": "下列哪一個是消化腺，食物不會經過？", "opts": ["胃", "小腸", "胰臟", "食道"], "ans": 2, "ex": "胰臟是消化腺，分泌胰液經管道注入小腸；胃、小腸、食道是消化道。", "fig": "", "ch": "2"}, {"id": "p_24_03", "src": "practice", "sec": "2-4", "concept": "膽汁", "q": "關於膽汁，下列何者正確？", "opts": ["由膽囊製造", "含有分解脂質的酵素", "不含酵素，能乳化脂質", "是酸性的"], "ans": 2, "ex": "膽汁由肝臟分泌、儲存在膽囊；不含酵素，但能乳化脂質，加快脂質分解；是鹼性。", "fig": "", "ch": "2"}, {"id": "p_24_04", "src": "practice", "sec": "2-4", "concept": "胃的功能", "q": "胃液中的酵素主要初步分解哪一種養分？", "opts": ["澱粉", "蛋白質", "脂質", "纖維素"], "ans": 1, "ex": "口腔初步分解澱粉，胃初步分解蛋白質。", "fig": "", "ch": "2"}, {"id": "p_24_05", "src": "practice", "sec": "2-4", "concept": "胃中的鹽酸", "q": "胃液中鹽酸的功能是什麼？", "opts": ["分解澱粉", "乳化脂質", "殺死部分細菌並促進胃中酵素作用", "吸收養分"], "ans": 2, "ex": "鹽酸讓胃呈酸性，可殺死部分細菌，也讓適合酸性的胃中酵素作用更好。", "fig": "", "ch": "2"}, {"id": "p_24_06", "src": "practice", "sec": "2-4", "concept": "小腸吸收", "q": "小腸內壁的絨毛有什麼功用？", "opts": ["分泌膽汁", "增加吸收養分的表面積", "磨碎食物", "儲存糞便"], "ans": 1, "ex": "絨毛是小腸內壁皺褶上的指狀突起，增加表面積，幫助吸收養分。", "fig": "", "ch": "2"}, {"id": "p_24_07", "src": "practice", "sec": "2-4", "concept": "消化產物", "q": "蛋白質完全消化後會變成什麼？", "opts": ["葡萄糖", "胺基酸", "甘油", "脂肪酸"], "ans": 1, "ex": "澱粉→葡萄糖；蛋白質→胺基酸；脂質→甘油與脂肪酸。", "fig": "", "ch": "2"}, {"id": "p_24_08", "src": "practice", "sec": "2-4", "concept": "胰液", "q": "哪一種消化液能分解醣類、蛋白質和脂質三大類養分？", "opts": ["唾液", "胃液", "膽汁", "胰液"], "ans": 3, "ex": "胰液含多種酵素，能分解醣類、蛋白質、脂質；腸液分解醣類與蛋白質；膽汁不含酵素。", "fig": "", "ch": "2"}, {"id": "p_24_09", "src": "practice", "sec": "2-4", "concept": "大腸", "q": "大腸的主要功能是？", "opts": ["分解蛋白質", "吸收水分和礦物質", "分泌胰液", "初步分解澱粉"], "ans": 1, "ex": "大腸繼續吸收殘渣中的水分與礦物質，剩下的形成糞便排出。", "fig": "", "ch": "2"}, {"id": "p_24_10", "src": "practice", "sec": "2-4", "concept": "小腸消化液的酸鹼性", "q": "膽汁、胰液、腸液都是鹼性，這有什麼好處？", "opts": ["讓食物變甜", "中和胃液的酸性，促進小腸酵素活性", "殺死所有細菌", "讓澱粉變成蛋白質"], "ans": 1, "ex": "食物從胃帶著酸性進入小腸，鹼性消化液能中和它，讓適合鹼性的小腸酵素發揮作用。", "fig": "", "ch": "2"}, {"id": "p_24_11", "src": "practice", "sec": "2-4", "concept": "食道", "q": "關於食道，下列敘述何者正確？", "opts": ["會分泌消化液分解澱粉", "靠管壁肌肉收縮把食物推送到胃", "是吸收養分的主要部位", "能乳化脂質"], "ans": 1, "ex": "食道不分泌消化液，靠肌肉收縮（蠕動）把食物推到胃。", "fig": "", "ch": "2"}, {"id": "p_31_01", "src": "practice", "sec": "3-1", "concept": "木質部", "q": "植物根部吸收的水分和礦物質，主要由哪個構造往上運送？", "opts": ["韌皮部", "木質部", "形成層", "表皮"], "ans": 1, "ex": "木質部運輸水分和礦物質；韌皮部運輸養分。", "fig": "", "ch": "3"}, {"id": "p_31_02", "src": "practice", "sec": "3-1", "concept": "韌皮部", "q": "葉子光合作用產生的養分，經由哪個構造運到根部儲存？", "opts": ["木質部", "韌皮部", "氣孔", "根毛"], "ans": 1, "ex": "養分由韌皮部運輸，可上可下。", "fig": "", "ch": "3"}, {"id": "p_31_03", "src": "practice", "sec": "3-1", "concept": "維管束位置", "q": "在莖的維管束中，木質部和韌皮部的位置是？", "opts": ["木質部在外、韌皮部在內", "木質部在內、韌皮部在外", "兩者混在一起", "都在莖的中心"], "ans": 1, "ex": "莖內維管束中，木質部在內側、韌皮部在外側。", "fig": "", "ch": "3"}, {"id": "p_31_04", "src": "practice", "sec": "3-1", "concept": "形成層", "q": "相思樹的莖可以逐年加粗，主要是因為有？", "opts": ["根毛", "形成層", "氣孔", "角質層"], "ans": 1, "ex": "形成層向內產生木質部、向外產生韌皮部，莖才能加粗；玉米等散生排列沒有形成層。", "fig": "", "ch": "3"}, {"id": "p_31_05", "src": "practice", "sec": "3-1", "concept": "散生排列", "q": "下列哪一種植物的維管束是散生排列？", "opts": ["相思樹", "榕樹", "玉米", "向日葵"], "ans": 2, "ex": "玉米、水稻、小麥是散生排列；向日葵、相思樹、榕樹是環狀排列。", "fig": "", "ch": "3"}, {"id": "p_31_06", "src": "practice", "sec": "3-1", "concept": "年輪", "q": "年輪中顏色淺、細胞大的部分，通常形成於？", "opts": ["溫暖多雨的季節", "寒冷少雨的季節", "晚上", "樹木死亡後"], "ans": 0, "ex": "溫暖多雨時木質部細胞長得快、細胞大、顏色淺；寒冷少雨時細胞小、顏色深。", "fig": "", "ch": "3"}, {"id": "p_31_07", "src": "practice", "sec": "3-1", "concept": "環狀剝皮", "q": "樹幹被環狀剝去樹皮一段時間後枯死，主要原因是？", "opts": ["木質部被破壞，水無法往上", "韌皮部被破壞，養分無法運到根", "葉子無法行光合作用", "氣孔全部關閉"], "ans": 1, "ex": "樹皮包含韌皮部，被剝除後養分運不到根，根死亡後無法吸水，整棵樹枯萎。", "fig": "", "ch": "3"}, {"id": "p_31_08", "src": "practice", "sec": "3-1", "concept": "蒸散作用", "q": "植物體內水分向上運輸的主要動力是？", "opts": ["光合作用", "蒸散作用", "呼吸作用", "重力"], "ans": 1, "ex": "水從氣孔散失產生拉力，把木質部中的水柱往上拉。", "fig": "", "ch": "3"}, {"id": "p_31_09", "src": "practice", "sec": "3-1", "concept": "根毛", "q": "根毛的主要功能是？", "opts": ["行光合作用", "增加吸收水分的表面積", "運輸養分", "儲存澱粉"], "ans": 1, "ex": "根毛呈細絲狀，增加吸收水分和礦物質的表面積。", "fig": "", "ch": "3"}, {"id": "p_31_10", "src": "practice", "sec": "3-1", "concept": "實驗判讀", "q": "芹菜插入紅色溶液後橫切葉柄，被染紅的是？", "opts": ["韌皮部", "木質部", "表皮", "形成層"], "ans": 1, "ex": "紅色溶液隨水由木質部往上運送，所以木質部被染紅。", "fig": "", "ch": "3"}, {"id": "p_31_11", "src": "practice", "sec": "3-1", "concept": "蒸散實驗", "q": "兩支芹菜一支摘除葉片、一支保留，放在通風日照處，結果何者正確？", "opts": ["摘除葉片的水位下降較多", "保留葉片的水位下降較多", "兩者一樣", "水位都上升"], "ans": 1, "ex": "保留葉片的氣孔多，蒸散較多，量筒水位下降較多。", "fig": "", "ch": "3"}, {"id": "p_32_01", "src": "practice", "sec": "3-2", "concept": "心臟腔室", "q": "心臟的四個腔室中，哪一個把血液送往全身？", "opts": ["右心房", "右心室", "左心房", "左心室"], "ans": 3, "ex": "體循環從左心室開始，經主動脈送往全身。", "fig": "", "ch": "3"}, {"id": "p_32_02", "src": "practice", "sec": "3-2", "concept": "瓣膜", "q": "心臟和部分靜脈中的瓣膜，功能是？", "opts": ["產生血液", "防止血液倒流", "交換氣體", "過濾病原體"], "ans": 1, "ex": "瓣膜讓血液只能往一個方向流，防止倒流。", "fig": "", "ch": "3"}, {"id": "p_32_03", "src": "practice", "sec": "3-2", "concept": "微血管", "q": "最適合血液與組織細胞交換物質的血管是？", "opts": ["動脈", "微血管", "靜脈", "主動脈"], "ans": 1, "ex": "微血管管壁只有一層細胞、流速最慢、分布最廣，最利於物質交換。", "fig": "", "ch": "3"}, {"id": "p_32_04", "src": "practice", "sec": "3-2", "concept": "動脈特徵", "q": "下列何者是動脈的特徵？", "opts": ["管壁最薄", "血壓最小", "管壁厚、彈性好、血流快", "內有很多瓣膜"], "ans": 2, "ex": "動脈管壁最厚、彈性最好、流速最快、血壓最大；靜脈部分有瓣膜。", "fig": "", "ch": "3"}, {"id": "p_32_05", "src": "practice", "sec": "3-2", "concept": "紅血球", "q": "關於紅血球，下列何者正確？", "opts": ["有細胞核", "數量最少", "含血紅素，攜帶氧氣", "能產生抗體"], "ans": 2, "ex": "紅血球無細胞核、數量最多，含血紅素攜帶氧氣；產生抗體的是白血球。", "fig": "", "ch": "3"}, {"id": "p_32_06", "src": "practice", "sec": "3-2", "concept": "血小板", "q": "受傷流血後傷口血液凝固，主要靠？", "opts": ["紅血球", "白血球", "血小板", "血漿"], "ans": 2, "ex": "血小板促使血液凝固，避免失血過多。", "fig": "", "ch": "3"}, {"id": "p_32_07", "src": "practice", "sec": "3-2", "concept": "體循環", "q": "體循環的起點和終點是？", "opts": ["右心室→左心房", "左心室→右心房", "左心房→右心室", "右心房→左心室"], "ans": 1, "ex": "體循環由左心室開始，回到右心房；肺循環由右心室到左心房。", "fig": "", "ch": "3"}, {"id": "p_32_08", "src": "practice", "sec": "3-2", "concept": "肺動脈", "q": "肺動脈中流的是什麼血？", "opts": ["充氧血", "缺氧血", "淋巴", "組織液"], "ans": 1, "ex": "肺動脈把右心室的缺氧血送到肺；在肺交換氣體後，肺靜脈帶充氧血回左心房。", "fig": "", "ch": "3"}, {"id": "p_32_09", "src": "practice", "sec": "3-2", "concept": "肺循環氣體交換", "q": "血液流經肺泡時，氣體如何交換？", "opts": ["氧氣從血液到肺泡", "二氧化碳從肺泡到血液", "氧氣從肺泡到血液、二氧化碳從血液到肺泡", "不交換"], "ans": 2, "ex": "肺泡氧濃度高，氧擴散進血液；血液二氧化碳濃度高，擴散到肺泡。", "fig": "", "ch": "3"}, {"id": "p_32_10", "src": "practice", "sec": "3-2", "concept": "心音", "q": "用聽診器聽到「撲、通」兩聲，代表心臟跳動幾次？", "opts": ["半次", "1 次", "2 次", "4 次"], "ans": 1, "ex": "心臟跳動一次有兩個心音，由瓣膜關閉、血液撞擊產生。", "fig": "", "ch": "3"}, {"id": "p_32_11", "src": "practice", "sec": "3-2", "concept": "脈搏", "q": "同一個人同一分鐘內，心搏次數和脈搏次數的關係是？", "opts": ["心搏較多", "脈搏較多", "相等", "沒有關係"], "ans": 2, "ex": "脈搏來自心搏，所以兩者次數相等；運動後兩者一起增加。", "fig": "", "ch": "3"}, {"id": "p_32_12", "src": "practice", "sec": "3-2", "concept": "淋巴", "q": "淋巴最後流回到哪裡？", "opts": ["心室", "動脈", "靜脈", "肺泡"], "ans": 2, "ex": "血漿滲出成組織液→進入淋巴管成淋巴→最後注入靜脈回到血液。", "fig": "", "ch": "3"}, {"id": "p_32_13", "src": "practice", "sec": "3-2", "concept": "小魚尾鰭", "q": "觀察小魚尾鰭時，由較粗血管分支成微血管的，是哪一種血管？", "opts": ["小動脈", "小靜脈", "淋巴管", "主動脈"], "ans": 0, "ex": "動脈越分越細成微血管；微血管匯流而成的是小靜脈。", "fig": "", "ch": "3"}, {"id": "p_33_01", "src": "practice", "sec": "3-3", "concept": "第一道防線", "q": "皮膚和黏膜阻擋病原體，屬於哪一道防線？", "opts": ["第一道", "第二道", "第三道", "不屬於防線"], "ans": 0, "ex": "皮膜的阻隔是第一道防線，屬非專一性防禦。", "fig": "", "ch": "3"}, {"id": "p_33_02", "src": "practice", "sec": "3-3", "concept": "發炎反應", "q": "傷口紅、腫、熱、痛，代表哪一道防線在作用？", "opts": ["第一道", "第二道", "第三道", "疫苗"], "ans": 1, "ex": "發炎反應讓白血球聚集吞噬病原體，屬第二道防線。", "fig": "", "ch": "3"}, {"id": "p_33_03", "src": "practice", "sec": "3-3", "concept": "專一性防禦", "q": "下列哪一個屬於專一性防禦？", "opts": ["皮膚阻擋細菌", "白血球針對特定病原體產生抗體", "傷口發炎", "胃酸殺菌"], "ans": 1, "ex": "針對特定病原體產生抗體或破壞受感染細胞，是第三道防線的專一性防禦。", "fig": "", "ch": "3"}, {"id": "p_33_04", "src": "practice", "sec": "3-3", "concept": "疫苗原理", "q": "疫苗能預防疾病，主要是因為？", "opts": ["疫苗會直接殺死病原體", "讓白血球記住病原體表面特徵，下次反應更快更強", "讓皮膚變厚", "增加紅血球數量"], "ans": 1, "ex": "疫苗模擬病原體表面特徵，讓特殊白血球留下記憶，第二次接觸時反應更快更強。", "fig": "", "ch": "3"}, {"id": "p_33_05", "src": "practice", "sec": "3-3", "concept": "專一性", "q": "打過腸病毒相關的防禦，能不能對抗流感病毒？", "opts": ["可以，所有病毒都能對抗", "不行，專一性防禦只對特定病原體有效", "只在冬天有效", "只要多吃就可以"], "ans": 1, "ex": "第三道防線具有專一性，對腸病毒的防禦對流感病毒無效。", "fig": "", "ch": "3"}, {"id": "p_33_06", "src": "practice", "sec": "3-3", "concept": "免疫曲線", "q": "第二次接觸相同病原體時，免疫反應和第一次相比？", "opts": ["較慢較弱", "較快較強", "完全一樣", "不會有反應"], "ans": 1, "ex": "部分白血球已有記憶，能快速大量增生或製造抗體。", "fig": "", "ch": "3"}, {"id": "p_41_01", "src": "practice", "sec": "4-1", "concept": "動器", "q": "下列何者屬於「動器」？", "opts": ["眼睛", "皮膚", "淚腺", "感覺神經元"], "ans": 2, "ex": "動器是產生反應的肌肉與腺體；淚腺分泌淚液是腺體，屬於動器。眼睛、皮膚含受器。", "fig": "", "ch": "4"}, {"id": "p_41_02", "src": "practice", "sec": "4-1", "concept": "神經元構造", "q": "神經元中負責接收及傳導訊息的是？", "opts": ["細胞本體", "神經纖維", "細胞核", "細胞壁"], "ans": 1, "ex": "神經纖維接收及傳導訊息；細胞本體含細胞核，調節代謝與整合訊息。", "fig": "", "ch": "4"}, {"id": "p_41_03", "src": "practice", "sec": "4-1", "concept": "中樞神經", "q": "下列何者屬於中樞神經？", "opts": ["腦神經", "脊神經", "脊髓", "感覺神經元"], "ans": 2, "ex": "中樞神經是腦和脊髓；腦神經、脊神經、感覺神經元都屬周圍神經。", "fig": "", "ch": "4"}, {"id": "p_41_04", "src": "practice", "sec": "4-1", "concept": "小腦", "q": "體操選手在平衡木上保持平衡，主要靠哪個部位協調？", "opts": ["大腦", "小腦", "腦幹", "脊髓"], "ans": 1, "ex": "小腦協調全身肌肉、維持身體平衡。", "fig": "", "ch": "4"}, {"id": "p_41_05", "src": "practice", "sec": "4-1", "concept": "腦幹", "q": "控制呼吸、心跳的「生命中樞」是？", "opts": ["大腦", "小腦", "腦幹", "脊髓"], "ans": 2, "ex": "腦幹控制呼吸、心跳、血壓等，嚴重受損時無法存活。", "fig": "", "ch": "4"}, {"id": "p_41_06", "src": "practice", "sec": "4-1", "concept": "交叉控制", "q": "某人左半身無法自由活動，最可能是哪裡受損？", "opts": ["左大腦半球", "右大腦半球", "小腦", "腦幹"], "ans": 1, "ex": "大腦左半球控制右半身、右半球控制左半身，所以左半身異常多半是右大腦半球受損。", "fig": "", "ch": "4"}, {"id": "p_41_07", "src": "practice", "sec": "4-1", "concept": "反射", "q": "下列哪一個是反射？", "opts": ["看到同學揮手打招呼", "聽到鐘聲走進教室", "灰塵飛入眼睛不經意眨眼", "看到尺掉落用手接住"], "ans": 2, "ex": "不經意眨眼由腦幹控制，不經大腦，是反射；其他都要經過大腦判斷，是意識反應。", "fig": "", "ch": "4"}, {"id": "p_41_08", "src": "practice", "sec": "4-1", "concept": "反射中樞", "q": "手摸到熱茶壺立刻縮回，這個反射的中樞是？", "opts": ["
