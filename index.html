<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生物體的營養 闖關島</title>
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f1ff; --card:#ffffff; --ink:#22203a; --sub:#5d5a78; --line:#e3def7;
  --pri:#5b4bdb; --pri2:#7c6cf0; --ok:#1f9d55; --okbg:#e3f7ea; --bad:#d64545; --badbg:#fde8e8;
  --gold:#f5a524; --c21:#ff8a3d; --c22:#e84393; --c23:#22a35a; --c24:#2f80ed;
  --shadow:0 4px 0 rgba(40,30,110,.12), 0 8px 24px rgba(40,30,110,.08);
  --r:18px; --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16142a; --card:#221f3d; --ink:#f1efff; --sub:#b4b0d6; --line:#37335e;
    --pri:#8f82ff; --pri2:#a79dff; --okbg:#173b27; --badbg:#47202a;
    --shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#16142a; --card:#221f3d; --ink:#f1efff; --sub:#b4b0d6; --line:#37335e;
  --pri:#8f82ff; --pri2:#a79dff; --okbg:#173b27; --badbg:#47202a;
  --shadow:0 4px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.65 system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
body.teach{--fs:24px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pri)}
img{max-width:100%;height:auto}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
body.teach .wrap{max-width:1180px}

/* 頂列 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.top .home{border:0;background:none;font-weight:800;font-size:1.05em;display:flex;align-items:center;gap:6px;padding:6px 4px;min-height:44px}
.xpbox{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lv{background:var(--gold);color:#3b2300;font-weight:800;border-radius:999px;padding:2px 10px;font-size:.8em;white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden;max-width:220px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd36b);border-radius:999px;transition:width .5s}
.modebtn{border:2px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85em;min-height:44px;white-space:nowrap}
body.teach .modebtn{background:var(--pri);color:#fff}

/* 卡片與按鈕 */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:16px 0}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 60%,#000);min-height:48px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pri) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.gold{background:var(--gold);color:#3b2300;box-shadow:0 4px 0 #b97300}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--sub);font-size:.9em}
h1{font-size:1.6em;margin:18px 0 6px;line-height:1.3}
h2{font-size:1.25em;margin:8px 0;line-height:1.35}
h3{font-size:1.05em;margin:6px 0}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78em;font-weight:700;background:var(--line);color:var(--sub)}
.k{background:color-mix(in srgb,var(--gold) 28%,transparent);border-radius:6px;padding:0 4px;font-weight:700}

/* 首頁地圖 */
.hero{padding:22px 20px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#5b4bdb,#9b5de5 60%,#f15bb5);box-shadow:var(--shadow);margin-top:16px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px;color:#fff}
.hero p{margin:0;opacity:.95}
.hero .blob{position:absolute;right:-30px;top:-30px;font-size:120px;opacity:.18;transform:rotate(-12deg)}
.islands{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
@media (max-width:560px){.islands{grid-template-columns:1fr}}
.isl{border:0;text-align:left;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;min-height:110px;border-left:8px solid var(--c)}
.isl .ic{font-size:44px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.isl b{display:block;font-size:1.08em}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05em}
.stars .off{color:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:0;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);text-align:center;min-height:104px}
.tile .ic{font-size:32px}
.tile b{display:block}
.tile small{color:var(--sub);display:block;line-height:1.35}

/* 節次分頁 */
.sechead{display:flex;align-items:center;gap:12px;margin-top:16px}
.sechead .ic{font-size:40px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap;min-height:44px}
.tab.on{border-color:var(--c,var(--pri));background:var(--c,var(--pri));color:#fff}

/* 觀念卡 */
.flash{min-height:300px;display:flex;flex-direction:column}
.flash .t{font-size:1.3em;font-weight:800;margin:4px 0 10px}
.flash .body{flex:1}
.flash .think{margin-top:14px;border:2px dashed var(--line);border-radius:14px;padding:12px}
.flash .think summary{cursor:pointer;font-weight:700;color:var(--pri);min-height:32px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c,var(--pri));width:24px;border-radius:999px}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92em}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:color-mix(in srgb,var(--c,var(--pri)) 14%,transparent)}
.tblwrap{overflow-x:auto}

/* 題目 */
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qtext{font-size:1.06em;white-space:pre-wrap}
.pas{background:color-mix(in srgb,var(--pri) 8%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:.95em;white-space:pre-wrap}
.qfig{margin:10px 0;text-align:center}
.qfig img{border-radius:10px;background:#fff;padding:6px;max-height:420px;width:auto}
body.teach .qfig img{max-height:560px}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.img{grid-template-columns:repeat(4,1fr)}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:52px}
.opt .L{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:800}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--card))}
.opt.sel .L{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opts.img .opt{justify-content:center}
.verdict{font-size:1.5em;font-weight:900;margin:14px 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.ex{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:14px;padding:12px 14px;margin-top:8px}
.warn{background:var(--badbg);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.9em}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--c,var(--pri));transition:width .3s}
.hearts{font-size:1.1em}

/* 模擬 */
.sim{position:relative}
.sim label{font-weight:700;display:block;margin-top:10px}
.sim input[type=range]{width:100%;height:36px;accent-color:var(--c,var(--pri))}
.simview{background:color-mix(in srgb,var(--c,var(--pri)) 7%,var(--card));border-radius:16px;padding:10px;margin-top:10px;text-align:center}
.simview svg{width:100%;height:auto;max-height:340px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;min-height:44px}
.chip.on{border-color:var(--c,var(--pri));background:color-mix(in srgb,var(--c,var(--pri)) 16%,var(--card))}
.readout{font-size:1.1em;font-weight:800;margin-top:8px}
.note{font-size:.88em;color:var(--sub);margin-top:8px}
.tube{transition:fill .8s}
.order li{list-style:none;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card);display:flex;gap:8px;align-items:center;min-height:48px}
.order{padding:0}
.dgrid{display:grid;grid-template-columns:minmax(150px,1fr) 1.3fr;gap:10px;text-align:left;align-items:center}
@media (max-width:560px){.dgrid{grid-template-columns:1fr}.dgrid svg{max-height:300px!important}}
.order li button{border:0;background:var(--line);border-radius:10px;width:40px;height:40px;font-weight:900}
.order li.ok{border-color:var(--ok);background:var(--okbg)}
.order li.bad{border-color:var(--bad);background:var(--badbg)}

/* 結算 / 徽章 */
.big{font-size:3em;text-align:center;margin:8px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{background:var(--card);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.badge .ic{font-size:36px;filter:grayscale(1);opacity:.35}
.badge.got .ic{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:800;z-index:50;transition:transform .35s;max-width:90vw;text-align:center}
.toast{opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.foot{text-align:center;color:var(--sub);font-size:.8em;margin:30px 0 10px}
.teachonly{display:none} body.teach .teachonly{display:block}
body.teach .stuonly{display:none}
.reveal{margin-top:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <button class="home" onclick="go('#/')" aria-label="回首頁">🏝️ <span>營養闖關島</span></button>
  <div class="xpbox stuonly"><span class="lv" id="lv">Lv 1</span><div class="xpbar"><i id="xpbar" style="width:0"></i></div></div>
  <div class="xpbox teachonly" style="display:none"></div>
  <button class="modebtn" id="modebtn" onclick="toggleTeach()" aria-pressed="false">🎓 上課模式</button>
</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script>
const DATA = {"meta": {"version": "10/23 16:21", "endpoint": ""}, "secs": [{"id": "2-1", "title": "食物中的養分", "icon": "🍱", "color": "#ff8a3d", "sim": "food", "cards": [{"t": "六大養分：誰能產生能量？", "page": 66, "html": "<p>養分是維持生命的必需條件。人體需要的養分分成兩組：<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>可以產生能量<\/th><th>無法產生能量<\/th><\/tr><tr><td><b>醣類<\/b>（碳水化合物）<\/td><td><b>礦物質<\/b><\/td><\/tr><tr><td><b>蛋白質<\/b><\/td><td><b>維生素<\/b><\/td><\/tr><tr><td><b>脂質<\/b><\/td><td><b>水<\/b><\/td><\/tr><\/table><\/div><p>只含單一養分的食物很少見，不同食物的養分種類與比例不同。<\/p>", "think": "維生素很重要，為什麼它不能提供能量？", "hint": "「重要」不等於「有能量」。維生素、礦物質、水負責維持正常生命機能，但燃燒它們不會產生熱量（0 大卡）。"}, {"t": "哪些食物富含哪種養分", "page": 66, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>養分<\/th><th>常見食物<\/th><\/tr><tr><td>醣類（例如澱粉）<\/td><td>米飯、麵包、地瓜、馬鈴薯、義大利麵<\/td><\/tr><tr><td>蛋白質<\/td><td>海鮮、肉類、蛋、牛奶、豆類、起司<\/td><\/tr><tr><td>脂質<\/td><td>食用油、橄欖油、奶油、酪梨、堅果<\/td><\/tr><tr><td>礦物質、維生素<\/td><td>各式食物，例如蔬菜、水果<\/td><\/tr><\/table><\/div>"}, {"t": "養分也是建造身體的材料", "page": 67, "html": "<ul><li><span class='k'>纖維素<\/span>（醣類的一種）組成植物的<b>細胞壁<\/b>。<\/li><li><span class='k'>蛋白質<\/span>是肌肉與頭髮的主要成分。<\/li><li>皮膚下層的<span class='k'>脂肪<\/span>可以防止熱量散失、保溫。<\/li><li>鈣：骨骼和牙齒的重要成分；鐵：影響紅血球；維生素 A：眼睛保健；維生素 C：增加復原力和抵抗力；水：協助代謝反應進行。<\/li><\/ul>"}, {"t": "纖維素：是醣類，卻不能給人體能量", "page": 67, "html": "<p>纖維素屬於醣類，但<b>人體無法直接分解它<\/b>來產生能量。適量攝取蔬果中的纖維素能促進腸胃蠕動、維持腸道健康。<\/p><p>高纖食品含較多<b>膳食纖維<\/b>（果膠、纖維素等不易被消化酵素分解的碳水化合物），能幫助糞便形成、避免便祕。（p.85）<\/p>", "think": "纖維素是醣類，1 公克能提供人體 4 大卡嗎？", "hint": "不能。4 大卡指的是人體能分解利用的醣類；人體沒有分解纖維素的酵素，所以纖維素不會變成能量。"}, {"t": "食物的熱量怎麼算", "page": 67, "html": "<p>熱量單位：<b>卡<\/b>或<b>大卡<\/b>，<span class='k'>1000 卡＝1 大卡<\/span>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>養分<\/th><th>每 1 公克產生<\/th><\/tr><tr><td>醣類<\/td><td>4 大卡<\/td><\/tr><tr><td>蛋白質<\/td><td>4 大卡<\/td><\/tr><tr><td>脂質<\/td><td><b>9 大卡<\/b><\/td><\/tr><tr><td>礦物質、維生素、水<\/td><td>0 大卡<\/td><\/tr><\/table><\/div><p>測量方法：燃燒食物加熱錐形瓶裡的水，看水溫上升多少來推估熱量。<\/p>", "think": "一包餅乾含醣類 20 g、蛋白質 2 g、脂質 10 g，大約多少大卡？", "hint": "20×4＋2×4＋10×9＝80＋8＋90＝178 大卡。脂質雖然只有 10 g，提供的熱量卻最多。"}, {"t": "檢測澱粉：碘液", "page": 68, "html": "<p>黃褐色的<span class='k'>碘液<\/span>遇到<b>澱粉<\/b>會變成<b>藍黑色或紫紅色<\/b>；沒有澱粉就維持黃褐色。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>樣品<\/th><th>澱粉液<\/th><th>米飯<\/th><th>糯米<\/th><th>蘋果<\/th><th>水<\/th><\/tr><tr><td>碘液結果<\/td><td>藍黑<\/td><td>藍黑<\/td><td>紫紅<\/td><td>黃褐<\/td><td>黃褐<\/td><\/tr><\/table><\/div><p>「碘液＋水」是<b>對照組<\/b>：確認讓碘液變色的是澱粉，不是水。（p.88）<\/p>"}, {"t": "檢測葡萄糖：本氏液要加熱", "page": 68, "html": "<p>淺藍色的<span class='k'>本氏液<\/span>加入葡萄糖（或麥芽糖）溶液後<b>隔水加熱<\/b>，會依糖的多寡和作用時間變成<b>綠→黃→橙→紅<\/b>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>樣品<\/th><th>葡萄糖液<\/th><th>蘋果果肉汁<\/th><th>米飯<\/th><th>水<\/th><\/tr><tr><td>本氏液加熱後<\/td><td>橘紅<\/td><td>橘紅<\/td><td>淺藍<\/td><td>淺藍<\/td><\/tr><\/table><\/div><p>🔴 <b>澱粉是大分子醣類，不會讓本氏液變色<\/b>；要先被分解成小分子醣類才會。隔水加熱是為了讓試管均勻受熱。（p.88）<\/p>", "think": "米飯含很多醣類，為什麼本氏液測米飯還是淺藍色？", "hint": "米飯裡主要是澱粉（大分子醣類），本氏液只檢測葡萄糖、麥芽糖這類小分子醣類。"}]}, {"id": "2-2", "title": "酵素", "icon": "🔑", "color": "#e84393", "sim": "enzyme", "cards": [{"t": "代謝作用：分解與合成", "page": 70, "html": "<p>養分在體內經過各種化學反應，產生能量或其他物質，統稱<span class='k'>代謝作用<\/span>。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>類型<\/th><th>發生什麼事<\/th><\/tr><tr><td><b>分解作用<\/b><\/td><td>大分子 → 小分子<\/td><\/tr><tr><td><b>合成作用<\/b><\/td><td>小分子 → 結合成大分子<\/td><\/tr><\/table><\/div><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>大分子<\/th><th>澱粉<\/th><th>蛋白質<\/th><th>脂質<\/th><\/tr><tr><td>分解後的小分子<\/td><td>葡萄糖<\/td><td>胺基酸<\/td><td>甘油、脂肪酸<\/td><\/tr><\/table><\/div>"}, {"t": "酵素（酶）與受質", "page": 70, "html": "<p><span class='k'>酵素<\/span>又稱<b>酶<\/b>，能<b>促進<\/b>代謝反應進行。和酵素結合、被它作用的物質叫做<span class='k'>受質<\/span>。<\/p><p>只要環境的溫度、酸鹼性沒有改變，酵素反應結束後還能和新的受質作用——<b>可以重複使用<\/b>。<\/p>"}, {"t": "專一性：一把鑰匙開一個鎖", "page": 70, "html": "<p>酵素和受質的結合具有<span class='k'>專一性<\/span>。例如唾液中的<b>澱粉酶<\/b>能和澱粉結合、把澱粉分解成小分子醣類，卻<b>不能<\/b>和纖維素結合，所以無法分解纖維素。<\/p>", "think": "澱粉和纖維素都是醣類，為什麼澱粉酶只分解澱粉？", "hint": "酵素只能和形狀吻合的受質結合（專一性）。纖維素和澱粉雖然都是醣類，但和澱粉酶「對不上」。"}, {"t": "酵素的主要成分是蛋白質", "page": 71, "html": "<p>大部分酵素的主要成分是<span class='k'>蛋白質<\/span>。所以凡是會影響蛋白質的因素——例如<b>溫度<\/b>、<b>酸鹼值<\/b>——都可能改變酵素的<b>活性<\/b>（反應快慢）。<\/p><p>🔴 「澱粉酶」的名字說的是它分解澱粉，<b>不是<\/b>它由澱粉組成。<\/p>"}, {"t": "溫度與酵素活性", "page": 71, "html": "<p>在一定範圍內，活性隨溫度升高而增加，到<b>最適溫度<\/b>最高；溫度過高，活性降低甚至失去活性。<\/p><p>課本章末強調：溫度過高會<b>破壞蛋白質構造，酵素會永久失去活性<\/b>。（p.86）<\/p><p>實驗 2-2 延伸（本氏液加熱後）：煮沸組<b>藍色<\/b>、低溫組<b>藍綠色<\/b>、37℃ 組<b>黃色<\/b>。（p.75）<\/p>", "think": "食物放冰箱比較不容易壞，為什麼？", "hint": "低溫會降低微生物體內酵素的活性，分解食物的速度變慢；但不是完全停止，所以冷藏太久還是會壞。"}, {"t": "酸鹼值與酵素活性", "page": 71, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>酵素在哪裡<\/th><th>最適合的環境<\/th><\/tr><tr><td>胃<\/td><td><b>酸性<\/b><\/td><\/tr><tr><td>唾液（口腔）<\/td><td>接近<b>中性<\/b><\/td><\/tr><tr><td>小腸<\/td><td><b>鹼性<\/b><\/td><\/tr><\/table><\/div><p>酸鹼值超過可以忍受的範圍，酵素可能降低或失去活性。課本例 1：唾液先加醋（酸性）再加澱粉液，本氏液結果是<b>藍色<\/b>；加水的對照組是<b>橘紅色<\/b>。（p.75）<\/p>", "think": "唾液澱粉酶跟著食物進到胃裡，還能分解澱粉嗎？", "hint": "胃是酸性環境，唾液酵素適合接近中性，到了胃裡活性會大幅降低。"}, {"t": "實驗 2-2：唾液讓米飯變甜", "page": 72, "html": "<p>假說：唾液能讓澱粉產生有甜味的小分子醣類。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>組別<\/th><th>加入<\/th><th>本氏液加熱後<\/th><th>推論<\/th><\/tr><tr><td>實驗組<\/td><td>唾液＋澱粉液<\/td><td>黃色<\/td><td>出現小分子醣類<\/td><\/tr><tr><td>對照組<\/td><td>水＋澱粉液<\/td><td>藍色<\/td><td>沒有小分子醣類<\/td><\/tr><\/table><\/div><p>為什麼要放在 <b>37℃<\/b> 溫水 10 分鐘？因為唾液來自人體，要模擬唾液所在的環境（體溫）。（p.89）<\/p><p>操作變因：是否加唾液；控制變因：澱粉液濃度與體積、溫度、反應時間等。<\/p>"}]}, {"id": "2-3", "title": "植物如何製造養分", "icon": "🌿", "color": "#22a35a", "sim": "photo", "cards": [{"t": "葉的構造", "page": 76, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>構造<\/th><th>功能<\/th><\/tr><tr><td>角質層<\/td><td>避免水分過度散失<\/td><\/tr><tr><td>上、下表皮<\/td><td>保護葉片（透明無色、排列緊密）<\/td><\/tr><tr><td><b>葉肉<\/b><\/td><td>含大量葉綠體，<b>主要行光合作用<\/b>的場所<\/td><\/tr><tr><td>葉脈<\/td><td>運輸水分和養分<\/td><\/tr><tr><td><b>氣孔<\/b><\/td><td>氣體進出的主要通道<\/td><\/tr><tr><td><b>保衛細胞<\/b><\/td><td>半月形、兩兩成對，調整氣孔開合；含葉綠體<\/td><\/tr><\/table><\/div>"}, {"t": "光合作用", "page": 78, "html": "<p>葉綠體中的<span class='k'>葉綠素<\/span>吸收光能，配合酵素作用，把水和二氧化碳變成氧氣、葡萄糖和水：<\/p><p style='text-align:center;font-weight:800;font-size:1.1em'>水＋二氧化碳 ──(光、葉綠體)──▶ 氧氣＋葡萄糖＋水<\/p><p>光合作用把<b>光能儲存在葡萄糖<\/b>中。<\/p>", "think": "反應式左右兩邊都有水，那水算原料還是產物？", "hint": "兩者都是：水是原料（由根吸收），反應過程中也會產生水。考題常問「原料」，答案要包含水和二氧化碳。"}, {"t": "原料從哪來？產物去哪裡？", "page": 87, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th><\/th><th>物質<\/th><th>來源／去處<\/th><\/tr><tr><td>原料<\/td><td>水<\/td><td>主要由<b>根<\/b>吸收<\/td><\/tr><tr><td>原料<\/td><td>二氧化碳<\/td><td>主要由<b>氣孔<\/b>進入<\/td><\/tr><tr><td>產物<\/td><td>葡萄糖<\/td><td>直接利用、形成纖維素，或轉換成<b>澱粉<\/b>等儲存<\/td><\/tr><tr><td>產物<\/td><td>氧氣<\/td><td>過多的氧氣釋放到空氣中<\/td><\/tr><\/table><\/div>"}, {"t": "實驗 2-3：照光才能製造養分", "page": 79, "html": "<p>假說：照光是植物進行光合作用的必要條件之一。<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>步驟<\/th><th>目的<\/th><\/tr><tr><td>活動前 3～5 天用鋁箔包住葉片中段<\/td><td>遮光，並<b>消耗<\/b>該部位原本的澱粉<\/td><\/tr><tr><td>葉片放入水中加熱<\/td><td>軟化葉片（角質層會阻擋碘液）<\/td><\/tr><tr><td>改放酒精中<b>隔水加熱<\/b><\/td><td>溶出葉綠素（酒精變綠）；隔水加熱避免酒精燃燒<\/td><\/tr><tr><td>放回熱水漂洗<\/td><td>洗去色素與酒精<\/td><\/tr><tr><td>滴碘液<\/td><td>檢測是否含澱粉<\/td><\/tr><\/table><\/div><p>結果：照光部位<b>藍黑色<\/b>（有澱粉），包鋁箔部位<b>黃褐色<\/b>（沒有澱粉）。<\/p>", "think": "為什麼要 3～5 天前包鋁箔，而不是 3～5 小時前？", "hint": "要讓被包住的部位有足夠時間把原本存著的澱粉用完；如果時間太短，原有的澱粉還在，就看不出是不是照光造成的。"}, {"t": "延伸：需要綠色構造（葉綠體）", "page": 81, "html": "<p>用有綠色、也有非綠色部分的<b>彩葉草<\/b>葉片做同樣的流程：滴碘液後<b>綠色部分呈藍黑色<\/b>。<\/p><p>結論：綠色構造（葉綠體）是光合作用的必要條件之一。<\/p><p>例 2：想驗證「吸收二氧化碳」會影響製造澱粉，可以用<b>油脂塗抹整個葉片<\/b>隔絕氣體進出當實驗組。<\/p>"}, {"t": "光合作用 vs 澱粉檢測", "page": 89, "html": "<p>碘液測的是<b>澱粉<\/b>，不是葡萄糖。光合作用產生的葡萄糖大量產生後會轉換成澱粉儲存，所以「照光部位有澱粉」可以<b>間接<\/b>推論光合作用有進行。<\/p>"}]}, {"id": "2-4", "title": "人體如何獲得養分", "icon": "🫃", "color": "#2f80ed", "sim": "digest", "cards": [{"t": "消化作用：大分子變小分子", "page": 82, "html": "<p>食物中的大分子養分在體內分解為小分子的過程叫<span class='k'>消化作用<\/span>：<\/p><div class=\"tblwrap\"><table class=\"tbl\"><tr><th>大分子<\/th><th>→ 小分子<\/th><\/tr><tr><td>澱粉<\/td><td>葡萄糖<\/td><\/tr><tr><td>蛋白質<\/td><td>胺基酸<\/td><\/tr><tr><td>（部分）脂質<\/td><td>甘油與脂肪酸<\/td><\/tr><\/table><\/div>"}, {"t": "消化系統＝消化道＋消化腺", "page": 82, "html": "<p><b>消化道<\/b>（食物走的路）：口腔 → 咽 → 食道 → 胃 → 小腸 → 大腸 → 肛門。管壁肌肉會<b>蠕動<\/b>推送食物。<\/p><p><b>消化腺<\/b>（分泌消化液）：唾腺、胃腺、腸腺、肝臟、胰臟。多數消化液含酵素。<\/p>", "think": "食物會經過肝臟和胰臟嗎？", "hint": "不會。肝臟、胰臟是消化腺，不在食物通過的消化道上；它們分泌的膽汁、胰液經由管道注入小腸。"}, {"t": "口腔、咽、食道", "page": 82, "html": "<ul><li><b>口腔<\/b>：牙齒切斷、磨碎食物；舌頭攪拌讓食物和<b>唾液<\/b>混合；唾液的酵素讓<b>澱粉初步分解<\/b>。<\/li><li><b>咽<\/b>：吞嚥時控制食物進入食道。<\/li><li><b>食道<\/b>：<b>不分泌消化液<\/b>，靠管壁肌肉收縮把食物推到胃。<\/li><\/ul>"}, {"t": "胃", "page": 82, "html": "<p>囊袋狀，可暫時貯存食物；蠕動讓食物和<b>胃液<\/b>充分混合。<\/p><ul><li>胃液含<b>酵素<\/b>：初步分解<b>蛋白質<\/b>。<\/li><li>胃液含<b>鹽酸<\/b>：殺死部分細菌，並促進胃中酵素的分解作用（胃中酵素適合酸性）。<\/li><\/ul><p>胃還分泌黏液與鹼性物質形成<b>胃黏膜層<\/b>，所以不會被自己的鹽酸腐蝕。（p.90）<\/p>"}, {"t": "小腸：消化與吸收的主角", "page": 84, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>消化液<\/th><th>來自<\/th><th>作用<\/th><\/tr><tr><td><b>膽汁<\/b><\/td><td>肝臟分泌、<b>膽囊<\/b>儲存<\/td><td><b>不含酵素<\/b>，乳化脂質，加快脂質分解<\/td><\/tr><tr><td><b>胰液<\/b><\/td><td>胰臟<\/td><td>分解醣類、蛋白質、脂質<\/td><\/tr><tr><td><b>腸液<\/b><\/td><td>腸腺<\/td><td>分解醣類、蛋白質<\/td><\/tr><\/table><\/div><p>三種消化液都是<b>鹼性<\/b>，能中和胃酸、促進小腸酵素活性。<\/p>", "think": "膽汁沒有酵素，算是消化液嗎？它怎麼幫忙消化？", "hint": "算。膽汁把大油滴乳化成小油滴，增加和酵素接觸的面積，讓脂質分解得更快——它幫忙，但自己不分解。"}, {"t": "絨毛：增加吸收面積", "page": 84, "html": "<p>小腸是<b>吸收水分和養分的主要部位<\/b>。內壁皺褶上有許多指狀小突起叫<span class='k'>絨毛<\/span>，可以增加吸收的表面積；吸收的小分子養分由<b>血液<\/b>運送到全身。<\/p>"}, {"t": "大腸與排遺", "page": 84, "html": "<p>沒被消化吸收的殘渣進入<b>大腸<\/b>（比小腸粗短），繼續吸收<b>水分與礦物質<\/b>。剩下的殘渣和水、剝落的腸壁細胞、腸內細菌混合成糞便，由肛門排出，叫做<span class='k'>排遺<\/span>。<\/p><p>能和人體共生互利的腸道菌叫<b>益生菌<\/b>，可協助合成部分維生素或胺基酸。（p.85）<\/p>"}, {"t": "消化總整理", "page": 87, "html": "<div class=\"tblwrap\"><table class=\"tbl\"><tr><th>消化道<\/th><th>消化液<\/th><th>酸鹼<\/th><th>作用<\/th><\/tr><tr><td>口腔<\/td><td>唾液<\/td><td>中性<\/td><td>分解澱粉<\/td><\/tr><tr><td>胃<\/td><td>胃液<\/td><td>酸性<\/td><td>分解蛋白質<\/td><\/tr><tr><td>小腸<\/td><td>膽汁<\/td><td>鹼性<\/td><td>乳化脂質<\/td><\/tr><tr><td>小腸<\/td><td>胰液<\/td><td>鹼性<\/td><td>分解醣類、蛋白質、脂質<\/td><\/tr><tr><td>小腸<\/td><td>腸液<\/td><td>鹼性<\/td><td>分解醣類、蛋白質<\/td><\/tr><tr><td>大腸<\/td><td>—<\/td><td>—<\/td><td>吸收剩餘水分<\/td><\/tr><\/table><\/div>"}]}], "qs": [{"id": "p_21_01", "src": "practice", "sec": "2-1", "concept": "能產生能量的養分", "q": "下列哪一組養分都能為人體產生能量？", "opts": ["醣類、蛋白質、脂質", "醣類、維生素、水", "蛋白質、礦物質、脂質", "維生素、礦物質、水"], "ans": 0, "ex": "能產生能量的是醣類、蛋白質、脂質；礦物質、維生素、水雖然重要，但不能產生能量。", "fig": ""}, {"id": "p_21_02", "src": "practice", "sec": "2-1", "concept": "熱量計算", "q": "1 公克的哪一種養分可以產生最多熱量？", "opts": ["醣類", "蛋白質", "脂質", "維生素"], "ans": 2, "ex": "1 公克脂質約 9 大卡，醣類和蛋白質各約 4 大卡，維生素 0 大卡。", "fig": ""}, {"id": "p_21_03", "src": "practice", "sec": "2-1", "concept": "熱量計算", "q": "某食物含醣類 10 公克、蛋白質 5 公克、脂質 2 公克，約可產生多少大卡？", "opts": ["17 大卡", "68 大卡", "78 大卡", "153 大卡"], "ans": 2, "ex": "醣類和蛋白質每公克 4 大卡、脂質 9 大卡：10×4＋5×4＋2×9＝40＋20＋18＝78 大卡。17 是只把公克數相加，忘了乘上熱量。", "fig": ""}, {"id": "p_21_04", "src": "practice", "sec": "2-1", "concept": "碘液檢測", "q": "在米飯上滴碘液，最可能出現什麼顏色？", "opts": ["淺藍色", "黃褐色", "藍黑色", "橘紅色"], "ans": 2, "ex": "米飯含澱粉，碘液遇澱粉會由黃褐色變成藍黑色（或紫紅色）。", "fig": ""}, {"id": "p_21_05", "src": "practice", "sec": "2-1", "concept": "本氏液檢測", "q": "用本氏液檢測葡萄糖時，下列哪一個步驟是必要的？", "opts": ["先用酒精脫色", "隔水加熱", "放入冰水中", "加入碘液"], "ans": 1, "ex": "本氏液要加熱才會反應；用隔水加熱讓試管均勻受熱，含葡萄糖就會由淺藍色變成綠、黃、橙、紅。", "fig": ""}, {"id": "p_21_06", "src": "practice", "sec": "2-1", "concept": "本氏液只測小分子醣類", "q": "把澱粉液加入本氏液後隔水加熱，結果最可能是？", "opts": ["變成橘紅色，因為澱粉是醣類", "維持淺藍色，因為澱粉是大分子醣類", "變成藍黑色，因為含有澱粉", "變成黃褐色，因為沒有葡萄糖"], "ans": 1, "ex": "本氏液只和葡萄糖、麥芽糖這類小分子醣類反應；澱粉是大分子醣類，不會讓本氏液變色。藍黑色是碘液遇澱粉的顏色。", "fig": ""}, {"id": "p_21_07", "src": "practice", "sec": "2-1", "concept": "對照組的意義", "q": "糖分測定實驗中，試管 A 放「本氏液＋水」，它的目的是什麼？", "opts": ["讓實驗更快完成", "當作對照組，確認讓本氏液變色的不是水", "測試水裡有沒有澱粉", "讓本氏液變得更藍"], "ans": 1, "ex": "「本氏液＋水」是對照組，和加了食物的試管比較，才能確定變色是葡萄糖造成的。", "fig": ""}, {"id": "p_21_08", "src": "practice", "sec": "2-1", "concept": "纖維素", "q": "關於纖維素，下列敘述何者正確？", "opts": ["屬於蛋白質", "人體可以直接分解它產生能量", "組成植物細胞的細胞壁，適量攝取可促進腸胃蠕動", "只存在於肉類中"], "ans": 2, "ex": "纖維素是醣類的一種，組成植物細胞壁；人體不能直接分解它來產生能量，但能幫助腸胃蠕動。", "fig": ""}, {"id": "p_21_09", "src": "practice", "sec": "2-1", "concept": "養分的功能", "q": "下列配對何者正確？", "opts": ["鈣：影響紅血球的製造", "鐵：骨骼和牙齒的重要成分", "蛋白質：肌肉與頭髮的主要成分", "維生素 C：組成細胞壁"], "ans": 2, "ex": "鈣是骨骼牙齒的成分、鐵影響紅血球、維生素 C 增加復原力和抵抗力；蛋白質是肌肉與頭髮的主要成分。", "fig": ""}, {"id": "p_21_10", "src": "practice", "sec": "2-1", "concept": "碘液與本氏液", "q": "蘋果果肉用碘液檢測呈黃褐色，用本氏液加熱後呈橘紅色，代表蘋果果肉？", "opts": ["有澱粉、有葡萄糖", "有澱粉、沒有葡萄糖", "沒有澱粉、有小分子醣類", "沒有澱粉、也沒有醣類"], "ans": 2, "ex": "碘液沒變色（黃褐）＝沒有澱粉；本氏液變橘紅＝有葡萄糖等小分子醣類。", "fig": ""}, {"id": "p_22_01", "src": "practice", "sec": "2-2", "concept": "酵素的主要成分", "q": "唾液中的澱粉酶，主要成分是什麼？", "opts": ["澱粉", "葡萄糖", "蛋白質", "脂質"], "ans": 2, "ex": "大部分酵素的主要成分是蛋白質。「澱粉酶」是指它分解澱粉，不是由澱粉組成。", "fig": ""}, {"id": "p_22_02", "src": "practice", "sec": "2-2", "concept": "專一性", "q": "唾液澱粉酶可以分解澱粉，卻不能分解纖維素，這說明酵素具有什麼特性？", "opts": ["可重複使用", "專一性", "會被消耗", "只在低溫作用"], "ans": 1, "ex": "酵素只能和特定的受質結合作用，這叫專一性。", "fig": ""}, {"id": "p_22_03", "src": "practice", "sec": "2-2", "concept": "分解與合成", "q": "下列哪一個屬於「合成作用」？", "opts": ["澱粉變成葡萄糖", "蛋白質變成胺基酸", "許多葡萄糖結合成澱粉", "脂質變成甘油和脂肪酸"], "ans": 2, "ex": "合成作用是小分子結合成大分子；其他三個選項都是大分子變小分子的分解作用。", "fig": ""}, {"id": "p_22_04", "src": "practice", "sec": "2-2", "concept": "酵素可重複使用", "q": "在溫度、酸鹼性都不變的情況下，酵素反應完一次之後會怎樣？", "opts": ["被分解掉", "變成產物", "還能再和新的受質作用", "變成受質"], "ans": 2, "ex": "酵素促進反應但本身不會被用掉，條件不變時可以重複使用。", "fig": ""}, {"id": "p_22_05", "src": "practice", "sec": "2-2", "concept": "溫度影響酵素", "q": "實驗中把唾液先煮沸 10 分鐘，再加入澱粉液，最後以本氏液檢測，結果最可能是？", "opts": ["黃色，澱粉被分解了", "藍色，澱粉沒有被分解", "藍黑色，有葡萄糖", "紅色，有很多澱粉"], "ans": 1, "ex": "高溫會破壞酵素的蛋白質構造使它失去活性，澱粉沒被分解，本氏液維持藍色。（課本 p.75）", "fig": ""}, {"id": "p_22_06", "src": "practice", "sec": "2-2", "concept": "實驗設計：37℃", "q": "實驗 2-2 為什麼要把唾液和澱粉液放在 37℃ 的溫水中？", "opts": ["讓澱粉溶化", "模擬唾液在人體內的溫度環境", "殺死唾液中的細菌", "讓本氏液變色"], "ans": 1, "ex": "唾液來自人體，人體溫度約 37℃，放在 37℃ 是模擬唾液原本作用的環境。", "fig": ""}, {"id": "p_22_07", "src": "practice", "sec": "2-2", "concept": "酸鹼值影響酵素", "q": "胃中的酵素在哪一種環境下活性最好？", "opts": ["酸性", "中性", "鹼性", "任何環境都一樣"], "ans": 0, "ex": "胃中的酵素適合酸性環境；唾液酵素接近中性；小腸酵素適合鹼性。", "fig": ""}, {"id": "p_22_08", "src": "practice", "sec": "2-2", "concept": "變因判斷", "q": "小玲把唾液加醋（實驗組）或加水（對照組），再加澱粉液反應。這個實驗的操作變因是什麼？", "opts": ["澱粉液的體積", "反應的溫度", "唾液所處環境是否為酸性", "本氏液的用量"], "ans": 2, "ex": "兩組只差在加醋（酸性）或加水，所以操作變因是酸鹼環境；其餘都要保持相同（控制變因）。", "fig": ""}, {"id": "p_22_09", "src": "practice", "sec": "2-2", "concept": "米飯嚼久變甜", "q": "米飯咀嚼久了會有甜味，主要原因是？", "opts": ["牙齒把米飯磨成糖", "唾液中的酵素把澱粉分解成有甜味的小分子醣類", "胃液流到口腔", "米飯遇到空氣變甜"], "ans": 1, "ex": "唾液澱粉酶把沒甜味的澱粉分解成有甜味的小分子醣類（例如麥芽糖）。", "fig": ""}, {"id": "p_22_10", "src": "practice", "sec": "2-2", "concept": "溫度與活性曲線", "q": "關於一般酵素活性和溫度的關係，何者正確？", "opts": ["溫度越高活性一定越高", "在最適溫度活性最高，溫度過高會失去活性", "溫度越低活性越高", "溫度不會影響酵素"], "ans": 1, "ex": "一定範圍內溫度升高活性增加，到最適溫度最高；溫度過高會破壞蛋白質構造，使酵素永久失去活性。", "fig": ""}, {"id": "p_23_01", "src": "practice", "sec": "2-3", "concept": "葉的構造", "q": "葉片中主要進行光合作用的部位是？", "opts": ["表皮", "葉肉", "葉脈", "角質層"], "ans": 1, "ex": "葉肉細胞含大量葉綠體，是光合作用的主要場所。", "fig": ""}, {"id": "p_23_02", "src": "practice", "sec": "2-3", "concept": "氣孔與保衛細胞", "q": "調整氣孔開合的是什麼構造？", "opts": ["表皮細胞", "葉脈", "保衛細胞", "角質層"], "ans": 2, "ex": "兩個半月形的保衛細胞成對排列，中間就是氣孔，由保衛細胞調整開合。", "fig": ""}, {"id": "p_23_03", "src": "practice", "sec": "2-3", "concept": "光合作用的原料", "q": "光合作用的原料是？", "opts": ["氧氣和葡萄糖", "水和二氧化碳", "氧氣和水", "葡萄糖和二氧化碳"], "ans": 1, "ex": "水＋二氧化碳 →(光、葉綠體)→ 氧氣＋葡萄糖＋水。原料是水和二氧化碳。", "fig": ""}, {"id": "p_23_04", "src": "practice", "sec": "2-3", "concept": "原料來源", "q": "光合作用需要的二氧化碳主要從哪裡進入植物？", "opts": ["根", "氣孔", "葉脈", "花"], "ans": 1, "ex": "二氧化碳主要由氣孔進入；水主要由根吸收。", "fig": ""}, {"id": "p_23_05", "src": "practice", "sec": "2-3", "concept": "能量轉換", "q": "光合作用把光能儲存在哪一種物質中？", "opts": ["氧氣", "水", "葡萄糖", "二氧化碳"], "ans": 2, "ex": "光合作用把光能儲存在葡萄糖中，葡萄糖可再轉換成澱粉等養分。", "fig": ""}, {"id": "p_23_06", "src": "practice", "sec": "2-3", "concept": "脫色步驟", "q": "實驗 2-3 中，把葉片放入酒精隔水加熱的目的是？", "opts": ["軟化葉片", "溶出葉綠素", "檢測澱粉", "殺死細菌"], "ans": 1, "ex": "酒精可以溶出葉綠素（酒精會變綠），葉片變淡後滴碘液才看得清楚顏色變化；隔水加熱是避免酒精燃燒。", "fig": ""}, {"id": "p_23_07", "src": "practice", "sec": "2-3", "concept": "實驗結果判讀", "q": "葉片中段包鋁箔照光幾天後做碘液檢測，包鋁箔的部位呈什麼顏色？", "opts": ["藍黑色", "黃褐色", "綠色", "橘紅色"], "ans": 1, "ex": "包鋁箔處沒照光、不能行光合作用，原有的澱粉也已消耗，沒有澱粉所以維持碘液的黃褐色。", "fig": ""}, {"id": "p_23_08", "src": "practice", "sec": "2-3", "concept": "鋁箔要提早包", "q": "為什麼要在實驗前 3～5 天就包上鋁箔？", "opts": ["讓葉片長大", "讓被包住部位原本的澱粉消耗掉", "讓鋁箔黏緊", "讓葉綠素增加"], "ans": 1, "ex": "時間夠長，被遮光的部位才會把原有澱粉用完，結果才能證明澱粉是照光後才產生的。", "fig": ""}, {"id": "p_23_09", "src": "practice", "sec": "2-3", "concept": "葉綠體是必要條件", "q": "用彩葉草（有綠色和紫紅色部分）做照光後碘液檢測，結果哪裡呈藍黑色？", "opts": ["整片葉子", "只有綠色部分", "只有紫紅色部分", "都不會變色"], "ans": 1, "ex": "只有含葉綠體的綠色部分能行光合作用、產生澱粉，所以綠色部分呈藍黑色。", "fig": ""}, {"id": "p_23_10", "src": "practice", "sec": "2-3", "concept": "實驗設計", "q": "想驗證「二氧化碳」是光合作用需要的，下列哪一種處理最適合當實驗組？", "opts": ["用鋁箔包住整片葉子", "用油脂塗滿整片葉子表面", "把葉子泡在酒精裡", "多澆水"], "ans": 1, "ex": "油脂能隔絕氣體進出葉子（二氧化碳進不來），其他條件和對照組相同，才能看出二氧化碳的影響（課本例 2）。", "fig": ""}, {"id": "p_24_01", "src": "practice", "sec": "2-4", "concept": "消化道順序", "q": "食物通過消化道的正確順序是？", "opts": ["口腔→食道→咽→胃→大腸→小腸→肛門", "口腔→咽→食道→胃→小腸→大腸→肛門", "口腔→咽→胃→食道→小腸→大腸→肛門", "口腔→咽→食道→小腸→胃→大腸→肛門"], "ans": 1, "ex": "口腔→咽→食道→胃→小腸→大腸→肛門。", "fig": ""}, {"id": "p_24_02", "src": "practice", "sec": "2-4", "concept": "消化腺", "q": "下列哪一個是消化腺，食物不會經過？", "opts": ["胃", "小腸", "胰臟", "食道"], "ans": 2, "ex": "胰臟是消化腺，分泌胰液經管道注入小腸；胃、小腸、食道是消化道。", "fig": ""}, {"id": "p_24_03", "src": "practice", "sec": "2-4", "concept": "膽汁", "q": "關於膽汁，下列何者正確？", "opts": ["由膽囊製造", "含有分解脂質的酵素", "不含酵素，能乳化脂質", "是酸性的"], "ans": 2, "ex": "膽汁由肝臟分泌、儲存在膽囊；不含酵素，但能乳化脂質，加快脂質分解；是鹼性。", "fig": ""}, {"id": "p_24_04", "src": "practice", "sec": "2-4", "concept": "胃的功能", "q": "胃液中的酵素主要初步分解哪一種養分？", "opts": ["澱粉", "蛋白質", "脂質", "纖維素"], "ans": 1, "ex": "口腔初步分解澱粉，胃初步分解蛋白質。", "fig": ""}, {"id": "p_24_05", "src": "practice", "sec": "2-4", "concept": "胃中的鹽酸", "q": "胃液中鹽酸的功能是什麼？", "opts": ["分解澱粉", "乳化脂質", "殺死部分細菌並促進胃中酵素作用", "吸收養分"], "ans": 2, "ex": "鹽酸讓胃呈酸性，可殺死部分細菌，也讓適合酸性的胃中酵素作用更好。", "fig": ""}, {"id": "p_24_06", "src": "practice", "sec": "2-4", "concept": "小腸吸收", "q": "小腸內壁的絨毛有什麼功用？", "opts": ["分泌膽汁", "增加吸收養分的表面積", "磨碎食物", "儲存糞便"], "ans": 1, "ex": "絨毛是小腸內壁皺褶上的指狀突起，增加表面積，幫助吸收養分。", "fig": ""}, {"id": "p_24_07", "src": "practice", "sec": "2-4", "concept": "消化產物", "q": "蛋白質完全消化後會變成什麼？", "opts": ["葡萄糖", "胺基酸", "甘油", "脂肪酸"], "ans": 1, "ex": "澱粉→葡萄糖；蛋白質→胺基酸；脂質→甘油與脂肪酸。", "fig": ""}, {"id": "p_24_08", "src": "practice", "sec": "2-4", "concept": "胰液", "q": "哪一種消化液能分解醣類、蛋白質和脂質三大類養分？", "opts": ["唾液", "胃液", "膽汁", "胰液"], "ans": 3, "ex": "胰液含多種酵素，能分解醣類、蛋白質、脂質；腸液分解醣類與蛋白質；膽汁不含酵素。", "fig": ""}, {"id": "p_24_09", "src": "practice", "sec": "2-4", "concept": "大腸", "q": "大腸的主要功能是？", "opts": ["分解蛋白質", "吸收水分和礦物質", "分泌胰液", "初步分解澱粉"], "ans": 1, "ex": "大腸繼續吸收殘渣中的水分與礦物質，剩下的形成糞便排出。", "fig": ""}, {"id": "p_24_10", "src": "practice", "sec": "2-4", "concept": "小腸消化液的酸鹼性", "q": "膽汁、胰液、腸液都是鹼性，這有什麼好處？", "opts": ["讓食物變甜", "中和胃液的酸性，促進小腸酵素活性", "殺死所有細菌", "讓澱粉變成蛋白質"], "ans": 1, "ex": "食物從胃帶著酸性進入小腸，鹼性消化液能中和它，讓適合鹼性的小腸酵素發揮作用。", "fig": ""}, {"id": "p_24_11", "src": "practice", "sec": "2-4", "concept": "食道", "q": "關於食道，下列敘述何者正確？", "opts": ["會分泌消化液分解澱粉", "靠管壁肌肉收縮把食物推送到胃", "是吸收養分的主要部位", "能乳化脂質"], "ans": 1, "ex": "食道不分泌消化液，靠肌肉收縮（蠕動）把食物推到胃。", "fig": ""}, {"id": "s112_1_q21", "src": "school", "sec": "2-1", "concept": "本氏液檢測", "q": "紹瑜買了「冬瓜茶」、「半糖烏龍茶」和「無糖綠茶」，分別將其放入試管中，再利用試劑檢測此三種飲料的含糖量，實驗後試管內液體的顏色如附表所示，下列敘述何者錯誤？", "ex": "本氏液要「隔水加熱」才會變色，所以(D)說不須加熱是錯的。顏色由淡藍→綠→黃→橙紅，糖越多越接近紅色，所以含糖量丙＞甲＞乙，淡藍色的乙就是無糖綠茶。", "fig": "fig/s112_1_q21.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["含糖量高低：丙＞甲＞乙", "飲料乙是無糖綠茶", "檢測所使用的試劑為本氏液", "檢測的過程不須加熱"], "ans": 3}, {"id": "s112_1_q22", "src": "school", "sec": "2-1", "concept": "碘液檢測澱粉", "q": "小文想知道白米飯中是否含有澱粉，該如何檢測，檢測後的變化應為？", "ex": "檢測澱粉要用碘液，澱粉遇碘液會變成藍黑色。本氏液是用來檢測葡萄糖等糖類的，不能拿來測澱粉；黃褐色是碘液原本的顏色，代表沒有澱粉。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["米飯滴加本氏液後靜置，會出現藍黑色變化", "米飯滴加碘液後靜置，會出現藍黑色變化", "米飯滴加本氏液後靜置，會出現黃褐色變化", "米飯滴加碘液後靜置，會出現黃褐色變化"], "ans": 1}, {"id": "s112_1_q43", "src": "school", "sec": "2-1", "concept": "食物熱量計算", "q": "超市的甜筒冰淇淋，一支200 公克，包裝上的營養標示如附表所示。吃完該冰淇淋可得到多少大卡的熱量？", "ex": "每公克醣類和蛋白質約提供4大卡、脂質約9大卡，鈉不提供熱量。每100公克熱量＝5×4＋25×9＋30×4＝365大卡，一支200公克要乘以2，所以是730大卡。常見錯誤是忘了乘2而選365。", "fig": "fig/s112_1_q43.webp", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["150 大卡", "365 大卡", "580 大卡", "730 大卡"], "ans": 3}, {"id": "s112_1_q44", "src": "school", "sec": "2-1", "concept": "能量來源養分", "q": "下列何者是生物體內能量的主要來源？", "ex": "醣類、蛋白質、脂質是可以提供能量的三大養分。維生素、礦物質和水雖然很重要，但都不能提供能量。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["脂質、醣類、礦物質", "蛋白質、脂質、維生素", "醣類、蛋白質、脂質", "維生素、礦物質、水"], "ans": 2}, {"id": "s112_1_q45", "src": "school", "sec": "2-1", "concept": "六大類營養素功能", "q": "以下關於6 大類營養素的敘述，何者錯誤？", "ex": "分布在皮下、可以保溫防止熱量散失的是脂質，不是蛋白質，所以(A)錯。蛋白質是構成肌肉、頭髮的主要成分；鈣和骨骼有關、鐵和造血有關、維生素A和眼睛有關。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蛋白質分佈在皮下，具有防止熱量散失的功能", "鈣可減緩骨質疏鬆症的發生，鐵質可以幫助造血", "肌肉與頭髮的主要成分是蛋白質", "維生素A 和眼睛保健有關"], "ans": 0}, {"id": "s112_1_q46", "src": "school", "sec": "2-1", "concept": "纖維素", "q": "植物細胞壁的主要成分為纖維素。蔬果的纖維素含量高，有益人體健康。下列有關纖維素的敘述，何者錯誤？", "ex": "纖維素是大分子醣類，但人體沒有分解纖維素的酵素，所以無法消化吸收，也就不能提供能量。它的好處是增加排便量、促進腸胃蠕動。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["屬於大分子醣類", "可增加排便量", "可促進腸胃蠕動", "可提供人體所需的能量"], "ans": 3}, {"id": "s112_1_q47", "src": "school", "sec": "2-1", "concept": "維生素C", "q": "檸檬營養價值高，有助於抗氧化、降低心血管疾病的發生率、促進傷口的癒合和預防壞血症的發生。請問檸檬有這麼多功效主要是因為富含何種養分？", "ex": "維生素C有抗氧化、幫助傷口癒合的作用，缺乏時會得壞血症，柑橘類水果如檸檬含量豐富。維生素A和眼睛有關，鈣和骨骼有關，鐵和造血有關。", "fig": "", "year": 112, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["維生素A", "鈣質", "維生素C", "鐵質"], "ans": 2}, {"id": "s112_2_q1", "src": "school", "sec": "2-2", "concept": "酵素特性", "q": "有關酵素的敘述，何者不正確？", "ex": "一種酵素可以反覆使用、在體外條件適合時也能作用。課本以唾液澱粉酶為例，它負責把澱粉分解，題目認定它不能合成澱粉，所以(C)不正確。記住：酵素有專一性，一種酵素只催化特定反應。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["酵素由活細胞產生", "生物體內的酵素可以反覆利用", "唾液中的澱粉酶能分解澱粉，也能合成澱粉", "唾液中的澱粉酶能在口腔中作用，也能在體外進行作用"], "ans": 2}, {"id": "s112_2_q2", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "派大星將吃剩的食物冰入冰箱中，請問此舉動主要的目的是？", "ex": "低溫會讓酵素活性變低，細菌生長和分解食物變慢，所以食物比較不容易壞。但低溫不會殺死細菌，也不會讓酵素永久失去活性，拿出來回溫後細菌又會繼續作用。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["冰箱可以殺死食物中的細菌", "放置於冰箱的食物可以永久保存", "冰箱可以讓細菌的酵素永久失去活性", "冰箱可以降低細菌的酵素活性"], "ans": 3}, {"id": "s112_2_q3", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "已知利用相同茶樹的葉片但不同的製作過程，可得綠茶及紅茶。茶葉中所含的酵素X 在超過70 ℃後，就無法再有催化能力。上圖為製作綠茶及紅茶時的四個步驟（依序由步驟I→II→III→IV）及其溫度調控示意圖，比較四個步驟中綠茶及紅茶的酵素X 之活性，下列何者最不合理？", "ex": "酵素X超過70℃就永久失去活性。綠茶在步驟I就被加熱超過70℃，之後酵素都沒有作用；紅茶到步驟III才超過70℃。所以步驟II結束時，綠茶的酵素已失效、紅茶的酵素還有活性，兩者不相等，(B)最不合理。", "fig": "fig/s112_2_q3.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["步驟I 結束時：綠茶＜紅茶", "步驟II 結束時：綠茶＝紅茶", "步驟III 結束時：綠茶＝紅茶", "步驟IV 結束時：綠茶＝紅茶"], "ans": 1}, {"id": "s112_2_q4", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "上圖為酵素Y 之活性與溫度的關係圖，酵素Y置於超過50 ℃的環境中，就無法再回復催化的能力。柯南在甲、乙、丙三支試管內都先裝入等量的澱粉液及酵素Y，再分別置於三種不同溫度的環境中，在進行實驗的第0、35、70分鐘時，分別從三支試管內各取出液體後，再用碘液檢測，其呈色結果如附表所示。已知柯南所使用的實驗溫度是10 ℃、30 ℃、55 ℃，則此三支試管最可能各置於何種溫度中？", "ex": "碘液變黃褐色代表澱粉被分解完了。酵素Y在30℃附近活性最高，所以最快變黃褐的甲是30℃；10℃活性較低、比較慢，是乙；55℃酵素已失去活性，澱粉一直沒被分解，是丙。", "fig": "fig/s112_2_q4.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲為10 ℃、乙為30 ℃、丙為55 ℃", "甲為30 ℃、乙為10 ℃、丙為55 ℃", "甲為55 ℃、乙為30 ℃、丙為10 ℃", "甲為55 ℃、乙為10 ℃、丙為30 ℃"], "ans": 1}, {"id": "s112_2_q5", "src": "school", "sec": "2-2", "concept": "唾液分解澱粉實驗", "q": "小明作「唾液對澱粉的影響實驗」，取四支試管甲乙丙丁，依上表處理方式，並放在37 度水浴20 分鐘後，各試管分別以2 mL 本氏液加熱檢驗，則溶液顏色變化最明顯的是哪一支試管？", "ex": "只有丁的新鮮唾液能在適合的溫度與酸鹼度下把澱粉分解成麥芽糖等糖類，加本氏液加熱後顏色變化最明顯。甲沒有唾液；乙的唾液煮沸過，酵素失去活性；丙加了鹽酸，酸鹼值不適合唾液澱粉酶作用。", "fig": "fig/s112_2_q5.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 3}, {"id": "s112_2_q6", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "取甲、乙、丙三支試管，先加入等量的物質X，再依序分別加入足量人體的唾液、胃液、胰液，並調整各試管的pH 值及溫度等條件，使其適合各消化液中的酵素作用。靜置足夠的反應時間後，結果三支試管內物質X 的含量皆沒有變化，推論物質X 最可能為何？", "ex": "唾液能分解澱粉，胃液能分解蛋白質，胰液能分解醣類、蛋白質和脂質。三種消化液都分解不了的是纖維素，因為人體沒有分解纖維素的酵素。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["纖維素", "脂質", "澱粉", "蛋白質"], "ans": 0}, {"id": "s112_2_q7", "src": "school", "sec": "2-2", "concept": "酵素本質是蛋白質", "q": "唾液中的甲物質可催化澱粉的分解，胃液中的乙物質則可催化蛋白質的分解，推測甲、乙兩物質本身的主要成分，下列何者最合理？", "ex": "唾液澱粉酶（甲）和胃蛋白酶（乙）都是酵素，而酵素的主要成分是蛋白質。不要把「酵素分解的對象」和「酵素本身的成分」搞混。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲、乙成分皆為澱粉", "甲、乙成分皆為蛋白質", "甲成分為澱粉，乙成分為蛋白質", "甲成分為葡萄糖，乙成分為胺基酸"], "ans": 1}, {"id": "s112_2_q8", "src": "school", "sec": "2-3", "concept": "光合作用原料與產物", "q": "有關光合作用的敘述何者錯誤？", "ex": "光合作用的原料是水和二氧化碳，產物是葡萄糖和氧氣（也會產生水）。葉綠體是進行光合作用的場所，陽光是提供能量的來源，兩者都不是原料，所以(D)錯。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水是原料也是產物", "氧氣、葡萄糖為產物", "二氧化碳、水為原料", "葉綠體、陽光也是原料"], "ans": 3}, {"id": "s112_2_q9", "src": "school", "sec": "2-3", "concept": "光合作用產生氧氣", "q": "小美發現將水缸的燈光打開一段時間後，水草會開始冒出氣泡，請問這些氣泡為何？", "ex": "水草照光後進行光合作用，會產生氧氣並釋放出來，就是看到的氣泡。常見錯誤是以為植物吐出二氧化碳。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["二氧化碳", "氮氣", "氧氣", "氫氣"], "ans": 2}, {"id": "s112_2_q10", "src": "school", "sec": "2-3", "concept": "光合作用與呼吸作用", "q": "承上題，燈光打開時水草會進行什麼作用？", "ex": "植物的細胞隨時都在進行呼吸作用，有光的時候還會同時進行光合作用。所以開燈時兩種作用同時進行，不是輪流進行。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["光合作用和呼吸作用同時進行", "光合作用和呼吸作用交替進行", "只有呼吸作用", "只有光合作用"], "ans": 0}, {"id": "s112_2_q11", "src": "school", "sec": "2-3", "concept": "光合作用條件", "q": "下列有關綠色植物進行光合作用的敘述，何者錯誤？", "ex": "光合作用是一連串化學反應，需要酵素參與；除了水和二氧化碳，還需要光能和葉綠素，所以(D)錯。電燈的光也能提供光能，夜晚開燈植物仍可行光合作用。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["有牽涉能量的轉換", "夜晚可以打開電燈取代陽光提供能量", "葉綠素能吸收光能", "只需要水分和二氣化碳、不需要酵素"], "ans": 3}, {"id": "s112_2_q12", "src": "school", "sec": "2-3", "concept": "光合作用產物去向", "q": "光合作用可以產生具有能量的物質，關於此物質的敘述，下列何者錯誤？", "ex": "光合作用製造的葡萄糖是在葉綠體中產生的，不是粒線體；粒線體是分解養分產生能量的地方。葡萄糖可以轉換成澱粉儲存，或轉換成纖維素、蛋白質、脂質等物質。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["植物可將此物轉換成澱粉來儲存", "植物可將此物轉換成纖維素", "植物可將此物轉換成蛋白質、脂質等物質", "此具有能量的物質是在粒線體產生"], "ans": 3}, {"id": "s112_2_q13", "src": "school", "sec": "2-3", "concept": "光合作用變因實驗步驟", "q": "(甲)滴加本氏液；(乙)滴加碘液；(丙)在酒精中隔水加熱；(丁)在熱水中漂洗；(戊)以鋁箔包裹葉片；(己)在沸水中加熱。右圖為「光合作用變因的探討」的實驗裝置，請問正確順序為何？", "ex": "先用鋁箔遮住部分葉片照光，摘下後放沸水中加熱，再用酒精隔水加熱去除葉綠素，接著放熱水漂洗，最後滴碘液檢測澱粉。測澱粉要用碘液，不是本氏液。", "fig": "fig/s112_2_q13.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["戊己丙丁乙", "戊己丙丁甲", "戊丁己丙甲", "戊丁己丙乙"], "ans": 0}, {"id": "s112_2_q14", "src": "school", "sec": "2-3", "concept": "光合作用需要葉綠素", "q": "摘一片生於曠野的彩葉草葉子，把葉子上綠色部分和非綠色部分分別作記號，經實驗結果發現只有綠色部分有澱粉的存在，這是證明光合作用與哪一因素有關？", "ex": "彩葉草葉片綠色部分含葉綠素、非綠色部分沒有，兩部分都照到光，只有綠色部分有澱粉，說明光合作用需要葉綠素。比較時，兩組只差在有沒有葉綠素這個變因。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["水", "葉綠素", "光", "二氧化碳"], "ans": 1}, {"id": "s112_2_q15", "src": "school", "sec": "2-3", "concept": "氣孔功能", "q": "以下有關氣孔功能的敘述，何者錯誤？", "ex": "氣孔是氣體進出葉片的通道，可以進出二氧化碳、氧氣和水蒸氣。植物吸收水分主要靠根，不是靠氣孔，所以(C)錯。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["吸收二氧化碳", "吸收氧", "吸收水分", "釋放氧"], "ans": 2}, {"id": "s112_2_q16", "src": "school", "sec": "2-4", "concept": "胃液分解蛋白質", "q": "已知胰島素是糖尿病患者的治療藥物之一，其成分是蛋白質。某些糖尿病患者以注射方式補充胰島素，卻不用口服，這是因為口服會造成胰島素被下列何者所含的物質分解？", "ex": "胰島素的成分是蛋白質，口服後會在胃中被胃液的酵素分解，失去作用，所以要用注射的。唾液只分解澱粉，膽汁不含酵素。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["胃液", "唾液", "血液", "膽汁"], "ans": 0}, {"id": "s112_2_q17", "src": "school", "sec": "2-4", "concept": "膽汁", "q": "下列關於膽汁的敘述，何者正確？", "ex": "膽汁由肝臟製造、儲存在膽囊，經由導管注入小腸。膽汁不含酵素，它的功能是把大油滴乳化成小油滴，幫助脂質消化。常見錯誤是以為膽汁由膽囊分泌。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["可以乳化脂質", "只含一種酵素", "由導管注入大腸作用", "由膽囊分泌"], "ans": 0}, {"id": "s112_2_q18", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "人體的消化液有：(甲)唾液；(乙)胃液；(丙)腸液；(丁)胰液；(戊)膽汁。其中與蛋白質分解有關的消化液有哪些？", "ex": "能分解蛋白質的消化液有胃液、腸液、胰液。唾液只分解澱粉，膽汁沒有酵素，所以答案是乙丙丁。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["只有甲乙丙丁", "只有乙丙丁", "只有丙丁戊", "只有乙丁"], "ans": 1}, {"id": "s112_2_q19", "src": "school", "sec": "2-4", "concept": "養分開始消化的位置", "q": "人體能消化的醣類、脂質與蛋白質，在消化道中「開始」分解的順序為何？", "ex": "醣類（澱粉）在口腔就開始被唾液分解，蛋白質在胃開始被分解，脂質要到小腸才開始被分解。所以開始分解的順序是醣類→蛋白質→脂質。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["脂質→醣類→蛋白質", "醣類→脂質→蛋白質", "醣類→蛋白質→脂質", "蛋白質→醣類→脂質"], "ans": 2}, {"id": "s112_2_q20", "src": "school", "sec": "2-1", "concept": "纖維素", "q": "醫療保健人員鼓勵人們多食用蔬菜補充纖維素，關於纖維素的敘述，何者不正確？", "ex": "人體無法消化纖維素，所以它不能提供熱量，(D)不正確。纖維素可以刺激腸胃蠕動、增加糞便體積。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "選項(B)「纖維素可以幫助消化吸收」也有爭議：纖維素本身不能被消化吸收，課本只說可促進腸胃蠕動、幫助排便。官方答案(D)無誤，但(B)的說法容易讓學生誤解。", "pas": "", "opts": ["纖維素可以刺激腸胃蠕動", "纖維素可以幫助消化吸收", "纖維素可以增加糞便的體積", "纖維素屬於醣類，可提供人體所需的熱量"], "ans": 3}, {"id": "s112_2_q21", "src": "school", "sec": "2-4", "concept": "消化腺", "q": "下列何者是消化腺？(甲)胰臟；(乙)膽囊；(丙)闌尾；(丁)肝臟。", "ex": "消化腺是能分泌消化液的器官，例如唾腺、胃腺、肝臟、胰臟、腸腺。膽囊只是儲存膽汁的地方，膽汁是肝臟製造的；闌尾也不分泌消化液。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲丁", "乙丁", "丙丁", "甲乙"], "ans": 0}, {"id": "s112_2_q22", "src": "school", "sec": "2-4", "concept": "消化作用的意義", "q": "人體的消化作用，需經過下列哪些步驟及順序？(甲)分泌消化液；(乙)大分子進入細胞；(丙)小分子進入細胞；(丁)食物分解。", "ex": "消化作用是先分泌消化液，把食物中的大分子分解成小分子，小分子才能被吸收進入細胞。大分子無法直接通過細胞膜，所以(乙)不會發生。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲→乙→丁", "甲→丁→乙", "甲→丁→丙", "乙→甲→丁"], "ans": 2}, {"id": "s112_2_q23", "src": "school", "sec": "2-4", "concept": "消化器官與消化液", "q": "下列有關消化作用的敘述，何者正確？", "ex": "胰臟分泌的胰液經導管送到小腸，幫助醣類、蛋白質、脂質的消化。唾液只能分解澱粉；胃中分解蛋白質主要靠胃液中的酵素，鹽酸是提供酸性環境；脂質在胃中不會被消化。", "fig": "", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["人類的唾液含有某種成分，可將蛋白質分解", "蛋白質在胃中被分解，主要是因胃液中鹽酸的作用，而非酵素作用", "胰臟分泌胰液經由導管進入小腸，協助食物的消化", "當脂質進入胃中，脂質也能被消化"], "ans": 2}, {"id": "s112_2_q24", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "關於人體的消化作用，何者正確？", "ex": "圖中丁是大腸，能吸收水分，剩下的殘渣形成糞便。胃（甲）主要不負責吸收；乙不是主要分解養分的器官；己（肛門）排出糞便叫「排遺」，不是排泄。", "fig": "fig/s112_2_q24.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "附圖是人體消化系統的示意圖，請根據附圖回答下列24.25題", "opts": ["蛋白質在「甲」中被吸收", "「丁」可吸收水分形成糞便", "很多養分可以在「乙」器官中被分解", "「己」是排泄器官"], "ans": 1}, {"id": "s112_2_q25", "src": "school", "sec": "2-4", "concept": "脂質的消化與吸收", "q": "酪梨是一種生長於熱帶的植物的果實，但在營養學來說它被歸類為油脂類，因為其豐富的脂肪含量。小美吃了一顆酪梨，請問其主要養分乳化、分解、吸收，依序是在右圖中哪些地方？", "ex": "酪梨的主要養分是脂質。脂質在小腸被膽汁乳化，再被胰液和腸液分解，最後也在小腸吸收，所以三個步驟都在丙（小腸）。常見錯誤是以為乳化在肝臟或膽囊進行。", "fig": "fig/s112_2_q24.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "附圖是人體消化系統的示意圖，請根據附圖回答下列24.25題", "opts": ["戊、乙、丙", "甲、乙、丙", "乙、丙、丁", "丙、丙、丙"], "ans": 3}, {"id": "s112_2_q44", "src": "school", "sec": "2-4", "concept": "小腸絨毛吸收", "q": "右圖為小腸絨毛模式圖，若此時小腸正在吸收養分，比較中圖中甲、乙二血管，下列敘述何者錯誤？（血管旁的箭頭表示血流方向）", "ex": "小腸絨毛增加吸收養分的表面積，像植物的根毛一樣。小腸吸收養分後，流出絨毛的乙血管養分比流入的甲血管多，二氧化碳也較多；但甲是把血液送進來的動脈端，血流比乙快，所以(C)錯。", "fig": "fig/s112_2_q44.webp", "year": 112, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["血液中葡萄糖等養分含量，甲血管＜乙血管", "血液中二氧化碳濃度，甲血管＜乙血管", "血液流速，甲血管＜乙血管", "此構造功能與植物根毛類似，可增加吸收表面積"], "ans": 2}, {"id": "s113_1_q47", "src": "school", "sec": "2-1", "concept": "食物熱量計算", "q": "魯夫吃了一個控肉便當，此便當含有：醣類150 公克、脂質20 公克、蛋白質50 公克，鈉、鈣、鉀各10 毫克，維生素C 200 毫克。請問：這個餐盒所含的熱量共有多少大卡？", "ex": "醣類和蛋白質每公克約4大卡，脂質每公克約9大卡；鈉、鈣、鉀和維生素C不提供熱量。150×4＋20×9＋50×4＝600＋180＋200＝980大卡。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["880", "980", "1230", "1130"], "ans": 1}, {"id": "s113_1_q48", "src": "school", "sec": "2-1", "concept": "食物中的養分", "q": "現代人注重飲食的品質，不只要吃飽，還要吃得好，下列有關食物中所含營養素的敘述，何者錯誤？", "ex": "肉類除了脂質，也含有豐富的蛋白質，說「只含有脂質」是錯的。米飯麵食主要提供澱粉，奶類豆類富含蛋白質，蔬果富含維生素與礦物質。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["三餐所吃的米飯或麵食主要是提供澱粉", "奶類、豆類食物含有豐富的蛋白質", "肉類只含有豐富的脂質", "蔬菜水果含有豐富的維生素和礦物質"], "ans": 2}, {"id": "s113_1_q49", "src": "school", "sec": "2-1", "concept": "碘液檢測澱粉", "q": "小文想知道白米飯中是否含有澱粉，該如何檢測？", "ex": "檢測澱粉直接滴碘液就可以，不需要加熱，變藍黑色就代表有澱粉。本氏液是檢測葡萄糖等糖類用的，而且要隔水加熱。", "fig": "", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["在白米飯滴加碘液即可", "將白米飯加本氏液後，隔水加熱", "將白米飯加本氏液即可", "在白米飯滴加碘液後，隔水加熱"], "ans": 0}, {"id": "s113_1_q50", "src": "school", "sec": "2-1", "concept": "本氏液檢測", "q": "紹瑜買了「正常甜珍珠奶綠」、「半糖烏龍茶」和「無糖四季春」，分別將其放入試管中，再利用試劑檢測此三種飲料的含糖量，實驗後試管內液體的顏色如附表所示，請依表選出錯誤的敘述為何？", "ex": "本氏液必須隔水加熱才會變色，所以(D)錯。藍色的甲幾乎沒有糖，是無糖四季春；黃色的乙是半糖烏龍茶；紅色的丙糖最多，是正常甜珍珠奶綠。", "fig": "fig/s113_1_q50.webp", "year": 113, "exam": 1, "ansSrc": "official", "warn": "", "pas": "", "opts": ["飲料甲的含糖量最低", "飲料乙是半糖烏龍茶", "飲料丙是珍珠奶綠", "檢測的過程不須加熱"], "ans": 3}, {"id": "s113_2_q1", "src": "school", "sec": "2-4", "concept": "消化腺", "q": "哪一個器官不具有消化腺？", "ex": "小腸有腸腺、肝臟和胰臟本身就是消化腺。課本說大腸不分泌消化液，只負責吸收水分和形成糞便，所以答案是大腸。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["小腸", "肝臟", "胰臟", "大腸。"], "ans": 3}, {"id": "s113_2_q2", "src": "school", "sec": "2-4", "concept": "消化液注入位置", "q": "消化液和其注入的消化器官的配對，何者正確？", "ex": "胰液和膽汁都經導管注入小腸；腸液由小腸的腸腺分泌，在小腸作用；唾液在口腔作用。只有(C)胰液→小腸正確。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["膽汁→胃", "腸液→大腸", "胰液→小腸", "唾液→食道。"], "ans": 2}, {"id": "s113_2_q3", "src": "school", "sec": "2-2", "concept": "酵素特性", "q": "下列有關酵素的敘述，何者正確？", "ex": "光合作用是一連串化學反應，需要酵素幫忙。酵素各有最適合的酸鹼值和溫度，不是越酸或越熱越好；葉綠素是吸收光能的色素，不是酵素。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["pH 值愈小，酵素的活性愈大", "葉綠素是一種酵素", "光合作用需要酵素促進反應進行", "溫度愈高，酵素的活性愈大。"], "ans": 2}, {"id": "s113_2_q4", "src": "school", "sec": "2-2", "concept": "合成與分解作用", "q": "附圖為人體某處的代謝作用，請問此作用為合成作用或分解作用？何者為受質？", "ex": "圖中乙反應前後都沒有改變，是酵素；甲是被作用的受質，被分成兩個丙，所以是分解作用。判斷酵素的訣竅：反應後形狀不變的就是酵素。", "fig": "fig/s113_2_q4.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["分解作用，甲", "合成作用，乙", "合成作用，丙", "分解作用，乙。"], "ans": 0}, {"id": "s113_2_q5", "src": "school", "sec": "2-2", "concept": "唾液分解澱粉", "q": "在試管內加入少許澱粉與足量唾液，並置於37℃溫水內一小時，使其完全作用後再加入碘液檢測，則反應結束後試管內的溶液顏色應為下列何者？", "ex": "唾液澱粉酶在37℃作用一小時，澱粉已完全被分解，所以加碘液不會變藍黑色，只會呈現碘液本身的黃褐色。橙紅色是本氏液遇大量糖類加熱後的顏色，不要搞混。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["橙紅色", "黃褐色", "淡藍色", "藍黑色。"], "ans": 1}, {"id": "s113_2_q6", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "下列有關酵素特性的敘述，何者正確?", "ex": "酵素遇高溫會失去活性，降溫也回不來。不同酵素最適溫度不同，不一定都是37℃；酵素也可以促進合成反應；酵素反應後不會被用掉，可以重複使用。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "選項(C)用「所有酵素」過於絕對（實際上少數酵素可耐高溫或可恢復），在國中課本層級可接受，官方答案無誤。", "pas": "", "opts": ["所有酵素在37℃時活性最大", "所有酵素只能作用於將大分子轉變成小分子的反應", "所有酵素遇高溫而失去活性後，再降溫亦無法再作用", "所有的酵素在反應結束後，就失去活性，無法再參與新的反應。"], "ans": 2}, {"id": "s113_2_q7", "src": "school", "sec": "2-2", "concept": "酵素專一性", "q": "下列有關酵素專一性的說明何者最適合?", "ex": "專一性是指一種酵素只能催化特定的反應，例如唾液澱粉酶只能分解澱粉、不能分解纖維素。(B)是在說酵素受酸鹼值影響，不是專一性。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["唾液中的澱粉酶只能在口腔中作用", "唾液中的澱粉酶只能在特定範圍的酸鹼值內反應", "唾液中的澱粉酶，只能在白天促進反應進行", "唾液中的澱粉酶只能分解澱粉，不能分解纖維素。"], "ans": 3}, {"id": "s113_2_q8", "src": "school", "sec": "2-3", "concept": "光合作用產物轉換", "q": "甘薯含有大量的澱粉，請問這些澱粉是植物在什麼地方、利用什麼作用的產物轉換而來的？", "ex": "甘薯（地瓜）的澱粉是葉片行光合作用製造葡萄糖後，運送到根部再轉換成澱粉儲存的。植物沒有消化作用，蒸散作用也不會製造養分。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["葉、光合作用", "葉、蒸散作用", "莖、光合作用", "葉、消化作用。"], "ans": 0}, {"id": "s113_2_q9", "src": "school", "sec": "2-3", "concept": "葉的構造", "q": "關於植物葉片的構造與功能之敘述，下列何者錯誤？", "ex": "葉的表皮細胞是無色透明的，沒有葉綠體；葉子看起來是綠色，是因為葉肉細胞和保衛細胞含有葉綠體。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["植物的氣孔是由兩個保衛細胞控制", "由葉片與葉柄構成，多呈綠色片狀", "表皮細胞含有葉綠體，所以葉子是綠色的", "葉肉組織是葉中主要行光合作用的場所。"], "ans": 2}, {"id": "s113_2_q10", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "下列有關消化作用的敘述，何者正確？", "ex": "小腸和大腸都能吸收水分。胃液不分解脂質；食物在胃中不必完全消化就會進入小腸；膽汁是肝臟製造的，膽囊只負責儲存。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["人類的胃液含有某種成分，可將脂質分解", "食物在胃中必須完全消化，才能進入小腸", "膽囊製造的膽汁能幫助脂肪消化", "小腸和大腸皆可吸收水分。"], "ans": 3}, {"id": "s113_2_q11", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "人體的消化液除了唾液外，與醣類分解有關的消化液還有哪些?", "ex": "能分解醣類的消化液有唾液、胰液、腸液。胃液主要分解蛋白質，膽汁不含酵素。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["胰液、腸液", "胃液、膽汁", "膽汁、胰液", "腸液、胃液。"], "ans": 0}, {"id": "s113_2_q12", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響實驗", "q": "在實驗室進行酵素作用的實驗，在甲、乙、丙、丁四支試管內加入試液的情形如附表所示（○表示加入，╳表示不加入）。若想證明唾液內酵素的活性隨溫度升高而增加，應取哪兩組做實驗組與對照組？", "ex": "要證明「溫度升高會讓唾液酵素活性增加」，兩組必須只有溫度不同、其他條件相同。乙（40℃）和丙（10℃）都有唾液，只差溫度，最適合比較。甲的唾液先加熱到100℃已失去活性，丁沒有加唾液。", "fig": "fig/s113_2_q12.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲乙", "乙丙", "甲丙", "乙丁。"], "ans": 1}, {"id": "s113_2_q13", "src": "school", "sec": "2-4", "concept": "消化道蠕動", "q": "下列敘述中，何者是較合理的?", "ex": "食物在消化道中是靠肌肉蠕動推送的，不是靠重力，所以太空人倒立也能把食物送入胃。吃下的酵素會被消化分解；飯越嚼越甜是因為澱粉被分解成麥芽糖，唾液本身不含糖。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["吃酵素能夠補充人體細胞產生的酵素", "太空人在無重力情況下，即使倒立仍能吃喝，並將食物送入胃", "吃剩的食物冰入冰箱中，可降低酵素中細菌的活性，延長食物保鮮期", "用餐時，飯在口中咀嚼一段時間後會產生甜味，是因為唾液中含糖分。"], "ans": 1}, {"id": "s113_2_q14", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "如附圖，甲、乙、丙三試管均加入3mL 澱粉及3mL唾液，分別置於0℃、37℃、90℃水浴中。每隔一段時間，分別從甲、乙、丙三試管各取出等量的液體，分別滴入碘液，則哪一個試管的液體經此檢驗後，首先不再出現藍色的變化？", "ex": "37℃最接近唾液澱粉酶的最適溫度，澱粉最快被分解完，所以乙最先不再出現藍色。0℃酵素活性很低，90℃酵素已失去活性。", "fig": "fig/s113_2_q14.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "甲乙丙同時。"], "ans": 1}, {"id": "s113_2_q15", "src": "school", "sec": "2-3", "concept": "光合作用原料與產物", "q": "如附圖為植物葉片進行光合作用，下列有關各物質的敘述何者正確？", "ex": "甲來自空氣，是二氧化碳；乙和甲一起反應，是水；丙和葡萄糖一起產生並釋放到空氣中，是氧氣。", "fig": "fig/s113_2_q15.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲是二氧化碳，乙是水，丙是氧氣", "甲是水，乙是二氧化碳，丙是氧氣", "甲是氧氣，乙是水，丙是二氧化碳", "甲是水，乙是氧氣，丙是二氧化碳。"], "ans": 0}, {"id": "s113_2_q16", "src": "school", "sec": "2-4", "concept": "脂質在小腸分解", "q": "已知某藥品的設計是將蛋白質以脂質包裹，當外層的脂質被消化液分解後，內部的蛋白質才能釋出。若人體攝入此藥品，則推測其所含的蛋白質釋出之地點應在下列哪一消化器官中？", "ex": "外層的脂質要到小腸才會被膽汁乳化、被胰液和腸液分解，所以裡面的蛋白質在小腸才釋出。口腔、食道、胃都不能分解脂質。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["口腔", "食道", "胃", "小腸。"], "ans": 3}, {"id": "s113_2_q17", "src": "school", "sec": "2-3", "concept": "葉的構造", "q": "植物進行光合作用時，水是藉由附圖中何種構造進入葉的內部參與反應？", "ex": "根吸收的水分經由莖的木質部，再由葉脈（維管束）送進葉片內部。圖中乙指的是葉脈，所以答案是乙；甲、丁是表皮，丙是葉肉，己是氣孔。", "fig": "fig/s113_2_q17.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "己。"], "ans": 1}, {"id": "s113_2_q18", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色", "q": "「測定光合作用產物」的實驗裝置如附圖。在實驗中，葉片放在酒精中隔水加熱的目的是什麼？", "ex": "酒精可以溶解葉綠素，把葉片的綠色去掉，滴碘液後才看得清楚顏色變化。要隔水加熱是因為酒精易燃，不能直接用火加熱。", "fig": "fig/s113_2_q18.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["使葉片變得較為柔軟", "加酒精可保持葉色翠綠", "因為酒精容易沸騰，可縮短加熱時間", "將葉綠素溶解除去，以免干擾實驗結果。"], "ans": 3}, {"id": "s113_2_q19", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色流程", "q": "試由下列選項中，選出與「測定光合作用產物」有關的四項實驗操作，並排出正確的順序：(甲)葉片在熱水中漂洗；(乙)葉片在本氏液中隔水加熱；(丙)加亞甲藍液；(丁)加碘液；(戊)葉片在酒精中隔水加熱；(己)葉片在沸水中煮沸2 分鐘。", "ex": "正確流程是：沸水中煮沸（己）→酒精中隔水加熱去除葉綠素（戊）→熱水中漂洗（甲）→滴碘液（丁）。本氏液和亞甲藍液都不是用來測葉片澱粉的。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["己乙丁戊", "乙己丙丁", "甲已丁戊", "己戊甲丁。"], "ans": 3}, {"id": "s113_2_q20", "src": "school", "sec": "2-4", "concept": "小腸吸收", "q": "下列有關消化系統的敘述，何者正確?", "ex": "小腸是吸收胺基酸、葡萄糖等養分的主要場所。膽汁幫助的是脂質消化，不是蛋白質；小腸內壁的絨毛是用來增加吸收面積，不是增加蠕動；纖維素無法消化，最後進入大腸隨糞便排出。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["膽囊切除後，將會影響蛋白質的分解", "小腸內壁的微小突起構造，可增加小腸的蠕動，加速消化", "小腸是吸收胺基酸及葡萄糖的主要場所", "纖維素因無法消化而被堆積在小腸。"], "ans": 2}, {"id": "s113_2_q21", "src": "school", "sec": "2-4", "concept": "消化器官與消化液", "q": "小美用起司、生菜、蛋和飯做了一個起司蛋包飯，有關此蛋包飯的敘述，下列何者錯誤？", "ex": "脂質是在小腸被分解，不是在胰臟；胰臟只負責分泌胰液送到小腸。膽汁不含酵素，所以不能分解蛋白質；纖維素無法被消化，不能提供能量。", "fig": "", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["起司中的脂質會在胰臟中被分解", "飯中的澱粉會在口腔中被分解", "蛋中的蛋白質無法被膽汁分解", "生菜中的纖維素無法提供小美能量。"], "ans": 0}, {"id": "s113_2_q22", "src": "school", "sec": "2-4", "concept": "養分開始消化的位置", "q": "現有三種由僅由醣類、脂質與蛋白質依不同比例混合而成的甲、乙、丙三種食物。若取等重的三種食物，可發現三種食物在人體內變化量情形如附圖。則依養分在人體消化順序情形，可推知三種食物中，何者的脂質含量比例最高？", "ex": "醣類在口腔、蛋白質在胃、脂質到小腸才開始消化。脂質比例最高的食物，重量最晚開始明顯減少，所以是曲線最晚下降的丙。", "fig": "fig/s113_2_q22.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "三種食物的脂質含量比例相同。"], "ans": 2}, {"id": "s113_2_q23", "src": "school", "sec": "2-2", "concept": "酵素受酸鹼值影響", "q": "某酵素在37℃且於不同的酸鹼環境下的活性測試結果如右圖所示。若吃下此酵素，其在口腔、胃及小腸中的活性大小，下列何者最合理？", "ex": "這種酵素在接近中性到微鹼性時活性高。在口腔（接近中性）有活性；到了胃中強酸使它失去活性，而且它本身是蛋白質，會被胃液分解，所以到小腸也沒有活性。常見錯誤是只看小腸偏鹼而選小腸活性最高。", "fig": "fig/s113_2_q23.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 0}, {"id": "s113_2_q24", "src": "school", "sec": "2-3", "concept": "光合作用需要光", "q": "進行「測定光合作用產物」的實驗，在實驗前5 天先將植物上的某個葉片作了如右圖的處理。在經過5 天正常日照後，將該葉片取下，再依課本「測定光合作用產物」的實驗步驟操作。實驗最終葉片顏色應該比較接近下列哪一個選項？", "ex": "貼黑紙的花形部分照不到光，不能行光合作用、沒有產生澱粉，滴碘液呈黃褐色；沒貼黑紙的部分有澱粉，呈藍黑色。", "fig": "fig/s113_2_q24.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 2}, {"id": "s113_2_q25", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "附圖是人體消化系統的示意圖。關於人體的消化作用，何者正確？", "ex": "戊是肝臟，分泌的膽汁沒有酵素。蛋白質在胃（甲）中被分解但不被吸收；糞便排出叫排遺，不是排泄；丁是大腸，大腸沒有絨毛，絨毛在小腸。", "fig": "fig/s113_2_q25.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蛋白質在「甲」中被吸收", "「戊」分泌的消化液沒有酵素", "糞便由「己」器官排出的過程稱為排泄", "「丁」中的絨毛可增加吸收養分及水分的表面積。"], "ans": 1}, {"id": "s113_2_q31", "src": "school", "sec": "2-3", "concept": "氣孔開閉", "q": "當保衛細胞從「甲」狀態變成「乙」狀態時，下列何者不會發生？", "ex": "保衛細胞由甲變成乙時氣孔打開，二氧化碳可以進入、氧氣和水蒸氣可以離開，蒸散作用加快。但植物不靠氣孔吸收水分，所以水分不會由氣孔進入葉片。", "fig": "fig/s113_2_q31.webp", "year": 113, "exam": 2, "ansSrc": "official", "warn": "", "pas": "", "opts": ["蒸散速度加快", "水分由氣孔進入葉片", "氧氣由氣孔離開葉片", "二氧化碳由氣孔進入葉片"], "ans": 1}, {"id": "s114_1_q39", "src": "school", "sec": "2-1", "concept": "纖維素", "q": "蔬果的纖維素含量高，有益人體健康。下列有關纖維素的敘述，幾項錯誤？(甲)可促進腸道蠕動；(乙)可增加排便量；(丙)是一種醣類；(丁)是植物細胞壁的主要成分；(戊)可經人體腸道吸收；(己)是一種大分子物質。", "ex": "纖維素是植物細胞壁的主要成分，屬於大分子醣類，可促進腸道蠕動、增加排便量；但人體不能消化吸收纖維素，所以只有(戊)錯誤。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "依課本知識，六項中只有(戊)「可經人體腸道吸收」錯誤（1項），四個選項都沒有1；若題意是問「幾項正確」，則為5項，對應(C)。本站暫以(C)作答；這題題目可能印錯，練習時把每一項的對錯想清楚最重要。", "pas": "", "opts": ["3", "4", "5", "6"], "ans": 2}, {"id": "s114_1_q40", "src": "school", "sec": "2-1", "concept": "食物熱量計算", "q": "右表為便利商店黑胡椒烤雞腿排握便當的營養標示，小娟放學後買了一個當晚餐，請問她身體可獲得多少大卡熱量？", "ex": "每100克含蛋白質8克、脂肪2克、碳水化合物30克，熱量＝8×4＋2×9＋30×4＝170大卡。一包裝有2份（200克），整個便當是170×2＝340大卡。常見錯誤是只算一份而選170。", "fig": "fig/s114_1_q40.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["120", "170", "340", "560"], "ans": 2}, {"id": "s114_1_q42", "src": "school", "sec": "2-1", "concept": "食物中的養分", "q": "有關食物中所含營養素的敘述，何者正確？", "ex": "鈣是構成骨骼的重要成分，多補充可以減緩骨質疏鬆。奶類、豆類主要提供蛋白質，米飯麵食主要提供澱粉；維生素也不是攝取越多越好，過量反而可能有害。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["多補充鈣質可減緩骨質疏鬆症的發生", "奶類、豆類食物是獲得澱粉的最佳來源", "三餐所吃的米飯或麵食主要是提供蛋白質", "維生素B 群功能廣泛，攝取愈多越好"], "ans": 0}, {"id": "s114_1_q43", "src": "school", "sec": "2-1", "concept": "碘液檢測澱粉", "q": "小文想知道薯條中是否含有澱粉，該如何檢測？而檢驗後會呈現的顏色應為？", "ex": "檢測澱粉要滴碘液，有澱粉會變藍黑色。本氏液是檢測葡萄糖等糖類用的；亞甲藍液是觀察細胞時用來染細胞核的。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["將薯條滴加亞甲藍液，呈現出藍紫色。", "將薯條滴加碘液，呈現出藍黑色", "將薯條滴加本氏液，呈現出淡藍色", "將薯條滴加本氏液後加熱，呈現出紅色。"], "ans": 1}, {"id": "s114_1_q44", "src": "school", "sec": "2-1", "concept": "本氏液檢測", "q": "紹瑜買了「礦泉水」、「半糖烏龍茶」和「冬瓜茶」，放入三個試管中，隨意標上試管1、2 和3，再利用試劑檢測三個試管中液體的含糖量，實驗後試管內液體的顏色如附表所示(不考慮原本飲料顏色)，請依表選出錯誤的敘述為何？", "ex": "本氏液遇到葡萄糖等糖類並加熱後才會變色，試管2呈淡藍色代表幾乎沒有糖，是礦泉水，放一晚也不會自己變成綠色，所以(D)錯。試管1紅色，含糖量最高。", "fig": "fig/s114_1_q44.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["試管1 中的液體含糖量最高", "檢測的過程若加熱可加速反應", "檢測所使用的試劑為本氏液", "試管2 若放置一晚，隔天會變綠色。"], "ans": 3}, {"id": "s114_1_q45", "src": "school", "sec": "2-2", "concept": "酵素特性", "q": "有關酵素的敘述，何者錯誤？", "ex": "酵素可以促進分解作用，也可以促進合成作用；只要環境適合，離開生物體也能作用。酵素在反應後本身不會改變，可以重複使用，不會隨即被分解，所以(D)錯。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["酵素由細胞產生，能促進生物體內分解作用", "酵素由細胞產生，能促進生物體內合成作用", "若環境適合，酵素離開生物體仍可發揮作用", "酵素進行完一次反應後，隨即被分解"], "ans": 3}, {"id": "s114_1_q46", "src": "school", "sec": "2-2", "concept": "酵素專一性", "q": "酵素具有專一性。請問何謂「專一性」？", "ex": "專一性是指一種酵素只能催化特定一種反應，例如澱粉酶只分解澱粉。(C)講的是溫度對酵素的影響，不是專一性。", "fig": "", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["一種酵素只能在消化道的某一段中進行反應", "一種酵素只能在固定時間促進反應進行", "一種酵素只能在某一溫度範圍內進行反應", "一種酵素只能進行特定一種反應"], "ans": 3}, {"id": "s114_1_q47", "src": "school", "sec": "2-2", "concept": "酵素受溫度與pH影響", "q": "附圖為某生物體內酵素活性變化的示意圖。下列關於此酵素的敘述何者最恰當？", "ex": "從右圖看，這個酵素在pH約3時活性最高，偏好酸性環境；在酸性範圍內，pH升到3之前活性上升，超過3之後反而下降，所以(C)正確。兩張圖的縱軸不能互相比較高低，所以(A)(D)無法判斷。", "fig": "fig/s114_1_q47.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["此酵素在環境溫度37℃時的活性，一定比在環境pH 值3 時來的高", "此酵素比較偏好中性的環境下作用", "在酸性環境下，其活性不會一直隨著酸鹼值升高而升高", "pH 值對酵素活性的影響比溫度的影響來得低"], "ans": 2}, {"id": "s114_1_q48", "src": "school", "sec": "2-2", "concept": "酵素反應示意圖", "q": "附圖為生物體內進行某種代謝反應的示意圖，請判斷哪一個分子是酵素？", "ex": "乙在反應前後形狀都沒有改變，又回到循環中重複使用，所以乙是酵素。甲是受質，被分解成丙和丁兩個產物。", "fig": "fig/s114_1_q48.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1}, {"id": "s114_1_q49", "src": "school", "sec": "2-2", "concept": "唾液分解澱粉實驗", "q": "小明作「唾液對澱粉的影響實驗」，取四支試管依附表方式裝置，並放在室溫下30 分鐘後，各試管分別以2 mL 本氏液加熱檢驗，則溶液顏色變化最明顯的是哪一支試管？", "ex": "丁的新鮮唾液能在室溫下把澱粉分解成糖，加本氏液加熱後顏色變化最明顯。甲沒有唾液；乙的唾液是冰凍的，活性很低；丙的唾液煮沸過，酵素已失去活性。", "fig": "fig/s114_1_q49.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 3}, {"id": "s114_1_q50", "src": "school", "sec": "2-2", "concept": "酵素受溫度影響", "q": "如附圖所示，明翰取了三支試管，分別加入2mL的澱粉液和唾液，並將三支試管放入0℃、37℃和98℃的水中，靜置15 分鐘後進行檢測。有關檢測的相關敘述，下列何者錯誤？", "ex": "不論哪一支試管，本氏液檢測都必須隔水加熱才會變色，所以(D)錯。37℃的乙酵素活性最高，最快把澱粉分解；98℃的丙酵素失去活性，澱粉不會被分解。", "fig": "fig/s114_1_q50.webp", "year": 114, "exam": 1, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["若利用碘液進行檢測，甲、乙、丙試管可能都會呈藍黑色", "若利用本氏液進行檢測，最快變色的是乙，接下來會變色的是甲，丙不會變色", "給予充足的時間反應後，若利用碘液進行檢測，乙管可能會呈黃褐色", "若利用本氏液進行檢測，只有甲試管需加熱，乙、丙不需加熱。"], "ans": 3}, {"id": "s114_2_q1", "src": "school", "sec": "2-3", "concept": "葉的構造", "q": "下列關於植物葉的構造與功能之敘述，下列敘述何者錯誤？", "ex": "葉的表皮細胞無色透明、沒有葉綠體；葉子的綠色來自葉肉細胞（和保衛細胞）中的葉綠體，所以(D)錯。角質層可以防止水分散失；葉脈負責運輸。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["由葉片與葉柄構成，多呈片狀", "葉脈可運輸水分及養分，但不能行光合作用", "葉子表面的角質層，能防止水分散失", "葉子多為綠色，其綠色來自於表皮細胞的顏色"], "ans": 3}, {"id": "s114_2_q2", "src": "school", "sec": "2-3", "concept": "光合作用條件", "q": "有關生物進行光合作用的敘述，何者正確？", "ex": "光合作用需要陽光提供能量，把光能轉換成化學能儲存在葡萄糖中。它的原料是水和二氧化碳，產物是葡萄糖和氧氣，不是二氧化碳。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["產生葡萄糖和二氧化碳", "需要陽光提供能量", "不牽涉能量的轉換", "需要水分和氧氣"], "ans": 1}, {"id": "s114_2_q3", "src": "school", "sec": "2-3", "concept": "葉肉行光合作用", "q": "下圖是某植物葉片橫切的構造圖，圖中哪個部位是主要進行光合作用的場所？", "ex": "葉肉細胞含有大量葉綠體，是葉片主要進行光合作用的地方。圖中乙是葉肉；甲是表皮，表皮細胞沒有葉綠體，不是主要行光合作用的地方。", "fig": "fig/s114_2_q3.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 1}, {"id": "s114_2_q4", "src": "school", "sec": "2-3", "concept": "光合作用原料與產物", "q": "植物進行光合作用之原料為何？", "ex": "光合作用的原料是水和二氧化碳。葉綠體是進行光合作用的場所，葡萄糖是產物，氮氣不參與光合作用。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["葉綠體、二氧化碳", "水、二氧化碳", "水、氮氣", "二氧化碳、葡萄糖"], "ans": 1}, {"id": "s114_2_q5", "src": "school", "sec": "2-3", "concept": "葉的表皮與氣孔", "q": "貞宜利用複式顯微鏡觀察葉的表皮，看到如附圖所示的影像，下列相關敘述何者錯誤？", "ex": "丙指的是兩個保衛細胞中間的開口，也就是氣孔，不是保衛細胞，所以(C)錯。乙是保衛細胞，含有葉綠體；陸生植物的氣孔多分布在葉的下表皮。", "fig": "fig/s114_2_q5.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲具有粒線體", "乙具有葉綠體", "丙為保衛細胞", "陸生植物的下表皮較易觀察到丙構造"], "ans": 2}, {"id": "s114_2_q6", "src": "school", "sec": "2-3", "concept": "光合作用的重要性", "q": "下列何者是植物進行光合作用的重要性？(甲) 產生葡萄糖可以提供自身使用；(乙)會製造氧氣供生物進行呼吸作用；(丙)可以將能量儲存在葡萄糖中，讓生物可以從葡萄糖中獲得能量；(丁)維持大氣中氧氣和二氧化碳比例的穩定", "ex": "光合作用製造葡萄糖供植物自己使用、放出氧氣供生物呼吸、把光能儲存在葡萄糖中讓其他生物也能取得能量，還能維持大氣中氧氣與二氧化碳的比例。四項都正確。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲乙丙丁", "乙丙丁", "甲乙丁", "甲丙丁"], "ans": 0}, {"id": "s114_2_q7", "src": "school", "sec": "2-3", "concept": "光合作用的目的", "q": "承上題，何者是植物行光合作用的最主要目的？", "ex": "植物行光合作用最主要是為了替自己製造養分（葡萄糖）。產生氧氣、提供其他生物能量、維持大氣穩定，都是對其他生物或環境的附帶影響。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 0}, {"id": "s114_2_q8", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色流程", "q": "摘下葉片拿掉貼紙後，依下列步驟處理：(甲)放到熱水中漂洗；(乙)放入沸水中煮2 分鐘；(丙)加入碘液；(丁)加入本氏液；(戊)放入酒精中隔水加熱。下列哪一項步驟是測定葉片澱粉的正確順序？", "ex": "測葉片澱粉的流程：先放沸水中煮（乙）→放酒精中隔水加熱去除葉綠素（戊）→放熱水中漂洗（甲）→滴碘液（丙）。本氏液不是用來測澱粉的。", "fig": "fig/s114_2_q8.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "喬巴用不透光數字貼紙貼住一片地瓜葉的上表皮，讓此葉片在日光下照射數天之後，採下來，進行澱粉測試。請回答8-10 題。", "opts": ["乙甲戊丙", "乙戊甲丙", "乙戊丁甲", "甲乙戊丙"], "ans": 1}, {"id": "s114_2_q9", "src": "school", "sec": "2-3", "concept": "光合作用需要光", "q": "葉片經澱粉測定後，顯示的顏色應為？", "ex": "甲是被不透光貼紙蓋住的數字「2」部分，照不到光不能行光合作用、沒有澱粉，滴碘液呈黃褐色；乙沒被遮住，有澱粉，呈藍黑色。", "fig": "fig/s114_2_q8.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "喬巴用不透光數字貼紙貼住一片地瓜葉的上表皮，讓此葉片在日光下照射數天之後，採下來，進行澱粉測試。請回答8-10 題。", "opts": ["甲：黃褐色、乙：黃褐色", "甲：藍黑色、乙：黃褐色", "甲：黃褐色、乙：藍黑色", "甲：藍黑色、乙：藍黑色"], "ans": 2}, {"id": "s114_2_q10", "src": "school", "sec": "2-3", "concept": "澱粉檢測脫色", "q": "本實驗溶解出葉片中葉綠素的方法，下列何者正確？", "ex": "葉片要放在裝酒精的小燒杯裡，小燒杯再放進裝水的大燒杯中隔水加熱，因為酒精容易燃燒，不能直接加熱。圖(B)葉片泡在酒精中、外層是水，所以正確。", "fig": "fig/s114_2_q10.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "喬巴用不透光數字貼紙貼住一片地瓜葉的上表皮，讓此葉片在日光下照射數天之後，採下來，進行澱粉測試。請回答8-10 題。", "opts": ["見附圖選項(A)", "見附圖選項(B)", "見附圖選項(C)", "見附圖選項(D)"], "ans": 1}, {"id": "s114_2_q11", "src": "school", "sec": "2-3", "concept": "角質層", "q": "小新逛水族館時發現有個水族用具名稱為「油膜處理器」，查詢資料後發現原來是水族箱內的部分水草葉片表面會有一層X 構造，X 構造含有油脂的成分能協助隔絕水分，當水草老化腐爛後，就是部分油膜的來源。某些水草因水中不缺水使得X 構造不發達。試問X 構造應為何？", "ex": "葉片表面有一層含油脂（蠟質）的角質層，可以防止水分散失。生活在水中的水草不怕缺水，所以角質層不發達。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["葉綠素", "角質層", "葉肉", "表皮"], "ans": 1}, {"id": "s114_2_q12", "src": "school", "sec": "2-4", "concept": "消化液注入位置", "q": "消化液和其注入的消化器官配對，何者正確？", "ex": "胰液和膽汁都經由導管注入小腸；唾液在口腔作用；膽汁是儲存在膽囊而不是注入膽囊；腸液在小腸作用。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["唾液→食道", "膽汁→膽囊", "腸液→大腸", "胰液→小腸"], "ans": 3}, {"id": "s114_2_q13", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "下列對於消化器官之敘述，何者錯誤？", "ex": "絨毛在小腸，大腸沒有絨毛，所以(C)錯。大腸主要吸收水分；肝臟是人體最大的腺體；胰液能幫助醣類、蛋白質和脂質的分解。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["肝臟位於右上腹部，是人體內最大的腺體", "胰臟分泌的胰液有助於醣類、蛋白質和脂質的分解", "大腸比小腸粗，且有更多的絨毛幫助吸收", "食物殘渣、水、大腸壁剝落的細胞、腸內細菌共同形成糞便"], "ans": 2}, {"id": "s114_2_q14", "src": "school", "sec": "2-4", "concept": "膽汁", "q": "下圖為人體部分消化器官的示意圖，若阿丹體內的甲處發生阻塞，則下列關於他的消化及養分吸收功能，何者最可能發生？", "ex": "圖中甲是把膽汁從肝臟、膽囊送到小腸的膽管。膽管阻塞，膽汁無法進入小腸，脂質無法被乳化，消化脂質的功能就會下降。", "fig": "fig/s114_2_q14.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["胃液無法分解蛋白質", "胰液無法排至小腸內", "吸收葡萄糖的功能下降", "消化脂質的功能下降"], "ans": 3}, {"id": "s114_2_q15", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "人體的消化液有：(甲)唾液；(乙)胃液；(丙)胰液；(丁)膽汁；(戊)腸液。其中與蛋白質分解有關的消化液有哪些？", "ex": "能分解蛋白質的消化液是胃液、胰液、腸液。唾液只分解澱粉，膽汁不含酵素。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲乙戊", "乙丁戊", "乙丙戊", "丙丁戊"], "ans": 2}, {"id": "s114_2_q16", "src": "school", "sec": "2-4", "concept": "消化液作用的養分", "q": "有關人體消化液和其作用的養分配對，下列何者錯誤？", "ex": "人體沒有分解纖維素的酵素，胰液可以分解醣類（澱粉）、蛋白質、脂質，但不能分解纖維素，所以丙錯。膽汁本身不分解脂質，而是把脂質乳化，題目以「作用養分」說明它和脂質有關。", "fig": "fig/s114_2_q16.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["甲", "乙", "丙", "丁"], "ans": 2}, {"id": "s114_2_q17", "src": "school", "sec": "2-4", "concept": "小腸吸收", "q": "新聞報導不健康的減重方式，例如：切除一部分的「某器官」，避免吸收過多經攝食、消化所獲得的養分。由此減重方式的描述，可推測被切除一部分的「某器官」，為何種器官？", "ex": "小腸是消化和吸收養分最主要的器官，切除一部分小腸會減少養分吸收。胃、胰臟和大腸都不是主要吸收養分的地方。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["胃", "胰臟", "大腸", "小腸"], "ans": 3}, {"id": "s114_2_q18", "src": "school", "sec": "2-2", "concept": "酵素本質是蛋白質", "q": "「吃酵素產品能夠補充人體細胞產生的酵素」，依據酵素的原理知識，這種說法是否適當？", "ex": "酵素的主要成分是蛋白質，吃下肚後會像其他蛋白質一樣在消化道中被分解成胺基酸，不能直接進入細胞補充酵素。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["適當，我們所吃的酵素在人體內的活性最高", "適當，我們所吃的酵素能直接進入人體的細胞", "不適當，我們所吃的酵素會被我們消化道中的酵素分解", "不適當，我們所吃的酵素無法在人體內發揮作用"], "ans": 2}, {"id": "s114_2_q19", "src": "school", "sec": "2-4", "concept": "纖維素", "q": "關於消化系統的敘述，何者正確？", "ex": "人體無法消化纖維素，它會留在消化道中增加糞便體積。食物在胃中不必完全消化就會進入小腸；肛門排出糞便叫排遺，不是排泄；大腸不分泌消化液（腸液）。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["食物在胃中必須完全消化才能進入小腸", "纖維素在人體內可以增加糞便的體積", "糞便由肛門排出，所以肛門是排泄器官", "小腸和大腸都有腸腺可以分泌腸液"], "ans": 1}, {"id": "s114_2_q20", "src": "school", "sec": "2-2", "concept": "酵素受酸鹼值影響", "q": "小智表示：「當胃液和食物一起進入小腸之後，胃液中的酵素就會逐漸失去活性。」關於這段話是否合理？", "ex": "胃液中的酵素在酸性環境作用最好，小腸環境偏鹼性，所以進入小腸後活性逐漸降低，這段話合理。人體各處溫度差不多；小腸也不會產生鹽酸，鹽酸是胃分泌的。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["合理，胃液中的酵素在鹼性環境活性較低", "合理，因為小腸和胃的溫度大約相差20 度", "不合理，所有酵素在小腸內具有較佳的活性", "不合理，小腸能產生鹽酸，有助於胃液中的酵素分解養分"], "ans": 0}, {"id": "s114_2_q21", "src": "school", "sec": "2-4", "concept": "消化器官功能", "q": "附圖是人體消化系統的示意圖，關於人體的消化作用，何者正確？", "ex": "戊是肝臟，分泌的膽汁不含酵素，所以(D)正確。甲是胃，蛋白質在胃中被消化但不被吸收；脂肪是在小腸被分解，不是在乙；丁是大腸，主要吸收養分的是小腸（丙）。", "fig": "fig/s114_2_q21.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["蛋白質在「甲」中被消化和吸收", "脂肪在「乙」器官中被分解", "「丁」是人體主要吸收養分的器官", "「戊」分泌的消化液沒有酵素"], "ans": 3}, {"id": "s114_2_q22", "src": "school", "sec": "2-4", "concept": "消化道順序", "q": "(甲)食道；(乙)小腸；(丙)胃；(丁)口腔；(戊)大腸。人體的消化管由前至後的順序為何？", "ex": "消化管由前到後依序是：口腔→食道→胃→小腸→大腸，所以是丁甲丙乙戊。", "fig": "", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["丁甲丙乙戊", "丁甲丙戊乙", "丁甲戊丙乙", "丁丙戊乙甲"], "ans": 0}, {"id": "s114_2_q23", "src": "school", "sec": "2-4", "concept": "養分開始消化的位置", "q": "附圖為人類消化a－澱粉，b－蛋白質，c－脂肪的過程，由甲～戊表示消化管，下列敘述哪一項錯誤？", "ex": "a（澱粉）在甲（口腔）開始減少，b（蛋白質）在丙開始減少，c（脂肪）在丁開始減少，所以甲是口腔、乙是食道、丙是胃、丁是小腸。蛋白質在丙（胃）被大量消化，丙不是食道，所以(B)錯。", "fig": "fig/s114_2_q23.webp", "year": 114, "exam": 2, "ansSrc": "ai", "warn": "", "pas": "", "opts": ["蛋白質可在丙、丁處消化", "丙處消化不多，可能是食道", "脂肪在丁處開始被分解", "消化後的養分可在丁處大量吸收"], "ans": 1}, {"id": "c104_01", "src": "cap", "sec": "2-3", "concept": "光合作用的原料與產物", "q": "圖(一)是生物進行某種生理作用的示意圖，圖中箭頭代表能量或物質在葉片中的進出，此生理作用最可能是下列何者？", "opts": ["呼吸作用", "蒸散作用", "光合作用", "觸發運動"], "ans": 2, "ex": "圖上葉片吸收陽光、二氧化碳和根送上來的水，並放出氧氣——這正是光合作用。呼吸作用是吸收氧氣、放出二氧化碳，方向剛好相反。", "fig": "fig/cap104_01_圖一.png", "figTop": false, "year": 104, "pas": ""}, {"id": "c104_41", "src": "cap", "sec": "2-2", "concept": "酵素的主要成分", "q": "唾液中的甲物質可催化澱粉的分解，胃液中的乙物質則可催化蛋白質的分解，若推測甲、乙兩物質本身的主要成分，下列敘述何者最合理？", "opts": ["甲、乙成分皆為澱粉", "甲、乙成分皆為蛋白質", "甲成分為澱粉，乙成分為蛋白質", "甲成分為葡萄糖，乙成分為胺基酸"], "ans": 1, "ex": "甲是唾液澱粉酶、乙是胃蛋白酶，兩者都是酵素，酵素的主要成分是蛋白質。名字裡的「澱粉」「蛋白」說的是它分解的對象，不是它的成分。", "fig": "", "figTop": false, "year": 104, "pas": ""}, {"id": "c105_07", "src": "cap", "sec": "2-3", "concept": "有葉綠體就能行光合作用", "q": "已知某種具有葉綠體的原生生物會分解養分產生能量，推測該生物能否進行光合作用或呼吸作用，下列敘述何者正確？", "opts": ["僅可進行光合作用", "僅可進行呼吸作用", "此兩種作用皆可進行", "此兩種作用皆無法進行"], "ans": 2, "ex": "有葉綠體就能行光合作用；題目又說它會分解養分產生能量，這就是呼吸作用。所有活細胞都會呼吸，所以兩種作用都能進行。", "fig": "", "figTop": false, "year": 105, "pas": ""}, {"id": "c105_28", "src": "cap", "sec": "2-2", "concept": "酵素分解澱粉與碘液檢測", "q": "在甲、乙及丙三支試管中分別裝入等量且濃度相同的溶液X，依實驗設計分別再加入等量的葡萄糖液、澱粉液或水，充分混勻再靜置於適宜的溫度，待足夠的反應時間後，以碘液進行檢測。將上述各試管所含的物質與碘液檢測結果整理如表(四)，根據此實驗結果判斷溶液X中最可能含有下列何種成分？", "opts": ["澱粉", "葡萄糖", "分解澱粉的酵素", "分解葡萄糖的酵素"], "ans": 2, "ex": "乙管加了澱粉液，碘液卻是黃褐色（沒有變藍黑色），代表澱粉不見了——被溶液 X 裡的東西分解掉。能分解澱粉的就是分解澱粉的酵素。", "fig": "fig/cap105_28_表四.png", "figTop": false, "year": 105, "pas": ""}, {"id": "c106_27", "src": "cap", "sec": "2-4", "concept": "膽汁幫助脂質消化", "q": "圖(十五)為人體部分消化器官的示意圖，若老王體內的甲處發生阻塞，則下列關於他的消化及養分吸收功能，何者最可能發生？", "opts": ["胰液無法排至小腸內", "胃液無法分解蛋白質", "消化脂質的功能下降", "吸收葡萄糖的功能下降"], "ans": 2, "ex": "甲是從膽囊通往小腸的膽管。膽管阻塞，膽汁到不了小腸，膽汁能把脂質乳化成小油滴，所以消化脂質的功能會下降。胰液走的是另一條管子。", "fig": "fig/cap106_27_圖十五.png", "figTop": false, "year": 106, "pas": ""}, {"id": "c107_18", "src": "cap", "sec": "2-2", "concept": "酵素活性與分解速率", "q": "將酵素甲和澱粉溶液在試管中混合均勻，並定時測量試管內的澱粉濃度。已知試管內澱粉濃度會隨著時間而改變，如圖(十)所示，下列關於甲的敘述，何者正確？", "opts": ["甲主要由葡萄糖組成", "甲與澱粉反應後，會被分解成胺基酸", "若降低甲的活性，會使澱粉的合成速率變快", "若提高甲的活性，會使澱粉的分解速率變快"], "ans": 3, "ex": "圖中澱粉濃度隨時間下降，表示酵素甲在分解澱粉。酵素活性越高，分解得越快；酵素是蛋白質、作用前後本身不會被分解。", "fig": "fig/cap107_18_圖十.png", "figTop": false, "year": 107, "pas": ""}, {"id": "c108_05", "src": "cap", "sec": "2-3", "concept": "光合作用速率的判斷", "q": "小帆想知道某一植株在不同環境條件下，葉片行光合作用時速率的快慢，應依據下列哪一資料進行推測最為合理？", "opts": ["單位時間內產生氧氣的量", "單位時間內消耗葉綠素的量", "單位時間內消耗葡萄糖的量", "單位時間內產生二氧化碳的量"], "ans": 0, "ex": "光合作用會產生氧氣，所以比較「單位時間內產生氧氣的量」就能知道快慢。葉綠素不會被消耗，葡萄糖是產物不是被消耗的，二氧化碳是被吸收而不是產生。", "fig": "", "figTop": false, "year": 108, "pas": ""}, {"id": "c108_45", "src": "cap", "sec": "2-2", "concept": "溫度影響酵素", "q": "已知利用相同茶樹的葉片但不同的製作過程，可得綠茶及紅茶。茶葉中所含的酵素X在超過70℃後，就無法再有催化能力。圖(二十三)為製作綠茶及紅茶時的四個步驟(依序由步驟I→II→III→IV)及其溫度調控示意圖，比較四個步驟中綠茶及紅茶的酵素X之活性，下列何者最合理？", "opts": ["步驟I結束時：綠茶＞紅茶", "步驟II結束時：綠茶＝紅茶", "步驟III結束時：綠茶＜紅茶", "步驟IV結束時：綠茶＝紅茶"], "ans": 3, "ex": "超過 70℃ 酵素 X 就失去作用而且回不來。綠茶在步驟 I 就超過 70℃，紅茶到步驟 III 才超過；到步驟 IV 兩者的酵素都已失效，活性相同。", "fig": "fig/cap108_45_圖二十三.png", "figTop": false, "year": 108, "pas": ""}, {"id": "c109_03", "src": "cap", "sec": "2-4", "concept": "澱粉的消化", "q": "澱粉在人體內經某種生理作用後可產生多個小分子X，如圖(二)所示。有關此生理作用及小分子X的名稱，下列何者最合理？", "opts": ["消化作用，葡萄糖", "消化作用，胺基酸", "呼吸作用，葡萄糖", "呼吸作用，胺基酸"], "ans": 0, "ex": "把大分子的澱粉分解成許多小分子葡萄糖，是消化作用。胺基酸是蛋白質分解的產物；呼吸作用是分解葡萄糖產生能量。", "fig": "fig/cap109_03_full.webp", "figTop": true, "year": 109, "pas": ""}, {"id": "c109_41", "src": "cap", "sec": "2-2", "concept": "酵素的主要成分", "q": "在製作麵包的過程中，可添加澱粉酶、脂肪酶和蛋白酶等酵素，表(六)為甲～丁四位同學對於三種酵素主成分的說明，哪一位同學的說明最合理？", "opts": ["甲", "乙", "丙", "丁"], "ans": 3, "ex": "不論分解澱粉、脂肪或蛋白質，酵素的主成分都是蛋白質，所以丁同學對。甲、丙把酵素的成分和它分解的對象搞混了。", "fig": "fig/cap109_41_表六.png", "figTop": false, "year": 109, "pas": ""}, {"id": "c110_42", "src": "cap", "sec": "2-4", "concept": "酵素在消化道中受 pH 影響", "q": "已知某種酵素最適合在37°C及pH＝8的環境中作用，且在pH＜5的環境下會被完全破壞。若某人吃下此種酵素，則此酵素在口腔、胃及小腸中的活性大小，下列何者最合理？", "opts": ["", "", "", ""], "ans": 2, "ex": "這種酵素在口腔（接近中性）還有活性；到了胃（強酸，pH＜5）會被完全破壞；被破壞的酵素到了小腸也不會恢復，所以只有口腔有活性。", "fig": "fig/cap110_42_full.webp", "figTop": true, "year": 110, "pas": "", "optsImg": true}, {"id": "c111_18", "src": "cap", "sec": "2-3", "concept": "哪些細胞能行光合作用", "q": "一株植物含有不同類型的細胞，以榕樹為例，關於其可行光合作用的細胞數目與可行呼吸作用的細胞數目之比較及其原因，下列何者最合理？", "opts": ["甲大於乙，因植物的部分細胞不具有粒線體", "甲小於乙，因植物的部分細胞不具有粒線體", "甲小於乙，因植物的部分細胞不具有葉綠體", "甲等於乙，因植物細胞皆具有葉綠體與粒線體"], "ans": 2, "ex": "只有含葉綠體的細胞（例如葉肉細胞）能行光合作用；根、莖內部很多細胞沒有葉綠體，但所有活細胞都要行呼吸作用，所以能光合的細胞比較少。", "fig": "", "figTop": false, "year": 111, "pas": "", "rate": 0.5027, "wrongOpt": "D"}, {"id": "c111_32", "src": "cap", "sec": "2-2", "concept": "設計對照實驗檢驗酵素", "q": "已知蜂蜜中含有分解澱粉的酵素。現有甲、乙兩試管皆裝有等量且濃度相同的澱粉液，隨機在其中一支加入蜂蜜，另一支加入等量的水。將兩支試管充分搖勻，靜置於適宜的溫度，待足夠的反應時間後，以碘液檢測。結果顯示甲呈現藍黑色，乙呈現黃褐色。根據此結果，推測哪一支試管加入了蜂蜜及其理由，下列何者最合理？", "opts": ["甲，因未檢測出澱粉", "甲，因有檢測出澱粉", "乙，因未檢測出澱粉", "乙，因有檢測出澱粉"], "ans": 2, "ex": "蜂蜜裡的酵素會把澱粉分解，碘液就不會變藍黑色。乙呈黃褐色＝沒有澱粉了，所以乙加了蜂蜜；甲藍黑色是加水的對照組。", "fig": "", "figTop": false, "year": 111, "pas": "", "rate": 0.48, "wrongOpt": "B"}, {"id": "c112_16", "src": "cap", "sec": "2-3", "concept": "光合作用反應式", "q": "已知維管束植物可進行某種代謝作用，其反應式為：「甲+二氧化碳→氧氣+乙+水」。有關甲的名稱及其在植物體內主要運送的構造，下列何者最合理？", "opts": ["水，由木質部運送", "水，由韌皮部運送", "葡萄糖，由木質部運送", "葡萄糖，由韌皮部運送"], "ans": 0, "ex": "光合作用：水＋二氧化碳 → 氧氣＋葡萄糖＋水。所以甲是水，由根吸收後經木質部往上運送；乙才是葡萄糖（由韌皮部運送）。", "fig": "", "figTop": false, "year": 112, "pas": "", "rate": 0.5943, "wrongOpt": "D"}, {"id": "c112_43", "src": "cap", "sec": "2-1", "concept": "看營養標示選食物", "q": "若壯壯跟安安兩人對於早餐飲品的需求為：壯壯：我想要攝取較多的胺基酸。安安：我要減少攝取糖。則根據營養比較表，在攝取相同容量飲品的情況下，推論兩人的選擇，下列何者最合理？", "opts": ["兩人皆宜選擇牛奶", "兩人皆宜選擇燕麥奶", "壯壯選擇牛奶，安安選擇燕麥奶", "壯壯選擇燕麥奶，安安選擇牛奶"], "ans": 0, "ex": "胺基酸是蛋白質消化後的產物，牛奶的蛋白質（3 g）比燕麥奶（1.3 g）多；糖則是牛奶（4.5 g）比燕麥奶（8.1 g）少。兩人都該選牛奶。", "fig": "fig/cap112_43_表七.webp", "figTop": false, "year": 112, "pas": "燕麥奶與牛奶常被拿來做比較。燕麥奶是燕麥和水混合後的成品，其營養組成成分和牛奶有些不同，表(七)為X牌燕麥奶與Y牌牛奶的營養比較表。", "rate": 0.5686, "wrongOpt": "D"}, {"id": "c113_41", "src": "cap", "sec": "2-2", "concept": "溫度影響酵素活性", "q": "某工廠進行原料加工的製程如表(十一)。當開始加工時，此原料中酵素X會持續催化原料中物質甲轉變成物質乙，但超過75℃後就無法再有催化的功能。若僅考慮酵素X的作用，這段加工製程中，哪兩時間點所含物質乙的量最相近？", "opts": ["10:00和10:10", "10:15和10:25", "10:25和10:45", "10:50和11:00"], "ans": 3, "ex": "步驟三（10:30 起）溫度 85℃，超過 75℃ 後酵素 X 失效，之後就算降回 35℃ 也不會恢復，物質乙不再增加。所以 10:50 和 11:00 物質乙的量相同。", "fig": "fig/cap113_41_表十一.png", "figTop": false, "year": 113, "pas": "", "rate": 0.382, "wrongOpt": "B"}, {"id": "c114_08", "src": "cap", "sec": "2-3", "concept": "光照與光合作用", "q": "圖(四)為某蘆筍植株的示意圖，圖中甲部位經過日光照射，呈現綠色；乙部位未受到日光照射，呈現白色。有關兩部位進行生理作用時所釋出的氣體，下列敘述何者最合理？", "opts": ["甲能釋出O2，但乙不能", "甲能釋出CO2，但乙不能", "乙能釋出O2，但甲不能", "乙能釋出CO2，但甲不能"], "ans": 0, "ex": "甲照光呈綠色，有葉綠素能行光合作用、放出氧氣；乙埋在土裡呈白色，不能行光合作用、不會放出氧氣。兩部位都會行呼吸作用放出二氧化碳。", "fig": "fig/cap114_08_圖四.png", "figTop": false, "year": 114, "pas": "", "rate": 0.6833, "wrongOpt": "B"}, {"id": "c114_36", "src": "cap", "sec": "2-2", "concept": "碘液與本氏液判斷酵素是否作用", "q": "有甲、乙、丙三杯濃度相同的澱粉液，分別加入經不同條件處理的等量澱粉酶，經相同的作用時間後，以碘液與本氏液分別檢測此三杯溶液，結果如表(八)。根據此結果推測，哪杯澱粉液加入的澱粉酶應已完全失去作用？", "opts": ["僅甲", "僅乙", "甲和丙", "乙和丙"], "ans": 0, "ex": "碘液變色＝還有澱粉；本氏液變色＝有糖產生。甲杯碘液有變色、本氏液沒變色：澱粉完全沒被分解，所以只有甲杯的澱粉酶完全失去作用。", "fig": "fig/cap114_36_表八.png", "figTop": false, "year": 114, "pas": "", "rate": 0.4156, "wrongOpt": "B"}, {"id": "c115_24", "src": "cap", "sec": "2-3", "concept": "光合作用的原料與產物", "q": "已知綠色植物可同時進行光合作用與呼吸作用，而光合作用的過程如下：關於甲、乙、丙三種物質的敘述，下列何者最合理？", "opts": ["甲主要由植物從土壤中吸收", "乙主要由植物根部排出至土壤", "乙與呼吸作用的產物相同", "丙可作為呼吸作用的反應物"], "ans": 3, "ex": "水＋甲（二氧化碳）→ 乙＋丙＋水，乙、丙是氧氣和葡萄糖。題目答案 D：丙是葡萄糖，可以當呼吸作用的原料。二氧化碳是從葉的氣孔進來，不是從土壤吸收。", "fig": "fig/cap115_24_full.webp", "figTop": true, "year": 115, "pas": "", "rate": 0.5601, "wrongOpt": "C"}, {"id": "c115_37", "src": "cap", "sec": "2-2", "concept": "消化酵素的作用", "q": "蘇蘇在試管中加入蛋白質溶液與人體消化液中以蛋白質為受質的某酵素，充分混合後放置於適宜作用的穩定環境，蘇蘇接著每隔一段時間測量試管中蛋白質與X物質的濃度，結果如圖(二十二)。已知X物質為蛋白質被分解後的產物，則關於此酵素的推論，下列何者最合理？", "opts": ["可能由膽汁中取得此酵素", "可能由胰液中取得此酵素", "此酵素催化X物質的分解", "此酵素催化X物質的合成0"], "ans": 1, "ex": "蛋白質濃度下降、X 物質增加，表示酵素把蛋白質分解成 X。膽汁不含酵素，胰液含有分解蛋白質的酵素，所以可能取自胰液。", "fig": "fig/cap115_37_圖二十二.webp", "figTop": false, "year": 115, "pas": "", "rate": 0.4099, "wrongOpt": "C"}]};
const APP_ID = "n7bio", VER = DATA.meta.version, ENDPOINT = DATA.meta.endpoint || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEC = Object.fromEntries(DATA.secs.map(s => [s.id, s]));
const QS = DATA.qs, QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const LETTERS = "ABCD";

/* ───── 儲存（手機本機；讀寫一律包 try） ───── */
const KEY = "n7bio:state";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let S = Object.assign({xp:0, done:{}, wrong:{}, cards:{}, sims:{}, badges:{}, best:{}}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ───── 上課模式 ───── */
let TEACH = false;
try{ TEACH = localStorage.getItem("n7bio:teach") === "1"; }catch(e){}
function applyTeach(){
  document.body.classList.toggle("teach", TEACH);
  const b = $("#modebtn"); b.textContent = TEACH ? "🎓 上課模式中" : "🎓 上課模式"; b.setAttribute("aria-pressed", TEACH);
}
function toggleTeach(){ TEACH = !TEACH; try{ localStorage.setItem("n7bio:teach", TEACH ? "1" : "0"); }catch(e){} applyTeach(); render(); toast(TEACH ? "上課模式：字放大、答案由老師揭曉、不記分" : "回到自學模式"); }

/* ───── 後台紀錄佇列（上課模式不送） ───── */
const SID = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let DEV = ""; try{ DEV = localStorage.getItem("n7bio:dev") || ""; if(!DEV){ DEV = "d" + Math.random().toString(36).slice(2, 8); localStorage.setItem("n7bio:dev", DEV); } }catch(e){ DEV = "anon"; }
let QUEUE = []; try{ QUEUE = JSON.parse(localStorage.getItem("n7bio:queue")) || []; }catch(e){}
function logEv(ev){
  if(TEACH) return;
  QUEUE.push(Object.assign({id: SID + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,5), ts: Date.now(), sid: SID, dev: DEV, v: VER}, ev));
  if(QUEUE.length > 500) QUEUE = QUEUE.slice(-500);
  try{ localStorage.setItem("n7bio:queue", JSON.stringify(QUEUE)); }catch(e){}
  flushSoon();
}
let flushT = null;
function flushSoon(){ clearTimeout(flushT); flushT = setTimeout(flush, 2500); }
async function flush(){
  if(!ENDPOINT || !QUEUE.length || !navigator.onLine) return;
  const batch = QUEUE.slice(0, 50);
  try{
    const r = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({app: APP_ID, events: batch})});
    const j = await r.json();
    if(j.ok){ const ids = new Set(batch.map(x => x.id)); QUEUE = QUEUE.filter(x => !ids.has(x.id)); try{ localStorage.setItem("n7bio:queue", JSON.stringify(QUEUE)); }catch(e){} if(QUEUE.length) flushSoon(); }
  }catch(e){}
}
addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flush(); });

/* ───── XP / 等級 / 徽章 ───── */
const LV_XP = 120;
function addXP(n){ if(TEACH) return; S.xp += n; save(); drawXP(); }
function drawXP(){ const lv = Math.floor(S.xp / LV_XP) + 1; $("#lv").textContent = "Lv " + lv; $("#xpbar").style.width = (S.xp % LV_XP) / LV_XP * 100 + "%"; }
const BADGES = [
  {id:"first", ic:"🌱", name:"第一題", desc:"答對第一題"},
  {id:"streak5", ic:"🔥", name:"五連對", desc:"一回合連續答對 5 題"},
  {id:"perfect", ic:"💯", name:"全對過關", desc:"一回合全部答對"},
  {id:"cards", ic:"📚", name:"讀卡達人", desc:"看完四節所有觀念卡"},
